[workspace]
default-members = [
  "kernel",
  "loader",
  "tools/testbench",
]
members = [
  "model",
  "kernel",
  "loader",
  "libs/client",
  "libs/layout",
  "libs/paging",
  "libs/rt",
  "libs/rt/fake",
  "libs/signing",
  "libs/stride",
  "libs/sys",
  "libs/littlefs",
  "libs/wire",
  "libs/wire/gen",
  "servers/keyd",
  "servers/sshd",
  "servers/bootfsd",
  "servers/consoled",
  "servers/blkd",
  "servers/netd",
  "servers/ipd",
  "stub",
  "tests/programs",
  "tests/net",
  "tests/net/client",
  "tools/doccheck",
  "tools/sshd-host",
  "tools/testbench",
  "tools/vendor-check",
]
resolver = "2"

# These packages have custom RUSTFLAGS, so if they
# were included in the workspace they would cause
# packages to be rebuilt every time they were touched.
# Keep them out of the main workspace.
exclude = [
  # Host-only fuzz targets, built by cargo-fuzz (see libs/wire/fuzz/Cargo.toml).
  "libs/wire/fuzz",
  # Host-only littlefs test crates: the C reference as an oracle, and the fuzzer. They must
  # never enter a normal build (TENETS.md 3: host-only oracles and fuzz drivers stay outside the
  # workspace build and are never linked into anything that runs on the machine).
  "libs/littlefs/diff",
  "libs/littlefs/fuzz",
  # Host-only fuzz targets for redoubt-rt (see libs/littlefs/fuzz/Cargo.toml).
  "libs/rt/fuzz",
  # Host-only fuzz targets for blkd (see servers/blkd/fuzz/Cargo.toml).
  "servers/blkd/fuzz",
  # Host-only fuzz targets for netd and ipd (see servers/ipd/fuzz/Cargo.toml).
  "servers/netd/fuzz",
  "servers/ipd/fuzz",
  # Host-only fuzz target for the loader stub's ELF bounds-checking (see stub/fuzz/Cargo.toml).
  "stub/fuzz",
  # beamlet, the BEAM VM for the OTP userland: its own workspace (host tools and `no_std`
  # target crates, its own test toolchain), built by its own `cargo` invocations.
  "userland/otp",
  # The userland's native libraries (the cell protocol): their own workspace.
  "userland/native",
  # ipd's TCP/IP stack and its dependencies, vendored unmodified from crates.io (vendor/README.md).
  # They are built through the [patch.crates-io] paths below but are not workspace members, so
  # their dev-dependencies never enter Cargo.lock and `cargo test --workspace` never builds their
  # default (std, libc) feature sets.
  "vendor/smoltcp",
  "vendor/managed",
  "vendor/heapless",
  "vendor/hash32",
  "vendor/stable_deref_trait",
  "vendor/byteorder",
  "vendor/ed25519-compact",
  "vendor/sunset",
  "vendor/aes",
  "vendor/ascii",
  "vendor/block-buffer",
  "vendor/chacha20",
  "vendor/cipher",
  "vendor/cmov",
  "vendor/cpubits",
  "vendor/crypto-common",
  "vendor/ctr",
  "vendor/ctutils",
  "vendor/digest",
  "vendor/getrandom",
  "vendor/hmac",
  "vendor/hybrid-array",
  "vendor/inout",
  "vendor/poly1305",
  "vendor/sha2",
  "vendor/snafu",
  "vendor/subtle",
  "vendor/typenum",
  "vendor/universal-hash",
  "vendor/zeroize",
  "vendor/sunset-sshwire-derive",
  "vendor/snafu-derive",
  "vendor/zeroize_derive",
  "vendor/virtue",
  "vendor/adler2",
  "vendor/aead",
  "vendor/aes-gcm",
  "vendor/base16ct",
  "vendor/cbc",
  "vendor/chacha20poly1305",
  "vendor/const-oid",
  "vendor/crypto-bigint",
  "vendor/crypto-primes",
  "vendor/der",
  "vendor/ecdsa",
  "vendor/elf",
  "vendor/elliptic-curve",
  "vendor/ff",
  "vendor/ghash",
  "vendor/group",
  "vendor/hkdf",
  "vendor/keccak",
  "vendor/libm",
  "vendor/md-5",
  "vendor/miniz_oxide",
  "vendor/num-bigint",
  "vendor/num-integer",
  "vendor/num-traits",
  "vendor/p256",
  "vendor/p384",
  "vendor/pbkdf2",
  "vendor/polyval",
  "vendor/primefield",
  "vendor/primeorder",
  "vendor/rand_core",
  "vendor/regex-automata",
  "vendor/regex-syntax",
  "vendor/rfc6979",
  "vendor/rsa",
  "vendor/ryu",
  "vendor/sec1",
  "vendor/sha1",
  "vendor/sha3",
  "vendor/signature",
  "vendor/sponge-cursor",
  "vendor/wnaf",
]

[profile.release]
codegen-units = 1  # 1 better optimizations
debug = false
strip = false
lto = "fat"
incremental = true
#panic = "abort" # Remove panic output, which can reduce file size
opt-level = "s" # z,s: Optimize for size instead of performance; 1 for easier debugging; comment out for "best performance" (but in Rust 1.72 this causes regressions)

# Release with checks on: `core`'s preconditions on raw-pointer calls, `debug_assert!` and
# arithmetic overflow panic instead of being silent. The bench boots chosen cases with it
# (docs/testbench.md, "Checked builds"); `cargo build --profile checked` by hand.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

[patch.crates-io]
# ipd's stack: the vendored copies are the ones that build; tools/vendor-check
# proves it and that every vendored byte is the published one.
[patch.crates-io.smoltcp]
path = "vendor/smoltcp"
[patch.crates-io.managed]
path = "vendor/managed"
[patch.crates-io.heapless]
path = "vendor/heapless"
[patch.crates-io.hash32]
path = "vendor/hash32"
[patch.crates-io.stable_deref_trait]
path = "vendor/stable_deref_trait"
[patch.crates-io.byteorder]
path = "vendor/byteorder"
# The loader's and keyd's Ed25519, the same way.
[patch.crates-io.ed25519-compact]
path = "vendor/ed25519-compact"
# sshd's SSH library (patched: vendor/patches/sunset.patch) and its dependencies.
[patch.crates-io.sunset]
path = "vendor/sunset"
[patch.crates-io.aes]
path = "vendor/aes"
[patch.crates-io.ascii]
path = "vendor/ascii"
[patch.crates-io.block-buffer]
path = "vendor/block-buffer"
[patch.crates-io.chacha20]
path = "vendor/chacha20"
[patch.crates-io.cipher]
path = "vendor/cipher"
[patch.crates-io.cmov]
path = "vendor/cmov"
[patch.crates-io.cpubits]
path = "vendor/cpubits"
[patch.crates-io.crypto-common]
path = "vendor/crypto-common"
[patch.crates-io.ctr]
path = "vendor/ctr"
[patch.crates-io.ctutils]
path = "vendor/ctutils"
[patch.crates-io.digest]
path = "vendor/digest"
[patch.crates-io.getrandom]
path = "vendor/getrandom"
[patch.crates-io.hmac]
path = "vendor/hmac"
[patch.crates-io.hybrid-array]
path = "vendor/hybrid-array"
[patch.crates-io.inout]
path = "vendor/inout"
[patch.crates-io.poly1305]
path = "vendor/poly1305"
[patch.crates-io.sha2]
path = "vendor/sha2"
[patch.crates-io.snafu]
path = "vendor/snafu"
[patch.crates-io.subtle]
path = "vendor/subtle"
[patch.crates-io.typenum]
path = "vendor/typenum"
[patch.crates-io.universal-hash]
path = "vendor/universal-hash"
[patch.crates-io.zeroize]
path = "vendor/zeroize"
[patch.crates-io.sunset-sshwire-derive]
path = "vendor/sunset-sshwire-derive"
[patch.crates-io.snafu-derive]
path = "vendor/snafu-derive"
[patch.crates-io.zeroize_derive]
path = "vendor/zeroize_derive"
[patch.crates-io.virtue]
path = "vendor/virtue"

# Arithmetic overflow remains an invariant failure in the executable model.
[profile.release.package.redoubt-model]
overflow-checks = true

# The bench runs host suites in dev; optimize the model without disabling checks.
[profile.dev.package.redoubt-model]
opt-level = 3
overflow-checks = true
