[package]
name = "redoubt-model"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Executable security model of the Redoubt kernel (docs/kernel/model.md) and the steward's policy core on it"

# One dependency on purpose: the steward's policy core, which the model embeds in place of a copy of
# the policy (servers/steward.md, "Two embedders and a reference"). Otherwise the model is read side
# by side with docs/kernel/, and its random sequences come from a small seeded generator
# (src/gen.rs), so every failure is reproducible from one seed and shrinks to a short trace.
[dependencies]
redoubt-steward = { path = "../libs/steward" }
