name: Deploy the book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the mdBook tools
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-mermaid
            ~/.cargo/bin/mdbook-svgbob
          key: mdbook-0.5.4-mermaid-0.17.1-svgbob-0.3.1-${{ runner.os }}

      - name: Install mdBook and its preprocessors
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install mdbook --version 0.5.4
          cargo install mdbook-mermaid --version 0.17.1
          cargo install mdbook-svgbob --version 0.3.1

      - name: Build the book
        run: mdbook build docs

      - name: Upload the book as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "target/book"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
