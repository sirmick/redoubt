[package]
name = "redoubt-stride"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The kernel's stride queue arithmetic and ranks (KERNEL-SPEC.md R7/R12), host-tested against the executable model"

