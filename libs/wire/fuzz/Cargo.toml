# Fuzz targets for redoubt-wire (TENETS.md 6: fuzz what parses). Host-only; excluded from the
# workspace; how to run them and the recorded results are in README.md. serde_json is a test
# oracle for the json target only; it is never linked into anything that runs on Redoubt.
[package]
name = "redoubt-wire-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
redoubt-wire = { path = ".." }

[workspace]

[[bin]]
name = "ninep"
path = "fuzz_targets/ninep.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typed"
path = "fuzz_targets/typed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false
bench = false
