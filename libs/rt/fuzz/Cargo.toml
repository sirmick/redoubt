[package]
name = "redoubt-rt-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Host-only and out of the main workspace (its own workspace below), so the fuzzer's nightly
# toolchain and libfuzzer never touch the machine build (TENETS.md 3 and 6). Run from here:
#     cargo fuzz run startup
#     cargo fuzz run ninep_server
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
redoubt-rt = { path = ".." }

[[bin]]
name = "startup"
path = "fuzz_targets/startup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ninep_server"
path = "fuzz_targets/ninep_server.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
