description = "Kernel RNG is seeded from the device tree: server IDs differ within a boot and between boots"
arch = ["rv64", "rv32"]
kind = "boot"
programs = ["log-server", "rng-test"]
expect = ['rng-seed: \d+ bytes', 'Kernel RNG seeded from the loader', 'RNG TEST PASSED']
distinct_across_boots = ['first server id: (.*)']
