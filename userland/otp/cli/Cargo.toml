[package]
name = "beamlet"
description = "Run BEAM modules on beamlet using the POSIX platform"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
beamlet-vm = { path = "../vm" }
beamlet-crypto = { path = "../crypto" }
beamlet-re = { path = "../re" }
beamlet-screen = { path = "../screen" }
cap-std = "3"
fs-set-times = "0.20"
# The terminal: raw mode and its restoration (`tty.rs`); `libc` for `sigaction` alone, which
# rustix has no safe wrapper for.
libc = "0.2"
rustix = { version = "1", features = ["stdio", "termios"] }

[dev-dependencies]
# The tests run the binary on a pseudo-terminal and signal it.
rustix = { version = "1", features = ["process", "pty", "stdio", "termios"] }

[features]
default = ["threads"]
# Several schedulers on threads. Without it the VM is built as it is for a `no_std` embedder
# (one scheduler, locks that are `RefCell`s), which `--no-default-features` tests end to end.
threads = ["beamlet-vm/std"]
# Real PCRE2 (C) behind `re`, for testing against BEAM; never in a default build.
pcre2 = ["beamlet-re/pcre2"]
