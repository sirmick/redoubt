[package]
name = "beamlet-redoubt"
description = "beamlet's Platform on Redoubt, over the client library"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
beamlet-vm = { path = "../vm" }
redoubt-client = { path = "../../../libs/client" }
redoubt-rt = { path = "../../../libs/rt" }
# The natives the shell's modules need, which `run` gives every VM.
beamlet-crypto = { path = "../crypto" }
beamlet-re = { path = "../re" }
# The host launcher, `fake-redoubt`: the platform run on the fake kernel. Host only; nothing that
# runs on the machine has this feature.
redoubt-fake-kernel = { path = "../../../libs/rt/fake", optional = true }

[features]
fake = ["dep:redoubt-fake-kernel"]

# beamlet on the machine, started by init (docs/userland/beamlet.md, "beamlet on Redoubt").
[[bin]]
name = "beamlet"
test = false

[[bin]]
name = "fake-redoubt"
required-features = ["fake"]

[[test]]
name = "console"
required-features = ["fake"]
