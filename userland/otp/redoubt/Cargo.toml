[package]
name = "beamlet-redoubt"
description = "beamlet's Platform on Redoubt, over the client library"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
# Several schedulers on the machine: the runtime's locks and threads (docs/userland/beamlet.md).
beamlet-vm = { path = "../vm", features = ["redoubt"] }
redoubt-client = { path = "../../../libs/client" }
redoubt-rt = { path = "../../../libs/rt" }
# The natives the shell's modules need, which `run` gives every VM.
beamlet-crypto = { path = "../crypto" }
beamlet-re = { path = "../re" }
beamlet-screen = { path = "../screen" }
# The host launcher, `fake-redoubt`: the platform run on the fake kernel. Host only; nothing that
# runs on the machine has this feature.
redoubt-fake-kernel = { path = "../../../libs/rt/fake", optional = true }
# The host fixture's home volume: the real `littlefsd`, on the fake kernel. Host only, as above.
redoubt-littlefsd = { path = "../../../servers/littlefsd", optional = true }
# What littlefsd's program starts through, which the fixture builds from its source.
redoubt-fileserver = { path = "../../../libs/fileserver", optional = true }

[features]
fake = ["dep:redoubt-fake-kernel", "dep:redoubt-littlefsd", "dep:redoubt-fileserver"]
# Test-only, for the bench's boot-profile cases, and off in every default build: the start
# module's line carries `[t=N]`, and the VM's lookups are counted and said at the prompt.
boot-stats = []

# beamlet on the machine, started by init (docs/userland/beamlet.md, "beamlet on Redoubt").
[[bin]]
name = "beamlet"
test = false

[[bin]]
name = "fake-redoubt"
required-features = ["fake"]

[[test]]
name = "console"
required-features = ["fake"]

[[test]]
name = "limits"
required-features = ["fake"]

[[test]]
name = "files"
required-features = ["fake"]

[[test]]
name = "system"
required-features = ["fake"]

[[test]]
name = "schedulers"
required-features = ["fake"]
