[package]
name = "beamlet-crypto"
description = "OTP's crypto NIFs for beamlet, in pure Rust (RustCrypto)"
edition.workspace = true
license.workspace = true
version.workspace = true

# Every dependency below is pure Rust and no_std: the RustCrypto crates, the most reviewed Rust
# implementations of these primitives, and for X25519 and Ed25519, ed25519-compact, the crate the
# loader, keyd and sshd use, so the system has one implementation of each. See
# docs/userland/beamlet.md.
[dependencies]
aes = { version = "0.9.3", default-features = false }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"] }
beamlet-vm = { path = "../vm" }
cbc = { version = "0.2.1", default-features = false }
chacha20 = { version = "0.10.2", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false }
ctr = { version = "0.10.1", default-features = false }
ed25519-compact = { version = "2.4.2", default-features = false, features = ["x25519"] }
hmac = { version = "0.13.0", default-features = false }
md-5 = { version = "0.11.0", default-features = false }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "ecdh", "arithmetic"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa", "ecdh", "arithmetic"] }
pbkdf2 = { version = "0.13.0", default-features = false }
poly1305 = { version = "0.9.1", default-features = false }
# RSA: the 0.10 line, pinned to one release candidate, because it is the one on the digest 0.11
# generation every other crate here uses, and its arithmetic is crypto-bigint's. The 0.9 line
# would bring a second copy of that generation's crates, the most unsafe ones in the VM among them.
rsa = { version = "=0.10.0-rc.18", default-features = false, features = ["hazmat"] }
rand_core = { version = "0.10", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
sha3 = { version = "0.12.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1", default-features = false }
elliptic-curve = { version = "0.14", default-features = false, features = ["arithmetic", "sec1", "ecdh"] }
ecdsa = { version = "0.17", default-features = false, features = ["algorithm", "der"] }
