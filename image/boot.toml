# What goes into the signed boot bundle (`signature || ustar`), in this order. The bench's builder
# reads it, the one tool that packs a bundle: `./mkimage` packs it into target/image/, and the
# `init-boot` case boots it (docs/kernel/boot.md, "The boot bundle").
#
# The loader verifies the signature over the whole archive and loads only the first two entries:
# `kernel`, which must be first, and `init`. Every later entry is data to the loader. `init` reads
# the manifest and starts the servers whose images it names (docs/servers/init.md).
#
# An entry is a program, the binary of `package` named as the entry and built for the target (in
# `workspace`, a directory of the root, if the package is in a workspace of its own), or data
# read from `path`, relative to the workspace root. A manifest's `verity` names the userland disk
# recipe whose verified volume's root and block count the builder pins in it, from its own pack.

[[entry]]
name = "kernel"
package = "redoubt-kernel"

[[entry]]
name = "init"
package = "redoubt-init"

[[entry]]
name = "keyd"
package = "redoubt-keyd"

[[entry]]
name = "consoled"
package = "redoubt-consoled"

[[entry]]
name = "bootfsd"
package = "redoubt-bootfsd"

[[entry]]
name = "blkd"
package = "redoubt-blkd"

[[entry]]
name = "verityd"
package = "redoubt-verityd"

[[entry]]
name = "netd"
package = "redoubt-netd"

[[entry]]
name = "ipd"
package = "redoubt-ipd"

[[entry]]
name = "littlefsd"
package = "redoubt-littlefsd"

[[entry]]
name = "erofsd"
package = "redoubt-erofsd"

[[entry]]
name = "beamlet"
# The Erlang VM, the shell's, in a workspace of its own.
package = "beamlet-redoubt"
workspace = "userland/otp"

[[entry]]
name = "manifest"
path = "image/manifest.json"
# The userland volume's root and data blocks, from the pack of image/userland.toml: the signed
# manifest pins the disk (docs/servers/verityd.md).
verity = "image/userland.toml"
