# What goes into the signed boot bundle (`signature || ustar`).
#
# The loader verifies the signature over the whole archive and starts the entries in order.
# `kernel` must be first. The loader refuses a `grants` entry: devices are reached only
# through their handles.
#
# NOTE: not yet consumed by a tool. `./mkimage` builds its bundle through the bench's builder;
# this file records the intended shape for when `init` and the servers exist. Then the loader
# loads only the kernel and `init`, and `init` starts every other entry from the boot manifest
# (docs/kernel/boot.md, docs/servers/init.md; planned in docs/plan/m1-separation.md).

[[entry]]
name = "kernel"
package = "redoubt-kernel"

