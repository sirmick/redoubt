# The virtio-blk disk image: a partition table, the `data` volume and Alice's labelled volume, each
# on walfs served by its own `walfsd`.
#
# `./mkimage` packs it into target/image/disk.img with the bench's packer (`testbench --pack-disk`):
# a GPT of equal partitions in this order, by `blkd`'s builder, then each partition as a walfs
# volume holding its stage's tree, written by libs/walfs itself (servers/walfsd.md, "The packer").
# Partition i is GPT entry i, the manifest's `volumes` partition.

# Whole disk, in KiB (a whole number of 512-byte sectors).
size_kib = 65536
# The manifest whose volumes' `bytes` the partitions are held to: a pack whose partition differs
# from its volume's `bytes` is refused (servers/init.md, "Home quotas").
manifest = "image/manifest.json"

[[partition]]
name = "data"
fs = "walfs"
# Where the partition's contents come from; built artifacts are copied in first.
stage = "target/image/stage"

# Alice's labelled volume, {alice-secrets}, served by its own walfsd (image/manifest.json).
[[partition]]
name = "alice-secrets"
fs = "walfs"
stage = "target/image/vault"
