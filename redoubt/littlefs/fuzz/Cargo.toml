[package]
name = "littlefs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Host-only, and outside the workspace (see the root Cargo.toml `exclude`).
# Run from redoubt/littlefs (nightly comes from rust-toolchain.toml):
#   cargo fuzz run -s none image fuzz/corpus/image fuzz/seeds/image
#   cargo fuzz run -s none mutate fuzz/corpus/mutate fuzz/seeds/mutate
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
littlefs = { path = ".." }

[[bin]]
name = "image"
path = "fuzz_targets/image.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mutate"
path = "fuzz_targets/mutate.rs"
test = false
doc = false
bench = false
