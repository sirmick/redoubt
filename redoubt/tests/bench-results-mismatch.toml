description = "Bench self-check: bench-results fails when one reported result differs from the file"
arch = ["rv64"]
kind = "boot"
programs = ["log-server", "ipc-client"]
expect = ['IPC TEST PASSED']
must_fail = '^result 3: guest reported "1000 lend_mut round trips", expected "999 lend_mut round trips"$'

[results]
pattern = '^\[ipc\] ok: (.*)$'
expected = "redoubt/tests/data/ipc-results-wrong.txt"

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]
