description = "blkd builds for both widths (BUILD-PLAN.md: rv32 keeps compiling)"
arch = ["rv64", "rv32"]
kind = "build"
# `cargo build -p redoubt-blkd` builds the library and its one bin, `blkd`. WP-K3's device
# objects, `dma_alloc` and IRQ receive are wired; what is still missing before a boot case is
# WP-K4's `process_start` handle list and WP-R3's `init`, which creates `blkd`'s endpoint and
# writes the startup block naming `disk` and `disk-irq`. Until then `blkd`'s behaviour is covered
# by host tests (`blkd-host-tests`), and this case covers the configuration the bench cannot boot
# yet.
package = "redoubt-blkd"
