description = "Bench self-check: a session connects to the host port QEMU forwards to the guest's port 22; nothing answers yet"
arch = ["rv64"]
kind = "boot"
programs = ["log-server"]
timeout_secs = 2.5
expect = ['PID 2 listening']

[net]
forward = [22]

# Nothing in the guest speaks TCP yet (netd and sshd come later), so QEMU accepts the
# connection on the host port and the SSH handshake then gets no answer; had the bench used
# the wrong port, ssh would have been refused at once. ssh gives up half a second before the
# case's deadline and says why.
[[session]]
user = "alice"
steps = [{ expect = 'Connection timed out during banner exchange' }, { exit = 255 }]

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]
