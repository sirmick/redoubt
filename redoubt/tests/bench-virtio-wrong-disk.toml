description = "Bench self-check: bench-virtio-devices fails when the disk has another size"
arch = ["rv64"]
kind = "boot"
programs = ["log-server", "virtio-probe"]
timeout_secs = 20
# The same expectations as bench-virtio-devices, with a 2 MiB disk: the probe must report
# 4096 sectors, so the case must fail at the disk line.
expect = ['network device, mac 52:54:00:12:34:56', 'block device, 8192 sectors', '2 device\(s\)']
must_fail = 'guest exited while waiting for /block device, 8192 sectors/'

[disk]
size_kib = 2048

[net]

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]

[[grant]]
program = "virtio-probe"
mmio = ["0x10001000:0x8000", "0x100000:0x1000"]
