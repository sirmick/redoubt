description = "Bench self-check: a session whose key the server refuses fails, and says why"
kind = "ssh-loopback"
timeout_secs = 20
authorized = ["alice"]
must_fail = '^session bob: step 2: ssh exited while waiting for /\^bob-42\$/$'

[[session]]
user = "bob"
steps = [
    { send = "echo bob-$((6 * 7))\n" },
    { expect = '^bob-42$' },
]
