description = "Hart timer as IRQ 0: ownership check, timebase, five one-shot ticks re-armed from the handler"
arch = ["rv64", "rv32"]
kind = "boot"
programs = ["log-server", "timer-test"]
expect = [
    'ok: set-deadline without owning the irq -> Err\(AccessDenied\)',
    '\[timer\] timebase \d+ Hz',
    '\[timer\] tick 5',
    'TIMER TEST PASSED',
]

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]

[[grant]]
program = "timer-test"
irq = [0]
