description = "blkd against a hostile virtio-blk device: the acceptance criterion no boot can reach yet"
kind = "host-tests"
# WP-D1's acceptance criterion is about a device that lies, and QEMU's virtio-blk does not. The
# fake device (`redoubt_blkd::fake`) writes malformed rings, indices out of range, lengths that
# overflow, descriptors that loop, used entries for requests never sent, and rewrites the region
# between two of the driver's own reads; 100,000 randomized liars run in the same suite. Nothing
# here needs a kernel, so it runs as a host test until WP-K3 lands and `blkd` can boot.
packages = ["redoubt-blkd"]
