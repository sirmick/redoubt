description = "Hostile interrupt syscalls: out-of-range numbers, unowned, another's and doubly claimed interrupts (verdict: the victim's irq and survival only, until WP-K3)"
# Pending (WP-K3): K3 rewrites this case for IRQ handles. Until then the out-of-range and
# double-claim attempts can only show that the kernel survived; that they were refused is the
# attacker's report. Freeing the victim's irq 10 is judged by the victim.
arch = ["rv64", "rv32"]
kind = "boot"
# PID 2 log-server is the victim, holding irq 10; PID 3 irq-attack attacks.
programs = ["log-server", "irq-attack"]
expect = [
    # Victim, unforgeable: only log-server's fixed template prints this (console::Line).
    '^\[server\] claimed irq 10$',
    # Progress, the attacker's report; a refusal it did not get shows as FAIL (forbidden).
    '^\[pid 3\] \[irq-attack\] ok: irq 0x20: free -> Err',
    '^\[pid 3\] \[irq-attack\] ok: irq 0xf+',
    '^\[pid 3\] \[irq-attack\] ok: freeing the victim.s irq 10 -> Err',
    '^\[pid 3\] \[irq-attack\] ok: double claim',
    '^\[pid 3\] \[irq-attack\] attempts done$',
    # The verdict, the victim's: the kernel survived and irq 10 is still the victim's.
    # Unforgeable: only log-server's interrupt handler prints this, for a byte on the UART.
    "^\\[server\\] irq 10: received 'y'$",
]
forbid = ['\] FAIL']

[[input]]
after = '^\[pid 3\] \[irq-attack\] attempts done$'
send = "y"

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]
irq = [10]

[[grant]]
program = "irq-attack"
irq = [6]
