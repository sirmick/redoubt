description = "The loader refuses a boot bundle signed under the right domain with the wrong length"
arch = ["rv64"]
kind = "boot"
programs = ["log-server"]
timeout_secs = 20
# The bundle domain, but a length that is not the archive's. The loader measures the archive in
# the container it is reading and never reads a length out of the signed bytes, so a signer that
# counted something else does not verify (VERIFIED-BOOT.md, Signature).
sign_bundle = "wrong-length"
allow_panic = true          # the loader is supposed to panic here
expect = ['^loader PANIC', 'signature is invalid']
forbid = ['KMAIN', 'bundle signature ok']
poweroff = true             # and the refusal stops the machine, rather than limping on

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]
