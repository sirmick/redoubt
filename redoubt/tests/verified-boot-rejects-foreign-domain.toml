description = "The loader refuses a boot bundle signed under another Redoubt signing domain"
arch = ["rv64"]
kind = "boot"
programs = ["log-server"]
timeout_secs = 20
# The right key over `"redoubt.pkg.v1\0" || u64_le(len) || tar`: a signature made for the package
# container (PACKAGES.md) must never boot a machine. This is the hole domain separation closes
# (answer 120): a signature made under one protocol, replayed as another's.
sign_bundle = "foreign-domain"
allow_panic = true          # the loader is supposed to panic here
expect = ['^loader PANIC', 'signature is invalid']
forbid = ['KMAIN', 'bundle signature ok']
poweroff = true             # and the refusal stops the machine, rather than limping on

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]
