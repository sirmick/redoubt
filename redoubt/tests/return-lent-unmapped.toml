description = "Unmapping or remapping a page while it is lent out is refused, and the borrower's return does not panic the kernel (verdict: survival only)"
arch = ["rv64", "rv32"]
kind = "boot"
# PID 2 log-server; PID 3 return-lent-borrower; PID 4 return-lent (lender + clobber thread);
# PID 5 attack-checker.
programs = ["log-server", "return-lent-borrower", "return-lent", "attack-checker"]
smp = [1, 4]
timeout_secs = 30
# On the old kernel, unmap cleared the lent PTE, and the borrower's return then asserted and
# halted the machine. PANIC is always forbidden; the verdict is the checker's clean power-off
# under its own PID, which a panicked kernel never reaches. The lender's own lines are progress:
# both the unmap and the remap must be refused (ShareViolation), and its page must
# come back intact.
expect = [
    '^\[pid 4\] \[lender\] while lent: unmap Err\(ShareViolation\), remap Err\(ShareViolation\)$',
    '^\[pid 4\] \[lender\] lend returned Ok\(MemoryReturned\(.*\)\), page intact: true$',
    '^\[pid 5\] \[checker\] PID 4 reported; the kernel still serves',
]
forbid = ['intact: false$', 'unmap Ok']
poweroff = true

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]

[[grant]]
program = "attack-checker"
mmio = ["0x100000:0x1000"]
