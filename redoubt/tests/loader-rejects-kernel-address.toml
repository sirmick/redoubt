description = "The loader refuses a program image with a segment in the kernel's address range"
arch = ["rv64", "rv32"]
kind = "boot"
programs = ["log-server", { corrupt = "rng-test", with = { segment-vaddr = "0xffffffffffd00000" } }]
timeout_secs = 20
allow_panic = true          # the loader is supposed to panic here
expect = ['loader PANIC', 'ELF segment 0xf+d00000\S* is outside']
forbid = ['KMAIN', 'entering kernel']

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]
