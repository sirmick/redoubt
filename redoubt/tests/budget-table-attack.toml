description = "Exhausting the handle table ends in OutOfMemory at 4096 handles (32 pages of 128), each page charged to the holder's budget and freed when emptied or swept; system keeps serving"
arch = ["rv64", "rv32"]
kind = "boot"
# PID 2 the attacker (the loader's first program, holding root, system and users); PID 3
# log-server; PID 4 budget-victim, in system beside the attacker; PID 5 attack-checker.
programs = ["budget-table-attack", "log-server", "budget-victim", "attack-checker"]
timeout_secs = 30
# The attacker fills its table with revocation scopes until the kernel refuses, closes the last
# page and reopens it, forges indices past the table, then destroys the pool, which sweeps
# every scope. A table grown without bound, or a page index past the table, would take the
# kernel down; the verdict is the victim's pages and the checker's power-off. The attacker's
# lines pin the limit and the charge (31 pages beyond the one it had) as progress.
expect = [
    '^\[pid 2\] \[table\] filled to handle 4096, then OutOfMemory; the pool paid 4092 pages$',
    '^\[pid 2\] \[table\] system paid 31 pages for the table$',
    '^\[pid 2\] \[table\] closed 3969..=4096: true; reopened -> Ok\(3969\)$',
    '^\[pid 2\] \[table\] destroyed the pool -> Ok\(\(\)\); system usage back where it was: true$',
    '^\[pid 2\] \[table\] every swept index is empty: true$',
    '^\[pid 2\] \[table\] attempts done$',
    '^\[pid 4\] \[victim\] mapped and touched 64 pages in system after the attack$',
    '^\[pid 5\] \[checker\] PID 4 reported; the kernel still serves',
]
forbid = ['BREACH']
poweroff = true

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]

[[grant]]
program = "attack-checker"
mmio = ["0x100000:0x1000"]
