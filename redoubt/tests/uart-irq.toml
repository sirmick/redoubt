description = "An external interrupt reaches a driver through `receive` on its IRQ handle (R5: the kernel masks the source and sets `fired`, the next receive unmasks it and returns; no acknowledge call), with the console taken through `map_device` and injected console input (checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
# Built with the checks on (redoubt/README.md, "Debug assertions").
debug_assertions = true
# PID 2 log-server is the bundle's first program, so it holds every device object the loader
# made (INTERIM, kernel device.rs): it maps the console through its MMIO handle and echoes
# every byte from a thread blocked in `receive` on the console's IRQ handle. No grants: the
# handle is the authority now (DEVICE-GRANTS.md, Replacement).
programs = ["log-server"]
# The server reads **one byte per interrupt**, so it leaves the FIFO asserted and every byte
# needs its own interrupt. That makes both halves of R5 visible:
#
# - a kernel whose `receive` does not unmask the source echoes nothing at all;
# - a kernel that does not mask the source when it fires never gets back to userspace. The
#   level is still asserted when the trap returns, so the hart traps again at once and for
#   ever, and the first byte is never echoed.
#
# The first three bytes are typed one at a time, each only after the one before was echoed;
# the last two are typed together, so the second is answered from a source that re-asserted
# while the driver was running rather than from a fresh keystroke.
#
# What this still cannot show: that the interrupt controller's claim is completed *before* the
# source is masked. The PLIC specification says a completion for a source that is not enabled
# is silently ignored (so the source would never fire again), but QEMU 8.2's model accepts it,
# and no case can tell the two orders apart on this machine. That one is read, not tested.
expect = [
    '^\[server\] holding the console irq$',
    "^\\[server\\] irq: received 'x'$",
    "^\\[server\\] irq: received 'y'$",
    "^\\[server\\] irq: received 'z'$",
    "^\\[server\\] irq: received 'p'$",
    "^\\[server\\] irq: received 'q'$",
]

[[input]]
after = '^\[server\] PID 2 listening$'
send = "x"

[[input]]
after = "^\\[server\\] irq: received 'x'$"
send = "y"

[[input]]
after = "^\\[server\\] irq: received 'y'$"
send = "z"

# Two at once: the second byte is still in the FIFO when the driver receives again.
[[input]]
after = "^\\[server\\] irq: received 'z'$"
send = "pq"
