description = "consoled builds for both widths (BUILD-PLAN.md: rv32 keeps compiling)"
arch = ["rv64", "rv32"]
kind = "build"
# `cargo build -p redoubt-consoled` builds the library and its one bin, `consoled`. Booting it
# on the box needs WP-K4 and WP-R3: it takes its UART and its interrupt from device handles in
# a startup block, and nothing writes one yet. Until then its behaviour -- both threads, the
# ns16550 registers, a parked read woken by an interrupt -- is covered by host tests against the
# runtime's fake kernel (`redoubt/consoled/tests/`, which include WP-W1's 9P conformance
# vectors), and this case covers the configuration the bench cannot boot yet.
package = "redoubt-consoled"
