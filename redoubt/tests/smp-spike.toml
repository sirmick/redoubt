description = "A second hart, started via SBI HSM, contends on the spinlock big-kernel-lock without losing updates"
arch = ["rv64", "rv32"]
kind = "boot"
# Debug assertions: `core`'s preconditions on raw-pointer calls and the kernel's own
# `debug_assert!`s run in this boot (redoubt/README.md, "Debug assertions").
debug_assertions = true
programs = ["log-server"]
kernel_features = ["smp"]
smp = [2]
timeout_secs = 60
expect = ['SMP SPIKE:.* OK']
forbid = ['MISMATCH', 'could not start']

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]
