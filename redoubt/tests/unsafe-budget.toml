description = "Ratchet on `unsafe` in the trusted computing base, and on unsafe without a SAFETY comment"
kind = "unsafe-budget"

# Budgets only go down. Raising one needs a justification in the commit that does it.
# Every component is at max_undocumented = 0: all `unsafe` in the kernel and loader now
# carries a SAFETY comment or a `# Safety` doc. Keep it that way.
# Only code that runs on rv64 is counted; see TENETS.md for the baseline.

[[budget]]
name = "paging crate (Sv32/Sv39 page tables)"
paths = ["redoubt/paging/src"]
max_unsafe = 12
max_undocumented = 0

[[budget]]
name = "loader"
paths = ["loader/src"]
max_unsafe = 17 # +3: fdt-rs DevTree::from_raw_pointer, the static index buffer, and Platform::read
max_undocumented = 0

[[budget]]
# WP-V1: the boot bundle's signature preimage, linked into the loader, so it is TCB. It is
# `#![forbid(unsafe_code)]`; the budget says so where the rest of the TCB is counted.
name = "redoubt-signing (signature preimages)"
paths = ["redoubt/signing/src"]
max_unsafe = 0
max_undocumented = 0

[[budget]]
name = "kernel: Sv39, SBI and PLIC backends"
paths = [
    "kernel/src/arch/riscv/mem.rs", "kernel/src/arch/riscv/mmu_flags.rs",
    "kernel/src/arch/riscv/intc_plic.rs", "kernel/src/arch/riscv/timer_sbi.rs",
    "kernel/src/arch/riscv/asm.rs", "kernel/src/platform/sbi",
]
max_unsafe = 15
max_undocumented = 0

[[budget]]
name = "kernel: RISC-V arch (shared with rv32)"
paths = [
    "kernel/src/arch/riscv/irq.rs", "kernel/src/arch/riscv/process.rs", "kernel/src/arch/riscv/syscall.rs",
    "kernel/src/arch/riscv/mod.rs", "kernel/src/arch/riscv/exception.rs", "kernel/src/arch/riscv/panic.rs",
]
max_unsafe = 10
max_undocumented = 0

[[budget]]
name = "kernel: core"
paths = [
    "kernel/src/main.rs", "kernel/src/mem.rs", "kernel/src/services.rs", "kernel/src/server.rs",
    "kernel/src/syscall.rs", "kernel/src/irq.rs", "kernel/src/args.rs", "kernel/src/io.rs",
    "kernel/src/budget.rs", "kernel/src/handle.rs", "kernel/src/kframe.rs", "kernel/src/redoubt.rs",
]
# WP-K1: kframe.rs's three (words of kernel-object frames and of records, through the physmap)
# replace mem.rs's three needless ones in the deleted `print_ownership`; the total is unchanged.
# WP-A2: -1, kframe.rs's `write_byte` (its one user, the old byte-writing `random`, is gone).
# WP-K0b: -2, mem.rs reads the loader's `MREx` table through a safe slice of words instead of
# casting it to a struct it is not aligned for, and args.rs prints a tag name through
# `str::from_utf8` instead of building a slice by hand.
max_unsafe = 21
max_undocumented = 0

[[budget]]
name = "redoubt-sys (system call ABI): the ecall stub"
paths = ["redoubt/sys/src"]
max_unsafe = 1
max_undocumented = 0

[[budget]]
name = "redoubt-rt (native runtime): the heap's free lists, page buffers and lends, the startup page"
paths = ["redoubt/rt/src"]
max_unsafe = 9
max_undocumented = 0

[[budget]]
name = "keyd (holds every private key; signs, never exports)"
paths = ["redoubt/keyd/src"]
# WP-S1: none, and the crate says `#![forbid(unsafe_code)]`, so this can only stay at 0.
max_unsafe = 0
max_undocumented = 0
