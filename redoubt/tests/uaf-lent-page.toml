description = "A process that dies while a page is lent out must not let that frame be reused under the borrower"
arch = ["rv64"]
kind = "boot"
programs = ["log-server", "uaf-holder", "uaf-victim", "uaf-grabber"]
timeout_secs = 30
# The holder prints "UAF TEST FAILED" if it sees the grabber's data; that contains
# "TEST FAILED", which the bench always forbids. So the safe outcome is the only pass.
# The verdict is the holder's (PID 3), the borrower whose page is at stake; the attacker is the
# grabber (PID 5), whose `[pid 5]` lines cannot pass for the holder's.
expect = ['^\[pid 3\] \[holder\] holding page', '^\[pid 5\] \[grabber\] stamped', '^\[pid 3\] UAF TEST PASSED']

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]

[[grant]]
program = "uaf-holder"
mmio = ["0x10000000:0x1000"]
