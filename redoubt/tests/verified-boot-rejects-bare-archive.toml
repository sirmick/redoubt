description = "The loader refuses a boot bundle whose signature covers the bare archive, with no domain and no length"
arch = ["rv64"]
kind = "boot"
programs = ["log-server"]
timeout_secs = 20
# Signed with the right key, over an untouched and well-formed archive: only the preimage is
# wrong. This is exactly what a signer that predates the bundle domain produces, and what the
# loader accepted before WP-V1 (VERIFIED-BOOT.md, answer 120).
sign_bundle = "bare-archive"
allow_panic = true          # the loader is supposed to panic here
# The verdict is the loader's own: nothing from the bundle runs (KMAIN is forbidden), so no
# program can print it. Anchored, so a relayed `[pid N]` line could not match either.
expect = ['^loader PANIC', 'signature is invalid']
forbid = ['KMAIN', 'bundle signature ok']

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]
