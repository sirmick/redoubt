description = "Bench self-check: without disk and net the guest sees no virtio devices"
arch = ["rv64"]
kind = "boot"
programs = ["log-server", "virtio-probe"]
timeout_secs = 20
expect = ['\[virtio\] 0 device\(s\)']
forbid = ['network device', 'block device']

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]

[[grant]]
program = "virtio-probe"
mmio = ["0x10001000:0x8000", "0x100000:0x1000"]
