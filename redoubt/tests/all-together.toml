description = "IPC and timer tests sharing one log server, to catch interference between processes (checked build)"
arch = ["rv64"]
kind = "boot"
# Built with the checks on (redoubt/README.md, "Debug assertions").
debug_assertions = true
programs = ["log-server", "ipc-client", "timer-test"]
smp = [1, 2]
expect = ["IPC TEST PASSED", "TIMER TEST PASSED"]

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]

[[grant]]
program = "timer-test"
irq = [0]
