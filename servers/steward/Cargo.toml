[package]
name = "redoubt-steward-server"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The steward: embeds the policy core, carves the principals' budgets, and binds its effects to the kernel"

[[bin]]
name = "steward"
path = "src/bin/steward.rs"

# Only our own crates: the policy core, the runtime and the client library. The core is the one
# place the steward's policy lives; this crate binds its effects.
[dependencies]
redoubt-client = { path = "../../libs/client" }
redoubt-rt = { path = "../../libs/rt" }
redoubt-steward = { path = "../../libs/steward" }

[dev-dependencies]
# init's manifest reading and its writer of the steward's lines, for the round trip over the image's
# manifest in tests/steward.rs.
redoubt-init = { path = "../init" }
