[package]
name = "redoubt-littlefsd"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "littlefsd: one littlefs volume, a range at blkd, served over 9P with its label set and littlefsd's typed operations"

[[bin]]
name = "littlefsd"
path = "src/bin/littlefsd.rs"

# The runtime, and littlefs for the medium; nothing else parses what the volume holds
# (TENETS.md 5).
[dependencies]
redoubt-rt = { path = "../../libs/rt" }
littlefs = { path = "../../libs/littlefs" }

[features]
# Test-only, for the bench's littlefsd-restart case, and off in every default build, as netd's
# restart-probe is: a walk to one name ends the instance (src/server.rs, PROBE).
restart-probe = []
# Test-only, for the bench's littlefsd-one-volume case, and off in every default build: before
# serving, littlefsd tries to reach past its endpoint and its range and says what it found
# (src/one_volume.rs).
one-volume-probe = []

[dev-dependencies]
redoubt-fake-kernel = { path = "../../libs/rt/fake" }
redoubt-client = { path = "../../libs/client" }
