[package]
name = "redoubt-verityd"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "verityd: one verified volume, its range at blkd checked block by block against a pinned or signed root and served on blkd's protocol"

[[bin]]
name = "verityd"
path = "src/bin/verityd.rs"

# The runtime, what the volume servers share (the range client), the tree's one definition, and
# the loader's Ed25519 for a signed volume's root block; nothing else reads what the range holds
# (TENETS.md 5).
[dependencies]
ed25519-compact = { version = "2", default-features = false }
redoubt-rt = { path = "../../libs/rt" }
redoubt-fileserver = { path = "../../libs/fileserver" }
redoubt-verity = { path = "../../libs/verity" }

[features]
# Test-only, for the bench's boot-profile cases, and off in every default build: verityd counts
# its reads, checks, tree-cache hits and reads at blkd, and says them (src/server.rs, `Said`).
boot-stats = []
