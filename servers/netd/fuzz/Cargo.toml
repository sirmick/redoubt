[package]
name = "redoubt-netd-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Host-only and out of the main workspace (its own workspace below), as blkd's: the fuzzer's
# nightly toolchain and libfuzzer never touch the machine build (TENETS.md 3 and 6). Run from
# servers/netd:
#     cargo fuzz run -s none device
# `-s none`: the crate's only `unsafe` is in `kernel.rs`, which no fuzz target reaches.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
redoubt-netd = { path = ".." }
redoubt-rt = { path = "../../../libs/rt" }

[[bin]]
name = "device"
path = "fuzz_targets/device.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
