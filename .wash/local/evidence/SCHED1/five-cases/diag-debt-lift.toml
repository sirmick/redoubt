description = "SCRATCH, never committed: sched-debt-lift with the trace, for the five-cases attribution"
arch = ["rv64"]
whole_run = false
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-debt-lift"]
kernel_features = ["sched-trace"]
post_check = "sched_oracle"
timeout_secs = 600
expect = ['^SCHED-TRACE-END \d+ dropped 0$']
forbid = ['PROGRAM HALT']
poweroff = true
