[[node]]
  id = "SCHED1"
  title = "The steward's timer wake at rv32 two harts under one spinner: a deterministic N=2 p50 miss (31.8 ms vs 15), a kernel lock-contention finding"
  template = "package"
  parent = "AGENTS"
  needs = []
  body = "Ruling: .wash/local/wave-2026-10-18-rulings.md 'STEWARD9 rv32 two-hart'. Brief: to follow (investigation-first). Tier A (kernel scheduler / kernel entry), size M, reviewer kernel-red. Found by STEWARD9, judged for the first time (STEWARD8 never reached the reset on rv32 two harts): the N=2 round's timer_wake p50 is 31.8 ms against the 15 ms target (31,855 then 31,835 us on a rerun alone, icount-deterministic), while N=1 is 5.6 ms and N=3 5.2 ms; everything else on rv32 two-hart N=1-3 meets its target, dropped 0; lock-wait contention 249/1000 in that round. So it is the kernel lock at two harts, scheduling.md's residual 'at 2 harts a wake can wait for the kernel lock behind three sections' (R78, fair kernel entry), surfacing at rv32 specifically and only at N=2 (one spinner live). A finding with a number, not a tuning; no target moves. Investigation: why N=2 (one spinner) specifically and not N=1 or N=3 — a resonance between the spinner's slices and the lock sections at two harts on rv32; whether R78's fair-entry order can bound the wake there, or it is a stated residual (the rv32 two-hart timer_wake at one spinner waits the lock, numbers on scheduling.md). The implementer measures (the lock-wait trace, the N=2 vs N=1/3 difference) and brings the fix-or-residual to the Architect. Not STEWARD9's: STEWARD9 states the rv32 two-hart rows as findings with their numbers and gates rv32 at one hart until this lands. Pages: scheduling.md 'Responsiveness'/'Residual risks' (the number, the cause). logs .tmp/STEWARD9/rv32-14-FAIL-timerwake.log."
  state = "todo"

[[node]]
  id = "BENCH1"
  title = "A case gives smp per width, so a case can gate rv32 at one hart and rv64 at both without a duplicated toml"
  template = "package"
  parent = "AGENTS"
  needs = []
  body = "Ruling: .wash/local/wave-2026-10-18-rulings.md 'STEWARD9 rv32 two-hart'. Tier A (the bench), size S, reviewer the orchestrator's pick (a bench/kernel red). The bench conditions arch and smp at case level only (one smp list for all of a case's widths), so a case that must run rv64 at [1,2] and rv32 at [1] — the latency cases (rv32 two-hart is a finding, SCHED1/READ1), and B88/STEWARD8 wanted the same — can only be expressed today by duplicating a rv64-only two-hart toml. Rule: the case's smp may be given per width (a map form beside the list, e.g. smp = { rv64 = [1, 2], rv32 = [1] }; the list form stays the default for both), parsed by the bench and honoured by the runner, documented on testbench.md with the one example; a width absent from the map runs the default or is skipped as the field says. Reusable: the latency cases, B88 and STEWARD8's cases use it in place of duplicated tomls. Cases: a bench host test of the per-width parse and the runner honouring it; steward-latency (its three cases) gating rv64 [1,2] and rv32 [1] with no duplicated toml. Pages: docs/testbench.md (the smp field, the per-width form, the one example). No kernel or steward change. STEWARD9 depends on it only for the clean gating; if it lands after STEWARD9 the cases carry a stated smp and adopt the field when it is in."
  state = "todo"
