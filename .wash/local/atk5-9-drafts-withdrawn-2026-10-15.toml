  body = "docs/todo/kernel-attack-gaps.md 'README.md' (5 lines), four reachable as bench host tests (tools/testbench), no kernel change: (1) every file under kernel/src appears in docs/kernel/README.md 'Source map' and every mapped path exists: a redoubt-doccheck test over the page (the checker already walks the book; a new check Cn with a fixture, as C7 and C11 have); (2) the no-cruft gate has a self-check: a fixture tree with a planted forbidden name, an `allow(dead_code)`, an unused feature and a second PAGE_SIZE each fails `cruft::check` (tools/testbench/src/cruft.rs:54; its test module at :235 already builds a scratch tree: extend it with the four negatives); (3) the unsafe ratchet shows every on-target TCB source file listed in a budget: a host test that the configured roots' .rs files are each covered by one budget entry (beside every_configured_root_must_contain_rust_source); (4) the README's inclusive line-count table is a snapshot: tie each row to size-budget's ceiling for the same crate (host:testbench::actual_source_counts_still_enforce_the_budget's data), so a row drifting past its ceiling fails bench:docs with the row named; the page's residual 'the table's inclusive line counts are snapshots' goes. Left and stated: that no driver, file system, naming or policy sits in the kernel rests on the source map and the no-cruft list (an argument, now with (1) holding the map complete). Gates: `cargo test -p redoubt-doccheck --test docs`, the testbench host tests, bench:no-cruft, bench:size-budget, bench:docs all green; each negative fixture shown to fail; README.md's status lines updated; the lines leave the todo page with their fate. Files: tools/testbench/src/cruft.rs, size.rs and tests, tools/doccheck, docs/kernel/README.md, docs/testbench.md. Tier B (bench self-checks, no guest code): kernel-red-2. Size S."
