[[node]]
  id = "ATK5"
  title = "devices.md's three crafted-tree lines on ATK4's device_tree knob: a 17th DMA device refused, the loader's no-console and console-without-interrupt refusals, R18's Devs over RAM or a controller"
  template = "package"
  parent = "M2"
  needs = ["ATK4"]
  body = "ATK3 left three devices.md lines (.wash/local/ATK3-report.md, the 'left' rows; devices.md 'Residual risks', 'Crafted boot inputs are not attacked') because the bench could not hand QEMU a device tree. ATK4 built that knob: `device_tree` dumps QEMU's own tree for the case's command line, edits it in place (tools/testbench/src/fdt.rs: drop, shrink, set; no byte moves) and boots with -dtb (.wash/local/ATK4-report.md item 5; docs/testbench.md's boot-knob list). Lever: three to four cases on it, each an expected kernel or loader failure with the named reason as the verdict (rule F), poweroff_status 255, KMAIN forbidden where the loader refuses: (1) seventeen DMA-capable nodes (copy a virtio-mmio node sixteen times with distinct addresses and IRQs if `fdt.rs` gains an 'add node' edit, or else a tree whose eight slots plus duplicated controller nodes reach 17): the kernel gives the 17th no object (dma.rs:15, MAX_DMA_DEVICES 16) and the tester's open of it is refused by name; (2) the tree with its console node dropped: the loader refuses with its 'no console' line; (3) the console's `interrupts` dropped: 'console without an interrupt'; (4) R18: a Devs region straddling RAM's start, and a non-controller node placed over the PLIC, both passing the loader's filter and refused by the kernel's Devs check by name (kernel/src/message.rs's device-object path). `Grnt` stays unreachable (no tree produces it; stated on the page as ATK3 wrote). If `fdt.rs` needs 'add node' or 'set reg', it is this package's bench change with its own host test. Gates: each case 5 runs both widths in the boot class; no bound widened; devices.md's residual and status lines rewritten to what is now attacked; the three lines leave the todo page with their fate. Files: tests/*.toml, tools/testbench/src/fdt.rs and its tests, docs/kernel/devices.md, docs/testbench.md, SECURITY.md; kernel/ only if a refusal is found missing (its own commit with the model's rule). Tier A (kernel refusals): kernel-red-2. Size S."
  state = "todo"

[[node]]
  id = "ATK6"
  title = "timer.md's and budgets.md's reachable lines: a tight kernel-entry loop cannot put a deadline off, a destroyed child's deadline leaves the list, time_now's origin, an endpoint's page, class never read"
  template = "package"
  parent = "M2"
  body = "docs/todo/kernel-attack-gaps.md 'timer.md' (6 lines) and 'budgets.md' (6): the reachable ones without a kernel change, grouped because two are one gap on both pages. (1) A process entering the kernel in a tight loop to put its deadline off (both pages): a tester under init whose budget has a deadline spins on the cheapest ecall; the oracle over the trace judges the deadline fired within one slice of its instant and the budget destroyed (budget-deadline's pattern), both widths. (2) A destroyed child's later deadline leaving the list: a parent destroys a child with a deadline 2 s out; the trace shows no timer arm at that instant and the next arm is the parent's own (today shown only by the kernel surviving past it). (3) time_now counts from the kernel's start: init's first time_now read, printed, is under a stated bound (exact under icount: quote both widths). (4) R6: an endpoint's one page to its owner (objects.md's same line): a tester's budget pages before and after endpoint_create differ by exactly one and return at destroy; the header page: a fresh carve's pages read exactly its header before any object. (5) Class is trust, not order: two budgets equal in weight differing only in class get shares within the share cases' tolerance of each other over the share window (net of audits per B5). Left model-only, stated on the pages: the expiry order at an equal instant (no case makes two instants equal on the target), the stale early hint; the boot table's 510 and INIT_WEIGHT get a bench host test that the constants match the page. Gates: each case 5 runs both widths in its class; no bound widened; the pages' status lines updated; the lines leave the todo page with their fate. Files: tests/*.toml and testers, docs/kernel/timer.md, budgets.md, objects.md (the shared line), SECURITY.md. Tier A (kernel cases): kernel-red-2. Size M."
  state = "todo"

[[node]]
  id = "ATK7"
  title = "objects.md's and ipc.md's reachable lines: R1 refuses a call across labels on the target, R14's labels arrive unchanged, a message into an unwritable record, mint after the stamp dies, R9's stamp"
  template = "package"
  parent = "M2"
  body = "docs/todo/kernel-attack-gaps.md 'ipc.md' (5 lines) and 'objects.md' (5): the reachable ones, grouped because each page has three. ipc.md: (1) R1 (flow): a call and a send between two user budgets with different label sets, created by a tester under init (budget_create takes labels since BEAM12), refused `label_denied` by the kernel, allowed where the sets match: on the target, today model-only; (2) R14 (unforgeable sender): a labelled sender's label set reaches the receiver unchanged, read from the delivery's words against the set the tester gave (account 0 throughout, as every case; a non-zero account is reachable only if budget_create takes one: say which on the page); (3) `receive` into a record made unwritable while the thread waits, for a message (receive-bad-record covers the exit notice, interrupt and abandoned-call notice: it gains the message arm). objects.md: (4) `mint` answering `Dead` from a message source whose call's stamp was destroyed: a tester takes a call, destroys the caller's budget, mints from the message and expects `Dead`; a model mutation beside it (gen.rs picks from values already drawn: no extra RNG draws); (5) R9 (stamps): a handle minted from a call takes the call's handle's stamp, not the caller's budget: minted from a call made through a handle stamped by budget S, the new handle dies with S and survives the caller's budget. Left and stated: R2's keying by account (needs accounts), R13's cross-hart completion races (an smp case, with SMP5's wave), the endpoint's page (ATK6's), the device object's page (ATK3's). Gates: each case 5 runs both widths in its class; model mutations caught within the mutations job's deadlines; ipc.md and objects.md status lines updated; the lines leave the todo page with their fate. Files: tests/*.toml and testers, model/src/mutation.rs and gen.rs, docs/kernel/ipc.md, objects.md, SECURITY.md. Tier A (kernel cases, the model): kernel-red-2. Size M."
  state = "todo"

[[node]]
  id = "ATK8"
  title = "processes.md's reachable lines: OutOfMemory refusals, a first thread returning from its entry, an exit notice dropped with its endpoint, R21's blame after the sender's budget dies"
  template = "package"
  parent = "M2"
  body = "docs/todo/kernel-attack-gaps.md 'processes.md' (5 lines), four reachable without a kernel change: (1) `thread_create` refused `OutOfMemory`: a tester in a carve sized to its header plus one thread's pages creates threads until the refusal and reads the error by name, its pages unchanged after; (2) `process_start` refused `OutOfMemory` the same way (a carve too small for the image's pages), the parent's handles and pages as before; (3) the first thread returning from its entry is a fault: a tester whose entry returns, judged by the kernel's fault line blaming it and the parent's exit notice with the fault's code; (4) an exit notice dropped because its exit endpoint was destroyed before the child exited: the parent destroys the endpoint, the child exits, the kernel's line says the notice was dropped and nothing else is delivered or leaked (the parent's pages as before, the process table's count back). (5) R21 (crash blame): blame after the blamed sender's budget is destroyed: a server takes a call, the caller's budget is destroyed, the server faults while the call is still its current call: the fault blames nobody (the kernel's line) and counts toward no restart but the server's own; and a thread holding a parked call that receives a send, then faults, blames nobody: the process-attack pattern. Left and stated: PIDs drawn at random (a statistical claim no case can judge; the seed path is R17's). Gates: each case 5 runs both widths in its class (the OutOfMemory cases under icount, exact pages quoted); no bound widened; processes.md's status lines updated; the lines leave the todo page with their fate. Files: tests/*.toml and testers, docs/kernel/processes.md, SECURITY.md; kernel/ only if a refusal or a line is found missing (its own commit). Tier A (kernel cases): kernel-red-2. Size S."
  state = "todo"

