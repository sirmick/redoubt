# Architect, 2026-10-19: STEWARD9's two-hart sequential run surfaced the real deadline_notice
# mechanism: a lease's deadline fires while the steward is INSIDE a 2-6 s synchronous start_agent
# launch, so the notice waits behind the launch. The latency case avoids it by sequencing (the
# steward idle at each deadline), but in production launches and deadlines overlap constantly, so
# the deadline_notice target (40 ms, a human-control promise that the sponsor is told promptly)
# is unmet whenever a launch is in flight. STEWARD12 (notices-first) does not help when the loop
# is inside the launch. This is the bigger fix: the launch does not hold the loop. It touches
# STEWARD10's "no install off the loop" premise (a launch thread installs the child's handles),
# so it is designed on the settled STEWARD10/STEWARD5 base; the brief follows that design.
# Ruling: .wash/local/wave-2026-10-18-rulings.md "STEWARD13". A sibling of STEWARD12, not a
# widening. Until it lands, scheduling.md states the residual (deadline_notice is clean with the
# steward idle at the deadline; a launch in flight delays it up to the launch bound).

[[node]]
  id = "STEWARD13"
  title = "A launch does not hold the steward's loop: the loop serves deadline notices, timer wakes and calls while an agent is launching"
  template = "package"
  parent = "AGENTS"
  needs = ["STEWARD10", "STEWARD12"]
  body = "Ruling: .wash/local/wave-2026-10-18-rulings.md 'STEWARD13' and 'STEWARD13 design'. Brief: .wash/local/STEWARD13-implementer.md. Tier A (the steward's loop and launch), size M, reviewer steward-red-5. Found by STEWARD9's two-hart sequential run: the deadline_notice delay is the steward LAUNCHING a later lease synchronously (image streamed from erofsd + map + process_start, 1.7-6.6 s) when an earlier deadline fires; the notice waits behind the launch, so the 40 ms human-control target is unmet whenever a launch is in flight. Design (settled): a launch thread, serial FIFO, STEWARD5's hand-over by reply; the loop prepares (endpoints, handles), the thread runs Launch::streamed().start(), the loop finishes (watch, keep, made/pids) and only then pushes the batch's Done to the core (event.rs Done { object, result }; drive.rs:147) — no core change, no wire change, start_agent still replies when launched. STEWARD10's premise re-shown: one install lock held by the loop across its now()+destroy pair and by the thread across start() except inside the read closure (dropped for every server call), so no install interleaves with the guard; the thread creates no budget. Events of the launching object held in order until the report, every other object served. Residual stated: a batch's mints still hold the loop within SERVER_US. Cases: a new overlap case (a deadline fires inside another lease's launch; deadline_notice judged only when the trace shows the overlap; run on main first to record the miss); host tests of the pending batch, the held events, the lock discipline; the steward set and the latency cases unchanged. Pages: steward.md, scheduling.md, erofsd.md/walfsd.md's in_flight if moved."
  state = "todo"
