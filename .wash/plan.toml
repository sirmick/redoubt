  body = "Found by EROFS1 (rv32 userland-boot with the system volume on EROFS, prompt in 14 s): 'beamlet: stack paint unit 6763 found twice': the unit sits at two pages each holding only that one painted word at the unit's in-page offset, neither beamlet's stack page: a stack word copied into a buffer or a message, which the fast boot no longer overwrites before the dump; the scanner's offset filter does not rule it out (its known blind spot). Ruling (.wash/local/SCAN-duplicate-ruling.md): the paint proves a word was never written; a copy proves the same about the same word, so it is no second unit; the duplicate rule is for forgery and corruption. Rule: the unit index fixes stack page k = unit/512 and the offset; for each k the scan counts units only from the one physical page holding the most of page k's units at their offsets; units elsewhere are copies, ignored; two pages holding equally many of page k's units are still refused; never undercounts (a copied buffer is a subset of the real page's words). Page sentence for testbench.md's memory paragraph in the ruling. Tier B bench, size S: tools/testbench/src/memory.rs and scanner tests (a single copied word ignored; a copied buffer ignored; an intact page copy refused). Gate: the memory host tests; init-boot, userland-boot, userland-read-only both widths; EROFS1's kept dump as the regression input if it can be reduced. Merges ahead of EROFS1 in its train."
