[[node]]
  id = "LIFT1"
  title = "A fresh debt lift of about a round on a small shared parent, observed at the sibling's first run"
  template = "package"
  parent = "M1"
  needs = ["SCHED1"]
  body = "Brief: .wash/local/LIFT1-implementer.md. docs/kernel/scheduling.md states a derived bound: a lineage's debt, carried onto a sibling as the parent's lead, delays the sibling's first run by at most about a round when the parent is small and the lift fresh. No boot exercises it: under a parent as wide as `users` the lift is a few thousandths of a slice, and sched-debt-lift judges only that the sibling runs before any other budget is picked twice. Tier A bench/fixtures, size S. The claim made exact: a destroyed child's lead W lands on parent P as W/w_P, the sibling enters at P's pass, so its first pick waits about (W/STRIDE) x (w_peer/w_P) rounds, independent of the sibling's weight. Construction: sixteen weight-100 spinners under users, three phases in one boot (w_P = 100, 50, 10), child destroyed and sibling created back to back; the oracle's check_lift_delay computes the expectation from the recorded lift and compares with the picks before the sibling's first pick within one round, failing a stale lift so the case cannot pass vacuously. The page's residual becomes the measured formula and three points per width, or what the trace shows if refuted. Ruling: .wash/local/SCHED1-five-cases-ruling.md 'debt-lift (red round 5, P1)'."
  state = "active"
  revision = 171

