[[node]]
  id = "B56"
  title = "The system at rest takes 119 (rv64) / 161 (rv32) interrupts per second per hart after train 18 (SMP6, K32, BEAM18): the idle ceilings are breached forty-fold"
  template = "package"
  parent = "smp"
  body = "Found by train 18's whole bench on 4b84112f2: launch-idle fails on both widths, interrupts per hart 119.1/s (rv64) and 161.2/s (rv32) against the ceiling of 9, host CPU over too; IDLE1 measured ~3/s on 6b46c8c86. Attributed by first-parent bisect to SMP6 (191.1/s at its merge 58326f13c alone); SMP6 dropped from train 18 (rebuilt as K32 + BEAM18), fix on wp-SMP6 (8fb11dc37 on 98b866854). CAUSE (measured on 8fb11dc37, .wash/local/SMP6-report.md): the rate is a 60 s average of a 1-2 s burst at the window's start. The login frees ~33k frames (~130 MiB) that sit in flight; when every hart goes idle together, all four drain their own pending lists at once, each frame a lock round trip (A1), the drainers contend, and nearly every re-acquire halts and is woken by the releaser's IPI (m_software at acquire_ticket's wfi paired 1:1 with wake_halted): ~32,900 of 33,160 IPIs fall in those two seconds; afterwards the rest is IDLE1-like (~3/s). The idle loop does halt when its list is empty; no timer storm; user ecalls as IDLE1. FIX: one hart drains at a time under the lock; a hart idle while another drains halts as before; when the drainer's list empties it wakes one idle hart with frames pending (one IPI per hart per drain). Then measure the single drainer's time (~33k x ~30 us) and its host-cores cost over the window; if the drain pushes host cores over 0.01, launch-idle waits for the system to settle before its window (frames in flight at zero via the trace, or a stated settle time) rather than moving the ceiling, and testbench.md and memory.md say that after a large free the idle harts spend about a second zeroing before the machine is quiet. Keep A1, A3 and the drain. Gate: launch-idle both widths at 4 harts under the ceilings; the per-cause table before/after in the report. Kernel: Tier A, kernel-red. Blocks SMP6's merge."
  state = "done"
  revision = 2

