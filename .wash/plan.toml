  body = "Train 34's bench (a43b72b13; .tmp/train-34b/fail-rv64-rt-miri.log): libs/rt/tests/parked_write.rs `a_waiting_write_is_parked_abandoned_and_expired` under Miri panics at :159 (`late.join().unwrap()`), the `late` client having died of the fake's guard 'a wait only a change can end saw none in the fake kernel for 60s' (libs/rt/fake/src/lib.rs:619-646) after 60.96 s; trains 32 and 33 passed; B70 put the test on a held clock the test ticks. By reading, the ordering has a hole and Miri's scheduler finds it: `until(parks == 2)` (:157) observes the park, not the server's next `receive`; a receive's deadline is `now + timeout` at the call (lib.rs:615-617) and `tick` only adds to the clock (:607-612), so a tick taken between the park and the receive leaves the server a deadline one LONGEST past the tick that nothing reaches, and the client (FOREVER) waits until the guard fires. Miri load reaching 60 host seconds is the other reading; the first makes it moot. Step 1: reproduce under Miri alone and loaded (20 runs each, through q), and show the hole natively by a forced yield between the park and the receive, naming the reading. Step 2, the fix in the fake, never a longer timeout: a tick on a held clock is taken only when every other thread of the fake is in `wait` (the fake counts threads alive and waiting; `tick` blocks until they agree: a quiescent step), so a tick always ends the waits it was written to end; the guard's panic names the clock's time and the waits outstanding. parked.rs and beamlet-redoubt's fake suite (26 tests) get the rule for free. Gates: rt-miri alone 20/20 and beside a bench 20/20; `cargo test -p redoubt-rt`; B70's 20-run loaded loop; beamlet-redoubt's fake suite; the fake's doc states the quiescent tick; no host timeout lengthened. Files: libs/rt/fake/src/lib.rs, libs/rt/tests/parked_write.rs, parked.rs, the page describing the fake kernel's clock. Tier A (libs/rt's fake): steward-red-2. Size S."
