[[node]]
  id = "B80"
  title = "rv32 beamlet-schedulers-one-hart-mttcg reads ratio 81-82 alone on main (floor 90): two schedulers on one guest hart outrun one by a fifth, so the case's verdict follows the host's load, not the VM"
  template = "package"
  parent = "AGENTS"
  body = "Found on train 48 (STEWARD3Y) and reproduced alone on main's tip 69aa50dd3 in the train worktree: rv32 `ratio 82 one 386566 two 465804 schedulers 2` (alone, main), `ratio 81 one 381169 two 467637` (alone, 3Y's tree), `ratio 81 one 382509 two 470400` (train 48 under load); rv64 PASS each time; the same tree passed the case under train 47's bench load. tests/beamlet-schedulers-one-hart-mttcg.toml judges two schedulers on one guest hart against one and forbids a ratio under 90 (docs/userland/beamlet.md 'Several schedulers': two schedulers cost little on one hart). Under mttcg the two scheduler threads are two host threads; with q's lease (how many host cores does the case get?) and an idle host, the second scheduler runs on a second host core while the guest sees one hart, so 'two' outruns 'one' and the ratio reads low; under a loaded host the threads contend and the ratio reads ~100. Find what the case measures and make it a verdict: pin the guest's threads to one host core for this case (q run --cores 1, or the bench's taskset for mttcg one-hart cases), or judge the reduction counts on the guest's own clock (icount), or restate the page's claim and the floor with the arithmetic; rv64 passing while rv32 fails needs its explanation too. Transcripts: .tmp/train-48/transcript-rv32-schedulers-alone-main.log, -alone-3y.log, transcript-rv32-beamlet-schedulers-one-hart-mttcg.log (train 48). Files: tests/beamlet-schedulers-one-hart-mttcg.toml, tools/testbench (if the pinning is the bench's), docs/userland/beamlet.md, docs/testbench.md. Tier B (a case's verdict), reviewer kernel-red-3. Size S. Consumer: every train (the case is in the whole bench; until fixed a rv32 failure of it alone is a known flake, recorded on the train)."
  state = "done"
  revision = 386

[[node]]
  id = "STEWARD3Z"
  title = "A shared server counts the steward's minted connections in the steward's own share, eight in all; per-principal root badges put each in its account's bucket, and consoled's pool follows the manifest"
  template = "package"
  parent = "STEWARD3"
  needs = ["STEWARD3Q"]
  body = "Brief: .wash/local/STEWARD3Z-implementer.md; rulings .wash/local/STEWARD3Z-ruling.md (Q1 consoled's caps by who holds them, (A); Q2 the six-principal boot and the latency table move to STEWARD3V). Found by STEWARD4's latency case (STEWARD4-ruling.md 'Q12'): admit.rs counts a connection a client mints in the share of the connection it minted from, so every connection the steward mints at erofsd:system (a session's shell and relay, a lease's) is a State of the steward's own share there, cap 8: the box holds eight steward-minted system-volume connections in all, a fifth session or a fourth lease refused on today's image; 3Q's per-account derivation missed the minter's share. consoled's per-bucket cap is init's need applied to every bucket, so its 2 MiB holds five. Lever: the serving library admits a connection minted for another account in that account's bucket from its first request, holding one of the minter's pending slots until then (R26 bounds a mint flood by the minter's share); fallback, a root badge per principal per shared server, only if the primary cannot be made sound. consoled: the default bucket's state derived from what one account holds, init's root badge alone at MAX_THREADS by with_overrides, the fit's arithmetic on the page. Gates: rt host tests (pending pool, the move at first call, the flood bound, the free at disconnect); steward-many-sessions on a three-principal manifest (four sessions and four leases hold system-volume connections at once); the steward set, aio-many-reads-two, walfsd-quota both widths; 3Q's admission host test extended. Not here (STEWARD3V): the six-principal boot, steward-latency at N = 4 and 16, the other shared servers' budgets. Pages: serving.md, consoled.md, init.md, steward.md Authority, SECURITY.md R26/R77. Files: libs/rt/src/server, servers/consoled, servers/init, tests/. Hotspot with STEWARD4: drive.rs (no edits to its files). Tier A: steward-red-4. Size M."
  state = "done"
  revision = 426

[[node]]
  id = "STEWARD3W"
  title = "A cleanup step a busy server did not take is parked and retried at that server's next answer, not dropped until its restart"
  template = "package"
  parent = "STEWARD3"
  body = "Ruling: .wash/local/STEWARD3W-ruling.md. Seen in STEWARD4's latency run (round 3, two spinner VMs at erofsd:system): a lease's disconnect timed out four times in 3Y's cleanup queue and was dropped, so its State stayed in the share at erofsd:system until a restart that never came, and the eighth lease connect was refused (4 of 5 runs at seed 3: STEWARD4's report). TRIES/RETRY_US were calibrated for a recovering server (four tries span init's 3 s SERVER_TIMEOUT); a busy server answers others, init sees it alive, and the count is a wrong proxy for lost. Rule: the fourth timeout parks the step; a parked step runs at the loop's turn after any call to that server completed within its bound, and before a mint the steward makes at that server while steps are parked there (at most one bound, a turn's rule); reconnected for that server forgets its parked steps; a server that never answers costs no bound per turn once parked; the queue's argued bound covers parked steps unchanged. The 100 ms send bound stays: persistence, not width. Pages: steward.md's cleanup paragraph and residual sentence; the console line becomes 'parked after 4 attempts: retried when the server answers'; SECURITY.md R41 row if tests change; scheduling.md's real-steward table regains its N = 3 row (STEWARD4 ships it as 'not reached' naming this leak). Host tests: a parked step runs at the next answered call; a mint at a server with parked steps runs them first and succeeds where it was refused; reconnected forgets parked steps; a never-answering server costs no bound; each connection held once. Bench: steward-latency at N = 3 both widths completes with no parked line outliving the round; steward-server-restart unchanged. Files: servers/steward/src/cleanup.rs, drive.rs, lib.rs, tests/, docs/kernel/scheduling.md's row. Hotspot: STEWARD4's drive.rs and latency manifest; starts after STEWARD4 lands. Size S; Tier A; steward-red-4 reviews."
  state = "done"
  revision = 455

[[node]]
  id = "STEWARD3V"
  title = "A shared server's admission budget follows its manifest entry's pages, not a compiled constant: six principals boot, and steward-latency regains N = 4 and 16"
  template = "package"
  parent = "STEWARD3"
  needs = ["STEWARD3Z"]
  body = "Ruling: .wash/local/STEWARD3Z-ruling.md 'Q2'. Found by STEWARD4's six-principal manifest (keyd buckets=10, consoled 9, bootfsd 10, ipd 11, walfsd:data 10, walfsd:alice-secrets 9, erofsd:system 10 by init's rule, 7 domains + system callers): every shared server checks limits(buckets).fits(COST, BUDGET) against a compiled constant that holds six (erofsd 1.5 MiB, bootfsd 1 MiB, walfsd 4 MiB: 'the image's six buckets and not a seventh'), so each refuses to start and init reboots. Rule: a shared server's usable budget is its entry's pages x PAGE_SIZE less its heap cap and stack, checked at start with Limits::fits against buckets=N (BAD_LIMITS, init reboots, unchanged); the entry rule on walfsd.md takes its derivation form: an entry's pages are what its count of buckets at their caps needs plus heap cap and stack, rounded up to 256; a case's manifest sizes by the same rule, never by what its case uses. The manifest is the one source; the count enters the rule; no maximum is picked. The image's entries keep their pages where the arithmetic already holds (walfsd 1,280 pages = 1,202 of budget, six buckets and a seventh); the latency manifest's entries are recomputed (walfsd ~1,614 -> 1,792). Scope: erofsd, bootfsd, walfsd, littlefsd, keyd, ipd (consoled is 3Z's); each page's admission paragraph with the derivation and the image's arithmetic; init.md's entry rule; the bench host test holds every manifest in the tree to pages >= the count's need, beside 3Q's terms; steward-latency regains N = 4 and 16 and scheduling.md's 'With the real steward' table is completed beside the stand-in's 1/4/16 (coordinated with STEWARD4 through the orchestrator; the gate moves here from 3Z). Gates: the servers' host tests, the steward set, walfsd-quota, aio-many-reads-two, the six-principal boot, both widths; docs; the size budget. Size M; Tier A (admission); steward-red reviews."
  state = "done"
  revision = 462

[[node]]
  id = "B81"
  title = "beamlet-lookup-host fails its system host tests under a whole bench's load about one train in two and passes alone; the kept job log keeps cargo's warnings, not the failing test's name"
  template = "package"
  parent = "AGENTS"
  body = "Seen on trains 44 (first run), 46 and 49 (2026-10-16/17), each time `beamlet-lookup-host  host tests failed` after 46-76 s, and PASS alone each time. Cause (.wash/local/B81-report.md): beamlet-redoubt --test system ran the platform's bounds (FILE_WAIT_US, ATTACH_US, HAND_US, REQUEST_WAIT_US, RETRY_US) on the host's clock, so under load a bind ran out its second before the fixture server answered (1 in 40); busy loops inside the lease do not reproduce it (9/9), so the quiet class was no verdict. Fix: system.rs holds the fake kernel's clock (B4/B70's mechanism, libs/rt/tests/held_clock.rs); tests take a turn and tick each bound once the platform waits on it, at quiescence; host-clock asserts removed; 27/27 in 24-27 s (was 46). (2) The bench keeps a host-test case's failures block (panics, names, result, Cargo's last error line, never warnings) in target/jobs/<w>-<case>.log; docs/testbench.md says what is kept. Files: userland/beamlet-redoubt/tests/system.rs, tools/testbench (build::test_failure, cargo_test, fanout), docs/testbench.md. Tier B (a case's verdict and the bench's logs), reviewer kernel-red-3. Size M (grew from S: the held-clock conversion)."
  state = "done"
  revision = 400

[[node]]
  id = "B82"
  title = "A lease's deadline runs from its request and can pass while its agent is still launching (2.46 s at two harts): a kernel case pins what a deadline does between create and start"
  template = "package"
  parent = "AGENTS"
  body = "Seen by STEWARD4's steward-latency on rv64 at two harts, twice at the 16th/17th lease: `a step failed (NotPermitted): Launch { .. kind: Lease .. slot: 2 }` straight after the kernel terminated the previous deadline lease's VM. Suspected a kernel race; the cause (.wash/local/B82-report.md): the steward sets a lease's deadline at the batch's start (carve_lease) and the Launch step (image read from erofsd, map, start) takes ~1.25 s guest time at one hart and ~2.46 s at two (icount counts both harts' instructions), so the case's 2 s kernel-deadline leases died between process_create and process_start; R10 destroyed the budget, the thread-less child was terminated, map/start answered NotPermitted. Evidence: AgentStarted deadline-at 6.54-6.57 s (two harts) vs 7.73-7.76 s (one) on a 9 s term; reproduced at one hart with 100 ms leases. The three race candidates ruled out. Delivered: tests/deadline-in-launch (a 300 ms lease from system; after the term map and start answer NotPermitted, the handle is BadHandle, the killed notice blames nobody, a witness in another budget draws another PID (R20), usage returns to before (I10)), both widths at smp 1 and 2; budgets.md 'Deadlines' names the window. No kernel change. STEWARD4's case lengthens its kernel-deadline leases (5 s) and records the two-hart row. Open design question for architect-2 (thread B82-launch-race): a lease's term from the agent's start, a launch floor, or the page stating the term runs from the request. Ruling: STEWARD4-ruling.md 'Q13'. Tier A (kernel case); kernel-red-3 reviews. Size S."
  state = "done"
  revision = 415

[[node]]
  id = "STEWARD3U"
  title = "The steward's console lines cost its loop one send bound per turn at most: one kept console fid, a line one write, lines drained in order at the loop's turn"
  template = "package"
  parent = "STEWARD3"
  body = "Ruling: .wash/local/STEWARD4-ruling.md 'Q15', 'Q16'. Found by STEWARD4's steward-latency: at weight 1,000 the real steward meets every target but the timer wake (p50 23-61 ms against 15 across widths and hart counts; at two harts the decision wake's p50 and the deadline notice's p99 too): the probe's timer expires while the steward is still writing its lines after start_agent's reply. `say` makes each console line a fresh one-page Lend, then attach, open, write and close at consoled (four round trips), two lines per start: about eight consoled calls per start, bounded only by consoled's turn. Rule: the steward keeps one console fid open for its life (opened at start and again after consoled's restart, as 3X re-binds), the lent page kept with it; a line is one write. Lines are a queue drained in order at the loop's turn, each write within the steward's send bound (100 ms), the turn stopping at the first that times out as the cleanup queue does (3Y): a busy consoled costs the loop one bound per turn. The queue's bound is argued; a line is dropped only with a line saying so; a batch's audit lines land in order. Page: steward.md 'Failure and restart' beside the cleanup queue; SECURITY.md rows if tests change. Measure: the re-armed probe's reply-to-receive gap, p99 at N = 1, both widths, on scheduling.md's real-steward table. Host tests: one call per line on the kept fid; a timeout costs one bound, lines stay queued; consoled's restart re-opens and drains; batch order. Bench: steward-latency meets its targets at N = 1, 2 both widths and returns to the whole run (STEWARD4 ships it whole_run = false until this lands); steward-server-restart; the steward set both widths. Files: servers/steward (say, drive.rs, lib.rs; not the core), tests/steward-latency.toml, scheduling.md's table. Hotspot: STEWARD4's drive.rs; start after STEWARD4 lands; shares the loop's turn with STEWARD3W (order the two queues on the page). Size S-M; Tier A; steward-red-4."
  state = "done"
  revision = 449

[[node]]
  id = "B83"
  title = "steward-pending-cap's end step prints its marker and ends the session on one line, so the marker races the session's end: ssh exits before `bye` is seen (train 50, both widths)"
  template = "package"
  parent = "AGENTS"
  body = "Seen on train 50 (B81, a tree with no steward or shell change), both widths: `session alice: step 26: ssh exited (status 0) while waiting for /^bye$/`; alice's log shows the line echoed and no `bye`: end_session destroyed the session before the shell's console write of `bye` was relayed. STEWARD3Y's regression fix put `IO.puts(\"bye\"); end_session(c)` on one line so the bench's exit step would not close the channel between a marker and the end (the detach race); that traded one race for another. Fix (tests/steward-pending-cap.toml, the end steps): three steps: send `IO.puts(\"bye\")`, expect `^bye$`, then send `Redoubt.Wire.Client.Steward.end_session(c)` as its own step, then `{ exit = 0 }`: the marker is matched before the end, and the bench sends the end before its exit step closes the input (one IPC against the close's network + EOF + call, the margin STEWARD3Y's review accepted), so neither the detach nor the flush can precede the end; the case comment says why. Check every steward case that ends a session the same way (grep end_session in tests/steward-*.toml) and apply the same shape where a marker precedes the end on one line. Gates: steward-pending-cap 5x both widths alone and 2x beside a load; the other touched cases both widths; formatting. Transcripts: .tmp/train-50/rv64-steward-pending-cap.smp1-alice.ssh.log, transcript-rv64-steward-pending-cap.log. Tier B (a case's verdict), reviewer steward-red-4. Size S."
  state = "done"
  revision = 411

[[node]]
  id = "B84"
  title = "job-interrupt-native times out under a whole bench's load about one train in three (trains 45, 51, 51b) and passes alone in 4 s: the case or the job's interrupt path depends on the host's load"
  template = "package"
  parent = "AGENTS"
  body = "Seen on trains 45 (rv32), 51 (rv32) and 51b (rv64), 2026-10-16/17: `job-interrupt-native timed out waiting for /(^|\\] )\\{:after_exec, true, \\{:error, :not_running\\}\\}$/` at 450 s, each time PASS alone in 4.2-4.6 s on the same tree. The case (tests/job-interrupt-native.toml; JOB1's Job.kill and the interrupt over the console) sends an interrupt to a native job and expects the job gone (`{:error, :not_running}` after the exec); under load the line never comes: either the interrupt is lost or late when the host starves QEMU, or a host-clock wait inside the shell's job path (Redoubt.Job, the console's interrupt delivery, the native stage's exit) runs out, or the expect's pattern misses a split line (B49's shape). Transcripts: .tmp/train-45/fail-rv32-job-interrupt-native.transcript.log, .tmp/train-51/transcript-rv32-job-interrupt-native.log, .tmp/train-51b/transcript-rv64-job-interrupt-native.log. Work: reproduce beside a load (a concurrent q build or parallel case set) and keep the console log; find whether the job ended and the line was lost, or the job never ended; fix on events (B4/B70's rule), or make the case's expectation the kernel's answer rather than a shell line, or move the case to the alone class with the reason on the page; prove 10x under load + 5x alone both widths. Files: tests/job-interrupt-native.toml, userland/shell (Redoubt.Job) or userland/native if the path is the shell's, docs/userland/shell.md 'Jobs'. Tier B (a case's verdict; the shell's job path if it moves), reviewer kernel-red-3 (steward-red-4 if the shell moves). Size S. Until it lands, a timeout of this case alone on a train is a known flake, rerun alone."
  state = "done"
  revision = 423

