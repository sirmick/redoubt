  needs = ["STEWARD3R"]
  body = "STEWARD3R's residual under R41 (.wash/local/STEWARD3R-ruling.md 'Cases, settled', point 2): `new_connection(root, quota, scope)` mints every 9P connection (fsd, consoled, carved homes) in the session's or lease's scope, so destroying the scope ends it in every table at once; ipd's typed `grant` (How::Grant in the steward's drive, libs/wire/tables/ipd.md) has no scope field, so a network connection ends only when the steward's cleanup disconnect reaches ipd, and a copy forwarded by a hijacked agent lives until then. Lever: the grant gains an optional `scope: handle[0] budget` as op 2 did; ipd mints the granted connection with it through the same Minter path; the steward passes the scope through Kernel::connect for Server::Net as for Shared. Gates: the rt host test's twin for ipd's grant (a granted connection in scope S dies with S, a sibling in T serves); the net cases once both widths (bench-net-peer, the ipd cases that grant); R41's residual leaves steward.md and SECURITY.md's row says every connection kind; the wire table's row. Files: libs/wire/tables/ipd.md, servers/ipd, servers/steward's drive, docs/servers/steward.md, ipd.md. Tier A (authority over connections): steward-red-2. Size S."
  state = "done"
  revision = 292

[[node]]
  id = "B76"
  title = "rv64 aio-many-reads-two hangs to its 90 s deadline about one run in three: the burst's 64-of-64 line never comes; B8 fixed the rv32 twin, and the failing transcript is not kept"
  template = "package"
  parent = "M2"
  body = "Seen in train 35's bench (main 32a448875-based) and train 39's (42437cdaf), and once alone in three on the train 39 head (then 0.8 s twice; .tmp/train-39/fail-rv64-aio-many-reads-two.log, .tmp/train-39/aio-alone/): rv64 aio-many-reads-two times out at 90 s waiting for the burst's `64 of 64 reads answered on 2 connection(s)...` line (tests/aio-many-reads-two.toml:18); rv32 passes in 0.7 s every time. AIO1's case: the hub keeps 64 reads outstanding over two littlefsd connections with a waiter thread each, the reader idle in receive on its own endpoint (native.md 'Many requests at once'). B8 fixed the rv32 flake (TEST FAILED: receive: Timeout at ~21 s); this is the rv64 twin with another shape: no FAILED line, a wait that never ends. The failing transcript was not kept: run dirs rotate and the job log holds the result line only. Step 0, the bench: a failing case's console and session logs are copied beside its job log (scripts/jobs.mk, the testbench's run dir), shown by a dry run. Step 1: 50 runs alone (`q run`, one general core) with transcripts kept, both widths; name the rate. Step 2: name the wait from the transcript (the waiter-to-reader hand-over at HAND_OVER_US, a wake-up send not taken, an empty completion call never re-parked, the second program's read parked behind the burst); the fix is in the hub (libs/client/src/aio.rs) or the case's ordering, never a longer deadline alone; B51's and B62's rules are the frame: a hang past them is a bug. Gates: 50/50 alone both widths; the aio cases and bench-net-peer once; client-host-tests. Files: libs/client/src/aio.rs and tests, tests/aio-many-reads-two.toml, scripts/jobs.mk, tools/testbench, docs/userland/native.md. Tier A (the hub is every session's I/O): steward-red-2, the bench copy in the same review. Size S."
  state = "done"
  revision = 290

[[node]]
  id = "STEWARD3Q"
  title = "walfsd and littlefsd admit two multiplexed sessions per account: alice's third live context, and any lease of hers, is refused its home; the cap follows the manifest (console + contexts + leases + 1)"
  template = "package"
  parent = "STEWARD3"
  body = "Found by STEWARD3A (.wash/local/STEWARD3A-questions.md 'Q4', wall 1; evidence .tmp/STEWARD3A/exp11, exp12 in its worktree): walfsd's `limits` (servers/walfsd/src/server.rs; littlefsd the same) admit `in_flight: 2` multiplexed sessions per bucket, and a bucket is keyed by account (serving.md 'Buckets', R26). Alice's console and SSH sessions hold both, so a lease of hers (her account by design) has its session-opening collect answered REFUSED in 3 ms and every file op is Eio; the same cap refuses her third live context its home, which the manifest allows (contexts cap 3): a latent defect no case exercises. With in_flight 4 the lease's read succeeds. Lever: the cap is what the manifest lets one account hold at once, stated as a derivation: 1 console session + the contexts cap + the leases per principal + 1 spare for a context detaching while another attaches (its connection lives until the relay ends); the image gives 6. A bench host test holds each server's constant to the largest such sum over the tree's manifests (every_beamlet_is_told_its_own_budget's pattern). `Limits::fits` against BUDGET with buckets=6: 6 x (364,544 + 262,144) = 3.76 MB > 3 MiB, so BUDGET and both servers' heap caps rise, the arithmetic on walfsd.md, littlefsd.md (admission lines, the limits doc comment) and image/README.md. Cases: steward-three-contexts (alice's three contexts live, each reading and writing its home, both widths); STEWARD3A's lease cases run on this branch until it merges. Gates: walfsd-quota, steward-home-quota, steward-context-cap, the memory scan for both servers (peak under half the new cap), both widths; the host test. Files: servers/walfsd, servers/littlefsd, libs/fileserver if the limits are shared, tools/testbench, image/manifest.json and tests/data manifests' heap_pages, docs/servers/walfsd.md, littlefsd.md, serving.md, image/README.md. Tier A (a shared server's admission): steward-red-2. Size S."
  state = "done"
  revision = 310

[[node]]
  id = "B77"
  title = "Every [net] case waits on one machine-wide lock (train 40: 3.4 h summed, 1,353 s once for a 0.5 s case); the lock guards only a port race, so the net cases lease ports from q instead"
  template = "package"
  parent = "M2"
  body = "Measured on train 40 (B76 + STEWARD3S, 704 pass, ~5.5 h wall; `scripts/q log`): 30 cases took lock=net, summed wait 12,360 s (3.4 h), the longest 1,353 s for rv32 bench-net-peer (a 0.5 s case) while members' net gates (STEWARD3A, 3Q) held the lock; non-net waits summed 1,690 s. What the lock guards (testbench.md:301-303): the bench picks a forwarded host port by binding and releasing it (qemu.rs:275-284 free_ports; the poke's UDP port) before QEMU binds it, so two boots at once may race for a port. Nothing else in a [net] case is shared: peers are guestfwd to a helper with no host listener (peer.rs:5-9), the capture a per-boot pcap, slirp per QEMU. Lever: `q run --ports N` leases N host ports no other lease holds (REDOUBT_PORTS=lo-hi in the job's environment, released with the job, also on a kill); the bench binds its forwards and the poke inside the range when the variable is set (free_ports stays outside q); jobs.mk's net recipe takes `--ports` and drops `--lock net`. A train's net tail and a member's net gate then run side by side. Class (ii) on testbench.md stays: bench-ssh-guest and bench-ssh-loopback-deadlock (timeout expectations) and the host-clock cases run alone for their own reasons, none for a port; the page says the race is gone under q. Gates: the net cases both widths through q (bench-net-peer, net-tcp, net-attacks, the pcap cases, the loopback set); two members' net gates beside a bench once, no port failure; a train's net tail wall time and summed wait before/after from `q log`, quoted; q's tests for the lease (no overlap; freed with the job). Files: scripts/q, scripts/jobs.mk, tools/testbench/src/qemu.rs, peer.rs, docs/testbench.md. Tier B (bench and pool): kernel-red-2. Size S-M. Launchable beside 3A/3Q; the q daemon's restart lands at a train boundary, the orchestrator's call."
  state = "done"
  revision = 302

[[node]]
  id = "STEWARD3X"
  title = "A shared server's restart strands every connection it served, the steward's kept one included: init hands the steward a new connection, the steward tells its sessions, a session re-binds its home"
  template = "package"
  parent = "STEWARD3"
  needs = ["STEWARD3Q"]
  body = "Found by STEWARD3C (.wash/local/STEWARD3C-questions.md Q1; ruling .wash/local/STEWARD3C-Q1-ruling.md): a shared server restarts with empty tables (R27), so the steward's kept fresh connection at walfsd:data (init.md 'Fresh connections per child') is dead, every later login fails its home step, and every live session's home connection is dead too; init has no way to hand a running server a new connection (init.md's consoled residual, the file servers' and ipd's as well). m3-agents.md's crash-blame row ('Alice is unaffected when walfsd panics') assumes this mechanism. Lever, one path for every shared server: (1) init, after restarting a server, makes the steward a new fresh connection there and calls the steward's root-class `reconnected(server, connection: handle[0])`; the steward replaces its kept connection; the records below the dead one died with the instance, so nothing leaks and init's release at the steward's exit still frees everything. (2) The steward sends `server_restarted(server)` on the `notices` endpoint of every session the server served. (3) A session re-binds: `rebind(slot)` from its badge mints a new connection below the new kept one, in the session's scope; the shell re-opens the binding on the notice; a session that never re-binds keeps `enotconn`. consoled's restart follows the same path or is stated as not covered. Cases: steward-server-restart (bob's write cuts walfsd:data; alice's and bob's sessions re-bind and read their homes; a login after the restart succeeds; three cuts reach R40's lockout on the machine, closing 3C's residual); host: init's call, the steward's rows, the oracle traces. Pages: steward.md 'Failure and restart' (the residual becomes the rule), init.md, agents.md, m3-agents.md's row, SECURITY.md R40 to tested. Files: servers/init, servers/steward, libs/steward (rows, oracle, model), the wire table, the shell's binding code, tests/. Tier A: steward-red-2. Size M."
  state = "done"
  revision = 353

[[node]]
  id = "B78"
  title = "mdbook's search index crossed its 10 MB warning (10,000,112 bytes) and the_book_builds fails on any mdbook WARN, so every package that adds prose fails the docs case: the index gets a stated headroom"
  template = "package"
  parent = "M2"
  body = "STEWARD3C's report (.wash/local/STEWARD3C-report.md:98-101): the search index reached 10,000,112 bytes with its prose and mdbook warns above 10 MB; `the_book_builds` (tools/doccheck/tests/docs.rs:19) fails on any WARN, so the implementer trimmed ~600 bytes to pass, and the next package adding a sentence fails the same way. The book's markdown is ~1.6 MB (testbench.md 136 KB, scheduling.md 125 KB, beamlet.md 105 KB the largest); elasticlunr's index is several times the text, and `[output.html.search]` (docs/book.toml) sets only `enable`. Lever, measured not guessed: build the index with each of mdbook's own knobs (`expand = false`, which drops prefix expansion and is the largest saving; `heading-split-level`; `teaser-word-count`) and record the index bytes and whether a search for a rule name (R41, `budget_pages`, `walfsd`) still finds its section; pick the smallest index whose search still finds those, aiming at least 30 % under the 10 MB WARN. Then the rule: a doccheck test reads the built index's size and fails at a stated ceiling below mdbook's WARN with the size and the three largest pages named, so a future failure says what grew instead of 'WARN'; docs/README.md states the ceiling and the headroom rule (evidence, tables and measurements beyond a page's argument go to .wash/local or a case comment, not the page; no page is split or removed here: a page leaving the book is the owner's). Gates: `cargo test -p redoubt-doccheck --test docs` green on the dev image (mdbook present), the three searches shown found, the index size quoted before and after, the ceiling test's negative (a fixture book over the ceiling fails naming its pages). Files: docs/book.toml, tools/doccheck/tests/docs.rs and a fixture, docs/README.md. Tier B (docs tooling): kernel-red-2. Size S."
  state = "done"
  revision = 334

[[node]]
  id = "STEWARD3Y"
  title = "The steward's end batch blocks its loop on each server's disconnect, serving nobody while a server recovers: the disconnects become deferred cleanup after the destroy"
  template = "package"
  parent = "STEWARD3"
  needs = ["STEWARD3X"]
  body = "Found by STEWARD3X in steward-blame-lockout (.wash/local/STEWARD3X-ruling.md 'Q4 amended'; 3X's report names the stall): a session's end batch waited its full RELEASE_TIMEOUT (1 s) on the `ended` send to sshd's channel console after sshd had closed the channel first, and init's blame arriving then was lost; the same shape holds for an end batch's disconnect at a not-yet-serving server (walfsd's recovery, 580-953 ms measured). Every cleanup call in an end batch (the `ended` send, each server's disconnect) runs on the steward's loop with the call's full timeout, and during it the steward serves nobody (logins, blame, end_lease ahead of admission included). STEWARD3R's rule already separates cutoff from cleanup: destroying the scope is the cutoff; `ended` and the disconnects free records and never are the cutoff. Lever: the end batch replies after DestroyBudget; the cleanup calls become deferred steps the Machine keeps in a bounded queue and runs at its loop's turn, each bounded short (the steward's own send bound, not RELEASE_TIMEOUT), a timed-out one retried at the next turn with a stated retry cap, then dropped with a console line (a server's admission for that connection is then freed only by its own restart: the residual that remains; an `ended` to a channel sshd already closed needs no retry). The queue is bounded by the connections live sessions and leases hold, stated. Gates: host (the end's reply precedes any cleanup call; a timed-out step is retried then dropped with the line; the queue's bound); steward-blame-lockout and steward-server-restart with no blame lost and `lost` forbidden (the stall before/after quoted, both widths); steward-session-ends, steward-lease-ends and steward-end-lease's 125 ms p99 unchanged or better. Pages: steward.md 'Failure and restart' and init.md 'Residual risks' (3X's residual becomes the rule), the Machine's doc comment. Files: servers/steward (the Machine, drive.rs), tests/, docs. Tier A: steward-red-2. Size S."
  state = "done"
  revision = 374

[[node]]
