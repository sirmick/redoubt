  body = "Closes docs/todo/audits-billed.md. Builds docs/kernel/scheduling.md#responsiveness ('Targets exclude the checked build's audits': an audit neither fills a window nor moves the schedule; the residual 'A checked build's audits move its schedule' goes) and docs/testbench.md#checked-builds. In a checked build an audit's time is charged to no budget and does not count against the running slice (slice end and charge start move forward by its length); audits stay full; no target moves. Accepted on GATE1's two-lease run (wp-gate1 e9ecc5ea5 fixture, seed 4) meeting the deadline notice on both widths, no regression at seed 3 in sched-latency and kernel-containment, and a recorded negative run (feature audit-billed) that misses. Design: QA GATE1-notice-two-leases (owner's decision A applied in full). Evidence: .wash/local/GATE1-two-lease-split.md. Brief: .wash/local/K18-implementer.md. Tier A (kernel), size S."
