[[node]]
  id = "B86"
  title = "A seed sweep's parallel boots inside one q lease bind the same host port: --jobs 2 hands the second boot port 23000 again (hostfwd in use) and every later seed dies at 0.1 s"
  template = "package"
  parent = "AGENTS"
  body = "Seen by STEWARD4's steward-latency sweep (2026-10-17): `--jobs 2` under one `q run` lease: the second concurrent boot was handed host port 23000 again (QEMU: hostfwd in use), seeds 2-20 died at 0.1 s, the sweep collapsed after seed 1. B77 made every [net] case lease its ports from q (`q run --ports N`, REDOUBT_PORTS=lo-hi, the bench binding its forwards inside the range), but B6's sweep runs its boots in parallel inside ONE lease and either every boot takes the range's first port or the sweep asks for no ports at all. Work: read tools/testbench's sweep (B6) and port binding (B77): make a sweep with --jobs N ask its lease for N x (ports per boot) and hand each boot a disjoint slice of REDOUBT_PORTS, or run each boot under its own `q run --ports` lease; a bench host test that two concurrent boots of one sweep bind different ports; docs/testbench.md's sweep and ports paragraphs say the rule. Evidence: STEWARD4's report and .tmp/steward4-logs/ (the implementer gives the lease's REDOUBT_PORTS, the --jobs count and the ports each boot bound). Until it lands, sweeps run serially (--jobs 1). Files: tools/testbench (sweep, qemu port binding), scripts/q if the lease must grow, docs/testbench.md. Tier A tooling (the bench's device/port map), reviewer kernel-red-3. Size S."
