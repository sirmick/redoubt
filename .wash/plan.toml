  body = "Found by the BEAM4 cases branch's gate on STEWARD2's final tip (rv32): beamlet-files failed once with badmatch {error,eexist} at prim_file:make_dir(\"/home/alice/d\") after every earlier line passed, then passed 2/2 alone. Ruled out by BEAM4's red (from the code): BEAM11's busy retry cannot duplicate a mkdir: a `busy` always means not served (ninep_mux.rs:585, produced only by take() before the message is decoded; littlefsd, walfsd and consoled return no BUSY from a handler). Likely cause: init restarts an exited program (servers/init/src/restarts.rs, up to MOST times) on the same walfsd volume, and beamlet-files forbids only servers' exits, so a first beamlet run that ended early replays make_dir on a volume already holding d. Check the failing log (BEAM4 cases implementer's run logs) for a second beamlet start or an earlier beamlet exit line; then (a) the case forbids a beamlet restart (its verdict then names the early exit), and (b) find why beamlet ended early, if it did. Tier B (the case) unless (b) finds a defect. Size S."
  state = "done"
  revision = 345

