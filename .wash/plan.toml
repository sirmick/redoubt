  body = "Brief: .wash/local/SMP1-implementer.md (updated for the owner's answers on QA SMP1-design: many harts by design, built as SMP1, SMP3, then SMP2; no ASIDs).\n\nBuilds docs/plan/m2-usable-shell.md#several-harts steps 1-3, and of step 4 its first stage:\n- any boot hart, up to MAX_HARTS (8), started through SBI HSM; one build (the smp feature and the spike go);\n- per-hart state through sscratch, including the hart's current process;\n- a FIFO ticket lock at trap entry;\n- device interrupts on the boot hart;\n- reschedule IPIs;\n- a budget runs on at most one hart at a time (interim: one predicate in the pick, lifted by SMP3);\n- the shootdown, built for a set of harts (the other harts whose current process is the target, flushed and acknowledged without the lock); its one caller here is a destruction, plus kernel-half unmaps to every hart;\n- the trace ring with a hart field;\n- `cargo testbench --smp N`.\n\nCases: smp-boot (2 and 4 harts); smp-evict, with a recorded negative; the whole bench at --smp 2. Started ahead of M2 on the owner's word (2026-10-03). Tier A, size L."
