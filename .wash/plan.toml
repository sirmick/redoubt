  body = "Found by the wave bench on bd6f768f6 and reproduced alone: bench-ssh-loopback-exit and bench-ssh-loopback-host-key fail on both widths because, after the expected refusal (mallory: Permission denied (publickey); alice: Host key verification failed), a line 'Error: Ssh(SessionEOF)' follows and becomes the session's last output. The string is servers/sshd's Error::Ssh(sunset::Error) (lib.rs:183) reaching a main that prints it: the guest sshd treats the client's close after a refusal as an error. Bisect by first-parent: passes at 27e74ec3b (B10's gate on 373396887 ran both alone, PASS), fails at 3aafc7a83 (MEM2's merge) and after. MEM2 changed libs/rt (heap cap, startup block v2), libs/client launch, and the bench's memory scan; find which path changed sshd's exit after EOF (the runtime's exit/report path? a heap record? the bench forwarding the guest console's last line where it did not before?) and fix the cause, not the regex: a refused login ends the connection quietly, as the page states (docs/servers/sshd.md). Size S. Gate: the 14 ssh-loopback-kind cases + bench-ssh-guest both widths, sshd and rt host tests."
  state = "done"
  revision = 161

[[node]]
  id = "BEAM8"
  title = "The VM's code is compact: one flat operand array per module, an 8-byte instruction"
  template = "package"
  parent = "M2"
  needs = ["BEAM6"]
  body = "Brief: .wash/local/BEAM8-implementer.md. Found by BEAM6's breakdown: decoded code is 7,180 pages on rv64 at the shell's prompt (242,345 instructions of 32 bytes, 521,551 operands of 24 in one Vec per instruction, 82 % of what the VM accounts for). Design: a flat per-module operand array, `Instr` = op, count, start (8 bytes), `Arg::List` boxed or indexed so `Arg` is 16 bytes, pinned by size_of asserts on both widths; the interpreter reads operands through its one accessor (`interp.rs` `arg(ins, i)`); the loader, the native-body patch and `on_load_entry` go through the same view; the .beam loader's input and refusals, eager loading, literals, atoms, heaps and the interpreter's semantics unchanged. About 2,510 pages of code either width, saving about 4,670 on rv64 and 1,165 on rv32. Tier A, size M. Done when `beamlet-footprint`'s table shows it on both widths, every limits and boot case passes, and the manifest's budget follows by the six-run rule. Open: QEMU's default 256 MiB (about 2,700 pages) is still out of reach with it; code kept in its on-disk form or loaded per function is the question that package would answer."
  state = "active"
  revision = 177
  overrides = ["2026-10-06: started by Orchestrator before M1 (reported): BEAM8's need BEAM6 is merged; M1 is reported, the plan's state for every active package"]

[[node]]
  id = "B13"
  title = "A share judged net of audits can exceed the whole: sched-budget-churn's deadline clause reads 1003 of 1000 and fails at the 1 ms slice"
  template = "package"
  parent = "M1"
  body = "Found by the train bench on main after SCHED1's merge (rv64, icount shift=3, deterministic): sched-budget-churn's 'share deadline: net 1003, gross 980 of 1000: target missed (450 <= share <= 1000)'. The victim's gross share is 980; the audit correction (B5: shares net of the checked build's audits, 46,022 us here) lifts it past the whole, and the clause's upper bound is the whole. At 1 ms the audits are a larger fraction of the window, so the correction's rounding shows. Nothing is unfair: a victim at or above 1000 means the churner gained nothing, which is the claim. Size S, Tier A bench. Fix the arithmetic, not the bound: the net share of a window cannot exceed the whole (clamp the correction at the window less the other budgets' net work, or compute net shares from net totals so they sum to 1000), with a host test on the oracle's share arithmetic that reproduces 1003 from the recorded numbers and reads 1000 after; state the rule on docs/testbench.md where B5's net-of-audits sentence is. Gate: sched-budget-churn both widths, the five sched share cases rv64, the oracle host tests."
  state = "done"
  revision = 182

[[node]]
  id = "B14"
  title = "The share fixtures' calibrated CPU count runs over the work it measures: find the bias in the calibration"
  template = "package"
