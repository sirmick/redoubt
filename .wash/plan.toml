  body = "Owner (2026-10-03). Brief: .wash/local/ABI1-implementer.md. Tier A (libs/sys, libs/rt's seam), size S. No needs.\n\nredoubt_sys::Transport (a Call in, a Return out, records and buffers by address) beside the ABI; Ecall implements it with today's one unsafe; redoubt_sys::syscall stays for the stub and tests/programs. libs/rt selects one installed transport (HostKernel becomes Transport, install_transport), the ecall by default on the machine, feature installed-transport otherwise; a no_std installed slot is the backend's own package. init's two direct DeviceInfo calls go through the runtime. Nothing above rt changes but the two renames.\n\nAcceptance: every host test and machine case unchanged, both widths; the unsafe count and the image sizes unchanged; a host test of a second transport seeing every call. Pages: libs/sys module doc, abi.md, native.md, and the owner's no-MMU direction as one line on docs/beyond/README.md."
  state = "done"
  revision = 2

[[node]]
  id = "ABI2"
  title = "Lends and transfers defined by ownership, not mapping; the fake kernel refuses given-up pages"
  template = "package"
  parent = "M1"
  needs = ["ABI1"]
  body = "Owner (2026-10-03). Brief: .wash/local/ABI2-implementer.md. Tier A (the IPC pages, the fake kernel), size S. Needs ABI1 (shared files: the fake, libs/sys docs).\n\nipc.md states lend and transfer as ownership: the caller gives a lend up for the whole call, the server may read and write it until its reply, the return says who owns it (returned / consumed); a transfer is given up at send and becomes the receiver's, owner and payer, at the take, or comes back if the send fails. One owner in every state. The MMU's remap is this kernel's enforcement (I9), stated once; a no-MMU backend may hand the buffer over. No kernel change (verified: take_buffer, give_buffer_back, move_buffer); a false rule is a stop-and-report. The fake refuses every call naming a given-up page. LendDisposition and Buffer docs say ownership; no type changes.\n\nAcceptance: the fake's new host tests; every host test and machine case unchanged, both widths."
  state = "done"
  revision = 2

[[node]]
  id = "MEM1"
  title = "Each server's stack declared in the manifest, painted by the launcher, measured by the bench"
