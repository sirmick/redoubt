  body = "Found by STEWARD4 (thread STEWARD4-crossing Q8; the implementer's need in .wash/local/B79-brief-from-steward4.md): the bench attaches one writable `[disk]` (disk0, bus 7) and the read-only userland disk (bus 5): tools/testbench/src/qemu.rs:349-409, docs/testbench.md 'Disks and network cards'. A confined manifest cannot put the unlabelled home volume and the vault on one disk (R34's device rule: one blkd, two label sets; servers/init confine.rs:132), so STEWARD4's confined-push boot case cannot boot. Build: a `[vault]` recipe beside `[disk]` (its own recipe/stage, `disk2` on a free virtio-mmio bus, the manifest device line, `devices_sit_on_fixed_slots` extended), the case toml key, testbench.md's section and the devices table; a host test that a recipe with both disks places them on their fixed slots and one without `[vault]` is unchanged; one existing case gains `[vault]` as proof of a boot with two writable disks (blkd:data and blkd:vault), both widths. Nothing else moves: no kernel, no init, no steward. Files: tools/testbench, docs/testbench.md, tests/<one case>.toml. Tier A tooling (the bench's device map), reviewer kernel-red-3. Size S. Consumer: STEWARD4 case 3 (rebases onto this or lands its boot case in a follow-up)."
