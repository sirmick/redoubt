[[node]]
  id = "CONW2"
  title = "A kernel line never leaves a session's line bare: the console hold says when a line is open, a free kernel line ends it first, and consoled re-emits the prefix after"
  template = "package"
  parent = "smp"
  body = "Ruled on QA B57-split-line (kernel-red-2, 2026-10-14) after train 22's bench failed three beamlet timing cases: consoled's hold covers a write, a program's line spans writes (the shell sends \"\\r\" then \":timed\\r\\n\"), and between writes nobody holds, so a free kernel line (B57's fall line; a kill line; any) prints at once after the `[con ID] ` prefix and the next write continues bare. consoled.md promises a program's line is never bare. Design (b57-implementer-3, ruled binding): one bit each way on console_hold, the kernel never waits: Release(3) says 'line open' (cleared by Release(2) or the kernel's own \"\\r\\n\"); a free kernel line with a line open writes \"\\r\\n\" first and goes out whole, and notes `wrote`; Take answers 'kernel wrote since' (cleared only by that Take) and consoled re-emits the prefix. State in Output under PRINTER; held lines, Line::Full and the 4 KiB bound unchanged; a refused Take keeps today's behaviour; consoled takes and releases once at start and a refusal is an exit code named in consoled.md. Proof: case console-kernel-line-mid-line (write `half`, end a child, write `rest\\n`: expect `[con ID] half`, the kill line, `[con ID] rest`; forbid `^rest$`), both widths at 2 harts; beamlet-reduction-rate, beamlet-schedulers-mttcg, -one-hart-mttcg green at CONW2's head; conhold host tests for the two bits; redoubt-sys round-trip tests; the model's rule if it has one. Pages: docs/kernel/devices.md 'The console's one writer', docs/servers/consoled.md. Touches redoubt-sys, kernel, conhold, rt, consoled, model: Tier A, kernel-red-2 reviews. B57 needs this, its code unchanged; its three cases rerun on CONW2's head before it rejoins a train. Branch wp-CONW2 from 691646841."
  state = "done"
  revision = 51

