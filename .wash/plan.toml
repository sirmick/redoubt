[[node]]
  id = "FSD4"
  title = "A directory listing reads the directory once per window, not once per entry"
  template = "package"
  parent = "M1"
  body = "Brief: .wash/local/FSD4-implementer.md (architect-14). Tier A (servers/fsd), size S, needs nothing. Found by BEAM2 (2026-10-03): listing the userland root (587 files) was unfinished after 400 s, and fsd answered no one else meanwhile. Cause: entry_name (server.rs:426) walks the whole directory for each entry, and each entry is then looked up again by path (node_at, stat_of, qid).\n\nDesign: one listing window per fsd, up to 64 entries with their stats (name, id, kind, size, qid version from the DirEntry's metadata and attributes), filled by one pass and keyed by the directory and a change generation that every volume change moves. dir_entry answers from it and refills on a miss, finding the directory once (its id check stays). Memory bounded (try_reserve). Listing n entries costs about n/64 passes with no per-entry lookup; one request costs at most a bounded number of passes, fixed by msize. The skeleton and littlefs are unchanged.\n\nAcceptance: host tests (pass count for 600 entries, a change between reads refills, one reply's bound); machine case fsd-large-directory, both widths: 600 files packed, listed in under 2 s, a second client's read answered during the listing. Page: fsd.md, a bullet \"A directory is listed a window at a time\" and the residual \"a listing is linear in the directory\"."
  state = "done"
  revision = 2

[[node]]
  id = "B6"
  title = "A seed sweep runs its boots in parallel, when asked"
  template = "package"
  parent = "M1"
  body = "Owner (2026-10-03): cut B6. Brief: .wash/local/B6-implementer.md (architect-14). Tier B, tools/testbench only, size S, needs nothing (B7's per-run directories are in). It launches when the host queue allows: its own proof boots QEMU.\n\nThe flags: --sweep SEEDS (A..B or a list; one case with qemu_seed), and --jobs J, which defaults to 1, is valid only with --sweep, and is capped at available_parallelism. Never the default. One build; each boot gets its seed directly (TESTBENCH_QEMU_SEED is refused with --sweep) and keeps its files in run-<pid>-<time>/seed-<N>-<arch>/. The join prints each seed's usual result in seed order, then a summary line (N seeds, passed, failed and which), and exits non-zero on any failure. A result under --jobs above 1 is a sweep datum, never a gate verdict; a timeout under --jobs is rerun alone. The merge gate stays serial.\n\nAcceptance: host tests (seed parsing and refusals, unique names, ordered join, summary and exit status); a machine proof of --sweep 1..4 --jobs 2 on the shortest seeded case, plus a serial replay of one seed matching. Page: testbench.md, after the qemu_seed paragraph, and the usage block."
  state = "done"
  revision = 2

