  body = "Owner, 2026-10-15: `./launch --system`, then the printed `ssh -p 2222 -i .tmp/launch/id_ed25519 alice@localhost`, answered 'Connection refused' while the serial console was alive. 'Refused' means nothing listened on the host's 127.0.0.1:2222: not the guest's sshd (a guest not yet listening resets or hangs the connection, QEMU holds the host port from its start). Candidates, by reading: (1) the ssh typed before QEMU ran (the build takes minutes; launch prints the line before building, tools/testbench/src/launch.rs:112-123); (2) the forward absent from the QEMU line launch ran (qemu.rs:329-332 adds hostfwd from the case's [net] forward = [22], tests/launch-system.toml:52; `scripts/q run` may have changed what ran: launch:88-99); (3) `localhost` resolving to ::1 first (the forward is 127.0.0.1 only; ssh falls through to 127.0.0.1, so this alone does not refuse). Step 1: reproduce with the owner's exact command on this host, both with and without the q daemon, and read the `+ qemu-system...` line launch echoed (ask the owner for their terminal's text if the first run passes). Step 2, whatever step 1 finds: launch proves the forward after QEMU starts (a connect to 127.0.0.1:port that gets the guest's reset or sshd's banner, then prints 'port 2222 forwards to the guest') and prints the ssh line again then, not only before the build; GETTING-STARTED.md:122-128 says when to try it; a host test holds launch.rs's printed line to the port the forward uses. If step 1 finds a defect, it is fixed here with its own case. Files: tools/testbench/src/launch.rs, launch, GETTING-STARTED.md; none of B50's. Tier A (the bench's launch path is what a person boots): kernel-red-2. Size S."
  state = "done"
  revision = 152

