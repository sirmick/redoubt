[[node]]
  id = "FSD4"
  title = "A directory listing reads the directory once per window, not once per entry"
  template = "package"
  parent = "M1"
  body = "Brief: .wash/local/FSD4-implementer.md (architect-14). Tier A (servers/fsd), size S, needs nothing. Found by BEAM2 (2026-10-03): listing the userland root (587 files) was unfinished after 400 s, and fsd answered no one else meanwhile. Cause: entry_name (server.rs:426) walks the whole directory for each entry, and each entry is then looked up again by path (node_at, stat_of, qid).\n\nDesign: one listing window per fsd, up to 64 entries with their stats (name, id, kind, size, qid version from the DirEntry's metadata and attributes), filled by one pass and keyed by the directory and a change generation that every volume change moves. dir_entry answers from it and refills on a miss, finding the directory once (its id check stays). Memory bounded (try_reserve). Listing n entries costs about n/64 passes with no per-entry lookup; one request costs at most a bounded number of passes, fixed by msize. The skeleton and littlefs are unchanged.\n\nAcceptance: host tests (pass count for 600 entries, a change between reads refills, one reply's bound); machine case fsd-large-directory, both widths: 600 files packed, listed in under 2 s, a second client's read answered during the listing. Page: fsd.md, a bullet \"A directory is listed a window at a time\" and the residual \"a listing is linear in the directory\"."
  state = "done"
  revision = 2

[[node]]
  id = "B6"
  title = "A seed sweep runs its boots in parallel, when asked"
  template = "package"
  parent = "M1"
  body = "Owner (2026-10-03): cut B6. Brief: .wash/local/B6-implementer.md (architect-14). Tier B, tools/testbench only, size S, needs nothing (B7's per-run directories are in). It launches when the host queue allows: its own proof boots QEMU.\n\nThe flags: --sweep SEEDS (A..B or a list; one case with qemu_seed), and --jobs J, which defaults to 1, is valid only with --sweep, and is capped at available_parallelism. Never the default. One build; each boot gets its seed directly (TESTBENCH_QEMU_SEED is refused with --sweep) and keeps its files in run-<pid>-<time>/seed-<N>-<arch>/. The join prints each seed's usual result in seed order, then a summary line (N seeds, passed, failed and which), and exits non-zero on any failure. A result under --jobs above 1 is a sweep datum, never a gate verdict; a timeout under --jobs is rerun alone. The merge gate stays serial.\n\nAcceptance: host tests (seed parsing and refusals, unique names, ordered join, summary and exit status); a machine proof of --sweep 1..4 --jobs 2 on the shortest seeded case, plus a serial replay of one seed matching. Page: testbench.md, after the qemu_seed paragraph, and the usage block."
  state = "done"
  revision = 2

[[node]]
  id = "K19"
  title = "A destruction's deliveries happen at its boundary: pumps after the mark, not in its middle"
  template = "package"
  parent = "M1"
  needs = ["IPC3"]
  body = "Brief: .wash/local/K19-implementer.md. Tier A, size M+, needs IPC3 merged (start from main). Part A, pumps at the boundary: no delivery inside a destruction; pumps become entries on a bounded to-pump list of endpoints, drained once after step 9 and before the bill; the five dying/doomed checks deleted or made checked-build assertions; commit 1 is a model trace of the mid-kill delivery, and the model's destroy pumps last; R10 step 4 tightens to \"from the mark on, no message stamped with a dying budget is delivered\" with a new model mutation (no R4b doomed mutation exists to retire: say so). Part B, per-budget chains of process objects (charged: the creator's owner chain; counted: a chain keyed on counted_in) so destroy_subtree's kill, step 3's frees and step 8's migration follow the dying subtree. Done when worst-walk's R10 p99 at full fill is within 30 ms net on both widths, its must_fail and docs/todo/destruction-walks-every-process.md gone, the residual bullets rewritten. Short gate plus the R10/R4b case lists and worst-walk by name. IPC3 already removed fail_all's rescan."
  state = "reported"
  revision = 167

[[node]]
  id = "AIO1"
  title = "One I/O hub per process: many outstanding 9P requests on one thread, the kernel unchanged"
  template = "package"
  parent = "beamlet-redoubt"
  body = "Owner (2026-10-03): one thread on the non-kernel side holds the buffers; AIO goes through it. Brief: .wash/local/AIO1-implementer.md (architect-14). Tier A (the serving library and the 9P skeleton; the client library), size M+, needs nothing. BEAM3 builds on it. Background: .wash/local/async-ipc-assessment.md.\n\nRuled: the completion side is one hub thread plus one thin waiter per server connection (a long-poll completion call each). Completions by send to a client endpoint are refused: the authority would match a reply's (R1), but the server's send blocks on the client's one thread, which can deadlock with that thread's own send, and any timeout drops a result and breaks R26. Exactly one thread needs a kernel notification object (AIO2, the owner's later choice, S-M, after IPC3); an endpoint set does not do it.\n\nDesign: the hub owns every buffer (by value in, by value out), sends tagged 9P requests (transfers for data; a short send timeout, retried, never lost), and dispatches completions. The serving library parks requests under the connection's admission share; undelivered completions count against it; over the share a request is answered busy; tags at most 256 per connection; Tflush answered once; the completion call's abandonment ends the connection.\n\nAcceptance: host attack tests (a never-polling client, death with requests parked, death between polls found at deadlines, a flush racing a completion, a send flood at WAIT_CAP, tag misuse); the machine case aio-many-reads (64 outstanding reads, 1 hub + 1 waiter, another client served meanwhile); today's one-call 9P unchanged. Pages: serving.md (Multiplexed connections, a new rule R7x, R26/R28 sentences), files.md, SECURITY.md."
  state = "done"
  revision = 2

