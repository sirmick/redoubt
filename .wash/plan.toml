[[node]]
  id = "STEWARD3R"
  title = "R41 has no mechanism: a connection carries no revocation scope, so a lease's connections end only by the launcher's disconnect; design the scope, then build it in the serving library"
  template = "package"
  parent = "STEWARD3"
  body = "The design question handed from STEWARD2 (.wash/local/STEWARD3-implementer.md '2026-10-06: a design question'; steward.md R41 'Open'; the R41 departure accepted for sessions in the Architect's handoff): `new_connection(root, quota)` carries no scope and only the process that makes a handle stamps it, so the steward's CreateScope budget (zero limits inside a lease) binds nothing; a lease's connections today end by the launcher's disconnect at the lease's end (agents.md 'When a lease ends'). Step 1 (the Architect, before any build): the ruling, with the page line for steward.md R41 and the kernel or protocol page it touches, between (a) a scope handle a server accepts at new_connection and ends connections by (a serving-library change in libs/rt, every file server's for free; a wire-table field), and (b) a disconnect-by-scope the steward drives (no server change; the steward must know every connection it minted). A choice that changes the kernel's ABI or the 9P wire goes to the owner by decision_request with both; a serving-library-only mechanism is the Architect's. Step 2: the build per the ruling, with a host test in libs/rt (a connection made in a scope ends when the scope's budget is destroyed, its fids freed, its sibling in another scope untouched) and R41's status and SECURITY.md row. STEWARD3A builds leases whose connections end by the launcher's disconnect until this lands, and R41 stays Open with this node's words. Files: docs/servers/steward.md R41, docs/servers/serving.md, libs/rt/src/server (if (a)), libs/wire/tables/steward.md, servers/steward. Tier A (authority over connections): steward-red-2. Size S (design) + S (build)."
  state = "done"
  revision = 279

[[node]]
  id = "STEWARD3S"
  title = "ipd's typed grant carries no scope on its wire: a session's or lease's ipd connection ends only by the steward's disconnect, where every 9P connection is minted in its scope and dies with it"
  template = "package"
