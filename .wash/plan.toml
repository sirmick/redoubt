  parent = "AGENT0"
  body = "Brief: .wash/local/AGT4-brief.md. AGT2's finding (.wash/local/AGT2-report.md 'Finding'): a three-line `defmodule` at the shell prompt over SSH, in or out of the machine mode, ends the session's VM: `PROGRAM HALT: CPU Exception on PID 420: Store page fault of 0x7ffecae8 at 0x002e2b70`; a probe at the plain prompt faults identically (deterministic); host beamlet compiles the block; no machine case compiles a module. The address: the first thread's stack sits under 0x8000_0000 (memory-layout.md:224-226); 0x7ffecae8 is 79,127 bytes, 19.4 pages, below the top, and the steward launches a session VM's first thread with SESSION_STACK_PAGES = 18 (steward.rs:105-107: twice the 36,136-byte peak beamlet-footprint measured, which compiles nothing; helper schedulers get SCHEDULER_STACK_PAGES = 18, lib.rs:648-650). So the first scheduler's native stack overflowed: the compile needs over 72 KiB where the term walks are iterative and something on the compile path is not. Step 1: addr2line 0x002e2b70 on the packed ELF both widths; on the host, the same block under a stack-peak probe names the recursion and its depth. Step 2: (a) make that path iterative if it is one path; else (b) the stack declared from a new peak by the page's rule (twice the largest peak): beamlet-footprint gains a compile, both constants follow, the steward's heap-cap arithmetic (11,092 of 11,136 pages) recomputed on the page and in the code. No separate compile thread: the compiler is Erlang code on a scheduler. Gates: a machine case shell-compile-module (the defmodule typed over SSH and called, both widths, 5 runs); beamlet-footprint with the new peak quoted; the shell set; size-budget; steward-ssh-two-principals once; init.md 'Stacks', testbench.md's memory-budget paragraph and beamlet.md updated. Files: userland/otp (vm, redoubt lib.rs), servers/steward/src/bin/steward.rs, tests/, the three pages. Tier A (a session limit moves, or the interpreter): steward-red-2. Size S-M. Blocks AGT3 and AGENT0."
