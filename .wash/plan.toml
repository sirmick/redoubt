  parent = "M1"
  needs = ["FSD1"]
  body = "Simplification, not a hole. Tier B, size S. The receive loop is copied in seven servers (bootfsd, keyd, blkd, fsd, consoled, netd, ipd, and libs/rt's echo-server), each with its own RECEIVE_FAILED = 3.\n\nBuild in libs/rt/src/server:\n- serve(endpoint, f) -> u32, for a server that takes only calls: each call to f (its result dropped, as now: the shared finish path answers a rejected reply); a send dropped and its handles closed; Interrupt, Exit and Abandoned ignored; Dead -> exit::OK; any other error -> exit::RECEIVE_FAILED.\n- close_delivery(&delivery), the handle-closing, for the loops that keep their own shape;\n- RECEIVE_FAILED moves to redoubt_rt::exit, still 3.\n\nbootfsd, keyd, blkd, fsd and echo-server call serve. consoled (abandoned parked reads), netd (meaningful sends, break_device on exit) and ipd (timeouts, two-word receive) keep their loops and use close_delivery and exit::RECEIVE_FAILED. No helper with hooks for their cases.\n\nKeepers: a host test of serve over the fake endpoint: a send's handles are closed, Dead exits OK, another error exits RECEIVE_FAILED. Every server's bench cases unchanged.\n\nPage line, serving.md, a bullet at the top of Interface: 'A server that takes only calls runs redoubt_rt::server::serve, the one receive loop: a send is dropped and what it brought closed, and the endpoint's death ends the server with OK.' Needs FSD1 (fsd's loop); start after INIT4 merges if INIT4 is still in netd's and ipd's bins."
  state = "done"
  revision = 323

[[node]]
  id = "SMP3"
  title = "Several harts: one process's threads on several harts at once"
  template = "package"
  parent = "M2"
