  body = "Found by B13's review: the oracle's net share is cpu*1000/(window - credited audits); with the credit now capped at the window less the share's CPU (B13), the fact that the program's calibrated CPU count exceeds the work by >= 0.3 % on rv64 and >= 0.65 % on rv32 (sched-budget-churn's deadline variant: 1,960,670 counted of a 2,000,000 window with 46-49 ms of audits; rv32 71,097 us audits, 58,089 credited) is hidden behind the report's 'credited N' and biases every SHARE's cpu high by that much. Size S, Tier A bench. Find the source in the fixtures' calibration (tests/programs' share programs: the loop count per unit of time at startup under the 1 ms slice), correct it or state the bias as a measured constant the oracle subtracts, with a host test and the page sentence beside B5's and B13's."
