[[node]]
  id = "BEAM9"
  title = "A hub write on a twice-minted consoled connection never completes on rv32: the steward's console session prints nothing after its first prompt"
  template = "package"
  parent = "M1"
  body = "Found by STEWARD2's gate on rv32 only: the console session's VM reads and evaluates every typed line (verityd's expected block-mismatch line appears, so the reads and the evaluation ran) but nothing it writes after its first prompt reaches the UART; ConsoleIo instrumented: no write is refused, short or ended; a write is put out on the hub and its completion never comes back, while the console's read completions do. Ruled out: beamlet's limit change, erofsd budget/buckets, the VM's erofsd connection, RAM, consoled heap, the steward's own console lines. What is left: the connection: the session's /dev/cons is a consoled connection the steward mints (new_connection, root \"\") through its own /dev/cons, which init minted; main's VM gets init's minted console directly; SSH sessions are fine on rv32; rv64 is fine. Cases: rv32 userland-boot, userland-read-only, boot-profile, boot-profile-unverified on wp-STEWARD2. Probe notes: .wash/local/STEWARD2-rv32-probe.md. Suspects: the hub's completion matching (libs/client aio.rs, BEAM3) or consoled's handling of a minted connection's writes under 32-bit tags/offsets; the kernel is not suspected. Tier A if libs/client or consoled changes. Size S-M. Blocks STEWARD2's merge."
  state = "done"
  revision = 2

