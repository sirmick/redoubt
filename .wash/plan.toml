  body = "docs/kernel/scheduling.md R12 restated across harts, once, with several runners per budget (after SMP3). Brief: .wash/local/SMP2-implementer.md. Tier A, size M-L.\n\n- R12: a budget gets its weight's share of the harts, at most one per runnable thread, what it cannot use going to the others by weight (water-filling); spreading gains nothing.\n- Architect's ruling: the floor leaves out capped budgets (weight share above their runnable threads, found by water-filling over the top H-1 by w/k); a budget leaving the cap is lifted to the floor. At one hart nothing is capped, so nothing changes.\n- Checkpoint before kernel work: four scenarios (late join, second cap, uncap, spread) in the model, under the old floor and the new rule, sent to the Architect.\n- The stride crate, the model (1, 2, 4 harts, independent water-filling) and five new mutations; the oracle judges multi-hart traces.\n- Cases: unpin SMP1's pins to [1, 2, 4]; sched-capped; sched-lock-contention (FIFO wait from the trace); sched-latency swept at 2 harts.\n- Targets (owner, QA SMP1-design): gated at 1 and 2 harts, recorded at 4.\n- The VM's two schedulers on two harts, once beamlet runs on Redoubt; else cut to its own node."
