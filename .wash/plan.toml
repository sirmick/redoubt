  body = "Brief: .wash/local/INIT3-implementer.md (rules, exact page lines, cases, owned paths, context rules).\n\nBuilds:\n- docs/servers/init.md#restarts-and-reboots: a fresh budget, the same endpoint, the boot's own steps repeated, exits during the boot counted, the reboot rule (more than 5 restarts in 60 s), a fault reported and blamed on nobody (blame itself waits for the steward step);\n- docs/servers/wire.md#a-launcher-releases-its-childs-grants: init releases through Grants; the launcher-orphan case;\n- docs/servers/serving.md#replies-and-rollback, in a boot: rollback against consoled, and the malformed fallback;\n- docs/kernel/devices.md: a driver restart, and a quarantined driver reboots (test driver, dma-reset-deaf).\n\nAlso, from INIT2's review:\n- a case that watches a child's console connection disconnected when the child exits;\n- a server that exits while the boot is starting falls under the reboot rule, consoled refusing a buckets=N among them.\n\nnetd's restart case moved to INIT4. Design: QA INIT1-design. Tier A, size M."
