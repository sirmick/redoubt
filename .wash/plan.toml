[[node]]
  id = "BEAM13"
  title = "A console reader that exits leaves input queued with no reader, and the VM's idle returns at once every pass: a hot loop"
  template = "package"
  parent = "M1"
  body = "Found by BEAM10's red: vm.rs:1394 clears console_reader when the reading process exits; poll_console then returns without draining, cons.input stays non-empty, and idle's 'something is there' return fires on every pass: a hot loop burning the session's budget until some process reads the console again. Fix: with no reader, input is drained (or held in a bounded buffer the next reader gets) and does not count as 'something there'; a host test on the fake kernel: the reader exits with input queued, the scheduler idles (idle's wait is entered), a later reader gets the bounded buffer or nothing, as the page says. beamlet.md's console paragraph says which. Tier B. Size S."
  state = "done"
  revision = 2

