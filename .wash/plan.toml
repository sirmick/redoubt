[[node]]
  id = "B87"
  title = "At two harts the scheduler oracle rejects six of ten real-steward latency traces: 'a device interrupt returned without its claim' (a kernel or trace-recording finding under icount)"
  template = "package"
  parent = "AGENTS"
  body = "Seen by STEWARD4's steward-latency sweep on rv64 at two harts (2026-10-17; .wash/local/steward4-logs/sweep-rv64-a.log; the handoff .wash/local/handoffs/steward4-implementer-2.md 'Sweep so far'): seeds 1-4, 8 and 9 of 1..10 have their trace rejected by sched_oracle with `record N: a device interrupt returned without its claim` (e.g. record 2149984 at seed 1); the four accepted traces read like seed 3's row on scheduling.md; one hart accepts every seed. The sweep keeps no failing log (--keep-failed conflicts with --sweep), so the rejected trace must be re-made: `TESTBENCH_QEMU_SEED=1 cargo testbench steward-latency --arch rv64 --keep-failed <dir>` under `q run` in a STEWARD4-or-later tree (the case, its probe and manifest are STEWARD4's; it lands first). Work: reproduce and keep one rejected trace; find whether the kernel's interrupt path at two harts can return from a device interrupt without claiming it (IRQ1's per-hart PLIC contexts, B56/IDLE2's idle path, SMP6's lock-to-decide: a hart taking an interrupt another hart already claimed, or a spurious interrupt returned as a device one), or the trace records the claim on the other hart's record stream so the oracle's pairing is wrong (B24/B58's shape: a recording or oracle fault, not the kernel's); the answer named from the trace lines; the fix where it belongs (kernel/src's interrupt path with its rule on devices.md/scheduling.md and a two-hart kernel case, or the oracle's pairing with a host test), both widths. Until it lands, the two-hart rows of steward-latency rest on the accepted seeds and the page says so (STEWARD4 states it). Files: kernel/src (irq, idle), tools/testbench's sched_oracle, docs/kernel/devices.md or scheduling.md. Tier A (kernel); reviewer kernel-red-3. Size M."
  state = "done"
  revision = 460

[[node]]
  id = "B88"
  title = "The rv32 two-hart latency stall: two spinner VMs loading code at once saturate the verified read path, then outrun the 5 s launch bound on compute; verityd caches from the manifest and reads ahead"
  template = "package"
  parent = "AGENTS"
  body = "Found by STEWARD3W's steward-latency N = 3 round on rv32 at two harts (twice, before and after STEWARD3U), first read as erofsd:system taking nobody's call. The block-trace (a test-only kernel instrument this node adds, off in every default build) showed the steward's calls out all return within 1.43 s and it waits to receive on its own endpoint, the read path's servers run whenever asked, and a kernel lost wake is refuted: the wedge is the verified system-volume read path (erofsd, verityd, blkd) under two concurrent VM code loads, verityd's four data blocks thrashing with no read-ahead, the shell's own load starved past start_agent's 5 s bound. Fix: verityd's data cache is sized from its manifest entry's heap (half the cap less a derived reserve, floor four), and a request's cold run is read ahead in one read bounded by MAX_SECTORS and the cache's size (up to five blkd calls at the two-page lend), every block hash-checked before it is kept; blkd reads fall from 2704 to 924 on the case and rounds N = 1 and 2 complete on rv32 at two harts. Round three does not: launch beside two spinners takes 5.3 to 5.7 s against 3.9 s alone (rv64: 2.2 to 3.3 s), and a larger cache cuts reads further without moving it, so the remaining cause is compute, two equal-weight module decodes and the shell's share under icount at two harts; the rv32 two-hart N = 3 and 4 rows are stated missed with that cause, the target unmoved. verity:system's heap grows 100 to 118 pages (init's rule: twice the measured peak) in the image and every memory-checked manifest; budget 256 unchanged. Residuals: the steward's mints at shared servers wait within FOREVER (bounded disconnects, unbounded mints; max observed 1.43 s), its own node; whether a session's load outranks a lease's under the scheduler, the Architect's. Report .wash/local/B88-report.md. Tier A; reviewer kernel-red-3. Size M."
  state = "done"
  revision = 467

[[node]]
  id = "SSH3"
  title = "sshd's connections are bounded in time before login and sized by the manifest, so no network client holds a slot for long and one principal's slots are the manifest's"
  template = "package"
  parent = "AGENTS"
  body = "Ruling: .wash/local/wave-2026-10-18-rulings.md 'The sshd step and SSH3'. Brief: .wash/local/SSH3-implementer.md. Tier A (sshd), size S, reviewer steward-red-4 or the orchestrator's sshd red. The sshd step's two items (approve@box, vault sessions over SSH) are built with their cases; this is the one follow-up its residual names ('Connections are first come, first served ... how many one principal may hold is not decided'). Rule: a connection that has not authenticated within a bound is closed, the bound measured (twice the slowest login the bench records, the arithmetic on sshd.md), so a slot is held before login for at most that; the slot count follows the manifest's buckets=N for sshd as every server's limits do (3Q, 3V), bounded by ipd's parked calls a bucket (the accept and one parked read per slot), with the arithmetic on sshd.md; after login a principal's channels are bounded by R82 already (a login past the cap is refused and the connection ends). Cases: a client that connects and never authenticates is closed at the bound and the slot serves the next login (verdict: the next login's session, not the attacker); a manifest sizing sshd's slots boots and holds them; sshd-host tests for the bound. Lowest priority of the wave: behind the agent-suite if slots are short."
  state = "done"
  revision = 482

[[node]]
  id = "STEWARD5"
  title = "The steward's loop never waits on a shared server: cleanup steps run on a thread of its own, their outcomes come back as events"
  template = "package"
  parent = "AGENTS"
  needs = ["STEWARD6"]
  body = "Ruling: .wash/local/wave-2026-10-18-rulings.md 'F1'. Brief: .wash/local/STEWARD5-implementer.md. Tier A (the steward's loop), size M, reviewer steward-red-4; after STEWARD6 (same file). Found by STEWARD3V's and 3W's latency rounds: a cleanup step's one attempt at a busy erofsd:system (100 ms, 3Y's bound at the loop's top) landing in a sample's window misses the timer wake's p99 (50 ms) by construction: one sample per round at N = 3 and 4 on both widths at one hart (69-93 ms), 148 ms at two on rv64. Options (a) a target-derived bound and (c) non-blocking calls refused in the ruling. Rule: the cleanup queue (due, retries, parked: 3W unchanged) is owned by a cleanup thread of the steward's, as its crossing watchers are; each step runs there with the client library's call bound; the loop hands it steps, wake(server) and forget(server), and takes each outcome back as a message on its own endpoint and says the line (3U's queue). A mint at a server with parked steps: wake, mint, and if refused wait one mint bound (STEWARD6's) for the thread's report and retry once (3W's test kept). The loop's top makes no call to a shared server. Cost: one thread and one lend page, the arithmetic on the page and in every memory-checked manifest. Acceptance: steward-latency N = 3 and 4 at one hart meet the timer wake's p99 on both widths and reply_wait carries no 100 ms retry; the steward set and steward-server-restart unchanged. Pages: steward.md 'Failure and restart', scheduling.md 'With the real steward' re-measured."
  state = "active"
  revision = 493

[[node]]
  id = "STEWARD6"
  title = "The steward's calls to shared servers inside a batch are bounded: a server that does not answer in time fails the step, never holds the loop"
  template = "package"
  parent = "AGENTS"
  body = "Ruling: .wash/local/wave-2026-10-18-rulings.md 'F3'. Brief: .wash/local/STEWARD6-implementer.md. Tier A (the steward), size S, reviewer steward-red-4. Found as B88's residual: the steward's mints (unattached -> Connection::new -> FOREVER), its launch step's image reads from erofsd:system and a push's source reads wait without bound, while its disconnects (3Y) and console writes (3U) are bounded; max observed 1.43 s under two spinner VMs. Rule: every call the steward makes to a shared server inside a batch is made within one bound, SERVER_US; a call the server did not take in time fails the step, the batch's existing failure path answers the caller (failed to start_agent and submit, a login refused) and nothing retries inside the steward. The bound is measured, not guessed: twice the worst per-call wait under steward-latency's load on both widths, rounded up to a second, stated on steward.md 'Residual risks' beside the relay bounds. Host tests with a server that never answers (a mint, the image read, a push's source); the steward set unchanged in verdict; steward-latency N = 1 unmoved. Pages: steward.md (residual, one clause under sessions), agents.md 'Leases' one clause. First of the pair: STEWARD5 shares bin/steward.rs."
  state = "done"
  revision = 492

[[node]]
  id = "STEWARD7"
  title = "A principal's leases are derived from the manifest: the admission caps' lease term is what its unlabelled share holds in agent budgets; steward-latency at N = 16"
  template = "package"
  parent = "AGENTS"
  body = "Ruling: .wash/local/wave-2026-10-18-rulings.md 'F2' (STEWARD3V-budgets Q4). Brief: .wash/local/STEWARD7-implementer.md. Tier A (admission caps in every shared server; the bench's derivation), size S-M, reviewer steward-red-4. Found by STEWARD3V part 2: 3Q's per-account caps add a lease term of 1 (the bench test's LEASES, 'no manifest names it'), so one session with N leases (2 + N at erofsd:system, 1 + N at its home and /boot) is admitted for N <= 7 and N = 16 is refused its eighth home connection. Rule: the term is derived as the context cap is (R82): leases(p) = min(share_pages / sizes.agent.pages, share_processes / sizes.agent.processes) over the principal's unlabelled share as init's holds derives it; an upper bound, since sessions carved from the share only lower it and a sponsored principal's sessions are leases of it; the kernel's carve (R7) refuses past it, so the steward gains no rule and the core no row. steward.md 'Leases' states it as arithmetic (image: alice 7); the bench test and the servers' limits take the term; entries follow STEWARD3V's rule where a bucket grows. The latency manifest's alice is sized by the rule for N = 16 if memory_mib affords it by the memory rule's arithmetic (about 190,722 pages for her), else the largest N the rule gives is recorded with its arithmetic beside the stand-in's column (owner question, conditional). Not a compiled constant raised to a case's N, not a new manifest field."
  state = "active"
  revision = 472

[[node]]
  id = "STEWARD8"
  title = "A lease's launch under load is a measured quantity: start_agent's client bound is derived from it, and the rv32 two-hart rounds at N = 3 and 4 are measured"
  template = "package"
  parent = "AGENTS"
  needs = ["STEWARD5", "STEWARD6"]
  body = "Ruling: .wash/local/wave-2026-10-18-rulings.md 'F4' (B88's residual). Brief: .wash/local/STEWARD8-implementer.md. Tier B (the Elixir client, the shell's call, a toml, pages), size S, one reviewer: the editor, the red team if the steward is touched. Runs when STEWARD5 and STEWARD6 are on main, so scheduling.md's table is re-measured once. Found by B88: on rv32 at two harts a lease VM's launch beside two spinners takes 5.3-5.7 s and the shell's start_agent answers timeout; the 5 s is @timeout 5000 in libs/wire/elixir/lib/client.ex, the client's bound for every steward call, a platform constant no page states as a target; no page bounds a launch. Rule: the launch is stated and measured as end_lease's 589 ms is (steward.md 'Residual risks'): start_agent's served time alone and beside N - 1 spinners, both widths, one and two harts, from the steward's served lines; the shell's start_agent passes the client a bound of its own, twice the worst launch measured beside the spinners the case runs, rounded up to a second (call/5 takes a timeout; 5 s stays for short calls). Then the rv32 two-hart rounds at N = 3 and 4 run and their rows are measured; a miss there is a scheduler finding, not a timeout's. Drafted under the image's weights (session 100, agent 50, steward 100; the case's steward 1,000): the owner's weight answers change the number, not the design; the launching lease's share against its sponsor's spinners is asked in the owner file."
  state = "todo"
  revision = 468

[[node]]
  id = "IPD1"
  title = "ipd parks a request strictly shorter than its clients wait: data and ctl reads below the hub's FILE_WAIT_US, so a late answer never carries bytes"
  template = "package"
  parent = "AGENTS"
  body = "Ruling: .wash/local/wave-2026-10-18-rulings.md 'BEAM5 Q1'. Tier A (ipd), size S, reviewer kernel-red-3 or the orchestrator's ipd red; no brief: the ruling is the whole scope. Found by BEAM5's implementer: the VM's hub gives a request up at FILE_WAIT_US (10 s) and drops a later answer (files.rs give_up); ipd parks a data read up to DATA_WAIT_US (30 s) and answers it with the bytes when they arrive, so bytes a peer sends 10-30 s into a quiet read are lost to the stream. Rule: a server parks a request strictly shorter than its clients' wait, by a stated margin: DATA_WAIT_US and CTL_WAIT_US come down below FILE_WAIT_US (8 s against 10 s, the margin the kernel's delivery of a reply; the arithmetic on ipd.md 'Pinned and abandoned calls' and files.md 'Files over 9P'); bytes arriving after ipd's timeout wait in its buffer for the next read, which the client makes at once. Cases: ipd's host test of the park bound; net-tcp, net-pinned, sshd-loopback-* unchanged in verdict, both widths. BEAM5's echo case lands on it."
  state = "done"
  revision = 478

[[node]]
  id = "ATK10"
  title = "The scripted hostile agent: a lease tries to get out, and every row of its table gets its case"
  template = "package"
  parent = "agent-suite"
  body = "Brief: .wash/local/ATK10-implementer.md; ruling .wash/local/wave-2026-10-18-rulings.md 'The agent-suite step'. Tier A (attack cases; the bench), size M, reviewer: a red (the orchestrator's pick). Builds docs/plan/m3-agents.md 'A scripted hostile agent': the rows marked not yet become cases, each judged by a party the agent cannot impersonate: (1) steward-agent-escape: the agent reads and writes outside /project, binds, calls the steward's operations from a lease's badge, looks for /net and a console, and asks for a lease past MAX_LEASE from its sponsor's side; verdicts: alice's canary files and listings unchanged, the servers' and steward's refusal lines, no grant in the audit (R25, R41, R39); (2) steward-lease-cut: the sponsor ends a lease while the agent writes to /project in a loop, so walfsd holds its lent pages when the budget dies; walfsd serves on, alice's project reads back whole, the lease's connection is gone and alice's own still works (R3, R10, R39, R41); (3) steward-agent-flood: the agent floods walfsd:data through /project and the steward through its badge from many processes; alice opens a file in her home and ends the lease, both answered within the case's bound (R26); (4) steward-vault-note: a vault session's free text in a request is not shown on approve@box, an unlabelled session's is quoted and marked (R38; the boot arm of the host test). Scripted agents are modules beside Redoubt.Agents.Echo, driven by ~/project/in. Pages: m3-agents.md rows, agents.md and steward.md status lines, SECURITY.md rows. No steward, kernel or server code."
  state = "done"
  revision = 505

[[node]]
  id = "ATK11"
  title = "The scripted hostile user at the shared servers: Bob and Alice's vault flood walfsd, blkd and ipd, and Alice is served in her turn"
  template = "package"
  parent = "agent-suite"
  body = "Brief: .wash/local/ATK11-implementer.md; ruling .wash/local/wave-2026-10-18-rulings.md 'The agent-suite step'. Tier A (attack cases; the bench), size M, reviewer: a red (the orchestrator's pick). Builds the fairness rows of docs/plan/m3-agents.md 'A scripted hostile user', each judged from the victim's side: (1) walfsd-flood-turn: bob's session floods walfsd:data from as many processes as his VM's hub admits while alice's session reads and writes her home, each operation answered within the bound the case states and derives (R2, R26); (2) vault-flood-turn: alice's vault session floods walfsd:data (it may read the unlabelled volume) while alice's unlabelled session's operations are answered as in (1): a vault's queued calls leave its owner's unlabelled turn and cap unaffected (R2, R37); (3) blkd-fairness: bob writes large files through walfsd:data without end while alice's vault session writes and reads back in walfsd:alice-secrets, both servers on one blkd (R2); (4) net-pinned-ssh: alice's shell parks 64 gen_tcp reads at ipd that its own short timeouts abandon while bob logs in over SSH and alice's echo to the peer still works (R28, R4a). Bounds are measured once on both widths and stated with their arithmetic in each toml's comment; a miss is a finding, not a tuning. Pages: m3-agents.md rows, serving.md, ipc.md R2 and ipd.md status lines, SECURITY.md rows. No server code."
  state = "done"
  revision = 501

[[node]]
  id = "ATK12"
  title = "Resources, launch and leaky state: shared pools, a hostile launch from a session, and what an unlabelled observer sees while a vault works"
  template = "package"
  parent = "agent-suite"
  body = "Brief: .wash/local/ATK12-implementer.md; ruling .wash/local/wave-2026-10-18-rulings.md 'The agent-suite step'. Tier A (attack cases; the bench), size M, reviewer: a red (the orchestrator's pick). Builds three rows of docs/plan/m3-agents.md 'A scripted hostile user': (1) walfsd-pools: bob fills his home to its quota and opens fids until his cap, refused by name, while alice's saves succeed and walfsd's budget holds no more pages than before (R48, R26); (2) session-hostile-launch: alice's session launches a malformed ELF from her home and a program whose image is cut short; each refusal names itself, the child alone is hurt and her session answers on (R31, R32); (3) vault-no-leak: alice's unlabelled session records a stated list of observables (her sub-budget's usage, a request id, a session id, the PID of a program it launches, her home's qids, versions and listings) before, while and after her vault session writes files, launches a program and submits a request; nothing it records changes with the vault's work, and it cannot write, truncate, create or remove in the vault's volume (R37, R25, R36). The observable list is the case's claim and is on the page; an observable that does change is a finding reported to the Architect with its mechanism, never removed from the list to pass. Pages: m3-agents.md rows, littlefsd.md and walfsd.md R48, init.md R31/R32, steward.md R37 status lines, SECURITY.md rows. No server or kernel code."
  state = "done"
  revision = 511

[[node]]
  id = "ATK13"
  title = "The last two scripted rows: a labelled agent has no sink, and keyd signs no relayed blob (its boot arm resolved)"
  template = "package"
  parent = "agent-suite"
  body = "Brief: .wash/local/ATK13-implementer.md; ruling .wash/local/wave-2026-10-18-rulings.md 'agent-suite wave B'. Tier A (attack cases; the bench), size S, reviewer: a red (the orchestrator's pick). Turns the two remaining 'not yet' rows of docs/plan/m3-agents.md into their honest state under today's image. (1) R60, the labelled-agent sink row, becomes a boot case steward-labelled-agent-no-sink, built on steward-approve-box's path (a labelled agent approved at approve@box, running in its vault): the agent's :gen_tcp.connect gets enetunreach (its lease namespace holds no /net, as session-tcp-loopback shows for an unlabelled lease), and ipd's refusal of a labelled caller is the backstop, cited to net-attacks (R60); the verdict is the agent's result file in its vault and the absence of any frame to the bench peer (rule F). (2) R44, the keyd relayed-blob row: no boot arm is reachable in the image, since no session or lease holds a keyd badge (keyd's purposes are sshd's ssh_host and the steward's audit; keys in leases are M6); the row resolves on m3-agents.md by citing keyd's host tests (a_relayed_ssh_user_auth_blob_is_never_what_gets_signed and R44's set) and stating why no boot arm exists, with a normal login's end-to-end verification (the client checks the host signature over the exchange it computed) as the boot evidence that keyd signs only its own digest. Pages: m3-agents.md rows, agents.md R60-adjacent and keyd.md R44 status lines, SECURITY.md R60 row. No server, kernel or steward code."
  state = "reported"
  revision = 514
