[[node]]
  id = "B75"
  title = "A spawned thread's stack has no guard page: an overflow writes over whatever is mapped below and the process dies later elsewhere (AGT4's rv64 illegal instruction), not at the overflow"
  template = "package"
  parent = "M2"
  body = "libs/rt/src/thread.rs:25 says it: 'No guard page below it: a stack that overflows writes over whatever is mapped below'; `spawn` (:33-41) takes `Buffer::new(stack_pages)` and hands it to thread_create. AGT4 found the cost: a helper scheduler's overflow corrupted the heap silently and rv64 died later with an illegal instruction, while the first thread's overflow faulted at once at its unmapped page (memory-layout.md:224-226); beamlet-compile-footprint paints the first thread only, so a helper's peak is unmeasured. Lever: the runtime places every spawned stack with an unmapped page below it, by whichever the ABI allows without a kernel change: a mapping of stack_pages + 1 whose lowest page is given back (unmapped) before the thread starts, or a fixed placement leaving a hole below (map_anon's area, memory-layout.md); the guard costs no frame, one page of address space; the sentence on thread.rs and native.md says so and the 'no guard page' sentence goes. The painted-stack measurement (MEM1's launcher) extends to spawned stacks so beamlet-compile-footprint and the memory scan report each scheduler's peak, and SCHEDULER_STACK_PAGES is sized from the largest. Gates: a host test and a boot case thread-stack-guard: a spawned thread overflows on purpose and the kernel's fault line names it at the guard, the process ending there, no later crash; beamlet-footprint and beamlet-compile-footprint both widths with the helper peaks quoted; the rt host tests; the kernel's address-space cases unchanged. Files: libs/rt/src/thread.rs, libs/rt/src/buffer or map, tools/testbench's memory scan, docs/userland/native.md, docs/userland/beamlet.md. Tier A (libs/rt, every program's threads): steward-red-2. Size S."
  state = "done"
  revision = 273

