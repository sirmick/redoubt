  parent = "M1"
  body = "Trains 4 and 5 (2026-10-07), both widths, deterministic: the case expects '... ssh exited (status 255), expected 0; last output: Host key verification failed.' and gets '... last output: Error: Broken pipe (os error 32)': ssh refuses the pinned key and exits 255 as intended, but the loopback sshd's ProxyCommand side writes its broken-pipe error after ssh's own last line, so the bench's 'last output' is the wrong process's. Tier B, size S: the session runner's failure text names ssh's exit status and the last line ssh itself wrote (stderr of the ssh process, not the ProxyCommand's), or must_fail matches the host-key line anywhere in the session's output; the bench's own test for the runner's text; rerun the case both widths and the 13 other loopback cases."
  state = "done"
