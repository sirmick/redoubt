[[node]]
  id = "B71"
  title = "beamlet's :binary.match tries every pattern at every byte and rebuilds the pattern list per call: the shell's control pattern growing 70 -> 88 entries cost shell-output-rate 5-8 %"
  template = "package"
  parent = "M2"
  needs = ["B69"]
  body = "From B69's gates (.wash/local/B69-report.md 'Follow-ons'): adding 18 entries to the shell's control pattern (70 -> 88) cost shell-output-rate 5-8 % on both widths (ascii 34,500 -> 32,100 B/s rv64); on the BEAM the two patterns cost the same. Cause, by reading userland/otp/vm/src/bif/binary.rs: `find` (:151) tests every pattern at every byte, O(len x patterns x pattern length); `patterns` (:126) re-collects the list into fresh Vecs on every call, and `compile_pattern` (:190) only wraps the list in {bm, P}, so a compiled pattern buys nothing; `bytes_of` copies the haystack per call too. The escaping path (Text.visible, the terminal guard) runs this on every piece, so every pattern the guard gains costs the shell's output rate. Lever: `compile_pattern` builds a real matcher the VM keeps (a resource or an opaque term the BIF recognises): a first-byte table (256 entries, each the patterns starting with that byte, longest first) is enough for the guard's single-code-point patterns and keeps leftmost-longest; Aho-Corasick if the table does not reach O(len) on the realistic page. An uncompiled pattern list builds the matcher per call (BEAM does the same). The haystack is read in place, not copied, where the term is one contiguous binary. Gates: a host measurement in userland/otp/vm tests (match over 64 KiB with 1, 8, 88 patterns: time per byte flat in the pattern count, quoted before/after); the binary difftests agree with BEAM on match/matches/split/replace, leftmost-longest and scope included; shell-output-rate's four rates re-measured on the machine both widths, the gain quoted in shell.md's profile bullet beside B64's, and the floors raised only if two runs agree; beamlet.md names compile_pattern as a real compile. Files: userland/otp/vm/src/bif/binary.rs and its tests, shell.md, beamlet.md's BIF notes; none of B50's or B69's once B69 merges. Tier A (the escaping path's rate depends on it): steward-red-2. Size S-M."
  state = "done"
  revision = 181
  overrides = ["2026-10-15: started by Orchestrator before B69 (active): B71's need on B69 is the final rate measurement only; the files are disjoint (binary.rs vs the shell's text.ex), so the matcher work starts now and the shell rates are taken after B69 merges"]

