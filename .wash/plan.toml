[[node]]
  id = "MEM2"
  title = "Each server's heap capped in the manifest, enforced by the runtime's allocator"
  template = "package"
  parent = "M1"
  needs = ["MEM1", "ABI1"]
  body = "Owner (2026-10-03; Redoubt-side seam for an outside no-MMU variant: keep small). Brief: .wash/local/MEM2-implementer.md. Size S+ (the startup block's version and the consumer sweep it forces). Needs MEM1 (scan, tag, manifest checks) and ABI1 (rt's seam).\n\nManifest key heap_pages (absent = no cap; refused 0, or heap + stack at/above the budget's pages). The startup block, version 2, gains heap_pages and tag; rt sets the cap before main. The cap is rt's ceiling below the kernel budget: pages the allocator holds, refused (null) before any map_anon, counted as mapped, not committed; the budget still bounds stacks, Buffers, lends, tables. Past the cap an infallible allocation panics (exit 101, init's restart rule); a fallible one sees the error. A heap record (magic, tag, cap, peak) in data, found by MEM1's scan; the bench fails a cap under twice the peak. Image servers get measured caps. beamlet's budget_pages= todo is not this package's.\n\nAcceptance: rt host tests over the fake (refusal with no map_anon), startup v2/v1, init tests; a tests/programs case capped low; heaps reported by MEM1's memory case both widths. Pages: init.md, budgets.md, native.md, testbench.md."
  state = "done"
  revision = 2
  overrides = ["2026-10-05: started by Orchestrator before MEM1 (reported): MEM1 is reported and final (cd73175b5, six scans PASS, awaiting its whole bench and panel); MEM2 branches from MEM1's head and rebases onto main once MEM1 merges", "2026-10-05: started by Orchestrator before MEM1 (active): MEM1 is final and rebasing for its bench; MEM2 builds on MEM1's head and rebases after MEM1 merges", "2026-10-05: started by Orchestrator before MEM1 (active): MEM1 is at its final head cfad0b83d awaiting acceptance; MEM2 rebases onto it now so its review can start", "2026-10-06: started by Orchestrator before MEM1 (active): MEM2's review runs on content now; it merges after MEM1, whose head it is built on", "2026-10-06: started by Orchestrator before MEM1 (active): MEM2's fix round runs on content now; it merges after MEM1, whose head it is built on"]

[[node]]
  id = "VOL1"
  title = "Verified volumes: verityd checks every block of a read-only volume against a hash tree whose root the signed manifest pins"
  template = "package"
  parent = "M1"
  needs = ["BEAM2"]
  body = "Brief: .wash/local/VOL1-implementer.md (architect-14). Tier A, size M+ (pinned root M, signed-root step +S). RULED by the owner 2026-10-03: verifier server; BEAM2 lands as built, then VOL1 deletes system.index and beamlet's check; decision 5 reversed (readers trust their verifying servers). Start from main after BEAM2 merges. QA: VOL1-verified-volumes.\n\nStep 1, pinned root: libs/verity (no_std, forbid(unsafe_code), sha2; dm-verity tree after the fs blocks; root = SHA-256(0x02||N||top)) pinned in the volume's manifest entry, signed with the bundle (R15). servers/verityd between blkd and fsd: serves blkd's protocol read-only to the volume's fsd, verifies each block first; mismatch = failed (fsd: corrupt); bad root/truncated: info answers, reads fail, stays up. fsd, littlefs, blkd untouched. init: volumes `verity`, fsd's badge at the verifier, confinement users gain it. Re-aims BEAM2 (plain files, R75 over new R76).\n\nStep 2, signed root: a root block at the range's end (N, version, root, Ed25519 under new domain redoubt.volume.v1 in libs/signing, ed25519-compact); manifest key (hex or \"bundle\") + floor instead of root; verityd refuses a bad signature or version < floor; the packer signs when the recipe names a key (build host only, R35). Image's userland volume stays pinned. SHA-256 tree already detects every bit error (CRC stays under it); no correction.\n\nAcceptance, both widths: verity-flipped-block, -flipped-tree, -wrong-root, userland-boot via verityd; verity-signed, -bad-signature, -rollback; host tests of verity, verityd, init, signing domain, packer determinism. Measured: extra calls, cache hits, boot-to-prompt with/without. Pages: verityd.md (R76), init.md, fsd.md, blkd.md, boot.md (R75, volume domain), beamlet.md, packages.md, testbench.md, SECURITY.md, image/README.md. Hotspot: MEM1."
  state = "done"
  revision = 2

[[node]]
  id = "BEAM6"
  title = "The shell's VM on a diet: its idle footprint measured, then cut until the image fits 512 MiB"
  template = "package"
  parent = "M2"
  needs = ["BEAM2", "MEM2"]
  body = "Brief: .wash/local/BEAM6-implementer.md. Tier A (the VM, the shell's start, the image), size M, needs BEAM2 and MEM2 (merged): start from main. Today the VM's budget holds 11,877 pages (rv64) / 7,554 (rv32) at the prompt, its runtime heap 11,814 / 6,966: the heap is the footprint. Step 1 measures a breakdown the VM prints under an argument (code per module with size_of::<Instr>, atoms, literals, process heaps live and held, ETS, binaries, loader copies, runtime pages held vs accounted), on the host then in a case beamlet-footprint with the memory scan as the verdict; checkpoint 1 with the table and ranked levers. Step 2: lazy loading in the shell's start, no second copy of a module's chunks, compact code only if it is a third of the heap (else proposed as its own package), smaller heaps and a shrinking collector, free-but-held pages (libs/rt by permission). Step 3: the owner's targets, the image at 512 MiB (VM about 10,000 pages rv64) or 256 MiB (about 2,700); manifest, memory_mib lines, README, budgets.md, testbench.md's table and beamlet.md's new breakdown subsection move with the target met; checkpoint 2 if missed. Short gate plus the beamlet and verity cases at the new RAM. Code-page sharing between VMs is for sessions, not here."
  state = "done"
