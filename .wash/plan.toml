[[node]]
  id = "B68"
  title = "beamlet's crypto natives run modpow on operands of any size up to the 2^24-bit bignum limit: a hostile key file or DH parameter holds a scheduler thread for minutes"
  template = "package"
  parent = "M2"
  body = "docs/todo/beamlet-bignum-bounds.md: `crypto:mod_pow/3`, `generate_key(dh, ...)` and `compute_key(dh, ...)` (userland/otp/crypto/src/pk.rs:155 dh_params, :177, :193, :202) run num-bigint's modpow on the caller's numbers, bounded only by the VM's bignum limit (2^24 bits). A native is not preempted by reductions: a megabyte modulus and exponent hold the scheduler thread, and every process on it, for minutes; it stays inside the session (budget weight shares the CPU) but a key file or peer parameter the session reads can hang its tools, as RSA keys did before from_components checked sizes. Lever: hold P and the modulus to a stated width (OpenSSL's OPENSSL_DH_MAX_MODULUS_BITS is 10,000 bits; RSA's limit here is 8,192), and each exponent and base to the modulus's width, before any modpow; an oversized operand is refused as the RSA size refusal is, never a panic. Gates: a host test per native with an oversized modulus and exponent showing the refusal comes at once (under 10 ms where the unbounded call takes seconds; measure the negative once and quote it); the crypto difftests still agree with BEAM on every in-range vector; the bound stated in beamlet.md 'Limits inside one VM' beside the RSA size, and the todo page deleted in the same commit. Files: userland/otp/crypto, its tests, beamlet.md's limits table (B50 edits beamlet.md's Life section: rebase, no overlap in lines). Tier A (a session's liveness against hostile input): steward-red-2. Size S."
  state = "done"
  revision = 161

