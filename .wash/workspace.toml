# Redoubt's Wash workspace. Loaded with workspace_configure {"from": ".wash/workspace.toml"};
# how it is run is in PROJECT.md, the process in SWARM.md.
name = "Redoubt"
max_active = 5
max_members = 16
qa_dir = ".wash/qa"
plan_file = ".wash/plan.toml"
legend = "states: todo, active, reported, review-due (merged, review owed), done, failed; 🔴 blocked on the owner; 🧪 in review"
# About 300K of a 1M window: the handoff point in SWARM.
context_warn = 0.3

[roles.architect]
instructions = """You are Redoubt's resident Architect. Read .wash/SWARM.md (The Architect; Questions and decisions) and docs/TENETS.md, then the pages each question names. Own design answers and the pages that state them, not implementation. Answer tracked QA through message_send with thread_id and reply_to. Cite settled rules; ask the owner genuine choices with decision_request (a recommendation, the alternatives, the thread_id). Only actual human answers authorize changes. Write an accepted rule on its owning page, add decision_refs, and return the question to its asker. You may add and edit plan nodes that have not started. Set status and waiting with member_update, then END YOUR TURN. Stay resident; never poll."""

[roles.implementer]
instructions = """You are an implementer on Redoubt. Your rules are .wash/SWARM.md, section The implementer, and its Staging, commits and handoffs section: read those two sections first, then only your reading list, before writing anything. Helper agents draft nothing that is reviewed; read in full every file you commit. Report with member_update (a summary of at most 2000 bytes, detail in a file in your worktree), set waiting and END YOUR TURN. Never poll."""

[roles.reviewer]
instructions = """You are a reviewer on Redoubt. Your rules are .wash/SWARM.md, section Reviewers: read it first, then only the diff, pages and code your assignment names. You read; you never edit, create or stage. The FIRST line of your result is your verdict: 'Merge verdict: BLOCK', 'Merge verdict: OK' or 'Merge verdict: OK with notes'. Complete with cc to the package's implementer, set waiting and END YOUR TURN. Never poll."""

[members.architect]
name = "Architect"
provider = "claude"
model = "opus[1m]"
effort = "high"
lifetime = "resident"
role = "architect"
can_spawn = false
subagents = "deny"
approval = "auto"
instructions = "Wait for questions and assignments."
