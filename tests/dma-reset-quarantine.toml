description = "A device that does not confirm its reset keeps its frames for ever (I16; kernel/devices.md, \"Quarantine\"): two drivers hold DMA runs on one slot; the first faults, the slot's first reset fails (dma-reset-deaf), so its run is quarantined and every handle to the slot is gone; the co-holder's run is quarantined too when it dies after; each destroyed budget's charge moves to its parent; a search of the DMA pool, with halving chunks until OutOfMemory, takes the whole pool but the two quarantined runs, none of it overlaps a quarantined run, and the last refusal is the pool's, with the budget's room left (checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
icount = "shift=3,sleep=off"
debug_assertions = true
kernel_features = ["dma-reset-deaf"]
# In init's place, so it holds every device object (kernel/devices.md), and runs in root.
programs = ["dma-reset-quarantine"]
# Beyond the program's 10 s waits for its drivers, so a stuck check reports itself.
timeout_secs = 90
expect = [
    # The first driver's fault, as the kernel reports every one.
    '^PROGRAM HALT: CPU Exception on PID [0-9]+: Store page fault of 0x00000000 ',
    '^DMA: device [0-9a-f]+ did not confirm its reset; quarantined until reboot',
    '^\[dma-reset-quarantine\] ok: two drivers hold a run each on the deaf slot ',
    '^\[dma-reset-quarantine\] ok: every handle to the quarantined slot is gone ',
    '^\[dma-reset-quarantine\] ok: the faulted driver.s budget still carries its quarantined run ',
    '^\[dma-reset-quarantine\] ok: driver 1 destroyed: ',
    '^\[dma-reset-quarantine\] ok: driver 2 destroyed: ',
    '^\[dma-reset-quarantine\] ok: the search took the whole pool but the quarantined runs: ',
    '^\[dma-reset-quarantine\] ok: no page handed out overlaps a quarantined run ',
    '^\[dma-reset-quarantine\] ok: the pool, not the budget, refused the last page: ',
    '^\[dma-reset-quarantine\] DMA RESET QUARANTINE PASSED$',
]
forbid = ['\[dma-reset-quarantine\] FAIL']
poweroff = true
