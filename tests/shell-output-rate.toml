description = "The shell's encoder draws printed text, and a long line being edited, at a stated rate on the machine (docs/userland/shell.md, \"The terminal library\"): at alice's console prompt, Redoubt.Term draws a 256 KiB line of ASCII and one of Cyrillic as it draws IO.puts, made visible, measured and encoded, then 64 KiB of a page of 82-byte lines of English with one CJK word, one emoji and one accented name each and the same page in ASCII alone, and then draws again a line of 400 characters wrapped over six rows as one typed in its middle does, each timed by the session's own clock in guest time with no output in the timing. The shell prints the two lines' rates and whether each is at or above 12,000 bytes a second, under half what either width draws (rv32 the slower: 31,400 ASCII, 41,000 UTF-8; main's encoder drew 599 and 1,207); the two pages' rates and whether they are at or above 6,500 and 12,000 (rv32 draws 7,800 and 16,500 here; with a per-line prologue the encoder once paid, about 6,000 and 9,400); and the least of three redraws' time and whether it is within 250 ms (124 ms at most, on rv32; main's took 1.84 s). The verdicts are the shell's lines on the console (rule F)"
arch = ["rv64", "rv32"]
kind = "boot"
recipe = "image/boot.toml"
# The image needs 1 GiB: the principals' budgets, each holding a shell VM's session, do not fit
# the users budget 256 MiB leaves (docs/kernel/budgets.md).
memory_mib = 1024
# Guest time, so a rate is the machine's instructions, not the loaded host's: sleep on, for the
# disk. Nothing timed waits on a device.
icount = "shift=3"
# The slowest pass alone, rv32, takes about 20 s.
timeout_secs = 60
expect = [
    '^init: the boot is done: ',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
    '^\[con [0-9a-f]{16}\] rates: ascii [0-9]+ B/s, utf8 [0-9]+ B/s: at the floors$',
    '^\[con [0-9a-f]{16}\] pages: mixed [0-9]+ B/s, ascii [0-9]+ B/s: at the floors$',
    '^\[con [0-9a-f]{16}\] redraw: [0-9]+ us: within the bound$',
]
forbid = [
    'init: refused the boot',
    'init: rebooting',
    '^init: .* (exited|faulted|was killed)',
    'init: restarted',
    'EXCEPTION',
    'below the floors',
    'over the bound',
]

# One line, ASCII as typed: d draws a text as the console's driver draws a print, slice by slice,
# and returns its rate in bytes a second of the session's clock. The echo holds the verdict's
# words apart, which the patterns do not match.
[[input]]
after = '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir '
send = "d = fn s -> t = System.monotonic_time(:microsecond); term = Redoubt.Term.new(80, 24); Enum.reduce(Redoubt.Term.slices(term, {:put_chars, :unicode, s}, 65_536), term, fn r, term -> elem(Redoubt.Term.request(term, r), 1) end); div(byte_size(s) * 1_000_000, max(System.monotonic_time(:microsecond) - t, 1)) end; a = d.(String.duplicate(\"z\", 262_144)); u = d.(String.duplicate(\"\\u043f\\u0440\\u0438\\u0432\\u0435\\u0442 \", 20_165)); IO.puts(\"rates: ascii #{a} B/s, utf8 #{u} B/s: \" <> if(a >= 12_000 and u >= 12_000, do: \"at\", else: \"below\") <> \" the floors\")\n"

# Then the pages, shell-text-profile's texts: 64 KiB of 82-byte lines, each with one CJK word, one
# emoji and one accented name, and the same page in ASCII alone. Every line is a piece of the
# draw, so these floors hold the cost a piece pays before its runs; they stand closer to the
# rates than the lines' do (1.2 and 1.4 on rv32) because they trap the prologue the encoder once
# paid a piece, which drew the pages at about 6,000 and 9,400 on rv32 here.
[[input]]
after = '^\[con [0-9a-f]{16}\] rates: '
send = "pages = fn l -> String.duplicate(l, div(65_536, byte_size(l))) end; p = d.(pages.(\"The quick brown fox jumps over the lazy dog near \\u4e16\\u754c, says Jos\\u00e9 \\u{1F642} at noon.\\n\")); q = d.(pages.(\"The quick brown fox jumps over the lazy dog near Beijing, says Josef :-) at noon.\\n\")); IO.puts(\"pages: mixed #{p} B/s, ascii #{q} B/s: \" <> if(p >= 6_500 and q >= 12_000, do: \"at\", else: \"below\") <> \" the floors\")\n"

# Then a line being edited: 400 characters after the prompt, wrapped over six rows of 80, the
# cursor in its middle, and one character typed there, which draws the whole line again: the least
# of three, so a collection of the garbage building the line left is not timed as the redraw.
[[input]]
after = '^\[con [0-9a-f]{16}\] pages: '
send = "l = Enum.reduce([:new_prompt, {:insert_chars, :unicode, \"/ (2)> \"}, {:insert_chars, :unicode, String.duplicate(\"x\", 400)}, {:move_rel, -200}], Redoubt.Term.new(80, 24), fn r, m -> elem(Redoubt.Term.request(m, r), 1) end); r = fn -> t = System.monotonic_time(:microsecond); Redoubt.Term.request(l, {:insert_chars, :unicode, \"y\"}); System.monotonic_time(:microsecond) - t end; k = Enum.min([r.(), r.(), r.()]); IO.puts(\"redraw: #{k} us: \" <> if(k <= 250_000, do: \"within\", else: \"over\") <> \" the bound\")\n"

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
