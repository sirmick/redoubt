description = "A vault session filling its share at a shared server leaves its owner's unlabelled session's turn and cap unaffected (docs/plan/m3-agents.md, \"A scripted hostile user\"; docs/kernel/ipc.md, R2; docs/servers/steward.md, R37): the image boots with sshd on port 22. Alice's unlabelled session seeds a file in her home on the data volume; her vault session, alice+alice-secrets, which may read the unlabelled volume but write nothing to it, spawns MAX_WAITERS (6) processes reading that file without end, so the vault's calls queue at walfsd:data without pause. R2 keys a group by account and label set, so the vault's {alice-secrets} group and the unlabelled {} group of the one principal share neither a turn nor a cap, and R26 keys their admission buckets apart the same way: the unlabelled session reads and writes its home throughout, each operation returning within the bound, the same bound walfsd-flood-turn measures for a flood from a second principal. The verdicts are the sizes the unlabelled shell prints within the bound (rule F); the vault shell shows only its process count. Every printed value is tagged so a pattern matches the printed value and never the echo of the line typed"
arch = ["rv64", "rv32"]
kind = "boot"
recipe = "image/boot.toml"
# The image needs 1 GiB: the principals' budgets, each holding a shell VM's session, do not fit
# the users budget 256 MiB leaves (docs/kernel/budgets.md).
memory_mib = 1024
# A vault login and an unlabelled login, each a shell VM, then the vault floods while the
# unlabelled session runs eight probes.
timeout_secs = 1500
expect = [
    '^init: started sshd, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] sshd: listening on port 22$',
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] steward: audit 1001/\{\} at [0-9]+: Login ',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
]
forbid = [
    'init: refused the boot',
    'init: rebooting',
    '^init: .* (exited|faulted|was killed)',
    'init: restarted',
    'EXCEPTION',
    'steward: a step failed',
    'sshd: login .*: refused',
]

# Alice's unlabelled session, the victim: it seeds the file the vault reads, then runs probes once
# the vault floods. Each probe overwrites one 64 KiB file in her home and reads it back, printing the
# operation's own elapsed ms, which is the verdict: under 4,000, the same bound walfsd-flood-turn
# uses for a second principal's flood, since R2 and R26 key the vault's {alice-secrets} group apart
# from this unlabelled one: twice the worst single probe operation measured once per width under
# the vault's flood (1.42 s on rv64, 1.52 s on rv32), rounded up to a second, the bench's rule for
# a measured bound, and far below a starved operation. The 20 s step bound is the bench's margin
# for the line to arrive over ssh on a loaded host, no part of the claim. A probe over 4,000 ms is
# the finding (R2 or R37 broken), never retried and never loosened.
# The worsts were measured with the disk flushing to the host's file (QEMU's default cache);
# the bench's disks no longer do (docs/testbench.md "Disks and network cards"), so the bound is
# looser than its rule against what a probe now costs: it is re-measured at the next train, and
# does not move until then.
[[session]]
user = "alice"
forbid = ['\*\* \(']
steps = [
    { expect = '/home/alice \([0-9]+\)> ' },
    { send = "d = :binary.copy(<<0>>, 65536); File.write!(\"/home/alice/flood\", d); probe = fn n -> t = System.monotonic_time(:millisecond); File.write!(\"/home/alice/probe\", d); s = byte_size(File.read!(\"/home/alice/probe\")); {n, s, System.monotonic_time(:millisecond) - t} end; {:seeded, byte_size(d)}\n" },
    { expect = '\{:seeded, 65536\}' },
    { mark = "seeded" },
    { wait = "flooding" },
    { send = "probe.(1)\n" },
    { within = 20 },
    { expect = '\{1, 65536, [0-3]?[0-9]{1,3}\}' },
    { send = "probe.(2)\n" },
    { within = 20 },
    { expect = '\{2, 65536, [0-3]?[0-9]{1,3}\}' },
    { send = "probe.(3)\n" },
    { within = 20 },
    { expect = '\{3, 65536, [0-3]?[0-9]{1,3}\}' },
    { send = "probe.(4)\n" },
    { within = 20 },
    { expect = '\{4, 65536, [0-3]?[0-9]{1,3}\}' },
    { send = "probe.(5)\n" },
    { within = 20 },
    { expect = '\{5, 65536, [0-3]?[0-9]{1,3}\}' },
    { send = "probe.(6)\n" },
    { within = 20 },
    { expect = '\{6, 65536, [0-3]?[0-9]{1,3}\}' },
    { send = "probe.(7)\n" },
    { within = 20 },
    { expect = '\{7, 65536, [0-3]?[0-9]{1,3}\}' },
    { send = "probe.(8)\n" },
    { within = 20 },
    { expect = '\{8, 65536, [0-3]?[0-9]{1,3}\}' },
    { mark = "alice-done" },
    { exit = 0 },
]

# Alice's vault session, the attacker: labelled {alice-secrets}, it reads the unlabelled file
# without pause from MAX_WAITERS processes, filling its own bucket and share at walfsd:data. It
# writes nothing to the unlabelled volume (it cannot) and its shell reports only its process count.
[[session]]
user = "alice+alice-secrets"
pty = true
steps = [
    { wait = "seeded" },
    { expect = '\([0-9]+\)> ' },
    { send = "n = (for _ <- 1..6, do: spawn(fn -> Stream.repeatedly(fn -> File.read(\"/home/alice/flood\") end) |> Enum.each(fn _ -> :ok end) end)) |> length(); {:flooding, n}\n" },
    { expect = '\{:flooding, 6\}' },
    { mark = "flooding" },
    { wait = "alice-done" },
    { exit = 0 },
]

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
forward = [22]
