description = "The legacy ReturnToParent outside any callback is refused, and a jump to a callback's return with none running is a plain fault (WP-K5); after each: a process that makes it and then spins is still destroyed at its lease's deadline, on time; the steward's stand-in still gets the CPU and destroys another such caller's budget; Redoubt calls keep working; nothing panics (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["callback-state-attack"]
timeout_secs = 60
expect = [
    '^\[callback-state\] ok: calibration destroy took \d+ µs$',
    '^\[callback-state\] ok: ReturnToParent refused, a Redoubt send after it delivered, the legacy Yield came back',
    '^\[callback-state\] ok: after ReturnToParent: the lease was destroyed by its deadline',
    '^\[callback-state\] lateness ok \(after ReturnToParent',
    '^\[callback-state\] ok: after ReturnToParent: the steward stand-in destroyed',
    '^\[callback-state\] ok: after ReturnToParent: Redoubt calls still served$',
    '^\[callback-state\] ok: a jump to a callback.s return with none running is a plain fault$',
    '^\[callback-state\] ok: after the jump: the lease was destroyed by its deadline',
    '^\[callback-state\] lateness ok \(after the jump',
    '^\[callback-state\] ok: after the jump: the steward stand-in destroyed',
    '^\[callback-state\] ok: after the jump: Redoubt calls still served$',
    '^CALLBACK-STATE-ATTACK TEST PASSED$',
]
forbid = ['\[callback-state\] FAIL', '\[callback-state\] lateness LATE', 'panicked', 'KERNEL FAILURE']
poweroff = true
