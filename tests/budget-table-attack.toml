description = "Exhausting the handle table ends in TooLarge at MAX_HANDLES = 4096 (32 pages of 128), each page charged to the holder's budget and freed when emptied or swept; system keeps serving"
arch = ["rv64", "rv32"]
kind = "boot"
# PID 2 log-server; PID 3 budget-victim, the first program started, holding the boot endpoint's
# receive right and `system`; PID 4 the attacker, holding `users` (slot 4), never a device. Each
# runs in a budget of its own under `system`.
programs = [
    "log-server",
    { bin = "budget-victim", budgets = ["system"] },
    { bin = "budget-table-attack", budgets = ["users"] },
]
timeout_secs = 30
# The attacker fills its table with revocation scopes until the kernel refuses, closes the last
# page and reopens it, then destroys the pool, which closes
# every scope. A table grown without bound, or a page index past the table, would take the
# kernel down; the verdict is the victim's pages and its DONE and the power-off. The attacker's
# lines pin the limit and the charge (63 pages beyond the one it had, 64 handles a page) as progress.
expect = [
    '^\[server\] started budget-table-attack as pid 4$',
    '^\[pid 4\] \[table\] filled to handle 4096, then TooLarge; the pool paid \d+ pages \(one per scope\)$',
    '^\[pid 4\] \[table\] its own budget paid 63 pages for the table$',
    '^\[pid 4\] \[table\] closed 4033..=4096: true; reopened -> Ok\(4033\)$',
    '^\[pid 4\] \[table\] destroyed the pool -> Ok\(\(\)\); its own usage back where it was: true$',
    '^\[pid 4\] \[table\] every swept index is empty: true$',
    '^\[pid 4\] \[table\] attempts done$',
    '^\[pid 3\] \[victim\] mapped and touched 64 pages after the attack; every budget it holds within its limits: true$',
    '^\[server\] done: reported by pid 3; still serving$',
]
forbid = ['BREACH']
poweroff = true
reporter = "budget-victim"
