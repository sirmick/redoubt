description = "Exhausting the handle table ends in TooLarge at MAX_HANDLES = 4096 (32 pages of 128), each page charged to the holder's budget and freed when emptied or swept; system keeps serving"
arch = ["rv64", "rv32"]
kind = "boot"
# PID 2 log-server; PID 3 budget-victim, second, in system beside the attacker and holding the
# boot endpoint's receive right; PID 4 the attacker, whose first act is to take root, system
# and users from log-server (TAKE_GIFTS; never a device).
programs = ["log-server", "budget-victim", "budget-table-attack"]
timeout_secs = 30
# The attacker fills its table with revocation scopes until the kernel refuses, closes the last
# page and reopens it, then destroys the pool, which sweeps
# every scope. A table grown without bound, or a page index past the table, would take the
# kernel down; the verdict is the victim's pages and its DONE and the power-off. The attacker's
# lines pin the limit and the charge (31 pages beyond the one it had) as progress.
expect = [
    '^\[server\] gifts given to pid 4$',
    '^\[pid 4\] \[table\] filled to handle 4096, then TooLarge; the pool paid \d+ pages \(one per scope\)$',
    '^\[pid 4\] \[table\] system paid 31 pages for the table$',
    '^\[pid 4\] \[table\] closed 3969..=4096: true; reopened -> Ok\(3969\)$',
    '^\[pid 4\] \[table\] destroyed the pool -> Ok\(\(\)\); system usage back where it was: true$',
    '^\[pid 4\] \[table\] every swept index is empty: true$',
    '^\[pid 4\] \[table\] attempts done$',
    '^\[pid 3\] \[victim\] mapped and touched 64 pages in system after the attack$',
    '^\[server\] done: reported by pid 3; still serving$',
]
forbid = ['BREACH']
poweroff = true
reporter = "budget-victim"
