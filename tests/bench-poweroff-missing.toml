description = "Bench self-check: `poweroff = true` fails a guest that passes its expectations but never powers off"
arch = ["rv64"]
kind = "boot"
icount = "shift=3,sleep=off"
programs = ["log-server", "ipc-client"]
timeout_secs = 3
# A self-check of the bench's poweroff rule, not of the kernel: its 3 s bound was set for the run
# at one hart, and at two log-server and ipc-client, one budget, hand each call across the harts
# (kernel/scheduling.md, "Residual risks").
keep_smp = true
expect = ['IPC TEST PASSED']
poweroff = true
must_fail = '^timed out waiting for the guest to power off$'
