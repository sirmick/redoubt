description = "Syscall arguments that once panicked the kernel are clean errors: a failed heap grow does not corrupt the heap, and an oversized lend does not underflow (verdict: survival only)"
arch = ["rv64", "rv32"]
kind = "boot"
# PID 2 log-server; PID 3 syscall-attack; PID 4 attack-checker.
programs = ["log-server", "syscall-attack", "attack-checker"]
timeout_secs = 30
# Each attempt once reached a panic (heap grow rolled forward then a shrink `.expect()`; a
# message-region size underflow). PANIC is always forbidden; the verdict is the checker's clean
# power-off under its own PID, which a panicked kernel never reaches. The attacker's lines are
# progress only, and pin the error kind, so a refusal for the wrong reason fails.
expect = [
    '^\[pid 3\] \[syscall\] heap grow W\+X -> Err\(InvalidArgument\); shrink -> Err\(OutOfMemory\)$',
    '^\[pid 3\] \[syscall\] oversized lend -> Err\(BadAddress\)$',
    '^\[pid 4\] \[checker\] PID 3 reported; the kernel still serves',
]
forbid = ['BREACH']
poweroff = true

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]

[[grant]]
program = "attack-checker"
mmio = ["0x100000:0x1000"]
