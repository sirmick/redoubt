description = "init refuses a manifest that hands a server a root badge at consoled, whose lines would come out bare: one line saying where and why, then a power-off reporting a system failure (system_reset kind 3, status 255), before any server runs"
arch = ["rv64", "rv32"]
kind = "boot"
# The real init, the images its manifest names, and the manifest: image/manifest.json with netd
# handed a badge at consoled's endpoint. The verdict is init's line and the firmware's status,
# which only system_reset kind 3 gives.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
]
timeout_secs = 30
expect = ['^init: refused the boot: servers\[4\]\.handed\[1\]\.endpoint: only init holds a root badge at consoled$']
forbid = ['^init: started']
poweroff = true
poweroff_status = 255

[[file]]
name = "manifest"
from = { path = "tests/data/init/consoled-handed.json" }
