description = "Endpoint flooding at walfsd, and Alice is still served in her turn (docs/plan/m3-agents.md, \"A scripted hostile user\"; docs/kernel/ipc.md, R2; docs/servers/serving.md, R26): the image boots with sshd on port 22. Bob's session seeds a file in his home on the data volume, then spawns MAX_WAITERS (6, docs/userland/io, a VM hub's waiter slots) processes each reading it without end, so bob's VM holds every hub place it can and his group's calls queue at walfsd:data without pause. Alice's session, a separate principal and so a separate waiting group, writes and reads her own home on the same walfsd throughout: each of her operations returns within the bound, her shell printing the size it read back. R2 serves the group waiting longest and keys bob and alice apart by account, and R26 gives alice's badge its share of walfsd's admission, so bob's flood never takes alice's turn. The verdicts are the sizes alice's shell prints within the bound (rule F); bob's shell shows only that it is flooding (its process count). Every printed value is tagged so a pattern matches the printed value and never the echo of the line typed"
arch = ["rv64", "rv32"]
kind = "boot"
recipe = "image/boot.toml"
# The image needs 1 GiB: the principals' budgets, each holding a shell VM's session, do not fit
# the users budget 256 MiB leaves (docs/kernel/budgets.md).
memory_mib = 1024
# Two logins, each a shell VM, then a sustained flood while alice runs eight probes.
timeout_secs = 1500
expect = [
    '^init: started sshd, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] sshd: listening on port 22$',
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] steward: audit 1001/\{\} at [0-9]+: Login ',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
]
forbid = [
    'init: refused the boot',
    'init: rebooting',
    '^init: .* (exited|faulted|was killed)',
    'init: restarted',
    'EXCEPTION',
    'steward: a step failed',
    'sshd: login .*: refused',
]

# Alice, the victim: a separate principal and so a separate waiting group at walfsd:data. Each probe
# overwrites one 64 KiB file in her home and reads it back, printing the operation's own elapsed ms.
# The verdict is the operation's own elapsed ms, printed by the probe: under 4,000, twice the worst
# single probe operation measured once per width under bob's flood (1.87 s on rv64, 1.54 s on
# rv32), rounded up to a second, the bench's rule for a measured bound; far below a starved
# operation, which would not return while bob floods without end. The 20 s step bound is the
# bench's margin for the line to arrive over ssh on a loaded host, no part of the claim. A probe
# over 4,000 ms is the finding (R2 or R26 broken), never retried and never loosened.
# The worsts were measured with the disk flushing to the host's file (QEMU's default cache);
# the bench's disks no longer do (docs/testbench.md "Disks and network cards"), so the bound is
# looser than its rule against what a probe now costs: it is re-measured at the next train, and
# does not move until then.
[[session]]
user = "alice"
forbid = ['\*\* \(']
steps = [
    { expect = '/home/alice \([0-9]+\)> ' },
    { send = "d = :binary.copy(<<0>>, 65536); probe = fn n -> t = System.monotonic_time(:millisecond); File.write!(\"/home/alice/probe\", d); s = byte_size(File.read!(\"/home/alice/probe\")); {n, s, System.monotonic_time(:millisecond) - t} end; {:setup, byte_size(d)}\n" },
    { expect = '\{:setup, 65536\}' },
    { wait = "flooding" },
    { send = "probe.(1)\n" },
    { within = 20 },
    { expect = '\{1, 65536, [0-3]?[0-9]{1,3}\}' },
    { send = "probe.(2)\n" },
    { within = 20 },
    { expect = '\{2, 65536, [0-3]?[0-9]{1,3}\}' },
    { send = "probe.(3)\n" },
    { within = 20 },
    { expect = '\{3, 65536, [0-3]?[0-9]{1,3}\}' },
    { send = "probe.(4)\n" },
    { within = 20 },
    { expect = '\{4, 65536, [0-3]?[0-9]{1,3}\}' },
    { send = "probe.(5)\n" },
    { within = 20 },
    { expect = '\{5, 65536, [0-3]?[0-9]{1,3}\}' },
    { send = "probe.(6)\n" },
    { within = 20 },
    { expect = '\{6, 65536, [0-3]?[0-9]{1,3}\}' },
    { send = "probe.(7)\n" },
    { within = 20 },
    { expect = '\{7, 65536, [0-3]?[0-9]{1,3}\}' },
    { send = "probe.(8)\n" },
    { within = 20 },
    { expect = '\{8, 65536, [0-3]?[0-9]{1,3}\}' },
    { mark = "alice-done" },
    { exit = 0 },
]

# Bob, the attacker: he seeds a file and floods walfsd:data with MAX_WAITERS reading processes, each
# looping without pause, so his VM holds every hub place and his group never stops queuing at
# walfsd. His shell reports only the count it spawned; the verdict is alice's, not his.
[[session]]
user = "bob"
steps = [
    { expect = '\([0-9]+\)> ' },
    { send = "f = :binary.copy(<<0>>, 65536); File.write!(\"/home/bob/flood\", f); {:seeded, byte_size(f)}\n" },
    { expect = '\{:seeded, 65536\}' },
    { send = "n = (for _ <- 1..6, do: spawn(fn -> Stream.repeatedly(fn -> File.read(\"/home/bob/flood\") end) |> Enum.each(fn _ -> :ok end) end)) |> length(); {:flooding, n}\n" },
    { expect = '\{:flooding, 6\}' },
    { mark = "flooding" },
    { wait = "alice-done" },
    { exit = 0 },
]

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
forward = [22]
