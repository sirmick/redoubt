description = "A measurement, and the boot-time target (the prompt within 20 s of guest time): the image's boot to its prompt through its verified userland volume, profiled (docs/userland/beamlet.md, \"beamlet on Redoubt\"; docs/servers/verityd.md, \"Memory and cost\"). The image's programs and manifest, with init, blkd, verityd, erofsd and beamlet built with boot-stats (docs/testbench.md, \"Checked builds\"): init's lines and beamlet's first object carry [t=N], guest time under icount with sleep on (a disk case: docs/testbench.md) and a pinned seed, so a run repeats closely, its spread shown by a sweep; blkd and erofsd say their counts at each power of two of their requests from 2^12, verityd from 2^7; at the VM's first console read beamlet says `beamlet: first console read [t=N]` and what its lookups cost, and when the shell's driver has drawn its first prompt, `beamlet: first prompt drawn [t=N]`: the end of the span the target is on, where a user sees the box ready; in this build those lines are drawn beside the prompt, the stamp's known cost; and a call to BootStats, a module no volume holds, makes erofsd say its counts exactly before it answers not_found. beamlet reads the volume's boot pack whole before its VM starts and says its size and entries, stamped, and its lookups' count says how many the pack answered (docs/userland/beamlet.md, \"beamlet on Redoubt\"). A typed Enum.sum(1..10) prints 55. boot-profile-unverified is the same boot with the volume unverified"
arch = ["rv64", "rv32"]
kind = "boot"
programs = [
    { package = "redoubt-init", bin = "init", features = ["boot-stats"] },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd", features = ["boot-stats"] },
    { package = "redoubt-verityd", bin = "verityd", features = ["boot-stats"] },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-walfsd", bin = "walfsd" },
    { package = "redoubt-erofsd", bin = "erofsd", features = ["boot-stats"] },
    { package = "beamlet-redoubt", bin = "beamlet", workspace = "userland/otp", features = ["boot-stats"] },
    { package = "redoubt-steward-server", bin = "steward" },
    { package = "redoubt-sshd", bin = "sshd" },
    { package = "redoubt-piped", bin = "piped" },
    { package = "redoubt-consrelay", bin = "consrelay" },
]
# The image needs 1 GiB: the principals' budgets, each holding the shell VM's session, do not fit
# the users budget 256 MiB leaves (docs/kernel/budgets.md).
memory_mib = 1024
icount = "shift=3"
qemu_seed = 1
timeout_secs = 900
expect = [
    '^init: up \[t=[0-9]+\]$',
    '^init: started verity:system, console [0-9a-f]{16} \[t=[0-9]+\]$',
    '^init: started erofsd:system, console [0-9a-f]{16} \[t=[0-9]+\]$',
    # The steward starts the shell as the console principal's session.
    '^init: started steward, console [0-9a-f]{16} \[t=[0-9]+\]$',
    '^\[con [0-9a-f]{16}\] beamlet: boot pack read [0-9]+ bytes, 78 entries \[t=[0-9]+\]$',
    '^\[con [0-9a-f]{16}\] beamlet: Elixir.Redoubt.Shell read from (erofsd:system|the boot pack) \[t=[0-9]+\]$',
    # The shell's driver reads the console before the shell draws its banner and prompt.
    # The boot-time target: the prompt within 20 s: the 14.7 s measured on rv32 (13.1 s on rv64)
    # to the first prompt drawn, and a tenth, rounded up to 5 s (docs/userland/beamlet.md).
    '^\[con [0-9a-f]{16}\] beamlet: first console read \[t=[0-9]+\]$',
    '^\[con [0-9a-f]{16}\] beamlet: boot-stats: loads [0-9]+ ',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
    # The target's line: the driver has drawn the first prompt, where a user sees the box ready.
    # Drawn beside the prompt, on its console line, so the line's start is the prompt's.
    'beamlet: first prompt drawn \[t=([0-9]{1,7}|1[0-9]{7})\]$',
    '^\[con [0-9a-f]{16}\] / \([0-9]+\)> Enum\.sum\(1\.\.10\)$',
    '^\[con [0-9a-f]{16}\] 55$',
    '^\[con [0-9a-f]{16}\] erofsd: boot-stats: 9P [0-9]+ ',
    'UndefinedFunctionError\) function BootStats.x/0 is undefined',
]
forbid = [
    'init: refused the boot',
    'init: rebooting',
    'exited',
    'faulted',
    'was killed',
    'init: restarted',
    'EXCEPTION',
    'verityd: the volume is refused',
    'does not match the tree',
    'served as corrupt',
    'not loaded',
]

[[input]]
after = 'beamlet: first prompt drawn '
send = "Enum.sum(1..10)\nBootStats.x()\n"

[[file]]
name = "manifest"
from = { path = "image/manifest.json" }
verity = "image/userland.toml"

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
