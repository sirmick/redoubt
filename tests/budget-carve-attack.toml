description = "Carving beyond a parent is refused for every limit, the largest values and sums that would wrap, and system keeps the pages its other process needs (R7)"
arch = ["rv64", "rv32"]
kind = "boot"
# PID 2 the attacker (the loader's first program, holding root, system and users); PID 3
# log-server; PID 4 budget-victim, in system beside the attacker; PID 5 attack-checker.
programs = ["budget-carve-attack", "log-server", "budget-victim", "attack-checker"]
timeout_secs = 30
# The attacker first carves all but about 100 of system's free pages into a child, so any carve
# the kernel wrongly allowed past system's limits would leave the victim, which lives in system,
# without its 64 pages: its first touch beyond them would end it, and it would never report.
# The verdict is the victim's line under its own PID and the checker's power-off; the
# attacker's lines are progress, pinning each refusal's error.
expect = [
    '^\[pid 2\] \[carve\] 101 pages 0 processes 0 weight under 2 -> Err\(OutOfMemory\)$',
    '^\[pid 2\] \[carve\] 18446744073709551615 pages 0 processes 0 weight under 2 -> Err\(OutOfMemory\)$',
    '^\[pid 2\] \[carve\] 1 pages 12 processes 0 weight under 2 -> Err\(OutOfProcesses\)$',
    '^\[pid 2\] \[carve\] 1 pages 4294967295 processes 0 weight under 2 -> Err\(OutOfProcesses\)$',
    '^\[pid 2\] \[carve\] 1 pages 0 processes 251 weight under 2 -> Err\(InvalidArgument\)$',
    '^\[pid 2\] \[carve\] 1 pages 0 processes 4294967295 weight under 2 -> Err\(InvalidArgument\)$',
    '^\[pid 2\] \[carve\] 1 pages 0 processes 0 weight under 1 -> Err\(OutOfMemory\)$',
    '^\[pid 2\] \[carve\] 18446744073709551615 pages 0 processes 0 weight under \d+ -> Err\(OutOfMemory\)$',
    '^\[pid 2\] \[carve\] 18446744073709551614 pages 4294967295 processes 4294967295 weight under \d+ -> Err\(OutOfMemory\)$',
    '^\[pid 2\] \[carve\] 9223372036854775808 pages 0 processes 0 weight under 3 -> Err\(OutOfMemory\)$',
    '^\[pid 2\] \[carve\] fill the child -> Ok\(\(\)\), then u64::MAX more -> Err\(OutOfMemory\)$',
    '^\[pid 2\] \[carve\] a scope in the full child -> Err\(OutOfMemory\)$',
    '^\[pid 2\] \[carve\] attempts done \(all refused\)$',
    '^\[pid 4\] \[victim\] mapped and touched 64 pages in system after the attack$',
    '^\[pid 5\] \[checker\] PID 4 reported; the kernel still serves',
]
forbid = ['BREACH']
poweroff = true

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]

[[grant]]
program = "attack-checker"
mmio = ["0x100000:0x1000"]
