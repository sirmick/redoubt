description = "The sixteen-lease burst, a companion of `steward-deadline-burst` (docs/servers/steward.md, \"Failure and restart\"; docs/kernel/scheduling.md, \"With the real steward\"): alice's session starts D = 16 spinning agents (Redoubt.Agents.Echo `spin`, each a beamlet VM on a lease) with one shared deadline, the sixteen the latency manifest sizes her for (2 x 11,392 + 16 x 5,248 = 106,770 pages, her unlabelled share), so the kernel takes all sixteen at once and the steward is handed sixteen exits together, the shape under which the burst's cost was found. The probe prints each lease's deadline notice, the sponsor told (the `lease_ended` send returned) less that lease's deadline, grouped at the leases live as each exit is dequeued (sixteen down to one), each bounded at 6 s, twice the worst measured at one and two harts rounded up to a second, and the session must print all sixteen `[lease ended]` lines: measured, the first notice comes 0.84 s after its deadline (93 to 103 ms net of the checked build's audits) behind the sixteen destructions at the deadline's entry, then each send returns 38 to 103 ms after the previous at one hart and 82 to 131 at two, the steward's own work per exit, the last of sixteen 1.8 to 2.5 s after its deadline (0.45 to 0.93 s net); before beamlet's serve thread queued each notice for the VM the sends waited for the VM's take once a scheduler turn, the last 2.1 to 2.8 s and one of sixteen lost at one hart. The shared deadline is 120 s from the first start: twice the sixteen launches' worst total (each launch beside the spinners before it, up to 3.72 s on rv64 at two harts beside fifteen), so every lease's VM runs when the deadline falls and the steward is idle at it. rv64 only: beside many spinners on rv32 a spinner VM's module reads at the system volume time out behind the others' and the VM exits 1 before any deadline, a finding of the read path stated on kernel/scheduling.md with the latency round at N = 16; the realistic burst runs on both widths in the companion"
arch = ["rv64"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
# The guest seed the gate runs, the latency cases'.
qemu_seed = 3
# Out of the whole run as the latency cases are: one boot on its own trace ring, the burst at
# the latency manifest's sixteen; the realistic burst on both widths is the companion's.
whole_run = false
# The image's programs, the steward built with its test-only latency-probe (servers/steward,
# src/bin/steward.rs, Probe), and the crossing program the image publishes. The latency manifest
# gives the steward the stand-in's weight, 1000 under `system` (the image's is 100): the
# workload the page's targets were set at.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-verityd", bin = "verityd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-walfsd", bin = "walfsd" },
    { package = "redoubt-erofsd", bin = "erofsd" },
    { package = "beamlet-redoubt", bin = "beamlet", workspace = "userland/otp" },
    { package = "redoubt-piped", bin = "piped" },
    { package = "redoubt-crossing", bin = "crossing" },
    { package = "redoubt-steward-server", bin = "steward", features = ["latency-probe"] },
    { package = "redoubt-sshd", bin = "sshd" },
    { package = "redoubt-consrelay", bin = "consrelay" },
]
# The same latency manifest as steward-latency: alice sized for sixteen lease VMs of 5,248 pages
# beside her two sessions of 11,392, bob's 16,384 under `users`, and the trace ring's large form
# (256 MiB). 1536 MiB, not 2048: RAM starts at 0x8000_0000 and two GiB wrap the 32-bit address
# space, so rv32 booted to nothing.
memory_mib = 1536
# Test builds only: the trace ring, its large form, and its dump at the reset.
kernel_features = ["sched-trace-large"]
# Gated at one hart and at two (kernel/scheduling.md, "Responsiveness").
smp = [1, 2]
# Sixteen beamlet VMs live at once under icount, their launches and the shared deadline the
# cost; the reboot rule needs six exits within 60 s.
timeout_secs = 7200
post_check = "sched_oracle gate_harts=2 r10_p99_us=30000"
expect = [
    '^init: started sshd, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] sshd: listening on port 22$',
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
]
forbid = [
    'init: refused the boot',
    'EXCEPTION',
    'steward: a step failed',
    'steward: the core exited',
    'sshd: login .*: refused',
    'target missed',
]
# The burst's samples, each under 6 s (twice the worst measured, 2.51 s at two harts, rounded up
# to a second: the digits admit up to 5,999,999 us), in the order the exits are served, sixteen
# down to one; then the counts, one deadline notice in each group; then the window's end on the
# done marker, which ends six instances within the minute, and init reboots, the reset dumping
# the kernel's trace the post-check reads.
expect_after = [
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=16 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=15 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=14 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=13 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=12 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=11 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=10 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=9 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=8 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=7 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=6 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=5 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=4 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=3 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=2 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-SAMPLE N=1 deadline_notice [0-9]+ ([0-9]{1,6}|[1-5][0-9]{6})$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=1 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=2 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=3 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=4 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=5 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=6 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=7 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=8 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=9 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=10 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=11 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=12 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=13 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=14 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=15 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=16 deadline_notice 1$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-END [0-9]+$',
    '^\[con [0-9a-f]{16}\] steward: latency-probe: the case is done, exiting for the reboot$',
    '^init: steward \(PID [0-9]+\) exited, code 9$',
    '^init: rebooting: steward was restarted 5 times within 60 seconds$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]

# Alice's session starts the burst with the companion's function: sixteen spinners, each asked
# for the shared deadline less the time since the first start, on the guest's clock; a sleep of
# the shared deadline and three seconds from the last launch's return; the round's marker, on
# which the probe counts the burst out; the done marker, on which it prints the window's end and
# exits for the reboot (the derivation is in steward-deadline-burst.toml's session comment); the
# sixteen `[lease alice/agent-N ended]` lines the shell prints are expected before the result.
[[session]]
user = "alice"
pty = true
steps = [
    { expect = '/home/alice \([0-9]+\)> ' },
    { send = "{:ok, c} = Redoubt.Contexts.connection(); {:stage, File.mkdir_p(\"/home/alice/project/out\"), File.write(\"/home/alice/project/in\", \"spin\")}\n" },
    { expect = '\{:stage, :ok, :ok\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "start = fn us -> {:ok, %{lease: l}} = Redoubt.Wire.Client.Steward.start_agent(c, us, Redoubt.Wire.Client.launch_timeout()); l end; burst = fn d, ms -> t0 = System.monotonic_time(:millisecond); for _ <- 1..d, do: start.((ms - (System.monotonic_time(:millisecond) - t0)) * 1000); Process.sleep(ms + 3000); File.write(\"/home/alice/latency-round-1\", \"round over\"); Process.sleep(3000); {:burst, d, :done} end; burst.(16, 120_000)\n" },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\[lease alice/agent-[0-9]+ ended\]' },
    { expect = '\{:burst, 16, :done\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "{:marker, File.write(\"/home/alice/latency-done\", \"the case is done\")}\n" },
    { expect = '\{:marker, :ok\}' },
    { expect = '\([0-9]+\)> ' },
    { exit = 0 },
]

[[file]]
name = "manifest"
from = { path = "tests/data/steward/latency.manifest.json" }
verity = "image/userland.toml"

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
forward = [22]
