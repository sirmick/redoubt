description = "Executable model properties and host trace replay (not real-kernel conformance); the mutations run apart, in model-mutations"
kind = "host-tests"
# Default suites retain their sequence counts; the separate million acceptance run is described in docs/kernel/model.md.
packages = ["redoubt-model"]
skip = ["mutations_are_caught"]
# Each test a job: the steward families are nearly all of the time, so each gets eight threads.
fanout = { each = "test", cores = 8, vars = { MODEL_THREADS = "8" } }
# steward_policy's job is the longest: 1,777 s on eight threads measured, and a third.
timeout_secs = 2369
