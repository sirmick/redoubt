description = "The image boots its shell on the UART from its verified userland volume (docs/userland/shell.md, \"The shell in a session\"; docs/kernel/boot.md, R75 (verified userland); docs/servers/verityd.md, R76 (verified volumes)), in the console principal's session (docs/servers/steward.md, \"Authentication and sessions\"): init starts the steward, which carves alice's and bob's budgets and opens alice's unlabelled session on the UART, its budget under users/alice/{} as the steward's audit line says. init starts verity:system, which checks the volume's top tree block against the root the signed manifest pins, beamlet reads Redoubt.Shell through erofsd:system and verity:system, and a typed Enum.sum(1..10) prints 55. The attack, verity-flipped-block, is the same boot: the disk has one bit of the data of Elixir.Version flipped after the pack, while the manifest's root is the pack's, and Version is loaded only when called. A call to it: verityd's console line names the block, beamlet's names the module and that its file could not be read, and the prompt is still there: a typed 1 + 1 prints 2. Version's own UndefinedFunctionError is not expected: once erofsd serves the volume as corrupt, the modules that print it cannot load either. erofsd now serves the volume as corrupt, so a module never loaded before, OptionParser, fails at its walk, and beamlet says so naming the error rather than taking it for a name the system lacks; a call to a module no volume holds (NoSuch) stays silent. The verdict is the system's: verityd hashes each block through the tree to the signed root, and init's lines show no exit and no reboot (rule F)"
arch = ["rv64", "rv32"]
kind = "boot"
recipe = "image/boot.toml"
# The image needs 1 GiB: the principals' budgets, each holding the shell VM's session, do not fit
# the users budget 256 MiB leaves (docs/kernel/budgets.md).
memory_mib = 1024
memory = true
timeout_secs = 450
# A call to a module no volume holds goes first, so the error's own modules are loaded before
# erofsd serves the volume as corrupt: nothing typed after the flipped block can load.
expect = [
    '^init: started verity:system, console [0-9a-f]{16}$',
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] steward: carved users/alice account 1001: \{\} \{7\}$',
    '^\[con [0-9a-f]{16}\] steward: carved users/bob account 1002: \{\}$',
    '^\[con [0-9a-f]{16}\] steward: audit 1001/\{\} at [0-9]+: Login ',
    '^\[con [0-9a-f]{16}\] beamlet: Elixir.Redoubt.Shell read from (erofsd:system|the boot pack)$',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
    'UndefinedFunctionError\) function NoSuch.call/0 is undefined',
    '^\[con [0-9a-f]{16}\] / \([0-9]+\)> Enum\.sum\(1\.\.10\)$',
    '^\[con [0-9a-f]{16}\] 55$',
    '^\[con [0-9a-f]{16}\] verityd: block [0-9]+ does not match the tree$',
    'beamlet: Elixir.Version not loaded: its file could not be read: corrupt$',
    'beamlet: Elixir.OptionParser not loaded: its file could not be read: corrupt$',
    '^\[con [0-9a-f]{16}\] / \([0-9]+\)> 1 \+ 1$',
    '^\[con [0-9a-f]{16}\] 2$',
]
forbid = [
    'init: refused the boot',
    'init: rebooting',
    # Version is not loaded: the shell never prints a parsed version.
    '%Version\{',
    'exited',
    'faulted',
    'was killed',
    'init: restarted',
    'EXCEPTION',
    'verityd: the volume is refused',
    'served as corrupt',
    'beamlet: Elixir.NoSuch',
]

[[input]]
after = 'Redoubt shell, on Elixir '
send = "NoSuch.call()\nEnum.sum(1..10)\nVersion.parse(\"1.2.3\")\nOptionParser.split(\"a b\")\n1 + 1\n"

[userland]
recipe = "image/userland.toml"
flip = "Elixir.Version.beam"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
