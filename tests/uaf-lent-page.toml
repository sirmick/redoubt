description = "A process that dies while a page is lent out must not let that frame be reused under the borrower"
arch = ["rv64"]
kind = "boot"
# PID 3 uaf-holder is the borrower whose page is at stake and judges; PID 4 uaf-victim lends
# it a page and dies; PID 5 uaf-grabber attacks, stamping every page it can get;
# the holder reports to log-server's DONE, which ends the case.
programs = ["log-server", "uaf-holder", "uaf-victim", "uaf-grabber"]
timeout_secs = 30
expect = [
    '^\[pid 3\] \[holder\] holding page',
    # Progress, the attacker's report.
    '^\[pid 5\] \[grabber\] stamped',
    # The verdict, the holder's; "UAF TEST FAILED" (it sees the grabber's data) is always
    # forbidden. Unforgeable: log-server prefixes it with the holder's kernel-reported PID 3,
    # and log-server powers off only when PID 3 reports DONE, which it does only on a pass.
    '^\[pid 3\] UAF TEST PASSED',
    '^\[server\] done: reported by pid 3; still serving$',
]
poweroff = true
reporter = "uaf-holder"
