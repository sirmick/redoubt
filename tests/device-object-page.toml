description = "A device object costs its owner one page (kernel/devices.md, \"Device objects\"): at boot system is charged exactly one page per device object it owns and nothing else, and when a quarantine destroys one object (dma-reset-deaf: a driver that allocated through an empty virtio-mmio slot faults and the slot's reset does not confirm) system's usage falls by exactly that page while every handle to the slot is gone (checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
icount = "shift=3,sleep=off"
debug_assertions = true
kernel_features = ["dma-reset-deaf"]
# In init's place, so it holds every device object (kernel/devices.md), and runs in root; the
# driver's budget is carved from system before the measure, so nothing but the object's page moves
# inside it. It prints on the console it maps itself: there is no log-server here.
programs = ["device-object-page"]
timeout_secs = 20
# The counts are the kernel's answers (budget_usage, device_info); the fault and the quarantine
# are the kernel's own lines, which no process can print.
expect = [
    '^\[device-object-page\] mapped the console$',
    '^\[device-object-page\] ok: system is charged [0-9]+ pages for the [0-9]+ device objects it owns: one page each$',
    '^PROGRAM HALT: CPU Exception on PID [0-9]+: Store page fault of 0x00000000 ',
    '^DMA: device [0-9a-f]+ did not confirm its reset; quarantined until reboot',
    '^\[device-object-page\] ok: the quarantine destroyed the slot.s object: system [0-9]+ -> [0-9]+ pages, one page back, and handle [0-9]+ is gone \(Err\(Dead\)\)$',
    '^\[device-object-page\] DEVICE OBJECT PAGE PASSED$',
]
forbid = ['\[device-object-page\] FAIL']
poweroff = true
