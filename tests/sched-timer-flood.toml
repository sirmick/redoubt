description = "Timer interrupts an attacker arms cost the attacker (billing): 1 us-staggered sleepers, staggered budget deadlines, and waits ended early, which leave the timer no early interrupt, leave an equal-weight victim at least its share of the harts; every timer interrupt from user mode billed only to the budgets of what it found (the oracle's direct check); the victim's share judged by the post-check on the kernel's charges net of lock waits (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-timer-flood"]
# Test builds only: the trace ring (never in a default kernel). The oracle checks every pick, and
# judges the victim's share of what the kernel charged in the window the program prints
# (`HART-SHARE`), net of lock waits; audits are charged to no one. It checks every timer interrupt's
# billing, and requires the cancelled waits to have left none that found them ended early: a wait
# that ends early raises the timer's hint (kernel/timer.md, "The hart timer"; kernel/scheduling.md,
# "Charging").
kernel_features = ["sched-trace"]
post_check = "sched_oracle no_stale_waits_in=cancelled-waits"
timeout_secs = 600
expect = [
    '^HART-SHARE sleepers \d+ \d+ 50\+ 2:1 100:30$',
    '^HART-SHARE sleepers-and-deadlines \d+ \d+ 50\+ 3:1 100:30$',
    '^HART-SHARE cancelled-waits \d+ \d+ 50\+ 4:1 100:3$',
    '^SCHED-TIMER-FLOOD TEST PASSED$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['\[timer-flood\] FAIL']
poweroff = true
