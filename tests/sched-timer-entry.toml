description = "A timer interrupt costs the kernel what its work needs (kernel/scheduling.md, \"Fair kernel entry is bounded by count\"): two spinners in budgets of equal weight and nothing else, so every timer interrupt from user mode ends a slice, switching budgets on one hart and picking the same spinner again on two; the kernel's lock section for each, trap to return, is bounded by the oracle from the trace (`hold-trace`), net of the checked build's audits (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-timer-entry"]
smp = [1, 2]
# Test builds only: the trace ring with each lock section's length and cause (never in a default
# kernel).
kernel_features = ["hold-trace"]
# Ticks are tenths of a microsecond on QEMU's virt board, 12.5 instructions each at shift=3. At one
# hart, where every slice's end switches budgets where the trap is, the steady sections are 943
# ticks (rv64) and 1,416 (rv32), p99 945 and 1,441 (five runs a width alone); the longest is the
# window's first, cold, preemption, 3,540 to 3,548 and 4,421 to 4,446. The p99 bound, 2,000, is
# 1.39 times the slower width's p99; the max, 5,000, 1.12 times its cold section. Before the
# timer's placement read the harts' runners at each re-arm (kernel/timer.md, "The hart timer")
# the steady sections were 928 and 1,388, p99 930 and 1,415, the cold ones 3,461 and 4,265: its
# cost is 15 and 26 ticks a slice's end. Before the slice's end picked
# and switched where it is, the same run's p99 was 1,096 and 1,597 (the round trip through kmain
# with one timer arm) and, before the kernel stopped re-arming the timer three times a
# preemption, decoding a whole budget to move its round-robin cursor and calling out for every
# word of a kernel object, 2,241 and 3,006 with a max of 5,807 and 6,831: that one fails both
# bounds on both widths. Gated at one hart: under icount the harts share one clock, so at two a
# section's ticks count the other hart's instructions too, and are recorded (p99 5,445 and 7,375
# in the same five runs, from 5,433 and 7,354 before the placement: the steady 1-hart section's
# rise, not a change of turns).
# The p99 bound assumes the run holds enough sections that its cold ones sit above the 99th
# percentile: under 200 sections the p99 lands on a cold one and fails; this run's length gives
# 366 to 379.
post_check = "sched_oracle timer_section_p99_ticks=2000 timer_section_max_ticks=5000 gate_harts=1"
timeout_secs = 600
expect = [
    '^\[timer-entry\] the spinners counted \d+ and \d+$',
    '^SCHED-TIMER-ENTRY TEST PASSED$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
poweroff = true
