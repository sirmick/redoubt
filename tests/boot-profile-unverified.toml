description = "A measurement, and the unverified boot-time target (the prompt within 20 s of guest time): boot-profile's boot with the userland volume unverified, the cost of verification measured by difference (docs/servers/verityd.md, \"Memory and cost\"). The same programs, built with boot-stats, and the same objects and boot pack, packed with no hash tree (tests/data/boot-profile/userland-unverified.toml); the manifest is the image's without the system volume's verity and without verity:system (tests/data/boot-profile/manifest-unverified.json), so erofsd:system reads its range at blkd:system directly. Its milestones and counts are boot-profile's, less verityd's; a typed Enum.sum(1..10) prints 55"
arch = ["rv64", "rv32"]
kind = "boot"
programs = [
    { package = "redoubt-init", bin = "init", features = ["boot-stats"] },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd", features = ["boot-stats"] },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-walfsd", bin = "walfsd" },
    { package = "redoubt-erofsd", bin = "erofsd", features = ["boot-stats"] },
    { package = "beamlet-redoubt", bin = "beamlet", workspace = "userland/otp", features = ["boot-stats"] },
    { package = "redoubt-steward-server", bin = "steward" },
    { package = "redoubt-sshd", bin = "sshd" },
    { package = "redoubt-piped", bin = "piped" },
    { package = "redoubt-consrelay", bin = "consrelay" },
]
# The image needs 1 GiB: the principals' budgets, each holding the shell VM's session, do not fit
# the users budget 256 MiB leaves (docs/kernel/budgets.md).
memory_mib = 1024
icount = "shift=3"
qemu_seed = 1
timeout_secs = 900
expect = [
    '^init: up \[t=[0-9]+\]$',
    '^init: started erofsd:system, console [0-9a-f]{16} \[t=[0-9]+\]$',
    # The steward starts the shell as the console principal's session.
    '^init: started steward, console [0-9a-f]{16} \[t=[0-9]+\]$',
    '^\[con [0-9a-f]{16}\] beamlet: boot pack read [0-9]+ bytes, 78 entries \[t=[0-9]+\]$',
    '^\[con [0-9a-f]{16}\] beamlet: Elixir.Redoubt.Shell read from (erofsd:system|the boot pack) \[t=[0-9]+\]$',
    # The shell's driver reads the console before the shell draws its banner and prompt.
    # The boot-time target: the prompt within 20 s: the 12.4 s measured on rv32 (10.9 s on rv64)
    # to the first prompt drawn, and a tenth, rounded up to 5 s (docs/userland/beamlet.md).
    '^\[con [0-9a-f]{16}\] beamlet: first console read \[t=[0-9]+\]$',
    '^\[con [0-9a-f]{16}\] beamlet: boot-stats: loads [0-9]+ ',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
    # The target's line: the driver has drawn the first prompt, where a user sees the box ready.
    # Drawn beside the prompt, on its console line, so the line's start is the prompt's.
    'beamlet: first prompt drawn \[t=([0-9]{1,7}|1[0-9]{7})\]$',
    '^\[con [0-9a-f]{16}\] / \([0-9]+\)> Enum\.sum\(1\.\.10\)$',
    '^\[con [0-9a-f]{16}\] 55$',
    '^\[con [0-9a-f]{16}\] erofsd: boot-stats: 9P [0-9]+ ',
    'UndefinedFunctionError\) function BootStats.x/0 is undefined',
]
forbid = [
    'init: refused the boot',
    'init: rebooting',
    'exited',
    'faulted',
    'was killed',
    'init: restarted',
    'EXCEPTION',
    'verityd',
    'served as corrupt',
    'not loaded',
]

[[input]]
after = 'beamlet: first prompt drawn '
send = "Enum.sum(1..10)\nBootStats.x()\n"

# Both data files are the image's own, less verification: the manifest is image/manifest.json
# without the system volume's `verity` and without `verity:system`, every other entry verbatim;
# the recipe is image/userland.toml without `verity = true`. init's host test
# the_boot_profiles_unverified_copies_are_the_image_less_its_verification (init-host-tests) fails
# when either copy differs from the image's, so a change to the image is made to its copy too.
[[file]]
name = "manifest"
from = { path = "tests/data/boot-profile/manifest-unverified.json" }

[userland]
recipe = "tests/data/boot-profile/userland-unverified.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
