description = "The attack: a program handed the userland erofsd's endpoint tries to create a file on the userland disk and to write Elixir.Version.beam (servers/erofsd.md, \"Serving\"; docs/kernel/boot.md, R75). erofsd serves only reads and refuses the create and the writes itself, before they reach verityd, which refuses every write too, blkd, or the host, which attaches the disk read-only; the file reads back the same length. The verdict that the file did not change is the system's: the shell then calls Version, and beamlet loads it only because verityd served every block of it as hashing to the signed manifest's root (R76; rule F)"
arch = ["rv64", "rv32"]
kind = "boot"
# The image's programs and littlefsd-client; the manifest is the image's with the client added.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-verityd", bin = "verityd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-littlefsd", bin = "littlefsd" },
    { package = "redoubt-walfsd", bin = "walfsd" },
    { package = "redoubt-erofsd", bin = "erofsd" },
    { package = "beamlet-redoubt", bin = "beamlet", workspace = "userland/otp" },
    { package = "redoubt-steward-server", bin = "steward" },
    { package = "redoubt-sshd", bin = "sshd" },
    { package = "redoubt-littlefsd-programs", bin = "littlefsd-client" },
]
# The image needs 1 GiB: the principals' budgets, each holding the shell VM's session, do not fit
# the users budget 256 MiB leaves (docs/kernel/budgets.md).
memory_mib = 1024
memory = true
timeout_secs = 330
# The client's lines come long before the shell's banner; they are expected first, so the call
# to Version follows the attack.
expect = [
    '^\[con [0-9a-f]{16}\] littlefsd-client: a create and a write to Elixir.Version.beam refused$',
    '^\[con [0-9a-f]{16}\] littlefsd-client TEST PASSED$',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
    '^\[con [0-9a-f]{16}\] / \(1\)> "1\.2\.3"$',
]
forbid = [
    'init: refused the boot',
    '^init: .* (exited|faulted|was killed)',
    'init: restarted',
    'not loaded',
    'littlefsd-client TEST FAILED',
]

[[input]]
after = 'Redoubt shell, on Elixir '
send = "Version.parse!(\"1.2.3\") |> to_string()\n"

[[file]]
name = "manifest"
from = { path = "image/manifest.json" }
verity = "image/userland.toml"

[[file.servers]]
name = "client"
program = "littlefsd-client"
budget = { pages = "256", processes = 1, weight = 100 }
handed = [{ endpoint = "erofsd:system", badge = "8" }]
args = ["readonly", "erofsd:system", "Elixir.Version.beam"]

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
