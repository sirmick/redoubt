description = "The bench's RAM scanner computes each stack's high-water mark, ignores a paint word copied into another stack slot or residue whose index no longer names its slot, and reads each heap record, dumping again while a server has not yet written its record, until the case's deadline; it rejects a missing server or record, a duplicate paint unit or record, an out-of-range index at its page offset, a record whose cap is not the manifest's, or a stack or capped heap below twice its peak"
kind = "host-tests"
packages = ["testbench"]
