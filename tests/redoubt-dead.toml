description = "R4b and R4's Refused: a server thread that exits holding an open call gives its caller Dead and its lend back intact, the endpoint survives for the next server, and a message the receiving budget cannot pay for is Refused to its sender while the receiver keeps waiting (checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
icount = "shift=3,sleep=off"
# Built with the checks on (docs/testbench.md, "Checked builds").
debug_assertions = true
# PID 2 log-server; PID 3 redoubt-dead, which holds the budget it runs in (slot 3), since the
# Refused step carves that budget's free pages away. Before the tester it ran in init's place, in
# system, and carved system; its own budget now is an equal share of system for one program (all
# of system's free pages bar one, 15 processes, weight 1,000), system-class as system is, so the
# step is the same.
programs = ["log-server", "redoubt-dead"]
timeout_secs = 20
expect = [
    '^\[pid 3\] \[dead\] server took a call with a lend of Some\(1\) pages, and exits$',
    '^\[pid 3\] \[dead\] its own budget down to \d+ free pages$',
    '^\[pid 3\] \[dead\] second server took a message with 16 lent pages$',
    '^\[pid 3\] REDOUBT-DEAD TEST PASSED$',
]
forbid = ['\[dead\] FAIL', 'REDOUBT-DEAD TEST FAILED']
