# OpenSSH's server for the bench's reference case, as a minimal Linux guest that the bench boots
# under its own QEMU for each session (docs/testbench.md, "Sessions and the loopback server").
# The bench tags the image with this file's hash and builds it only when that tag is missing:
# pin everything, so that one hash always names one server. Every package comes from one
# snapshot of Debian's archive (trixie, riscv64) and is checked against its sha256 there.
snapshot = "https://snapshot.debian.org/archive/debian/20261001T000000Z/"

# The package whose `boot/vmlinux-*` is the guest's kernel; its modules are not installed, only
# these, relative to its module directory, decompressed into /usr/lib/modules.
kernel = "linux-image-6.12.107+deb13-riscv64"
modules = [
    "kernel/drivers/virtio/virtio_mmio.ko.xz", # the bus QEMU's virt machine puts virtio-serial on
]

# What the other packages unpack that the guest leaves out, each for the reason given.
omit = [
    "usr/share",                       # documentation, manuals, locales: nothing reads them
    "usr/lib/riscv64-linux-gnu/gconv", # glibc's charset converters (6 MB): nothing converts
    "usr/lib/systemd",                 # units: no service manager runs
    "usr/lib/sysusers.d",              # systemd's user list: /etc/passwd below is the whole of it
    "usr/lib/tmpfiles.d",              # systemd's directory list: /run/sshd below is made here
    "etc/default",                     # the init scripts' settings
    "etc/init.d",                      # init scripts: no service manager runs
    "etc/logrotate.d",                 # no log is rotated: the log leaves on a port
    "etc/pam.d",                       # sshd_config says UsePAM no
    "etc/runit",                       # runit's service files
    "etc/sv",                          # runit's service files
    "etc/ufw",                         # a firewall profile: the guest has no network
    "var/log/runit",                   # runit's log directory
]

# What the guest adds to the packages' files. Trixie's packages install under /usr and leave the
# root's links to base-files, which the guest does not have.
dirs = ["case", "dev", "proc", "root", "run/sshd", "sys", "tmp", "usr/lib/modules"]
links = [
    ["bin", "usr/bin"],
    ["lib", "usr/lib"],
    ["sbin", "usr/sbin"],
    ["usr/bin/sh", "busybox"],
]

# The only logins: root, which the sessions use, and sshd's privilege-separation user.
[[file]]
path = "etc/passwd"
mode = 0o644
text = """
root:x:0:0:root:/root:/bin/sh
sshd:x:100:65534::/run/sshd:/usr/sbin/nologin
"""

[[file]]
path = "etc/group"
mode = 0o644
text = """
root:x:0:
nogroup:x:65534:
"""

# One inetd-mode session on the port named "io", the case's files in /case, the log carried to
# the port named "log"; then the guest powers off, and QEMU exits.
[[file]]
path = "init"
mode = 0o755
text = '''
#!/bin/sh
/usr/bin/busybox --install -s /usr/bin
mount -t proc proc /proc
mount -t sysfs sysfs /sys
mount -t devtmpfs devtmpfs /dev
mkdir -p /dev/pts /dev/virtio-ports
mount -t devpts -o ptmxmode=0666 devpts /dev/pts
insmod /lib/modules/virtio_mmio.ko
# udev would name the ports. The name each port's host side gives arrives a little after the
# port itself: wait for both, for at most 500 tries 10 ms apart.
tries=500
until [ -c /dev/virtio-ports/io ] && [ -c /dev/virtio-ports/log ]; do
    if [ $((tries -= 1)) -lt 0 ]; then
        echo "init: no virtio ports named io and log; powering off"
        poweroff -f
    fi
    for port in /sys/class/virtio-ports/*; do
        name=$(cat "$port/name" 2>/dev/null) && [ -n "$name" ] &&
            ln -sfn "/dev/${port##*/}" "/dev/virtio-ports/$name"
    done
    sleep 0.01
done
# A port takes one open at a time. sshd's input and output share one, and each of its processes
# opens its log file anew: they share a FIFO, which one reader carries to the port a whole line
# per write, so that QEMU appends whole lines among other sessions'. The writer held on fd 3 keeps
# the reader going until sshd and all its processes are done.
mkfifo /run/sshd.log
while IFS= read -r line; do printf '%s\n' "$line"; done </run/sshd.log >/dev/virtio-ports/log &
exec 3>/run/sshd.log
/usr/sbin/sshd -i -f /case/sshd_config -E /run/sshd.log <>/dev/virtio-ports/io >&0
exec 3>&-
wait
poweroff -f
'''

