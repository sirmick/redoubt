description = "Budget churn gains nothing (pass inheritance): blocking, spinning-parent, deadline-timed and fresh-intermediate churn leave an equal-weight victim half; a shell that keeps giving a budget half its weight and taking it back is neither starved nor favoured; the victim's share judged by the post-check net of the checked build's audits inside its window (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-budget-churn"]
# Test builds only: the trace ring (never in a default kernel). The oracle checks every pick, and
# recomputes every lift (a destroyed child's work moving to its parent) from the rule: the lift
# wiring, which the victim's share alone cannot see (a churner pays more for spawning and for R10
# than a wrong lift could give it back). It also judges the victim's share, which the program prints
# with its window (`SHARE`), net of the audit time inside it (kernel/scheduling.md, "Responsiveness").
kernel_features = ["sched-trace"]
post_check = "sched_oracle"
timeout_secs = 600
expect = [
    '^SHARE blocking \d+ \d+ \d+ 450 1000$',
    '^SHARE spinning-parent \d+ \d+ \d+ 450 1000$',
    '^SHARE deadline \d+ \d+ \d+ 450 1000$',
    '^SHARE fresh-intermediates \d+ \d+ \d+ 450 1000$',
    '^SHARE shell \d+ \d+ \d+ 450 550$',
    '^SCHED-BUDGET-CHURN TEST PASSED$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['\[budget-churn\] FAIL']
poweroff = true
