description = "Budget churn gains nothing (pass inheritance): blocking, spinning-parent, deadline-timed and fresh-intermediate churn leave an equal-weight victim at least its share of the harts, every lift recomputed by the oracle; the victim's share judged by the post-check on the kernel's charges net of lock waits (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-budget-churn"]
# Test builds only: the trace ring (never in a default kernel). The oracle checks every pick, and
# recomputes every lift (a destroyed child's work moving to its parent) from the rule: the lift
# wiring, which the victim's share alone cannot see (a churner pays more for spawning and for R10
# than a wrong lift could give it back). It also judges the victim's share of what the kernel charged
# in the window the program prints (`HART-SHARE`), net of lock waits; audits are charged to no one.
kernel_features = ["sched-trace"]
post_check = "sched_oracle"
timeout_secs = 600
expect = [
    '^HART-SHARE blocking \d+ \d+ 50\+ 2:1 100:2$',
    '^HART-SHARE spinning-parent \d+ \d+ 50\+ 3:1 100:2$',
    '^HART-SHARE deadline \d+ \d+ 50\+ 4:1 100:2$',
    '^HART-SHARE fresh-intermediates \d+ \d+ 50\+ 5:1 100:2$',
    '^SCHED-BUDGET-CHURN TEST PASSED$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['\[budget-churn\] FAIL']
poweroff = true
