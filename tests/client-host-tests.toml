description = "The client library (redoubt-client) on the host, against the real bootfsd, consoled and keyd and an in-test file server on the runtime's fake kernel: files (a refusal is the server's and costs no fid, a minted connection cannot climb out of its root, a refused quota mints nothing, threads share a connection), the namespace, the console (a labelled session cannot write it), littlefsd's operations (two connections' files are refused before any call), typed calls (a hostile reply or a server dying mid-call leaves no handle), and launching (refusals before any kernel call, a refusal midway hands the budget back, the exit notice releases every grant at every server)"
