description = "One volume per littlefsd instance (servers/littlefsd.md, R47): init starts blkd and a littlefsd for each of two volumes on one disk, minting each its own range; each littlefsd, built with its test-only feature one-volume-probe, tries before serving to reach past its endpoint, its range and its console: the kernel finds every other handle index empty and refuses a badge minted from its range, and blkd refuses the sector just past its range as out_of_range; a client handed a root badge at each writes a file of the same name through both and reads each back apart"
arch = ["rv64", "rv32"]
kind = "boot"
# The real init, the servers the manifest names, littlefsd built with its test-only feature
# one-volume-probe (both littlefsds run it), and littlefsd-client.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-littlefsd", bin = "littlefsd", features = ["one-volume-probe"] },
    { package = "redoubt-littlefsd-programs", bin = "littlefsd-client" },
]
timeout_secs = 60
expect = [
    '^init: the manifest is checked: 6 servers, bound \d+ pages$',
    '^init: started littlefsd:a, console [0-9a-f]{16}$',
    # Each littlefsd's line, in whichever order the two print them.
    '^\[con [0-9a-f]{16}\] littlefsd:[ab] reaches only its endpoint, its range and its console: its range mints nothing, and sector [0-9]+ is out_of_range$',
    '^\[con [0-9a-f]{16}\] littlefsd:[ab] reaches only its endpoint, its range and its console: its range mints nothing, and sector [0-9]+ is out_of_range$',
    '^\[con [0-9a-f]{16}\] littlefsd-client read littlefsd:a.s which and littlefsd:b.s apart$',
    '^\[con [0-9a-f]{16}\] littlefsd-client TEST PASSED$',
]
forbid = ['init: refused the boot', '^init: .* (exited|faulted|was killed)', 'init: restarted', 'init: rebooting', 'FAILED R47', 'littlefsd-client TEST FAILED']
reporter = "client"

[[file]]
name = "manifest"
from = { path = "tests/data/littlefsd/one-volume.json" }

[disk]
size_kib = 4096
partitions = 2
