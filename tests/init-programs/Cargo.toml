[package]
name = "redoubt-init-programs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The test programs the servers' cases start under the real init, as servers entries of their manifests (docs/testbench.md)"

# Each one is a program like a server: the runtime's start-up, its handles by name from the
# block init writes, and its lines through the /dev/cons connection init minted for it.
[[bin]]
name = "boot-reader"
path = "src/bin/boot-reader.rs"
test = false

[[bin]]
name = "con-forger"
path = "src/bin/con-forger.rs"
test = false

[[bin]]
name = "quitter"
path = "src/bin/quitter.rs"
test = false

[[bin]]
name = "restartee"
path = "src/bin/restartee.rs"
test = false

[[bin]]
name = "restart-client"
path = "src/bin/restart-client.rs"
test = false

[[bin]]
name = "restart-faulter"
path = "src/bin/restart-faulter.rs"
test = false

[[bin]]
name = "rollback-client"
path = "src/bin/rollback-client.rs"
test = false

[[bin]]
name = "dma-driver"
path = "src/bin/dma-driver.rs"
test = false

[[bin]]
name = "driver-client"
path = "src/bin/driver-client.rs"
test = false

[[bin]]
name = "orphan-server"
path = "src/bin/orphan-server.rs"
test = false

[[bin]]
name = "orphan-launcher"
path = "src/bin/orphan-launcher.rs"
test = false

[[bin]]
name = "orphan-child"
path = "src/bin/orphan-child.rs"
test = false

[[bin]]
name = "passer"
path = "src/bin/passer.rs"
test = false

[[bin]]
name = "keeper"
path = "src/bin/keeper.rs"
test = false

[lib]
test = false
doctest = false

[dependencies]
redoubt-rt = { path = "../../libs/rt" }
redoubt-client = { path = "../../libs/client" }
