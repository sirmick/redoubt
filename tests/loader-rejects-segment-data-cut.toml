description = "The loader refuses a program image whose headers parse and whose last segment's data runs past the end of the file (R16)"
arch = ["rv64", "rv32"]
kind = "boot"
icount = "shift=3,sleep=off"
# The section table dropped and the file cut 64 bytes before the end of the last loadable
# segment's data: the ELF header and program headers are whole, so the parse succeeds (unlike
# loader-rejects-truncated-elf, whose cut takes the headers), and the loader meets the missing
# bytes only when it slices the segment's data out of the image.
programs = [{ corrupt = "rng-test", with = { truncate-segment-data = 64 } }]
timeout_secs = 10
allow_panic = true          # the loader is supposed to panic here
# The verdict is the loader's own: nothing from the bundle runs (KMAIN is forbidden), so no
# program can print it. Anchored, so a relayed `[pid N]` line could not match either. The
# reason is the bounds check's: the slice `p_offset..p_offset + p_filesz` ends past the image.
expect = ['^loader PANIC', 'range end index \d+ out of range for slice of length \d+']
forbid = ['KMAIN', 'entering kernel']
