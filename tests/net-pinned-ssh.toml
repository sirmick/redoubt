description = "Pinned open calls at ipd from a session, with SSH surviving (docs/plan/m3-agents.md, \"A scripted hostile user\"; docs/servers/ipd.md, \"Pinned and abandoned calls\"; docs/servers/serving.md, R28; docs/kernel/ipc.md, R4a): the image boots with sshd on port 22 and alice logs in over SSH. Her shell's gen_tcp connection to the bench's peer at 10.0.9.100:80 goes through the session's /net at ipd; with nothing coming she makes 64 reads, each a 20 ms recv her own timeout abandons, so each parks at ipd and must be answered and freed (a leaked one would fill her share's parked calls and a later read would be refused at once, not time out). Bob logs in over SSH while she parks, and reaches his prompt, so the parked calls never took sshd's admission; then alice's echo to the peer still round-trips the bytes on the same connection. The verdicts are alice's count of 64 timeouts and her echo's bytes, bob's login line, and the peer's count of one connection with no SYN to the box's own addresses (rule F). Every printed value is tagged so a pattern matches the printed value and never the echo of the line typed"
arch = ["rv64", "rv32"]
kind = "boot"
recipe = "image/boot.toml"
# The image needs 1 GiB: the principals' budgets, each holding a shell VM's session, do not fit
# the users budget 256 MiB leaves (docs/kernel/budgets.md).
memory_mib = 1024
# Two logins, each a shell VM, then 64 abandoned reads and one echo on alice's connection.
timeout_secs = 1500
expect = [
    '^init: started sshd, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] sshd: listening on port 22$',
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] steward: audit 1001/\{\} at [0-9]+: Login ',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
]
forbid = [
    'init: refused the boot',
    'init: rebooting',
    '^init: .* (exited|faulted|was killed)',
    'init: restarted',
    'EXCEPTION',
    'steward: a step failed',
    'sshd: login .*: refused',
]
# Bob logs in while alice parks, and the steward says a login's lines before it answers sshd, so
# both logins reach their prompt: sshd was served while alice's reads churned at ipd.
expect_after = [
    '^\[con [0-9a-f]{16}\] sshd: login alice: session [0-9a-f]{16}, labels \[\]$',
    '^\[con [0-9a-f]{16}\] sshd: login bob: session [0-9a-f]{16}, labels \[\]$',
]

# Alice, parking abandoned reads: one connection to the peer, 64 reads each abandoned at 20 ms with
# nothing coming, every one of which ipd answers and frees; her count of timeouts is 64, so none was
# refused at once for a full share (R28, R4a). Then her echo on the same connection round-trips.
[[session]]
user = "alice"
forbid = ['\*\* \(']
steps = [
    { expect = '/home/alice \([0-9]+\)> ' },
    { send = "{:ok, s} = :gen_tcp.connect({10, 0, 9, 100}, 80, [:binary, active: false], 20000); {:connected, :ok}\n" },
    { expect = '\{:connected, :ok\}' },
    { mark = "connected" },
    { send = "{:parked, Enum.count(Enum.map(1..64, fn _ -> :gen_tcp.recv(s, 0, 20) end), &(&1 == {:error, :timeout}))}\n" },
    { expect = '\{:parked, 64\}' },
    { wait = "bob-in" },
    { send = "{:echo, (fn -> :ok = :gen_tcp.send(s, \"ping\"); :gen_tcp.recv(s, 4, 20000) end).()}\n" },
    { expect = '\{:echo, \{:ok, "ping"\}\}' },
    { send = "{:closed, :gen_tcp.close(s)}\n" },
    { expect = '\{:closed, :ok\}' },
    { exit = 0 },
]

# Bob logs in over SSH while alice parks, and reaches his prompt: sshd's admission at ipd is its
# own bucket, untouched by alice's parked reads.
[[session]]
user = "bob"
steps = [
    { wait = "connected" },
    { expect = '\([0-9]+\)> ' },
    { mark = "bob-in" },
    { exit = 0 },
]

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
forward = [22]
# ipd refuses the box's own addresses whatever the scope (docs/servers/ipd.md, R59).
self_forbidden = ["127.0.0.0/8", "10.0.2.15/32"]

[[net.peer]]
addr = "10.0.9.100:80"
connections = 1
