description = "DMA pages stay put (WP-K5b, OD2): a dma_alloc page is refused for lend, transfer and process_map, set_flags works, unmap drops only the mapping (the frames stay charged and are not handed out again), and a child that allocates and exits leaves its budget as it was. Empty virtio-mmio slots, no device behind them (checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
# The first program, so it holds every device object (INTERIM, kernel device.rs).
programs = ["dma-rules"]
timeout_secs = 30
expect = [
    '^\[dma-rules\] ok: a DMA page cannot be lent or transferred ',
    '^\[dma-rules\] ok: process_map refuses a DMA page ',
    '^\[dma-rules\] ok: set_flags on a DMA page: read-only, then read-write again$',
    '^\[dma-rules\] ok: unmap drops only the mapping: ',
    '^\[dma-rules\] ok: a child that allocated 4 DMA pages and exited leaves its budget as it was ',
    '^\[dma-rules\] DMA RULES PASSED$',
]
forbid = ['\[dma-rules\] FAIL', 'PROGRAM HALT']
poweroff = true

