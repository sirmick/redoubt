description = "The model's deliberate rule breaks (kernel/model.md, \"Mutations\"): each caught by some property, one job per mutation in release"
kind = "host-tests"
packages = ["redoubt-model"]
tests = ["mutations"]
profile = "release"
# The longest job is the late one's full search: 1,720 s on one core measured, and a third.
timeout_secs = 2294

# One core a job, so the jobs fit beside others on a shared machine.
[fanout]
each = "value"
env = "REDOUBT_MODEL_MUTATIONS"
values = "cargo run --quiet --profile release -p redoubt-model --example mutations"
late = [
    # Caught only at steward_policy's seed 4709, past the steward families' 500-seed cap: a known
    # weakness of the steward model, until MODEL1 removes this entry.
    "PolicyDeclassifyUnfit",
]
