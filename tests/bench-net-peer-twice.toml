description = "Bench self-check (must fail): the guest connects to the peer 10.0.9.100:7 twice, and the case expects once; the bench's count of the peer's connections must catch it"
arch = ["rv64", "rv32"]
kind = "boot"
# The real init, the servers, the judge and the clients (tests/data/net/twice.json).
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-net-tests", bin = "net-judge" },
    { package = "redoubt-net-client", bin = "net-client" },
]
timeout_secs = 120
expect = [
    '^init: the manifest is checked: 7 servers, bound \d+ pages$',
    '^init: started judge, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] judge ipd has a link ',
    '^\[con [0-9a-f]{16}\] judge ok: echo through 10\.0\.9\.100:7, 2 round\(s\): outcome 0$',
    '^\[con [0-9a-f]{16}\] judge ok: the listener accepted and echoed the bench.s dial \(1\)$',
    '^\[con [0-9a-f]{16}\] judge TEST PASSED$',
]
# A server or client that ends is restarted by init, and says so: none may.
forbid = ['init: refused the boot', '^init: \S+ .*(exited|faulted|was killed)', '^init: restarted ', 'judge FAIL']
reporter = "judge"
must_fail = '^peer 10\.0\.9\.100:7: 2 connections, expected 1$'

[[file]]
name = "manifest"
from = { path = "tests/data/net/twice.json" }

[net]
forward = [8000]
self_forbidden = ["10.0.2.0/24", "10.0.9.102/32", "0.0.0.0/8", "127.0.0.0/8", "224.0.0.0/4", "240.0.0.0/4", "255.255.255.255/32"]

[[net.peer]]
addr = "10.0.9.100:7"
connections = 1

[[net.dial]]
port = 8000
send = "d3 dial\n"
expect = "d3 dial\n"
