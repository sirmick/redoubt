description = "Bench self-check (must fail): the guest connects to the peer 10.0.9.100:7 twice, and the case expects once; the bench's count of the peer's connections must catch it"
arch = ["rv64"]
kind = "boot"
programs = [{ package = "redoubt-net-tests", bin = "net-rig-twice" }]
timeout_secs = 120
expect = [
    '^\[net-rig\] ok: echo through 10\.0\.9\.100:7, 2 round\(s\): exited 0$',
    '^\[net-rig\] ok: the listener accepted and echoed the bench.s dial \(1\)$',
    '^\[net-rig\] D3 NET TCP PASSED$',
]
forbid = ['\[net-rig\] FAIL']
poweroff = true
must_fail = '^peer 10\.0\.9\.100:7: 2 connections, expected 1$'

[net]
forward = [8000]
self_forbidden = ["10.0.2.0/24", "10.0.9.102/32", "0.0.0.0/8", "127.0.0.0/8", "224.0.0.0/4", "240.0.0.0/4", "255.255.255.255/32"]

[[net.peer]]
addr = "10.0.9.100:7"
connections = 1

[[net.dial]]
port = 8000
send = "d3 dial\n"
expect = "d3 dial\n"
