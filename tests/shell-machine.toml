description = "The shell's machine mode in a session over SSH (docs/userland/shell.md, \"The machine mode\"): alice's session enters the mode with machine(token) and reads the line's mark; it sends a three-line block ended by the token line, a function bound over three lines, which is evaluated whole, and a call to it, and reads each value and its `token n ok` mark, with no prompt and no echo between them; a block that raises is printed as its error and marked `token n error`; machine(nil) is marked, and the prompt follows it. The verdicts are the values and the marks the shell printed, in that order, and ssh's exit status (rule F)"
arch = ["rv64"]
kind = "boot"
recipe = "image/boot.toml"
# As shell-contexts: the principal's budget, holding a shell VM's session, needs the 1 GiB image.
memory_mib = 1024
timeout_secs = 150
expect = [
    '^init: started sshd, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] sshd: listening on port 22$',
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
]
forbid = [
    'init: refused the boot',
    'init: rebooting',
    '^init: .* (exited|faulted|was killed)',
    'init: restarted',
    'EXCEPTION',
    'steward: a step failed',
    'sshd: login .*: refused',
]

# In the mode nothing typed is echoed, so a pattern matches what the shell printed; the one echoed
# line, machine("agt2-tok-1"), holds no mark.
[[session]]
user = "alice"
pty = true
steps = [
    { expect = '/home/alice \(1\)> ' },
    { send = "machine(\"agt2-tok-1\")\n" },
    { expect = 'agt2-tok-1 1 ok' },
    { send = "agt2 = fn x ->\n  {:agt2, x + 1}\nend\nagt2-tok-1\n" },
    { expect = '#Function<' },
    { expect = 'agt2-tok-1 2 ok' },
    { send = "agt2.(41)\nagt2-tok-1\n" },
    { expect = '\{:agt2, 42\}' },
    { expect = 'agt2-tok-1 3 ok' },
    { send = "raise \"agt2 boom\"\nagt2-tok-1\n" },
    { expect = '\*\* \(RuntimeError\) agt2 boom' },
    { expect = 'agt2-tok-1 4 error' },
    { send = "machine(nil)\nagt2-tok-1\n" },
    { expect = 'agt2-tok-1 5 ok' },
    { expect = '/home/alice \(6\)> ' },
    { send = "exit\n" },
    { exit = 0 },
]

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
forward = [22]
