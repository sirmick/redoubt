description = "Every anonymous page a process is given is zero (freed-frame reuse: I9)"
# Coverage: this shows that every page the attacker gets is zero when mapped. It does not show
# that the victim's freed frames were among them: the attacker chooses what to lend and the
# kernel which frames to hand out. Reuse of freed frames needs the kernel's knowledge of
# physical addresses (the model's invariant I9).
arch = ["rv64", "rv32"]
kind = "boot"
# PID 3 mem-victim frees pages holding its secret and judges, on the boot endpoint's receive
# right; PID 4 mem-attack lends it every anonymous page it can get.
programs = ["log-server", "mem-victim", "mem-attack"]
expect = [
    '^\[pid 3\] \[mem-victim\] left the secret in 64 freed pages$',
    # Progress, the attacker's report.
    '^\[pid 4\] \[mem-attack\] lent 128 anonymous pages to the victim$',
    # The verdict, the victim's. Unforgeable: log-server prefixes it with the victim's
    # kernel-reported PID 3, and log-server powers off only when PID 3 reports DONE.
    '^\[pid 3\] \[mem-victim\] checked 128 pages from PID 4: all zero$',
    '^\[server\] done: reported by pid 3; still serving$',
]
# A page with data (the victim's report).
forbid = ['BREACH']
poweroff = true
reporter = "mem-victim"
