description = "A lease ends at its deadline and its sponsor is told (docs/servers/steward.md, \"Leases\" and R39; docs/userland/agents.md, \"Leases\" and \"A lease's end is the kernel's\"): alice's SSH session writes `echo hello` to ~/project/in and starts an agent with a ten-second lease through the steward's `start_agent`; the steward carves the lease from users/alice/{} with that deadline (the kernel's count of her sub-budget's carved processes rises by the lease's two), connects it to her ~/project and launches beamlet on the agent module, which writes its input back to ~/project/out/result and ends; the deadline destroys the lease's budget and the steward, told by the exit notice, audits the lease's end and sends `lease_ended` to alice's sessions, whose shells print `[lease alice/agent-1 ended]`; bob's session prints nothing of it; alice then reads the result the agent wrote, and the sub-budget is back to her two sessions. The steward runs on throughout. The verdicts are the steward's audit and usage lines (the kernel's counts), the notice the shell printed from the steward's send, and the file the agent wrote (rule F)"
arch = ["rv64", "rv32"]
kind = "boot"
recipe = "image/boot.toml"
# The image needs 1 GiB: the principals' budgets, each holding shell VMs' sessions and a lease,
# do not fit the users budget 256 MiB leaves (docs/kernel/budgets.md).
memory_mib = 1024
# Two logins and an agent's VM, one after the other.
timeout_secs = 1500
expect = [
    '^init: started sshd, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] sshd: listening on port 22$',
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
]
forbid = [
    'init: refused the boot',
    'init: rebooting',
    '^init: .* (exited|faulted|was killed)',
    'init: restarted',
    'EXCEPTION',
    'steward: a step failed',
    'steward: the core exited',
    'sshd: login .*: refused',
]
# The agent is carved from alice's unlabelled sub-budget: the lease's two processes more while it
# runs, then her two sessions again once the deadline took it; the steward's lines come in this order.
expect_after = [
    '^\[con [0-9a-f]{16}\] steward: audit 1001/\{\} at [0-9]+: AgentStarted \{ lease: [0-9]+, sponsor: 0, parent: None, deadline: [0-9]+ \}',
    '^\[con [0-9a-f]{16}\] steward: users/alice/\{\} holds [0-9]+ pages, 22 processes$',
    '^\[con [0-9a-f]{16}\] steward: audit 1001/\{\} at [0-9]+: LeaseEnded \{ lease: [0-9]+ \}',
    '^\[con [0-9a-f]{16}\] steward: users/alice/\{\} holds [0-9]+ pages, 20 processes$',
]

# Alice stages the agent's input, starts it, and waits for its end; every answer is tagged, so a
# pattern matches the shell's printed value and never the echo of the line typed.
[[session]]
user = "alice"
pty = true
steps = [
    { expect = '/home/alice \([0-9]+\)> ' },
    { send = "{:stage, File.mkdir_p(\"/home/alice/project/out\"), File.write(\"/home/alice/project/in\", \"echo hello\")}\n" },
    { expect = '\{:stage, :ok, :ok\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "{:ok, c} = Redoubt.Contexts.connection(); {:lease, Redoubt.Wire.Client.Steward.start_agent(c, 10_000_000)}\n" },
    { expect = '\{:lease, \{:ok, %\{lease: [0-9]+, name: "agent-1"\}\}\}' },
    { expect = '\([0-9]+\)> ' },
    { mark = "agent-started" },
    # The deadline's end, as the steward's send to this session, printed by the shell.
    { expect = '\[lease alice/agent-1 ended\]' },
    { send = "{:result, File.read(\"/home/alice/project/out/result\")}\n" },
    { expect = '\{:result, \{:ok, "echo hello\\n"\}\}' },
    { expect = '\([0-9]+\)> ' },
    { mark = "alice-done" },
    { exit = 0 },
]

# Bob's session runs beside it and is told nothing: the notice goes to the sponsor's sessions.
[[session]]
user = "bob"
pty = true
forbid = ['lease alice/agent-1 ended']
steps = [
    { expect = '/home/bob \([0-9]+\)> ' },
    { wait = "alice-done" },
    { send = "{:bob, :still_here}\n" },
    { expect = '\{:bob, :still_here\}' },
    { exit = 0 },
]

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
forward = [22]
