    '^\[!\] Terminating process with PID \d+$',
    '^\[!\] Terminating process with PID \d+$',
    '^\[!\] Terminating process with PID \d+$',
    '^\[!\] Terminating process with PID \d+$',
    '^\[!\] Terminating process with PID \d+$',
    '^\[!\] Terminating process with PID \d+$',
    '^\[!\] Terminating process with PID \d+$',
    '^\[console\] ok: 40 of 40 children killed$',
    '^\[console\] ok: the writer wrote \d+ lines beside the kills$',
    '^CONSOLE-ONE-WRITER TEST PASSED$',
