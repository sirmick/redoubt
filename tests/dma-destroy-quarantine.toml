description = "A device quarantined while a budget is destroyed still loses its handles (R10, I1, I2, I16; kernel/devices.md, \"Quarantine\"): a driver dma_allocs through the deaf slot and parks, then its budget is destroyed (not a fault), so a destruction runs with object-frame frees deferred when the slot's first reset fails (dma-reset-deaf); the destruction returns, every handle to the quarantined slot is gone (BadHandle), and the run's charge moves to the parent"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
kernel_features = ["dma-reset-deaf"]
# The first program, so it holds every device object (kernel/devices.md).
programs = ["dma-destroy-quarantine"]
# Beyond the program's 60 s wait for the driver's report, so a stuck check reports itself.
timeout_secs = 120
expect = [
    '^\[dma-destroy-quarantine\] ok: the driver dma_alloced through the deaf slot ',
    '^DMA: device [0-9a-f]+ did not confirm its reset; quarantined until reboot',
    '^\[dma-destroy-quarantine\] ok: the driver.s budget is destroyed, not faulted',
    '^\[dma-destroy-quarantine\] ok: every handle to the quarantined slot is gone ',
    '^\[dma-destroy-quarantine\] ok: its carve came back ',
    '^\[dma-destroy-quarantine\] DMA DESTROY QUARANTINE PASSED$',
]
forbid = ['\[dma-destroy-quarantine\] FAIL', 'PROGRAM HALT', 'PANIC']
poweroff = true
