description = "init boots the image's six servers from the boot manifest (servers/init.md, \"Starting the servers\"): it checks the manifest whole, starts keyd and finds it holds none of the keys the box is authenticated by, gives the UART up to consoled and writes through it, starts the rest with a console connection each, pushes the public entries to bootfsd and seals it, and no server exits"
arch = ["rv64", "rv32"]
kind = "boot"
# The real init in its place, the six servers' images and the image's manifest as bundle entries.
# Every verdict is init's own line, on the UART it maps and then through consoled; a refusal
# would be init's line and a power-off reporting a system failure.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
]
timeout_secs = 60
expect = [
    '^init: up$',
    '^init: the manifest is checked: 6 servers, bound \d+ pages$',
    '^init: started keyd$',
    '^init: keyd holds none of the 1 keys$',
    '^init: started consoled, and writes through it$',
    '^init: started bootfsd, console [0-9a-f]{16}$',
    '^init: started blkd, console [0-9a-f]{16}$',
    '^init: started netd, console [0-9a-f]{16}$',
    '^init: started ipd, console [0-9a-f]{16}$',
    '^init: 0 public entries pushed to bootfsd, and sealed$',
    # The manifest's two handed items and the four consoles after consoled's, each found gone.
    '^init: holds none of the 2 badges and 4 console connections it handed$',
    '^init: the boot is done: 6 servers, root holds \d+ pages for it, within the bound of \d+$',
]
forbid = ['init: refused the boot', '^init: .* (exited|faulted|was killed), code']

[[file]]
name = "manifest"
from = { path = "image/manifest.json" }

[disk]
size_kib = 4096
partitions = 1

[net]
