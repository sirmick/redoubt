description = "The image's bundle, packed from image/boot.toml as ./mkimage packs it, on the image's disk, packed from image/disk.toml as ./mkimage packs it, and its read-only userland disk, packed from image/userland.toml, boots to init's last line (servers/init.md, \"Starting the servers\"): init checks the manifest whole, starts keyd and finds it holds none of the keys the box is authenticated by, gives the UART up to consoled and writes through it, starts the rest with a console connection each, pushes the public entries to bootfsd and seals it, holds no more of root than its bound, and no server exits"
arch = ["rv64", "rv32"]
kind = "boot"
# The recipe's bundle: the kernel, the real init, the servers' images and beamlet's, the userland disk's
# system.index, public, and the image's manifest. Every verdict is init's own line, on the UART it maps and then through consoled; a
# refusal would be init's line and a power-off reporting a system failure.
recipe = "image/boot.toml"
# The image needs 1 GiB: beamlet's budget, twice the shell VM's use at its prompt, does not fit
# the system budget a quarter of 256 MiB gives (docs/kernel/budgets.md).
memory_mib = 1024
timeout_secs = 60
expect = [
    '^init: up$',
    '^init: the manifest is checked: 10 servers, bound \d+ pages$',
    '^init: started keyd$',
    '^init: keyd holds none of the 1 keys$',
    '^init: started consoled, and writes through it$',
    '^init: started bootfsd, console [0-9a-f]{16}$',
    '^init: started blkd, console [0-9a-f]{16}$',
    '^init: started netd, console [0-9a-f]{16}$',
    '^init: started ipd, console [0-9a-f]{16}$',
    '^init: started fsd:data, console [0-9a-f]{16}$',
    '^init: started blkd:system, console [0-9a-f]{16}$',
    '^init: started fsd:system, console [0-9a-f]{16}$',
    '^init: started beamlet, console [0-9a-f]{16}$',
    '^init: 1 public entries pushed to bootfsd, and sealed$',
    # The manifest's four handed items, the two volumes' ranges, and the eight consoles after
    # consoled's, each found gone.
    '^init: holds none of the 6 badges and 8 console connections it handed$',
    '^init: the boot is done: 10 servers, root holds \d+ pages for it, within the bound of \d+$',
]
forbid = ['init: refused the boot', '^init: .* (exited|faulted|was killed), code']

# The image's disk recipe, holding the fsd cases' stage rather than target/image/stage, which a
# fresh checkout does not have.
[disk]
recipe = "image/disk.toml"
stage = "tests/data/fsd/stage"

[userland]
recipe = "image/userland.toml"

[net]
