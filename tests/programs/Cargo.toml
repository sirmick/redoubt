[package]
name = "test-programs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "no_std programs that run inside Redoubt under the test bench (redoubt/testbench)"
autobins = false

[dependencies]
uart_16550 = { version = "0.3", default-features = false }
redoubt-sys = { path = "../../libs/sys" }
# The kernel-half addresses the attack cases aim at, from their one definition.
redoubt-layout = { path = "../../libs/layout" }
# Only for the stub launcher: the startup-block builder, and the stub's own fixed
# address/bounds-checking constants. Every other test program stays on the raw `rd` wrapper.
redoubt-rt = { path = "../../libs/rt" }
stub = { path = "../../stub" }
