description = "Budget churn gains nothing (pass inheritance), by carving: a shell that keeps giving a budget half its weight and taking it back leaves the victim at least its share, its lifts recomputed by the oracle; the victim's share judged by the post-check on the kernel's charges net of lock waits (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-budget-churn-shell"]
# Test builds only: the trace ring (never in a default kernel). The oracle checks every pick, and
# recomputes every lift (a destroyed child's work moving to its parent) from the rule: the lift
# wiring, which the victim's share alone cannot see (a churner pays more for spawning and for R10
# than a wrong lift could give it back). It also judges the victim's share of what the kernel charged
# in the window the program prints (`HART-SHARE`), net of lock waits; audits are charged to no one.
kernel_features = ["sched-trace"]
post_check = "sched_oracle"
# One hart until destruction's work leaves the kernel lock (kernel/scheduling.md, "Fair kernel
# entry is bounded by count"): at two harts the shell's create and destroy calls hold the lock and
# the victim's hart waits for it, 848 ms of 2 s, so even net of the waits it keeps a third (326
# rv64, 406 rv32). sched-budget-churn judges the other variants at two.
keep_smp = true
timeout_secs = 600
expect = [
    '^HART-SHARE shell \d+ \d+ 50\+ 2:1 100:2$',
    '^SCHED-BUDGET-CHURN-SHELL TEST PASSED$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['\[budget-churn-shell\] FAIL']
poweroff = true
