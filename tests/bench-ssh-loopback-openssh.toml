description = "Bench self-check, the reference case: concurrent scripted SSH sessions, ordered by marks, exit statuses checked, a pty and a refused key, against OpenSSH's server in a QEMU guest, the session runner's independent witness"
kind = "ssh-loopback"
server = "openssh"
timeout_secs = 20
# ssh starts OpenSSH's sshd itself (inetd mode) in a QEMU guest of its own for each session; it
# runs /bin/sh for every login and accepts only these test keys. It logs in only root in its
# guest, so `user` here only chooses the key and names the log (docs/testbench.md).
authorized = ["alice", "bob"]
# The server is OpenSSH's: no other server logs this.
server_log = ['^debug1: sshd-session version OpenSSH_']

[[session]]
user = "alice"
steps = [
    { send = "echo alice-$((6 * 7))\n" },
    { expect = '^alice-42$' },
    { mark = "alice-in" },
    { wait = "bob-done" },
    { send = "exit 3\n" },
    { exit = 3 },
]

# Ends the default way: input closed, and ssh must exit with status 0.
[[session]]
user = "bob"
steps = [
    { wait = "alice-in" },
    { send = "echo bob-was-here\n" },
    { expect = '^bob-was-here$' },
    { mark = "bob-done" },
]

# A terminal session: the login name's `+label` is not part of the key's name.
[[session]]
user = "alice+tty"
pty = true
steps = [
    { send = "tty; exit\n" },
    { expect = '/dev/pts/\d+' },
]

# A key the server does not accept: ssh's refusal is output, and its status is checked.
[[session]]
user = "mallory"
steps = [
    { expect = 'Permission denied \(publickey\)' },
    { exit = 255 },
]
