description = "The attack: a process of beamlet's VM floods its heap (docs/userland/beamlet.md, \"Limits inside one VM\"). The platform sets the process heap limit to a sixteenth of the VM's budget, so the process is killed in Erlang while the VM still has pages: the module sees it go, the same VM still reads and echoes a typed line, and init's line that beamlet exited with code 0 is the system's verdict that the flood did not end the VM (rule F)"
arch = ["rv64", "rv32"]
kind = "boot"
# As beamlet-boot, with the flooding module and the OTP modules it needs on the userland disk, and
# the budget's pages given to beamlet again as an argument (a program cannot read its budget).
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-erofsd", bin = "erofsd" },
    { package = "beamlet-redoubt", bin = "beamlet", workspace = "userland/otp" },
]
timeout_secs = 60
expect = [
    '^init: started beamlet, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] beamlet-heap-flood: flooding$',
    '^\[con [0-9a-f]{16}\] beamlet-heap-flood: the flood ended: killed$',
    '^\[con [0-9a-f]{16}\] beamlet-heap-flood: type a line$',
    '^\[con [0-9a-f]{16}\] echo: still served after the flood$',
    '^init: beamlet \(PID [0-9]+\) exited, code 0$',
]
forbid = [
    'init: refused the boot',
    'exited, code 101',
    '^init: (keyd|consoled|bootfsd) .*(exited|faulted|was killed)',
    '^init: restarted (keyd|consoled|bootfsd)\b',
    'init: rebooting',
]

[[input]]
after = '^\[con [0-9a-f]{16}\] beamlet-heap-flood: type a line$'
send = "still served after the flood\n"

[[file]]
name = "manifest"
from = { path = "tests/data/beamlet/flood.json" }

[userland]
recipe = "tests/data/beamlet/userland.toml"
