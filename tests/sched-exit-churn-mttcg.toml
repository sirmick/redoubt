description = "sched-exit-churn where the harts run at once (multi-threaded TCG, no icount): the three victims keep at least their share of the harts by the kernel's charges net of lock waits, and the timer work billed to others in each one's time, the attacker's poll timeouts whose payer runs nowhere while it waits, is at most 10 of 1000 of its charges, which under icount only the order of QEMU's turns decides (kernel/timer.md, \"R12 (scheduling) for timer work\") (host time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
programs = ["sched-exit-churn"]
# Test builds only: the trace ring (never in a default kernel), which needs a checked build; its
# audits are charged to no one, and so is a wait behind another hart's audit.
kernel_features = ["sched-trace"]
# The icount case's program at two harts, judged on the host clock. A one-thread attacker's poll
# timeout has a payer that runs nowhere while it waits, so every hart's timer comes by it and the
# victim's hart answers about half: the rule's own residual. Five runs a width alone on the quiet
# cores, against threads that exit: 0 of 1000 throughout (rv64; 6,023 to 12,887 ticks; the
# victim's share 508 to 509) and 5, 4, 2, 1, 4 (rv32; 35,908 to 111,457; 513 to 530); against
# processes that exit and that fault 0 (one run 1,113 ticks). Under icount the same count reads
# QEMU's turn order: 20 of 1000 (164 interrupts, 323,661 ticks) on rv64 and 0 on rv32 in one run
# each, so the icount case records it and this one judges it, on the quiet core set, one such
# case at a time.
post_check = "sched_oracle foreign_timer_in=threads-exit:10 foreign_timer_in=processes-exit:10 foreign_timer_in=processes-fault:10"
smp = [2]
keep_smp = true
timeout_secs = 300
expect = [
    '^HART-SHARE threads-exit \d+ \d+ 50\+ 2:1 100:2$',
    '^HART-SHARE processes-exit \d+ \d+ 50\+ 3:1 100:2$',
    '^HART-SHARE processes-fault \d+ \d+ 50\+ 4:1 100:2$',
    '^SCHED-EXIT-CHURN TEST PASSED$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['\[exit-churn\] FAIL']
poweroff = true
