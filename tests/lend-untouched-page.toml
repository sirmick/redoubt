description = "Lending, mutably lending or moving anonymous pages never touched is served, a half-mapped range is refused whole, and running past RAM is the caller's error (verdict: survival only) (checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
# Built with the checks on (docs/testbench.md, "Debug assertions").
debug_assertions = true
# 32 MiB so the lend-past-RAM step (12k pages = 48 MiB) exhausts RAM in milliseconds.
memory_mib = 32
# PID 2 log-server; PID 3 lend-untouched makes every attempt, then reports DONE.
programs = ["log-server", "lend-untouched"]
smp = [1, 4]
timeout_secs = 30
# The kernel once backed such pages while holding its memory-manager cell and panicked ("RefCell
# already borrowed"; with `smp`, a deadlock and a timeout), left a half-mapped range half lent,
# and panicked when backing ran out of RAM. PANIC is always forbidden, and the verdict is
# log-server's DONE line naming PID 3 and its clean power-off: a kernel that panicked on any
# attempt never reaches it. The attacker's own lines are progress only. `[server] moved page` and
# relayed `[pid N]` lines are client-triggerable, so they are never the verdict.
expect = [
    '^\[pid 3\] \[untouched\] half-mapped lend refused: true$',
    '^\[pid 3\] \[untouched\] lend beyond RAM: Err\(OutOfMemory\)$',
    '^\[server\] done: reported by pid 3; still serving$',
]
forbid = ['FAIL', ': false$']
poweroff = true
reporter = "lend-untouched"
