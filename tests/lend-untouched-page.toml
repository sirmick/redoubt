description = "Lending, writably lending or transferring stack pages never touched is served, a half-mapped range is refused whole, and asking past RAM is the caller's error (verdict: survival only) (checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
# Built with the checks on (docs/testbench.md, "Checked builds").
debug_assertions = true
# 32 MiB so the map-past-RAM step (12k pages = 48 MiB) is past RAM.
memory_mib = 32
# PID 2 lend-untouched, alone in init's place: only the program the loader starts has a stack
# reservation, pages never touched. It serves its own log endpoint on a second thread, which
# receives the lends, makes every attempt, then powers off. Behind the tester its stack would be
# backed, and the case would pass without reaching the kernel path it attacks.
programs = ["lend-untouched"]
smp = [1, 4]
timeout_secs = 30
# The kernel once backed such pages while holding its memory-manager cell and panicked ("RefCell
# already borrowed"; with `smp`, a deadlock and a timeout), left a half-mapped range half lent,
# and panicked when backing ran out of RAM. PANIC is always forbidden, and the verdict is the
# clean power-off, which only this program can ask for and only after every attempt: a kernel
# that panicked on any attempt never reaches it. Its own lines are progress only.
expect = [
    '^\[pid 2\] \[untouched\] lend Ok\(\(\)\), writable lend Ok\(\(\)\)$',
    '^\[pid 2\] \[untouched\] half-mapped lend refused: true$',
    '^\[pid 2\] \[untouched\] transfer Ok\(\(\)\)$',
    '^\[pid 2\] \[untouched\] map beyond RAM: Err\(OutOfMemory\)$',
    '^\[pid 2\] \[untouched\] every attempt made; powering off$',
]
forbid = ['FAIL', ': false$']
poweroff = true
