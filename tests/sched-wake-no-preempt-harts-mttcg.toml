description = "sched-wake-no-preempt-harts where the harts run at once (multi-threaded TCG, no icount): a sleeper's hundred and twenty timeouts take no hart from the thread whose entry answered them, and at least five came mid-slice, which under icount only the order of QEMU's turns decides (kernel/scheduling.md, \"Preemption points\") (host time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
programs = ["sched-wake-no-preempt-harts"]
kernel_features = ["sched-trace"]
post_check = "sched_oracle wake_no_preempt=120 wake_witnesses=5 wake_mid_slice=5"
# The icount case's program and naps. Ten runs alone on quiet cores, each width, read 52 to 78
# mid-slice and 30 to 60 at a call (rv64), 57 to 71 and 30 to 44 (rv32). A kernel built with
# `wake-preempts` fails it on both widths (wake took hart 0 from budget 34, rv64; from 37, rv32),
# a recorded run each.
smp = [2]
keep_smp = true
timeout_secs = 120
expect = [
    '^\[wake\] the shortest delay from a nap.s start to the sleeper.s run was \d+ µs$',
    '^SCHED-WAKE-NO-PREEMPT TEST PASSED$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['PROGRAM HALT']
poweroff = true
