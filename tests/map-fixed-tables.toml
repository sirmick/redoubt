description = "map_fixed's page-table count across a gigabyte (R22, I14): unmap frees the 514 tables a setup made, and a range of the most a call may name across a gigabyte boundary, needing 4 tables, is refused one table short with nothing charged instead of panicking the kernel"
arch = ["rv64"]
kind = "boot"
icount = "shift=3,sleep=off"
debug_assertions = true
# PID 2 log-server; PID 3 map-fixed-tables, the one program it starts, in its own budget: all
# of system's free pages bar one, 15 processes, weight 1,000. Before the tester it ran alone in
# init's place, in system. Every verdict is its own budget's usage or a kernel error, printed
# under the place only the tester gives it, and nothing else runs beside it (docs/testbench.md,
# "Rule F").
programs = ["log-server", "map-fixed-tables"]
timeout_secs = 60
expect = [
    '^\[pid 3\] \[map-fixed-tables\] ok: unmap freed every page table the setup made$',
    '^\[pid 3\] \[map-fixed-tables\] ok: one page table short across a gigabyte is refused$',
    '^\[pid 3\] \[map-fixed-tables\] ok: nothing charged$',
    '^\[pid 3\] \[map-fixed-tables\] MAP-FIXED TABLES TEST PASSED$',
]
forbid = ['\[map-fixed-tables\] FAIL', 'PANIC']
poweroff = true
reporter = "map-fixed-tables"
