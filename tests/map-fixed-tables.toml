description = "map_fixed's page-table count across gigabytes (R22, I14): unmap frees the 514 tables a setup made, and a range needing 515 tables across a gigabyte boundary is refused one table short with nothing charged instead of panicking the kernel"
arch = ["rv64"]
kind = "boot"
debug_assertions = true
# `system` gets a quarter of RAM and must afford the 261634-page range; the guest touches ~130 MiB.
memory_mib = 4608
programs = ["map-fixed-tables"]
# 120, not less: a regression maps and zeroes the whole 1 GiB (about a minute) before its last
# `alloc_page` fails, so the kernel PANIC is only seen after that.
timeout_secs = 120
expect = [
    '^\[map-fixed-tables\] ok: unmap freed every page table the setup made$',
    '^\[map-fixed-tables\] ok: one page table short across two gigabytes is refused$',
    '^\[map-fixed-tables\] ok: nothing charged$',
    '^\[map-fixed-tables\] MAP-FIXED TABLES TEST PASSED$',
]
forbid = ['\[map-fixed-tables\] FAIL', 'PANIC']
poweroff = true
