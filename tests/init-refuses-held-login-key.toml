description = "init refuses a manifest that gives keyd a principal's login key (R35): one line saying where and why, then a power-off reporting a system failure (system_reset kind 3, status 255), after keyd alone has run"
arch = ["rv64", "rv32"]
kind = "boot"
# The real init, the images its manifest names, and the manifest: image/manifest.json with alice,
# whose login key is the public half of keyd's ssh_host seed. The verdict is init's line and the
# firmware's status, which only system_reset kind 3 gives.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
]
timeout_secs = 30
expect = ['^init: started keyd$', '^init: refused the boot: principals\[0\]\.ssh_keys\[0\]: keyd holds this key, and the box is authenticated by it \(R35\)$']
forbid = ['^init: started consoled', '^init: keyd holds none']
poweroff = true
poweroff_status = 255

[[file]]
name = "manifest"
from = { path = "tests/data/init/held-login-key.json" }
