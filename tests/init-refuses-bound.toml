description = "init refuses a manifest that would cost init more of root than INIT_PAGES keeps: one line saying where and why, then a power-off reporting a system failure (system_reset kind 3, status 255), before any server runs"
arch = ["rv64", "rv32"]
kind = "boot"
# The real init, the images its manifest names, and the manifest: image/manifest.json with eight
# more servers receiving on 60 endpoints each, a page of root's apiece. The verdict is init's line
# and the firmware's status, which only system_reset kind 3 gives.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
]
timeout_secs = 30
expect = ['^init: refused the boot: the boot would cost init \d+ pages of root and root keeps \d+ \(INIT_PAGES\)$']
forbid = ['^init: started']
poweroff = true
poweroff_status = 255

[[file]]
name = "manifest"
from = { path = "tests/data/init/bound.json" }
