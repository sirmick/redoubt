description = "init refuses a manifest that would cost init more of root than INIT_PAGES keeps: one line saying where and why, then a power-off reporting a system failure (system_reset kind 3, status 255), before any server runs"
arch = ["rv64", "rv32"]
kind = "boot"
icount = "shift=3,sleep=off"
# The real init, the images its manifest names, and the manifest: image/manifest.json with eight
# more servers receiving on 60 endpoints each, a page of root's apiece, and s7's program a batch
# of zeros (below). The verdict is init's line and the firmware's status, which only system_reset
# kind 3 gives.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
]
timeout_secs = 10
# The printed bound, so the number is real: the same on both widths, the image term in it being
# one batch.
expect = ['^init: refused the boot: the boot would cost init 1047 pages of root and root keeps 1023 \(INIT_PAGES\)$']
forbid = ['^init: started']
poweroff = true
poweroff_status = 255

[[file]]
name = "manifest"
from = { path = "tests/data/init/bound.json" }

# The refusal comes from the servers, their endpoints and init's own costs (980 pages) and one
# batch of the largest image with its tables (64 + 3): any image of 64 pages or more counts that
# one batch, and ipd's already does, so the size of this entry does not move the bound. s7 only
# needs a program, here a batch (64 pages of 4 KiB) of zeros; init refuses on the bound before it
# reads any image, so the entry's bytes never need to be an ELF.
[[file]]
name = "big"
from = { zeros = 262144 }
