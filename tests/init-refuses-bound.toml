description = "init refuses a manifest that would cost init more of root than INIT_PAGES keeps: one line saying where and why, then a power-off reporting a system failure (system_reset kind 3, status 255), before any server runs"
arch = ["rv64", "rv32"]
kind = "boot"
# The real init, the images its manifest names, and the manifest: image/manifest.json with eight
# more servers receiving on 60 endpoints each, a page of root's apiece, and s7's program 6 MiB of
# zeros (below). The verdict is init's line and the firmware's status, which only system_reset
# kind 3 gives.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
]
timeout_secs = 30
# The printed bound, so the number is real: the same on both widths, the image term in it being
# the entry's length.
expect = ['^init: refused the boot: the boot would cost init 2521 pages of root and root keeps 2047 \(INIT_PAGES\)$']
forbid = ['^init: started']
poweroff = true
poweroff_status = 255

[[file]]
name = "manifest"
from = { path = "tests/data/init/bound.json" }

# The largest image is the one term of the bound that reaches INIT_PAGES: no manifest gets there
# through endpoints, which each server's 64 start handles and system's 15 processes cap. s7's
# program is 6 MiB of zeros; init refuses on the bound before it reads any image, so the entry's
# bytes never need to be an ELF.
[[file]]
name = "big"
from = { zeros = 6291456 }
