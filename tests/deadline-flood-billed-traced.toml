description = "A deadline's whole destruction is billed to the dying budget's parent across harts (R10, R12): deadline-flood-billed's creator and victim with the trace in a checked build, the victim keeping at least its share of the harts by the kernel's charges net of lock waits (virtual time)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["deadline-flood-billed"]
# Test builds only: the trace ring (never in a default kernel), which needs a checked build; its
# audits are charged to no one. Under icount a count is the machine's instructions, not a hart's
# time, so the victim's share is the kernel's charges (`HART-SHARE`); the counts' bounds are the
# release twin's.
kernel_features = ["sched-trace"]
# Judged at the bench's harts. At two the destructions land on the creator's hart, whose timer
# alone is armed for its deadlines while it runs, or at the creator's own entries; the timer work
# billed to others in the victim's time is bounded at 10 of 1000 of its charges (`foreign_timer_in`,
# judged at two harts, recorded at one). Before the placement the destructions ran on whichever
# hart's timer came first, and the victim's share followed where they landed: mostly on the
# creator's hart (91 of 96 on rv64 and 77 of 80 on rv32 with 16 deadlines, 124 and 125 of 128
# with 64) it kept about 870 of 1000; mostly on its own (87 of 96, rv64, 16 deadlines, in one
# build) 482, near the bound, which no pick can repay a one-thread victim (kernel/timer.md, "R12
# (scheduling) for timer work"). With it: TBD-GATE.
post_check = "sched_oracle foreign_timer_in=16-deadlines:10 foreign_timer_in=64-deadlines:10"
timeout_secs = 600
expect = [
    '^HART-SHARE 16-deadlines \d+ \d+ 50\+ 2:1 100:1$',
    '^HART-SHARE 64-deadlines \d+ \d+ 50\+ 3:1 100:1$',
    '^DEADLINE-FLOOD-BILLED TEST PASSED$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['PANIC']
poweroff = true
