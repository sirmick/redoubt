description = "Device objects are the only authority: a process holding none cannot receive on an interrupt, map an MMIO range, allocate DMA, reach the Reset right or name RAM by physical address, and the victim that holds them keeps hearing its interrupt (checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
# Built with the checks on (docs/testbench.md, "Debug assertions").
debug_assertions = true
# PID 2 log-server is the victim: as the bundle's first program it holds every device object
# (INTERIM, kernel device.rs), maps the console and waits for its interrupt in `receive`.
# PID 3 irq-attack holds the boot endpoint and its log handle, and attacks from there.
programs = ["log-server", "irq-attack"]
timeout_secs = 30
expect = [
    # Victim, unforgeable: an unprefixed line comes only from log-server's fixed templates
    # (console::Line), and no client request can make it print this one
    # (bench-attack-forgery checks that for every path a client's text can take).
    '^\[server\] holding the console irq$',
    # Progress, the attacker's report: each refusal, and for the right reason. A refusal for
    # the wrong reason prints FAIL, which is forbidden.
    '^\[pid 3\] \[irq-attack\] ok: receive on an irq handle it does not hold',
    '^\[pid 3\] \[irq-attack\] ok: mapping the console.s mmio',
    '^\[pid 3\] \[irq-attack\] ok: map_anon first word -> Ok\(0\)$',
    '^\[pid 3\] \[irq-attack\] ok: wrong kind',
    '^\[pid 3\] \[irq-attack\] attempts done$',
    # The verdict, the victim's: the machine is still up (a stolen Reset right would have
    # powered it off), and the console's interrupt is still the victim's, so a byte sent after
    # every attempt reaches its `receive`. Only log-server's interrupt thread prints this.
    "^\\[server\\] irq: received 'y'$",
]
forbid = ['\] FAIL', 'BREACH']

[[input]]
after = '^\[pid 3\] \[irq-attack\] attempts done$'
send = "y"
