description = "Exiting on the CPU is charged (trap-boundary accounting): threads that exit, processes that exit and processes that fault leave an equal-weight victim at least its share of the harts, judged by the post-check on the kernel's charges net of lock waits (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-exit-churn"]
# Test builds only: the trace ring (never in a default kernel). The oracle checks every pick, and
# judges the victim's share of what the kernel charged in the window the program prints
# (`HART-SHARE`), net of lock waits; audits are charged to no one, and so is a wait behind another
# hart's audit. Each variant is judged at whatever harts the run has.
kernel_features = ["sched-trace"]
post_check = "sched_oracle"
timeout_secs = 600
expect = [
    '^HART-SHARE threads-exit \d+ \d+ 50\+ 2:1 100:2$',
    '^HART-SHARE processes-exit \d+ \d+ 50\+ 3:1 100:2$',
    '^HART-SHARE processes-fault \d+ \d+ 50\+ 4:1 100:2$',
    '^SCHED-EXIT-CHURN TEST PASSED$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['\[exit-churn\] FAIL']
poweroff = true
