description = "Rule 3's refusals at the client (docs/servers/steward.md, \"Contexts\" and \"Residual risks\"; docs/userland/sessions.md, \"Contexts\"): thirty logins with alice's key, one after another, ten each of an unknown principal (carol), a known principal with a wrong key (bob) and a label set alice does not have (alice+nosuch), interleaved so drift falls on all three alike. Each is refused as the same Permission denied at the client and as BadKey at sshd, and each session's log notes how long after its ssh started the refusal came: the report compares the three kinds' medians against their spread. The verdicts are sshd's refusals and each ssh's exit status (rule F); the times are a measurement, not a verdict, and the case holds each refusal to the case's deadline only"
arch = ["rv64", "rv32"]
kind = "boot"
recipe = "image/boot.toml"
# The image needs 1 GiB: the principals' budgets, each holding a shell VM's session, do not fit
# the users budget 256 MiB leaves (docs/kernel/budgets.md).
memory_mib = 1024
# Thirty refusals of about a second each, one after another: well inside this.
timeout_secs = 600
expect = [
    '^init: started sshd, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] sshd: listening on port 22$',
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
]
forbid = [
    'init: refused the boot',
    'init: rebooting',
    '^init: .* (exited|faulted|was killed)',
    'init: restarted',
    'EXCEPTION',
    'steward: the core exited',
    'sshd: login (carol|bob|alice\+nosuch): session',
]
expect_after = [
    '^\[con [0-9a-f]{16}\] sshd: login carol: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login bob: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login alice\+nosuch: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login carol: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login bob: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login alice\+nosuch: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login carol: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login bob: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login alice\+nosuch: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login carol: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login bob: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login alice\+nosuch: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login carol: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login bob: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login alice\+nosuch: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login carol: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login bob: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login alice\+nosuch: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login carol: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login bob: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login alice\+nosuch: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login carol: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login bob: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login alice\+nosuch: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login carol: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login bob: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login alice\+nosuch: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login carol: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login bob: refused \(BadKey\)$',
    '^\[con [0-9a-f]{16}\] sshd: login alice\+nosuch: refused \(BadKey\)$',
]

[[session]]
user = "carol"
name = "t0"
key = "alice"
steps = [{ expect = 'Permission denied \(publickey\)' }, { exit = 255 }, { mark = "t0" }]

[[session]]
user = "bob"
name = "t1"
key = "alice"
steps = [{ wait = "t0" }, { expect = 'Permission denied \(publickey\)' }, { exit = 255 }, { mark = "t1" }]

