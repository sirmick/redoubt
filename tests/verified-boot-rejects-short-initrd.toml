description = "The loader refuses an initrd too short to carry a signature (R17): the signed bundle's first 63 bytes"
arch = ["rv64", "rv32"]
kind = "boot"
icount = "shift=3,sleep=off"
programs = ["log-server"]
timeout_secs = 10
# One byte short of a signature: the loader must refuse before it reads anything as one, so
# the bytes are a real signature's prefix and nothing after it.
short_initrd = 63
allow_panic = true          # the loader is supposed to panic here
# The verdict is the loader's own: nothing from the bundle runs (KMAIN is forbidden), so no
# program can print it. Anchored, so a relayed `[pid N]` line could not match either.
expect = ['^loader PANIC', 'initrd is too small to be signed']
forbid = ['KMAIN', 'bundle signature ok']
poweroff = true             # and the refusal stops the machine, rather than limping on
poweroff_status = 255       # RustSBI preserves the loader's SBI SystemFailure reason
