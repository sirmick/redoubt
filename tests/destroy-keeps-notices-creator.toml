description = "R4b, R10 and exit notices: destroying a budget B feeds no notice to a process in a live budget whose process object B pays for, which the same destruction kills; B's process's notice reaches its creator, and the killed child's is never made (checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
# The program runs first and judges from the kernel's answers: the notices its receive returns.
programs = ["destroy-keeps-notices-creator"]
timeout_secs = 60
expect = [
    '^\[destroy-keeps-notices-creator\] ok: P started C in L, and C is receiving on E$',
    '^\[destroy-keeps-notices-creator\] ok: E holds P.s notice, cause killed \(pid \d+\)$',
    '^\[destroy-keeps-notices-creator\] ok: E holds nothing else: C.s notice is never made$',
    '^DESTROY-KEEPS-NOTICES-CREATOR TEST PASSED$',
]
forbid = ['\[destroy-keeps-notices-creator\] FAIL', 'PANIC']
poweroff = true
