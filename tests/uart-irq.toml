description = "An external interrupt reaches a driver through `receive` on its IRQ handle (R5: the kernel masks the source and sets `fired`, the next receive unmasks it and returns; no acknowledge call), with the console taken through `map_device` and injected console input (checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
# Built with the checks on (docs/testbench.md, "Debug assertions").
debug_assertions = true
# PID 2 log-server is the bundle's first program, so it holds every device object the loader
# made (INTERIM, kernel device.rs): it maps the console through its MMIO handle and echoes
# every byte from a thread blocked in `receive` on the console's IRQ handle, which is the
# authority (DEVICE-GRANTS.md, Replacement).
programs = ["log-server"]
# The server reads **one byte per interrupt**, so every byte needs an interrupt of its own and
# the FIFO is left with data in it. What that pins: a kernel whose `receive` does not unmask
# the source echoes nothing at all, and one that unmasks only the first time stops after 'x'.
# The first three bytes are typed one at a time, each only after the one before was echoed;
# the last two are typed together, so the second is answered from a source that fired while
# the driver was running rather than from a fresh keystroke.
#
# Two halves of R5 this still does not catch, tried and measured rather than assumed:
#
# - **the masking.** A kernel that never masks a fired source was expected to trap for ever on
#   the still-asserted level and never reach userspace. It does not, here: QEMU's 16550 sets
#   the controller's pending bit once per byte it pushes rather than from a continuing level,
#   so with the FIFO unread and the claim completed nothing re-raises. The case passes with the
#   masking deleted. It would not on hardware that holds the line.
# - **the completion order.** The PLIC specification says a completion for a source that is not
#   enabled is silently ignored, so completing after masking would lose the source for good;
#   QEMU 8.2 accepts it anyway, and no case can tell the two orders apart on this machine.
#
# Both are matters of reading the kernel until there is a device model that holds a level.
expect = [
    '^\[server\] holding the console irq$',
    "^\\[server\\] irq: received 'x'$",
    "^\\[server\\] irq: received 'y'$",
    "^\\[server\\] irq: received 'z'$",
    "^\\[server\\] irq: received 'p'$",
    "^\\[server\\] irq: received 'q'$",
]

[[input]]
after = '^\[server\] PID 2 listening$'
send = "x"

[[input]]
after = "^\\[server\\] irq: received 'x'$"
send = "y"

[[input]]
after = "^\\[server\\] irq: received 'y'$"
send = "z"

# Two at once: the second byte is still in the FIFO when the driver receives again.
[[input]]
after = "^\\[server\\] irq: received 'z'$"
send = "pq"
