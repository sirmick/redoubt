description = "The model's two steward families at their counts (kernel/model.md), each a job on four cores, and the check that their coverage table is reproduced"
kind = "host-tests"
packages = ["redoubt-model"]
tests = ["properties", "steward_reach"]
filter = ["steward_policy", "steward_noninterference", "the_reach_table_is_reproduced"]
fanout = { each = "test", cores = 4, vars = { MODEL_THREADS = "{cores}" } }
# steward_policy is the longest job: 26 s on four cores measured, and a third.
timeout_secs = 35
