description = "sched-capped where the harts run at once (multi-threaded TCG, no icount): the late join, uncap and spread scenarios judged at two harts and the second cap at three, on the kernel's charges net of lock waits against water-filling, within 50 per thousand, which sched-capped under icount only records at two and three harts: there a hart's clock counts the other harts' turns, which can fall in time billed to nobody, and three slice ends meet at the kernel lock in an order QEMU's turns fix (kernel/scheduling.md, \"Residual risks\") (host time, checked build, two and three harts)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
programs = ["sched-capped"]
# Five runs alone on quiet cores, each width, read late-a 497 to 501, late-b and late-c 249 to
# 251, uncap 818 to 819 and 89 to 91, spread 496 to 503 (owed 500, 250, 818, 90 and 500). The
# same program on the `sched-capped-holds-floor` kernel here misses late join: late-b 30 and
# late-c 470 (rv64), 31 and 469 (rv32), a recorded run each.
# At three harts (B63), five runs a width alone on the quiet cores: second-a 327 to 328 and
# second-b 328 to 329 (owed 333), second-c and second-e 114 (owed 111); each heavy budget's lock
# waits 1.02 to 1.17M ticks of a 2.1 to 2.4M total in the 60M-tick window, the three 10-weight
# budgets' under 26k each; one rv32 run with 13.9M of waits beside the machine's load read 314,
# 315 and 123. Under icount the same clause reads 276 to 340 for the heavy budget on the hart
# last to the lock at every slice end (tests/sched-capped.toml), so it is judged here.
smp = [2, 3]
keep_smp = true
# Test builds only: the trace ring (never in a default kernel).
kernel_features = ["sched-trace"]
post_check = "sched_oracle"
timeout_secs = 1200
expect = [
    '^HART-SHARE late-a \d+ \d+ 50@2 2:1 100:1 100:1$',
    '^HART-SHARE late-b \d+ \d+ 50@2 3:1 900:1 100:1$',
    '^HART-SHARE late-c \d+ \d+ 50@2 4:1 900:1 100:1$',
    '^HART-SHARE second-a \d+ \d+ 50@3 5:1 100:1 10:5 10:5 10:1$',
    '^HART-SHARE second-b \d+ \d+ 50@3 6:1 1000:1 10:5 10:5 10:1$',
    '^HART-SHARE second-c \d+ \d+ 50@3 7:5 1000:1 100:1 10:5 10:1$',
    '^HART-SHARE second-e \d+ \d+ 50@3 9:1 1000:1 100:1 10:5 10:5$',
    '^HART-SHARE uncap-a \d+ \d+ 50@2 10:2 100:1 100:1$',
    '^HART-SHARE uncap-b \d+ \d+ 50@2 11:1 900:2 100:1$',
    '^HART-SHARE uncap-c \d+ \d+ 50@2 12:1 900:2 100:1$',
    '^HART-SHARE spread-a \d+ \d+ 50@2 13:4 100:1$',
    '^HART-SHARE spread-b \d+ \d+ 50@2 14:1 100:4$',
    '^HART-SHARE spread-a-4 \d+ \d+ 50@4 13:4 100:1$',
    '^HART-SHARE spread-b-4 \d+ \d+ 50@4 14:1 100:4$',
    '^SCHED-CAPPED TEST PASSED$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['\[capped\] FAIL']
poweroff = true
