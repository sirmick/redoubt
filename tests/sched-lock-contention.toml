description = "Fair kernel entry under contention (R78, kernel/scheduling.md), at two harts: one budget refused a `map_anon` after a search of the whole area in a loop, R12's costliest call, beside the latency workload's driver stand-in on the goldfish RTC's alarm; every wait for the kernel lock takes it in ticket order (the trace's tickets, `lock-trace`; each section's length and cause beside, `hold-trace`), every driver wake falls inside the hammer's window, and the wake's p50 and p99 net of the checked build's audits are recorded beside their 15 and 50 ms targets, not judged: a wake waits one search in ticket order, longer than the p50 target under the range cap (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-lock-contention"]
# A hammer on every hart but one: one hart has no lock to wait for, and four are
# `sched-lock-contention-4`'s. Each hammer asks for the most a range call may name
# (`MAX_RANGE_PAGES`, 16 pages) after taking a page in every 64 KiB window of the `map_anon`
# area, 4,096 pages of its budget, all pinned before the window: no request fits, so each refusal
# reads every page table of the area through 4,096 starts, the shortest refused search a request
# at the cap can be made to take (kernel/memory.md, R22).
smp = [2]
keep_smp = true
# Test builds only: the trace ring with each lock wait's ticket (never in a default kernel).
kernel_features = ["hold-trace"]
# The oracle checks the waits' ticket order, and gates the driver wake on sched-latency's targets:
# every hart's PLIC context takes the RTC's interrupt, so the idle hart wakes, draws its ticket
# behind the hammer's search in progress and runs the driver itself (kernel/scheduling.md, R78).
# `irq-boot-hart-only` is the same run on a kernel whose boot hart alone takes it.
# The wake's figures are recorded, not judged: the driver's own `receive` queues in ticket order
# behind one search, and under the range cap the shortest refused search (22.6 ms on rv64, 17.0 on
# rv32) exceeds the 15 ms p50 target until the search is bounded (kernel/scheduling.md, R78);
# that bound's change re-judges them. Ticket order and the trace's other checks stay judged.
post_check = "sched_oracle driver_wake_p50_us=15000 driver_wake_p99_us=50000 record=rv64:2:contention:driver_wake:p50 record=rv64:2:contention:driver_wake:p99 record=rv32:2:contention:driver_wake:p50 record=rv32:2:contention:driver_wake:p99"
timeout_secs = 1200
expect = [
    '^\[lock-contention\] ok: every hammer pinned its area before the window opened$',
    '^\[lock-contention\] 1 hammers. searches refused: \d+$',
    '^\[lock-contention\] driver wake: .*: gross, audits included; net in the post-check',
    '^LATENCY-SAMPLE contention driver_wake \d+ \d+$',
    '^\[lock-contention\] ok: every driver wake fell inside the hammers. window: the last at \d+ µs, the window.s end \d+$',
    '^SCHED-LOCK-CONTENTION TEST PASSED$',
    # The kernel's count at power-off: each hart's claims, its claims that found nothing, and the
    # alarms its context took, their sum. The other hart took ten or more, whichever hart idles and
    # wins the claims: its context is enabled (R78; `irq-boot-hart-only` reads 0 there). Recorded:
    # taken by hart [200, 196] (rv64; claimed [200, 1], found nothing [0, 195]) and [199, 177]
    # (rv32; claimed [24, 177], found nothing [175, 0]): the hammer's hart, when the boot hart
    # idles, takes its alarms as claims that find nothing.
    '^external interrupts: claimed by hart \[\d+, \d+\], found nothing by hart \[\d+, \d+\], taken by hart \[\d+, [1-9]\d+\]$',
    # A checked build's count: idle and lock-wait halts that found the interrupt they wait for
    # pending ran no `wfi` (kernel/scheduling.md, R78).
    '^halts: [1-9]\d* skipped, an awaited interrupt pending$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['\[lock-contention\] FAIL']
poweroff = true
