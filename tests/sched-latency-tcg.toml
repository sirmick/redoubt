description = "Reference run in real time (no icount), reporting without judging: latency under the named workload, as sched-latency, with host load showing up as guest latency; the rank oracle still checks every pick (plain TCG, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
programs = ["sched-latency"]
kernel_features = ["sched-trace"]
# Order only: R10's time is host time here, so no bound.
post_check = "sched_oracle"
# Two harts, which run at once without icount: the kernel's console lines (the kill line
# `[!] Terminating process`) wait for the program's line in progress on the other hart, so no
# sample or count line arrives broken (kernel/devices.md, "The console's one writer").
smp = [2]
timeout_secs = 1800
expect = [
    '^\[latency\] the RTC keeps virtual time: (met|missed)',
    '^\[latency\] N=1 driver wake: .*: gross, audits included; net in the post-check',
    '^\[latency\] N=1 steward timer wake: .*: gross, audits included; net in the post-check',
    '^\[latency\] N=1 steward decision wake: .*: gross, audits included; net in the post-check',
    '^\[latency\] N=1 deadline notice: .*: gross, audits included; net in the post-check',
    '^\[latency\] N=1 budget_destroy, call to return: ',
    '^\[latency\] N=4 driver wake: .*: gross, audits included; net in the post-check',
    '^\[latency\] N=4 steward timer wake: .*: gross, audits included; net in the post-check',
    '^\[latency\] N=4 steward decision wake: .*: gross, audits included; net in the post-check',
    '^\[latency\] N=4 deadline notice: .*: gross, audits included; net in the post-check',
    '^\[latency\] N=4 budget_destroy, call to return: ',
    '^\[latency\] N=16 driver wake: .*: gross, audits included; net in the post-check',
    '^\[latency\] N=16 steward timer wake: .*: gross, audits included; net in the post-check',
    '^\[latency\] N=16 steward decision wake: .*: gross, audits included; net in the post-check',
    '^\[latency\] N=16 deadline notice: .*: gross, audits included; net in the post-check',
    '^\[latency\] N=16 budget_destroy, call to return: ',
    '^\[latency\] N=16: the 1000-weight server counted \d+ of 1000 of the spinning CPU \(its weight.s 384\)$',
    '^SCHED-LATENCY TEST PASSED$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['\[latency\] FAIL', 'PROGRAM HALT']
poweroff = true
