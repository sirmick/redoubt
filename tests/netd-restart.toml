description = "netd faults and init restarts it (servers/netd.md, \"Started by init\"): a client round-trips bytes through the peer at 10.0.9.100:7; the judge learns netd's instance and says so, and the bench, reading that line, sends one UDP datagram from outside the guest that netd's test-only feature restart-probe faults on (nothing resends a datagram, so the new instance never sees it); init reports the fault and restarts netd; the kernel resets the card without quarantining it; a new instance answers the judge, and a second client, asking again while ipd refuses its connect, round-trips through it (the peer counts both connections), and that instance still answers the judge after it, so netd was restarted once"
arch = ["rv64", "rv32"]
kind = "boot"
# The real init, the servers, the judge and the clients (tests/data/net/restart.json), netd built
# with its test-only feature restart-probe.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-netd", bin = "netd", features = ["restart-probe"] },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-net-tests", bin = "net-judge" },
    { package = "redoubt-net-client", bin = "net-client" },
]
timeout_secs = 120
expect = [
    '^init: the manifest is checked: 7 servers, bound \d+ pages$',
    '^init: started judge, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] judge ipd has a link ',
    '^\[con [0-9a-f]{16}\] judge ok: echo through 10\.0\.9\.100:7 before netd.s fault: outcome 0$',
    '^\[con [0-9a-f]{16}\] judge knows netd.s instance: poke it$',
    # 13: a load page fault, the kernel's ending; a panic would exit with 101 after its reset.
    '^init: netd \(PID [0-9]+\) faulted, code 13, serving nobody, labels none; blamed on nobody: no steward$',
    '^init: restarted netd, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] judge a new netd answers$',
    '^\[con [0-9a-f]{16}\] judge ok: echo through 10\.0\.9\.100:7 after netd.s restart: outcome 0$',
    # One restart only: the instance that served the second echo is the one that answered first.
    '^\[con [0-9a-f]{16}\] judge ok: netd.s instance is unchanged since its restart$',
    '^\[con [0-9a-f]{16}\] judge TEST PASSED$',
]
# netd's one fault is the point; nothing else may end, the card may not be quarantined, and the
# machine may not reboot.
forbid = [
    'init: refused the boot',
    '^init: (keyd|consoled|ipd|judge|echo|again) .*(exited|faulted|was killed)',
    '^init: netd .*(exited|was killed)',
    '^init: restarted (keyd|consoled|ipd|judge|echo|again)\b',
    'quarantined',
    'init: rebooting',
    'judge FAIL',
]
reporter = "judge"

[[file]]
name = "manifest"
from = { path = "tests/data/net/restart.json" }

[net]
# ipd's self= in the manifest, then SELF_ALWAYS (tests/net/src/lib.rs); a host test keeps them equal.
self_forbidden = ["10.0.2.0/24", "10.0.9.102/32", "0.0.0.0/8", "127.0.0.0/8", "224.0.0.0/4", "240.0.0.0/4", "255.255.255.255/32"]

# Both echoes, one before the fault and one after.
[[net.peer]]
addr = "10.0.9.100:7"
connections = 2

# servers/netd/src/restart_probe.rs: PORT and PAYLOAD (a host test keeps them equal).
[net.poke]
port = 47000
payload = "redoubt netd restart probe"
after = '^\[con [0-9a-f]{16}\] judge knows netd.s instance: poke it$'
