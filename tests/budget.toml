description = "Budgets and handle tables, as seen by a system-class caller in a budget of its own, holding it and users: carving and charging (R6, R7), labels added and sorted (part of I6), depth, destruction and its sweep of the caller's own table (R10, I2, I10), 128 handles per table page, usage within limits (I5), 500 create-destroy cycles, time_now and random, and a model-predicted sequence; accounts, stamps, user-class callers and killing are other cases' (checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
# PID 2 log-server; PID 3 budget-test, the one program it starts, in its own budget (an equal
# share of system: all it has free, one page apart; 15 processes; weight 1,000), with users.
# Before the tester it ran alone in init's place, in system itself.
programs = ["log-server", { bin = "budget-test", budgets = ["users"] }]
timeout_secs = 30
# Built with the checks on (docs/testbench.md, "Checked builds").
debug_assertions = true
expect = ['^\[pid 3\] \[budget\] own ', '^\[pid 3\] BUDGET TEST PASSED$']
forbid = ['\[budget\] FAIL']
