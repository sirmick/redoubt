description = "The loader refuses a boot bundle that carries a `grants` manifest: a process reaches a device only through its device handle"
arch = ["rv64", "rv32"]
kind = "boot"
programs = ["log-server"]
timeout_secs = 20
allow_panic = true          # the loader is supposed to panic here
# The verdict is the loader's own: nothing from the bundle runs (KMAIN is forbidden), so no
# program can print it. Anchored, so a relayed `[pid N]` line could not match either.
expect = ['^loader PANIC', 'holds a `grants` entry']
forbid = ['KMAIN', 'entering kernel']

[[file]]
name = "grants"
from = { path = "tests/data/bundle-file.txt" }
