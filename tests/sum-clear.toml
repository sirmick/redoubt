description = "The kernel cannot load through a user mapping (R24): a test build loads the first caller's `ecall` straight through its user address, and the load faults as a kernel failure instead of reading it (sum-probe, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
icount = "shift=3,sleep=off"
debug_assertions = true
kernel_features = ["sum-probe"]
programs = ["rng-test"]
timeout_secs = 20
# The verdict is the kernel's trap report, not the program's: the fault is the kernel's own
# load, taken in S-mode. A load that succeeded would print the probe's `read` line instead.
expect = [
    '^sum-probe: loading 0x[0-9a-f]+ through the caller.s user mapping$',
    '^!!! KERNEL FAILURE !!!: CPU Exception on PID [0-9]+: Load page fault of 0x[0-9a-f]+ at 0xff',
]
forbid = ['sum-probe: read']
