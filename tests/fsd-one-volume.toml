description = "One volume per fsd instance (servers/fsd.md, R47): init starts blkd and an fsd for each of two volumes on one disk, minting each its own range; each fsd, built with its test-only feature one-volume-probe, tries before serving to reach past its endpoint, its range and its console: the kernel finds every other handle index empty and refuses a badge minted from its range, and blkd refuses the sector just past its range as out_of_range; a client handed a root badge at each writes a file of the same name through both and reads each back apart"
arch = ["rv64", "rv32"]
kind = "boot"
# The real init, the servers the manifest names, fsd built with its test-only feature
# one-volume-probe (both fsds run it), and fsd-client.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-fsd", bin = "fsd", features = ["one-volume-probe"] },
    { package = "redoubt-fsd-programs", bin = "fsd-client" },
]
timeout_secs = 60
expect = [
    '^init: the manifest is checked: 6 servers, bound \d+ pages$',
    '^init: started fsd:a, console [0-9a-f]{16}$',
    # Each fsd's line, in whichever order the two print them.
    '^\[con [0-9a-f]{16}\] fsd:[ab] reaches only its endpoint, its range and its console: its range mints nothing, and sector [0-9]+ is out_of_range$',
    '^\[con [0-9a-f]{16}\] fsd:[ab] reaches only its endpoint, its range and its console: its range mints nothing, and sector [0-9]+ is out_of_range$',
    '^\[con [0-9a-f]{16}\] fsd-client read fsd:a.s which and fsd:b.s apart$',
    '^\[con [0-9a-f]{16}\] fsd-client TEST PASSED$',
]
forbid = ['init: refused the boot', '^init: .* (exited|faulted|was killed)', 'init: restarted', 'init: rebooting', 'FAILED R47', 'fsd-client TEST FAILED']
reporter = "client"

[[file]]
name = "manifest"
from = { path = "tests/data/fsd/one-volume.json" }

[disk]
size_kib = 4096
partitions = 2
