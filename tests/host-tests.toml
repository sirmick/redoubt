description = "Host unit tests that no boot can reach: the signing domain's own bytes, and the bench's golden signature"
kind = "host-tests"
# A typo in `BUNDLE_DOMAIN` would boot every case in this suite, because the loader and the bench
# share the constant and would agree on the wrong bytes. What catches it is a test that spells the
# domain out by hand (redoubt/signing) and one that pins a signature made under it
# (redoubt/testbench, build.rs), which also holds the refusals Ed25519 gives for free.
packages = ["redoubt-signing", "testbench"]
