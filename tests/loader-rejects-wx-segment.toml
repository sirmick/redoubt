description = "The loader refuses a program image with a segment both writable and executable (R16): the paging crate refuses the mapping"
arch = ["rv64", "rv32"]
kind = "boot"
icount = "shift=3,sleep=off"
# The first loadable segment's flags set to read, write and execute: a well-formed image asking
# for a W+X page, which no page is ever mapped as (kernel/boot.md, R16).
programs = [{ corrupt = "rng-test", with = { segment-flags = "rwx" } }]
timeout_secs = 10
allow_panic = true          # the loader is supposed to panic here
# The verdict is the loader's own: nothing from the bundle runs (KMAIN is forbidden), so no
# program can print it. Anchored, so a relayed `[pid N]` line could not match either.
expect = ['^loader PANIC', 'refusing a writable and executable mapping']
forbid = ['KMAIN', 'entering kernel']
