description = "The responsiveness targets measured with the real steward (docs/kernel/scheduling.md, \"Responsiveness\" and R12; docs/servers/steward.md, \"Leases\"), beside sched-latency's stand-ins: four principals' sessions start N spinning agents between them (Redoubt.Agents.Echo `spin`, each a beamlet VM on a lease; the servers admit one account's sessions and leases up to what the manifest lets it hold, so the load is spread over principals as the box's would be, and four principals declare the image's four domains, so every shared server keeps the image's bucket count) for N = 1, 4 and 16, then alice's session starts D probe leases the steward ends by its own decision (its test-only latency-probe arms a timer after each one's start and, at a second timeout, ends it: the steward's timer wake and decision wake, time_now less the deadline it armed, printed as the stand-in prints them, and its budget_destroy call to return) and D leases the kernel's deadline takes (the deadline notice: the exit notice's arrival less the deadline), D = 16 at N = 1 and 4, 8 at N = 16 (p99 at D samples is the maximum; the pinned seed's sweep stands behind it); each sample's group is the count of the other live leases over every principal; the counts go out when a round's leases are all gone, and the window's end is marked after the third round's. R10's cost per destruction is the kernel's trace: the case ends by the steward's marker-file exit, six times, so init's reboot rule resets the machine and the kernel dumps its trace. A lease's end is measured to its destruction and the notice to the sponsor: the servers' records are freed after, off the measured path. Targets unchanged from the stand-in's: decision wake p50 <= 25 ms and p99 <= 95 ms, timer wake p50 <= 15 ms and p99 <= 50 ms, deadline notice p99 <= 40 ms, R10 kernel time p99 <= 30 ms, a lease's end (the worst decision-wake p99 + R10's p99) <= 125 ms; every latency target judged by the post-check net of the checked build's audits, and every pick checked by the rank oracle (virtual time, checked build). A miss is a finding, not a tuning"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
# The guest seed the gate runs, sched-latency's; the sweep is recorded on the page.
qemu_seed = 3
# The image's programs, the steward built with its test-only latency-probe (servers/steward,
# src/bin/steward.rs, Probe), and the crossing program the image publishes.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-verityd", bin = "verityd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-walfsd", bin = "walfsd" },
    { package = "redoubt-erofsd", bin = "erofsd" },
    { package = "beamlet-redoubt", bin = "beamlet", workspace = "userland/otp" },
    { package = "redoubt-piped", bin = "piped" },
    { package = "redoubt-crossing", bin = "crossing" },
    { package = "redoubt-steward-server", bin = "steward", features = ["latency-probe"] },
    { package = "redoubt-sshd", bin = "sshd" },
    { package = "redoubt-consrelay", bin = "consrelay" },
]
# Sixteen lease VMs of 5248 pages (328 MiB) beside five shells of 11392 pages (the four
# principals' sessions and alice's console session, 222 MiB); the principals' budgets in the
# latency manifest sum to 262,144 pages (1 GiB), which `users` must hold: 2048 MiB leaves it
# about 1.76 GiB. The trace ring's large form holds a boot this long.
memory_mib = 2048
# Test builds only: the trace ring, its large form, and its dump at the reset.
kernel_features = ["sched-trace-large"]
# The targets are gated at one hart and at two (kernel/scheduling.md, "Responsiveness").
smp = [1, 2]
# Up to 21 beamlet VMs live at once under icount, and the reboot rule needs six exits within 60 s.
timeout_secs = 5400
post_check = "sched_oracle gate_harts=2 r10_p99_us=30000 lease_end_p99_us=125000 timer_wake_p50_us=15000 timer_wake_p99_us=50000 decision_wake_p50_us=25000 decision_wake_p99_us=95000 deadline_notice_p99_us=40000"
expect = [
    '^init: started sshd, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] sshd: listening on port 22$',
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
]
forbid = [
    'init: refused the boot',
    'EXCEPTION',
    'steward: a step failed',
    'steward: the core exited',
    'sshd: login .*: refused',
    'target missed',
]
# Every group's counts, as the round's leases go: the probe's decisions and the kernel's
# deadlines at N = 1, 4 and 16; then the window's end, after which the oracle judges nothing (the
# six marker-file exits reap every lease's VM), before the marker file is written. Then the
# case's marker ends six instances within the minute, and init reboots: the reset dumps the
# kernel's trace, which the post-check reads (these lines follow the sessions, so they are not
# in `expect`, which the sessions wait out).
expect_after = [
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=1 decision_wake 16$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=1 deadline_notice 16$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=4 decision_wake 16$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=4 deadline_notice 16$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=16 decision_wake 8$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=16 deadline_notice 8$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-END [0-9]+$',
    '^\[con [0-9a-f]{16}\] steward: latency-probe: the case is done, exiting for the reboot$',
    '^init: steward \(PID [0-9]+\) exited, code 9$',
    '^init: rebooting: steward was restarted 5 times within 60 seconds$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]

# Alice's session drives the three rounds and carries the probe's leases: her spinners (two at
# most beside the probe's lease, what the servers admit for one account with two sessions), then,
# once the other principals' spinners are up, D probe leases (9 s, the probe's marker, ended by
# the steward within a tenth of a second) and D two-second leases the kernel takes; then every
# principal's spinners are ended and the round's counts go out. The shell prints every
# `[lease alice/agent-N ended]` between. Last, after the other sessions have left, the marker
# file for the steward's exits, then the logout, before the steward goes.
[[session]]
user = "alice"
pty = true
steps = [
    { expect = '/home/alice \([0-9]+\)> ' },
    { send = "{:ok, c} = Redoubt.Contexts.connection(); {:stage, File.mkdir_p(\"/home/alice/project/out\"), File.write(\"/home/alice/project/in\", \"spin\")}\n" },
    { expect = '\{:stage, :ok, :ok\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "start = fn us -> {:ok, %{lease: l}} = Redoubt.Wire.Client.Steward.start_agent(c, us); l end; up = fn n -> s = for _ <- 1..n, do: start.(600_000_000); Process.sleep(5000); s end; measure = fn d -> for _ <- 1..d, do: (start.(9_000_000); Process.sleep(1500)); for _ <- 1..d, do: (start.(2_000_000); Process.sleep(4000)); :measured end; down = fn s -> Enum.each(s, &Redoubt.Wire.Client.Steward.end_lease(c, &1)); Process.sleep(3000); :down end; :defined\n" },
    { expect = ':defined' },
    { expect = '\([0-9]+\)> ' },
    { send = "s = up.(1); {:measured, 1, measure.(16)}\n" },
    { expect = '\{:measured, 1, :measured\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "{:round, 1, down.(s)}\n" },
    { expect = '\{:round, 1, :down\}' },
    { expect = '\([0-9]+\)> ' },
    { mark = "round-4-go" },
    { send = "s = up.(2); {:up, 4}\n" },
    { expect = '\{:up, 4\}' },
    { expect = '\([0-9]+\)> ' },
    { wait = "bob-4-up" },
    { send = "{:measured, 4, measure.(16)}\n" },
    { expect = '\{:measured, 4, :measured\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "{:ended, 4, down.(s)}\n" },
    { expect = '\{:ended, 4, :down\}' },
    { expect = '\([0-9]+\)> ' },
    { mark = "round-4-end" },
    { wait = "bob-4-down" },
    { mark = "round-16-go" },
    { send = "s = up.(2); {:up, 16}\n" },
    { expect = '\{:up, 16\}' },
    { expect = '\([0-9]+\)> ' },
    { wait = "bob-16-up" },
    { wait = "carol-16-up" },
    { wait = "dave-16-up" },
    { send = "{:measured, 16, measure.(8)}\n" },
    { expect = '\{:measured, 16, :measured\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "{:ended, 16, down.(s)}\n" },
    { expect = '\{:ended, 16, :down\}' },
    { expect = '\([0-9]+\)> ' },
    { mark = "round-16-end" },
    { wait = "bob-gone" },
    { wait = "carol-gone" },
    { wait = "dave-gone" },
    { send = "{:marker, File.write(\"/home/alice/latency-done\", \"the case is done\")}\n" },
    { expect = '\{:marker, :ok\}' },
    { expect = '\([0-9]+\)> ' },
    { exit = 0 },
]

# The other principals carry the rest of the load: bob two spinners at N = 4 and five at
# N = 16, carol five and dave four at N = 16 (a session and five leases is what one account's
# admission holds); each starts them when alice's round opens, ends them when it closes, and
# leaves before the marker file is written.
[[session]]
user = "bob"
pty = true
steps = [
    { expect = '/home/bob \([0-9]+\)> ' },
    { send = "{:ok, c} = Redoubt.Contexts.connection(); start = fn -> {:ok, %{lease: l}} = Redoubt.Wire.Client.Steward.start_agent(c, 600_000_000); l end; {:stage, File.mkdir_p(\"/home/bob/project/out\"), File.write(\"/home/bob/project/in\", \"spin\")}\n" },
    { expect = '\{:stage, :ok, :ok\}' },
    { expect = '\([0-9]+\)> ' },
    { wait = "round-4-go" },
    { send = "s = for _ <- 1..2, do: start.(); {:up, 4, length(s)}\n" },
    { expect = '\{:up, 4, 2\}' },
    { expect = '\([0-9]+\)> ' },
    { mark = "bob-4-up" },
    { wait = "round-4-end" },
    { send = "Enum.each(s, &Redoubt.Wire.Client.Steward.end_lease(c, &1)); {:down, 4}\n" },
    { expect = '\{:down, 4\}' },
    { expect = '\([0-9]+\)> ' },
    { mark = "bob-4-down" },
    { wait = "round-16-go" },
    { send = "s = for _ <- 1..5, do: start.(); {:up, 16, length(s)}\n" },
    { expect = '\{:up, 16, 5\}' },
    { expect = '\([0-9]+\)> ' },
    { mark = "bob-16-up" },
    { wait = "round-16-end" },
    { send = "Enum.each(s, &Redoubt.Wire.Client.Steward.end_lease(c, &1)); {:down, 16}\n" },
    { expect = '\{:down, 16\}' },
    { expect = '\([0-9]+\)> ' },
    { exit = 0 },
    { mark = "bob-gone" },
]

[[session]]
user = "carol"
pty = true
steps = [
    { expect = '/home/carol \([0-9]+\)> ' },
    { send = "{:ok, c} = Redoubt.Contexts.connection(); start = fn -> {:ok, %{lease: l}} = Redoubt.Wire.Client.Steward.start_agent(c, 600_000_000); l end; {:stage, File.mkdir_p(\"/home/carol/project/out\"), File.write(\"/home/carol/project/in\", \"spin\")}\n" },
    { expect = '\{:stage, :ok, :ok\}' },
    { expect = '\([0-9]+\)> ' },
    { wait = "round-16-go" },
    { send = "s = for _ <- 1..5, do: start.(); {:up, 16, length(s)}\n" },
    { expect = '\{:up, 16, 5\}' },
    { expect = '\([0-9]+\)> ' },
    { mark = "carol-16-up" },
    { wait = "round-16-end" },
    { send = "Enum.each(s, &Redoubt.Wire.Client.Steward.end_lease(c, &1)); {:down, 16}\n" },
    { expect = '\{:down, 16\}' },
    { expect = '\([0-9]+\)> ' },
    { exit = 0 },
    { mark = "carol-gone" },
]

[[session]]
user = "dave"
pty = true
steps = [
    { expect = '/home/dave \([0-9]+\)> ' },
    { send = "{:ok, c} = Redoubt.Contexts.connection(); start = fn -> {:ok, %{lease: l}} = Redoubt.Wire.Client.Steward.start_agent(c, 600_000_000); l end; {:stage, File.mkdir_p(\"/home/dave/project/out\"), File.write(\"/home/dave/project/in\", \"spin\")}\n" },
    { expect = '\{:stage, :ok, :ok\}' },
    { expect = '\([0-9]+\)> ' },
    { wait = "round-16-go" },
    { send = "s = for _ <- 1..4, do: start.(); {:up, 16, length(s)}\n" },
    { expect = '\{:up, 16, 4\}' },
    { expect = '\([0-9]+\)> ' },
    { mark = "dave-16-up" },
    { wait = "round-16-end" },
    { send = "Enum.each(s, &Redoubt.Wire.Client.Steward.end_lease(c, &1)); {:down, 16}\n" },
    { expect = '\{:down, 16\}' },
    { expect = '\([0-9]+\)> ' },
    { exit = 0 },
    { mark = "dave-gone" },
]

[[file]]
name = "manifest"
from = { path = "tests/data/steward/latency.manifest.json" }
verity = "image/userland.toml"

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
forward = [22]
