description = "The responsiveness targets measured with the real steward (docs/kernel/scheduling.md, \"Responsiveness\" and R12; docs/servers/steward.md, \"Leases\"), beside sched-latency's stand-ins: alice's session starts N spinning agents (Redoubt.Agents.Echo `spin`, each a beamlet VM on a lease) for N = 1, 4 and 16, then D probe leases the steward ends by its own decision (its test-only latency-probe arms a timer after each one's start and, at a second timeout, ends it: the steward's timer wake and decision wake, time_now less the deadline it armed, printed as the stand-in prints them, and its budget_destroy call to return) and D leases the kernel's deadline takes (the deadline notice: the exit notice's arrival less the deadline), D = 16 at N = 1 and 4, 8 at N = 16 (p99 at D samples is the maximum; the pinned seed's sweep stands behind it); each sample's group is the count of the domain's other live leases; the counts go out when a round's leases are all gone. R10's cost per destruction is the kernel's trace: the case ends by the steward's marker-file exit, six times, so init's reboot rule resets the machine and the kernel dumps its trace. A lease's end is measured to its destruction and the notice to the sponsor: the servers' records are freed after, off the measured path. Targets unchanged from the stand-in's: decision wake p50 <= 25 ms and p99 <= 95 ms, timer wake p50 <= 15 ms and p99 <= 50 ms, deadline notice p99 <= 40 ms, R10 kernel time p99 <= 30 ms, a lease's end (the worst decision-wake p99 + R10's p99) <= 125 ms; every latency target judged by the post-check net of the checked build's audits, and every pick checked by the rank oracle (virtual time, checked build). A miss is a finding, not a tuning"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
# The guest seed the gate runs, sched-latency's; the sweep is recorded on the page.
qemu_seed = 3
# The image's programs, the steward built with its test-only latency-probe (servers/steward,
# src/bin/steward.rs, Probe), and the crossing program the image publishes.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-verityd", bin = "verityd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-walfsd", bin = "walfsd" },
    { package = "redoubt-erofsd", bin = "erofsd" },
    { package = "beamlet-redoubt", bin = "beamlet", workspace = "userland/otp" },
    { package = "redoubt-piped", bin = "piped" },
    { package = "redoubt-crossing", bin = "crossing" },
    { package = "redoubt-steward-server", bin = "steward", features = ["latency-probe"] },
    { package = "redoubt-sshd", bin = "sshd" },
    { package = "redoubt-consrelay", bin = "consrelay" },
]
# Sixteen agent VMs beside alice's sessions: her budget is the latency manifest's (640 MiB), and
# the trace ring's large form holds a boot this long.
memory_mib = 2048
# Test builds only: the trace ring, its large form, and its dump at the reset.
kernel_features = ["sched-trace-large"]
# The targets are gated at one hart and at two (kernel/scheduling.md, "Responsiveness").
smp = [1, 2]
# 61 beamlet VMs start under icount, and the reboot rule needs six exits within 60 s.
timeout_secs = 5400
post_check = "sched_oracle gate_harts=2 r10_p99_us=30000 lease_end_p99_us=125000 timer_wake_p50_us=15000 timer_wake_p99_us=50000 decision_wake_p50_us=25000 decision_wake_p99_us=95000 deadline_notice_p99_us=40000"
expect = [
    '^init: started sshd, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] sshd: listening on port 22$',
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
    # The case's marker ends six instances within the minute, and init reboots: the reset dumps
    # the kernel's trace, which the post-check reads.
    '^init: steward \(PID [0-9]+\) exited, code 9$',
    '^init: rebooting: steward was restarted 5 times within 60 seconds$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = [
    'init: refused the boot',
    'EXCEPTION',
    'steward: a step failed',
    'steward: the core exited',
    'sshd: login alice.*: refused',
    'target missed',
]
# Every group's counts, as the round's leases go: the probe's decisions and the kernel's
# deadlines at N = 1, 4 and 16.
expect_after = [
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=1 decision_wake 16$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=1 deadline_notice 16$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=4 decision_wake 16$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=4 deadline_notice 16$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=16 decision_wake 8$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=16 deadline_notice 8$',
]

# Alice's session drives the three rounds: N spinners (ten-minute leases), D probe leases (9 s,
# the probe's marker, ended by the steward within a tenth of a second), D two-second leases the
# kernel takes, then the spinners ended; each round's end is tagged. The shell prints every
# `[lease alice/agent-N ended]` between. Last, the marker file for the steward's exits, then the
# logout, before the steward goes.
[[session]]
user = "alice"
pty = true
steps = [
    { expect = '/home/alice \([0-9]+\)> ' },
    { send = "{:ok, c} = Redoubt.Contexts.connection(); {:stage, File.mkdir_p(\"/home/alice/project/out\"), File.write(\"/home/alice/project/in\", \"spin\")}\n" },
    { expect = '\{:stage, :ok, :ok\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "start = fn us -> {:ok, %{lease: l}} = Redoubt.Wire.Client.Steward.start_agent(c, us); l end; round = fn n, d -> spinners = for _ <- 1..n, do: start.(600_000_000); Process.sleep(5000); for _ <- 1..d, do: (start.(9_000_000); Process.sleep(1500)); for _ <- 1..d, do: (start.(2_000_000); Process.sleep(4000)); Enum.each(spinners, &Redoubt.Wire.Client.Steward.end_lease(c, &1)); Process.sleep(3000); {:round, n, :done} end; round.(1, 16)\n" },
    { expect = '\{:round, 1, :done\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "round.(4, 16)\n" },
    { expect = '\{:round, 4, :done\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "round.(16, 8)\n" },
    { expect = '\{:round, 16, :done\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "{:marker, File.write(\"/home/alice/latency-done\", \"the case is done\")}\n" },
    { expect = '\{:marker, :ok\}' },
    { expect = '\([0-9]+\)> ' },
    { exit = 0 },
]

[[file]]
name = "manifest"
from = { path = "tests/data/steward/latency.manifest.json" }

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
forward = [22]
