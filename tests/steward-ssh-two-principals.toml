description = "Alice and bob, separate principals in separate SSH sessions (docs/servers/steward.md, \"Authentication and sessions\"; docs/servers/sshd.md, \"Sessions over SSH\"; docs/userland/sessions.md, \"A session is a VM in a budget\"): the image boots with sshd listening on port 22; each logs in over SSH with its test key and gets a prompt from its own beamlet VM, in a budget the steward carved from its own principal's sub-budget (alice's beside her console session, bob's alone in his), with its own session id. Each session evaluates a marker, and neither marker reaches the other's channel. What each namespace holds is the binding table's host test; the sessions' file verdicts wait for beamlet's file platform (BEAM3). The verdicts are sshd's and the steward's lines, the kernel's usage through them, and init's lines showing no exit and no reboot (rule F)"
arch = ["rv64", "rv32"]
kind = "boot"
recipe = "image/boot.toml"
# The image needs 1 GiB: the principals' budgets, each holding a shell VM's session, do not fit
# the users budget 256 MiB leaves (docs/kernel/budgets.md).
memory_mib = 1024
# The scan sizes sshd, ipd and the steward with two SSH sessions at once.
memory = true
# Two logins, one after the other, each booting a shell VM.
timeout_secs = 1500
expect = [
    '^init: started sshd, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] sshd: listening on port 22$',
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] steward: audit 1001/\{\} at [0-9]+: Login ',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
]
distinct = ['steward: audit [0-9]+/\{\} at [0-9]+: Login \{ session: ([0-9]+)']
forbid = [
    'init: refused the boot',
    'init: rebooting',
    '^init: .* (exited|faulted|was killed)',
    'init: restarted',
    'EXCEPTION',
    'sshd: login .*: refused',
    'sshd: every slot is busy',
]
# Bob logs in once alice has her prompt, and the steward says a login's lines before it answers
# sshd, so the lines come in one order.
expect_after = [
    '^\[con [0-9a-f]{16}\] steward: audit 1001/\{\} at [0-9]+: Login \{ session: [0-9]+, principal: 0, key: [1-9]',
    '^\[con [0-9a-f]{16}\] steward: users/alice/\{\} holds [0-9]+ pages, 4 processes$',
    '^\[con [0-9a-f]{16}\] sshd: login alice: session [0-9a-f]{16}, labels \[\]$',
    '^\[con [0-9a-f]{16}\] steward: audit 1002/\{\} at [0-9]+: Login \{ session: [0-9]+, principal: 1, key: [1-9]',
    '^\[con [0-9a-f]{16}\] steward: users/bob/\{\} holds [0-9]+ pages, 2 processes$',
    '^\[con [0-9a-f]{16}\] sshd: login bob: session [0-9a-f]{16}, labels \[\]$',
]

[[session]]
user = "alice"
forbid = ['bob-marker']
# beamlet's first line comes once the login is through and the VM runs; the prompt once the shell
# loaded. The log notes when each matched: the login's latency, measured.
steps = [
    { expect = 'Elixir.Redoubt.Shell read from' },
    { expect = '\([0-9]+\)> ' },
    { mark = "alice-up" },
    { send = "\"alice-\" <> \"marker\"\n" },
    { expect = '"alice-marker"' },
    { wait = "bob-done" },
    { exit = 0 },
]

[[session]]
user = "bob"
forbid = ['alice-marker']
steps = [
    { wait = "alice-up" },
    { expect = 'Elixir.Redoubt.Shell read from' },
    { expect = '\([0-9]+\)> ' },
    { send = "\"bob-\" <> \"marker\"\n" },
    { expect = '"bob-marker"' },
    { mark = "bob-done" },
    { exit = 0 },
]

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
forward = [22]
