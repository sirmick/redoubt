description = "Ratchet on `unsafe` in the trusted computing base, and on unsafe without a SAFETY comment"
kind = "unsafe-budget"

# Budgets only go down. Raising one needs a justification in the commit that does it.
# Every component but the legacy redoubt-abi is at max_undocumented = 0: all `unsafe` in the
# kernel's and loader's own crates now carries a SAFETY comment or a `# Safety` doc. Keep it
# that way. Third-party crates.io dependencies are outside the budget: the ratchet counts code
# this repository owns, and those are pinned by Cargo.lock.
# Only code that runs on rv64 is counted; see TENETS.md for the baseline.
# G1: every on-target source file is listed. A file left out of every budget is not counted
# at all, and the checker cannot notice; add new sources to a budget when they land.
# vendor/ (smoltcp and its dependencies for ipd, getrandom) is third-party code pinned by
# checksum and outside the ratchet (vendor/README.md), like other crates.io dependencies.

[[budget]]
name = "paging crate (Sv32/Sv39 page tables)"
paths = ["libs/paging/src"]
max_unsafe = 12
max_undocumented = 0

[[budget]]
# WP-K5: the kernel's stride queue rules, linked into the kernel. `#![forbid(unsafe_code)]`.
name = "redoubt-stride (scheduler rules)"
paths = ["libs/stride/src"]
max_unsafe = 0
max_undocumented = 0

[[budget]]
name = "loader"
paths = ["loader/src"]
max_unsafe = 17 # +3: fdt-rs DevTree::from_raw_pointer, the static index buffer, and Platform::read
max_undocumented = 0

[[budget]]
# WP-V1: the boot bundle's signature preimage, linked into the loader, so it is TCB. It is
# `#![forbid(unsafe_code)]`; the budget says so where the rest of the TCB is counted.
name = "redoubt-signing (signature preimages)"
paths = ["libs/signing/src"]
max_unsafe = 0
max_undocumented = 0

[[budget]]
name = "kernel: Sv39, SBI and PLIC backends"
paths = [
    "kernel/src/arch/riscv/mem.rs", "kernel/src/arch/riscv/mmu_flags.rs",
    "kernel/src/arch/riscv/intc_plic.rs", "kernel/src/arch/riscv/timer_sbi.rs",
    "kernel/src/arch/riscv/asm.rs", "kernel/src/platform/sbi", "kernel/src/arch/riscv/physmap.rs",
    "kernel/src/platform/mod.rs",
]
# G1: +1, physmap.rs's `Window::new` over the loader's physmap. Existing code that no budget
# listed, now counted; no new unsafe.
# WP-K5: -1, the legacy hart-timer path removed (the kernel owns the timer); +1, mem.rs's
# `sync_icache`, the one `fence.i` (OWNER DECISION 10): executable pages must be fetched as
# written, and inline asm is the only way to issue the instruction. Net 0.
max_unsafe = 16
max_undocumented = 0

[[budget]]
name = "kernel: RISC-V arch (shared with rv32)"
paths = [
    "kernel/src/arch/riscv/irq.rs", "kernel/src/arch/riscv/process.rs", "kernel/src/arch/riscv/syscall.rs",
    "kernel/src/arch/riscv/mod.rs", "kernel/src/arch/riscv/exception.rs", "kernel/src/arch/riscv/panic.rs",
    "kernel/src/arch/riscv/smp.rs", "kernel/src/arch/mod.rs",
]
# G1: +3, smp.rs's hart-block `Sync`, its write of the block and the parked hart's `wfi`
# (the `smp` spike). Existing code that no budget listed, now counted; no new unsafe.
max_unsafe = 13
max_undocumented = 0

[[budget]]
name = "kernel: core"
paths = [
    "kernel/src/main.rs", "kernel/src/mem.rs", "kernel/src/services.rs",
    "kernel/src/syscall.rs", "kernel/src/args.rs", "kernel/src/io.rs",
    "kernel/src/budget.rs", "kernel/src/handle.rs", "kernel/src/kframe.rs", "kernel/src/redoubt.rs",
    "kernel/src/device.rs", "kernel/src/message.rs", "kernel/src/process.rs", "kernel/src/cell.rs",
    "kernel/src/debug", "kernel/src/endpoint.rs",
    "kernel/src/time.rs", "kernel/src/sched.rs", "kernel/src/dma.rs",
]
# WP-K5: time.rs and sched.rs (the kernel's timer and scheduler) have no unsafe.
# WP-K1: kframe.rs's three (words of kernel-object frames and of records, through the physmap)
# replace mem.rs's three needless ones in the deleted `print_ownership`; the total is unchanged.
# WP-A2: -1, kframe.rs's `write_byte` (its one user, the old byte-writing `random`, is gone).
# WP-K0b: -2, mem.rs reads the loader's `MREx` table through a safe slice of words instead of
# casting it to a struct it is not aligned for, and args.rs prints a tag name through
# `str::from_utf8` instead of building a slice by hand.
# WP-K3: device.rs joins the list with none of its own (it reaches frames through kframe.rs
# and the page tables through arch::mem). -1: the legacy contiguous allocation for a device,
# which `dma_alloc` replaces, is deleted, and its `bzero` of the freshly mapped pages with it.
# G1: +5, existing code that no budget listed, now counted; no new unsafe. cell.rs's three
# (`SpinLock`/`KernelCell` `Sync` and the lock's access) and the debug console's two (setting
# `OUTPUT` at boot and `print!`'s use of it). The debug pair gained its SAFETY comments here.
# WP-K5b: +2, dma.rs's volatile read and write of a DMA device's registers through the kernel's
# register window (the reset of answer 173); no other access to a device's registers needs one.
max_unsafe = 27
max_undocumented = 0

[[budget]]
name = "redoubt-sys (system call ABI): the ecall stub"
paths = ["libs/sys/src"]
max_unsafe = 1
max_undocumented = 0

[[budget]]
name = "redoubt-rt (native runtime): the heap's free lists, page buffers and lends, the startup page"
paths = ["libs/rt/src"]
# +1 (WP-D3, answer 174): start.rs turns the panic hook's stored address back into its `fn()`,
# the one way a program (netd) can stop its device before the panic handler exits.
max_unsafe = 10
max_undocumented = 0

[[budget]]
name = "keyd (holds every private key; signs, never exports)"
paths = ["servers/keyd/src"]
# WP-S1: none, and the crate says `#![forbid(unsafe_code)]`, so this can only stay at 0.
max_unsafe = 0
max_undocumented = 0

[[budget]]
# WP-D1: a DMA driver is TCB without DMA confinement (TENETS.md 7). The four unsafe
# blocks in src/kernel.rs perform volatile MMIO register and DMA byte reads/writes.
name = "blkd (virtio-blk driver; DMA, so TCB)"
paths = ["servers/blkd/src"]
max_unsafe = 4
max_undocumented = 0

[[budget]]
# WP-D3 (answer 174): netd is a DMA driver, TCB like blkd. src/kernel.rs holds all of it: volatile
# register reads (32- and 8-bit) and writes, volatile DMA byte reads, writes and zeroing, and the
# one Box::from_raw that hands the receive thread its half.
name = "netd (virtio-net driver; DMA, so TCB)"
paths = ["servers/netd/src"]
max_unsafe = 7
max_undocumented = 0

[[budget]]
# WP-D3 (answer 174): ipd forbids unsafe code; smoltcp and its dependencies are vendored third-party
# code outside this count (vendor/README.md: pinned by checksum, heapless's Vec and LinearMap read).
name = "ipd (the TCP/IP stack; /net over 9P)"
paths = ["servers/ipd/src"]
max_unsafe = 0
max_undocumented = 0

[[budget]]
# WP-R4: both crates forbid unsafe code. consoled uses the runtime's Registers for MMIO.
name = "bootfsd and consoled (the first two 9P servers)"
paths = ["servers/bootfsd/src", "servers/consoled/src"]
max_unsafe = 0
max_undocumented = 0

[[budget]]
# G1: the wire codecs are linked into the runtime, so they run on target. The crate says
# `#![forbid(unsafe_code)]`, so this can only stay at 0.
name = "redoubt-wire (protocol codecs)"
paths = ["libs/wire/src"]
max_unsafe = 0
max_undocumented = 0

[[budget]]
# G1: the legacy Xous ABI, linked into the kernel and loader for shared constants and types.
# Existing code that no budget listed, now counted; no new unsafe. The 44 undocumented uses
# are pre-existing legacy-interface debt. WP-K6 deletes that interface; do not add to it.
name = "redoubt-abi (legacy interface)"
paths = [
    "libs/abi/src/lib.rs", "libs/abi/src/arch/mod.rs", "libs/abi/src/arch/riscv", "libs/abi/src/carton.rs",
    "libs/abi/src/definitions.rs", "libs/abi/src/definitions", "libs/abi/src/pagebuffer.rs",
    "libs/abi/src/process.rs", "libs/abi/src/services.rs", "libs/abi/src/services", "libs/abi/src/string.rs",
    "libs/abi/src/stringbuffer.rs", "libs/abi/src/syscall.rs",
]
max_unsafe = 52
max_undocumented = 44
