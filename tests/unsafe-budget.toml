description = "Ratchet on `unsafe` in the trusted computing base, and on unsafe without a SAFETY comment"
kind = "unsafe-budget"

# Budgets only go down. Raising one needs a justification in the commit that does it.
# Every component is at max_undocumented = 0: all `unsafe` in the
# kernel's and loader's own crates carries a SAFETY comment or a `# Safety` doc. Keep it
# that way. Third-party crates.io dependencies are outside the budget: the ratchet counts code
# this repository owns, and those are pinned by Cargo.lock.
# Only code that runs on rv64 is counted; see docs/testbench.md, "The unsafe budget".
# Every on-target source file is listed. A file left out of every budget is not counted
# at all, and the checker cannot notice; add new sources to a budget when they land.
# vendor/ (smoltcp and its dependencies for ipd, getrandom) is third-party code pinned by
# checksum and outside the ratchet (vendor/README.md), like other crates.io dependencies.

[[budget]]
name = "paging crate (Sv32/Sv39 page tables)"
paths = ["libs/paging/src"]
max_unsafe = 12
max_undocumented = 0

[[budget]]
# The kernel's stride queue rules, linked into the kernel. `#![forbid(unsafe_code)]`.
name = "redoubt-stride (scheduler rules)"
paths = ["libs/stride/src"]
max_unsafe = 0
max_undocumented = 0

[[budget]]
name = "loader"
paths = ["loader/src"]
max_unsafe = 17 # +3: fdt-rs DevTree::from_raw_pointer, the static index buffer, and Platform::read
max_undocumented = 0

[[budget]]
# The boot bundle's signature preimage, linked into the loader, so it is TCB. It is
# `#![forbid(unsafe_code)]`; the budget says so where the rest of the TCB is counted.
name = "redoubt-signing (signature preimages)"
paths = ["libs/signing/src"]
max_unsafe = 0
max_undocumented = 0

[[budget]]
name = "kernel: Sv39, SBI and PLIC backends"
paths = [
    "kernel/src/arch/riscv/mem.rs", "kernel/src/arch/riscv/mmu_flags.rs",
    "kernel/src/arch/riscv/intc_plic.rs", "kernel/src/arch/riscv/timer_sbi.rs",
    "kernel/src/arch/riscv/asm.rs", "kernel/src/platform/sbi", "kernel/src/arch/riscv/physmap.rs",
    "kernel/src/platform/mod.rs",
]
# Includes physmap.rs's `Window::new` over the loader's physmap, and mem.rs's `sync_icache`,
# the one `fence.i`: executable pages must be fetched as written, and inline asm is the only way
# to issue the instruction.
max_unsafe = 13
max_undocumented = 0

[[budget]]
name = "kernel: RISC-V arch (shared with rv32)"
paths = [
    "kernel/src/arch/riscv/irq.rs", "kernel/src/arch/riscv/process.rs", "kernel/src/arch/riscv/syscall.rs",
    "kernel/src/arch/riscv/mod.rs", "kernel/src/arch/riscv/exception.rs", "kernel/src/arch/riscv/panic.rs",
    "kernel/src/arch/riscv/smp.rs", "kernel/src/arch/mod.rs",
]
# Includes smp.rs's hart-block `Sync`, its write of the block and the parked hart's `wfi` (the
# `smp` spike), and syscall.rs's hand-made S-mode trap, `kmain`'s private switch (`switch_trap`).
max_unsafe = 12
max_undocumented = 0

[[budget]]
name = "kernel: core"
paths = [
    "kernel/src/main.rs", "kernel/src/mem.rs", "kernel/src/ptable.rs",
    "kernel/src/args.rs", "kernel/src/io.rs",
    "kernel/src/budget.rs", "kernel/src/handle.rs", "kernel/src/kframe.rs", "kernel/src/redoubt.rs",
    "kernel/src/device.rs", "kernel/src/message.rs", "kernel/src/process.rs", "kernel/src/cell.rs",
    "kernel/src/debug", "kernel/src/endpoint.rs",
    "kernel/src/time.rs", "kernel/src/sched.rs", "kernel/src/dma.rs",
]
# time.rs and sched.rs (the kernel's timer and scheduler) have no unsafe, and device.rs none of
# its own (it reaches frames through kframe.rs and the page tables through arch::mem). Among
# the 19: kframe.rs's three (words of kernel-object frames and of records, through the
# physmap); cell.rs's three (`SpinLock`/`KernelCell` `Sync` and the lock's access); the debug
# console's two (setting `OUTPUT` at boot and `print!`'s use of it); dma.rs's volatile read and
# write of a DMA device's registers through the kernel's register window (the reset before reuse,
# I16), the only access to a device's registers that needs one.
max_unsafe = 19
max_undocumented = 0

[[budget]]
name = "redoubt-sys (system call ABI): the ecall stub"
paths = ["libs/sys/src"]
max_unsafe = 1
max_undocumented = 0

[[budget]]
name = "redoubt-rt (native runtime): the heap's free lists, page buffers and lends, the startup page"
paths = ["libs/rt/src"]
# Includes start.rs turning the panic hook's stored address back into its `fn()`,
# the one way a program (netd) can stop its device before the panic handler exits.
max_unsafe = 10
max_undocumented = 0

[[budget]]
name = "keyd (holds every private key; signs, never exports)"
paths = ["servers/keyd/src"]
# None, and the crate says `#![forbid(unsafe_code)]`, so this can only stay at 0.
max_unsafe = 0
max_undocumented = 0

[[budget]]
# A DMA driver is TCB without DMA confinement (TENETS.md, tenet 7). The four unsafe
# blocks in src/kernel.rs perform volatile MMIO register and DMA byte reads/writes.
name = "blkd (virtio-blk driver; DMA, so TCB)"
paths = ["servers/blkd/src"]
max_unsafe = 4
max_undocumented = 0

[[budget]]
# netd is a DMA driver, TCB like blkd. src/kernel.rs holds all of it: volatile
# register reads (32- and 8-bit) and writes, volatile DMA byte reads, writes and zeroing, and the
# one Box::from_raw that hands the receive thread its half.
name = "netd (virtio-net driver; DMA, so TCB)"
paths = ["servers/netd/src"]
max_unsafe = 7
max_undocumented = 0

[[budget]]
# ipd forbids unsafe code; smoltcp and its dependencies are vendored third-party
# code outside this count (vendor/README.md: pinned by checksum, heapless's Vec and LinearMap read).
name = "ipd (the TCP/IP stack; /net over 9P)"
paths = ["servers/ipd/src"]
max_unsafe = 0
max_undocumented = 0

[[budget]]
# Both crates forbid unsafe code. consoled uses the runtime's Registers for MMIO.
name = "bootfsd and consoled (the first two 9P servers)"
paths = ["servers/bootfsd/src", "servers/consoled/src"]
max_unsafe = 0
max_undocumented = 0

[[budget]]
# The wire codecs are linked into the runtime, so they run on target. The crate says
# `#![forbid(unsafe_code)]`, so this can only stay at 0.
name = "redoubt-wire (protocol codecs)"
paths = ["libs/wire/src"]
max_unsafe = 0
max_undocumented = 0

[[budget]]
# The kernel-half map and PIDs the loader and kernel share. `#![forbid(unsafe_code)]`, so this
# can only stay at 0.
name = "redoubt-layout (kernel-half map)"
paths = ["libs/layout/src"]
max_unsafe = 0
max_undocumented = 0
