description = "Bench self-check: a forbidden line right after the last expected one still fails the case"
arch = ["rv64"]
kind = "boot"
programs = ["log-server"]
# The kernel prints its KMAIN banner straight after the RNG line, within the bench's grace
# period, so reading must not stop at the last expect.
expect = ['Kernel RNG seeded from the loader']
forbid = ['KMAIN']
must_fail = '^forbidden output /KMAIN/: KMAIN'
