description = "Fair kernel entry under contention (R78, kernel/scheduling.md), at four harts: three budgets mapping and unmapping in a loop a range at the cap whose page tables each makes afresh, R12's costliest call, one on every hart but one, beside the latency workload's driver stand-in; every wait for the kernel lock takes it in ticket order (`lock-trace`; each section's length and cause beside, `hold-trace`), every driver wake falls inside the hammers' window, and the driver wake's p50 and p99 net of the checked build's audits are within their 15 and 50 ms targets (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-lock-contention-4"]
# A hammer on every hart but one; two harts are `sched-lock-contention`'s.
smp = [4]
keep_smp = true
# Test builds only: the trace ring with each lock wait's ticket (never in a default kernel).
kernel_features = ["hold-trace"]
# The oracle checks the waits' ticket order and gates the driver wake on its targets. Under
# `-icount` a hart woken while another is in a section runs only when that hart's QEMU turn ends,
# and then draws its ticket behind up to three sections (kernel/scheduling.md, "Residual risks"),
# each about a slice at most: a wake's wait stays well inside the targets.
post_check = "sched_oracle driver_wake_p50_us=15000 driver_wake_p99_us=50000"
timeout_secs = 1200
expect = [
    '^\[lock-contention\] one section alone, a range at the cap mapped with its page tables: p50 \d+ µs, max \d+ µs \(21 sections\)$',
    '^\[lock-contention\] 3 hammers. ranges mapped: \d+$',
    '^\[lock-contention\] driver wake: .*: gross, audits included; net in the post-check',
    '^LATENCY-SAMPLE contention driver_wake \d+ \d+$',
    '^\[lock-contention\] ok: every driver wake fell inside the hammers. window: the last at \d+ µs, the window.s end \d+$',
    '^SCHED-LOCK-CONTENTION TEST PASSED$',
    # The kernel's count at power-off, each hart's: its claims, its claims that found nothing (its
    # context trapped for an alarm another hart claimed first), and their sum, the alarms its
    # context took. A hart other than the boot hart took ten or more: its context is enabled
    # (kernel/boot.md, "Hardware abstraction"; R78). Which hart wins a claim is the idle one's, and
    # which hart idles follows the boot's timing, so it is not what this checks. Nor that every
    # hart takes each alarm: under icount a hammer in the kernel at every rise returns to a source
    # already claimed and masked, and traps for none; `sched-lock-contention-4-mttcg`, where the
    # harts run at once, proves that.
    # Recorded: claimed by hart [4, 3, 1, 193], taken by hart [21, 60, 31, 193] (rv64) and claimed
    # by hart [19, 151, 17, 14], taken by hart [125, 151, 136, 134] (rv32).
    '^external interrupts: claimed by hart \[\d+(, \d+){3}\], found nothing by hart \[\d+(, \d+){3}\], taken by hart \[\d+(, \d+)*, [1-9]\d+(, \d+)*\]$',
    # A checked build's count: idle and lock-wait halts that found the interrupt they wait for
    # pending ran no `wfi` (kernel/scheduling.md, R78).
    '^halts: [1-9]\d* skipped, an awaited interrupt pending$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['\[lock-contention\] FAIL']
poweroff = true
