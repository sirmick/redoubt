description = "Fair kernel entry under contention (R78, kernel/scheduling.md), at four harts: three budgets refused a `map_anon` after a search of the whole area in a loop, one on every hart but one, beside the latency workload's driver stand-in; every wait for the kernel lock takes it in ticket order (`lock-trace`), and the driver wake's numbers are recorded against the targets, not gated (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-lock-contention-4"]
# A hammer on every hart but one; two harts are `sched-lock-contention`'s.
smp = [4]
keep_smp = true
# Test builds only: the trace ring with each lock wait's ticket (never in a default kernel).
kernel_features = ["lock-trace"]
# The oracle checks the waits' ticket order; the driver wake is recorded against the targets at
# four harts (`gate_harts`; kernel/scheduling.md, "Responsiveness").
post_check = "sched_oracle gate_harts=2 driver_wake_p50_us=15000 driver_wake_p99_us=50000"
timeout_secs = 1200
expect = [
    '^\[lock-contention\] 3 hammers. searches refused: \d+$',
    '^\[lock-contention\] driver wake: .*: gross, audits included; net in the post-check',
    '^LATENCY-SAMPLE contention driver_wake \d+ \d+$',
    '^SCHED-LOCK-CONTENTION TEST PASSED$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['\[lock-contention\] FAIL']
poweroff = true
