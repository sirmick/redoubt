description = "Fair kernel entry under contention (R78, kernel/scheduling.md), at four harts: three budgets mapping and unmapping in a loop a range at the cap whose page tables each makes afresh, R12's costliest call, one on every hart but one, beside the latency workload's driver stand-in; every wait for the kernel lock takes it in ticket order (`lock-trace`; each section's length and cause beside, `hold-trace`), every driver wake falls inside the hammers' window, and the driver wake's p50 and p99 net of the checked build's audits are within their 15 and 50 ms targets (p50 6.7 and 9.4 ms); the idle hart alone takes the alarm, so no hart's claims that found nothing pass a single digit, and the claims equal the interrupts the program received (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-lock-contention-4"]
# A hammer on every hart but one; two harts are `sched-lock-contention`'s.
smp = [4]
keep_smp = true
# Test builds only: the trace ring with each lock wait's ticket (never in a default kernel).
kernel_features = ["hold-trace"]
# The oracle checks the waits' ticket order and gates the driver wake on its targets. Under
# `-icount` a hart woken while another is in a section runs only when that hart's QEMU turn ends,
# and then draws its ticket behind up to three sections (kernel/scheduling.md, "Residual risks"),
# each about a slice at most: a wake's wait stays well inside the targets. Net p50/p99 6.7/7.6 ms
# on rv64 and 9.4/10.3 on rv32 against 15/50, the halted idle hart that alone takes the alarm
# waiting a turn (kernel/scheduling.md, "Residual risks").
post_check = "sched_oracle driver_wake_p50_us=15000 driver_wake_p99_us=50000"
timeout_secs = 1200
expect = [
    '^\[lock-contention\] one section alone, a range at the cap mapped with its page tables: p50 \d+ µs, max \d+ µs \(21 sections\)$',
    '^\[lock-contention\] 3 hammers. ranges mapped: \d+$',
    '^\[lock-contention\] driver wake: .*: gross, audits included; net in the post-check',
    # How many interrupts the RTC's `receive`s took (below).
    '^IRQ-RECEIVED \d+$',
    '^LATENCY-SAMPLE contention driver_wake \d+ \d+$',
    '^\[lock-contention\] ok: every driver wake fell inside the hammers. window: the last at \d+ µs, the window.s end \d+$',
    '^SCHED-LOCK-CONTENTION TEST PASSED$',
    # The kernel's count at power-off: each hart's claims and their total, its claims that found
    # nothing, and their sum, the alarms its context took. While a hart idles, one idle hart's
    # context alone takes device interrupts (kernel/boot.md, "The interrupt controller contract"),
    # so the alarms are claimed where the driver idles and no hart traps for one another claimed:
    # every hart's claims that found nothing are a single digit (a few may come when every hart
    # runs and one then idles). The post-check holds their total to the interrupts the program's
    # `receive`s took, the 200 alarms and the RTC probe's (`IRQ-RECEIVED`): each claimed once and
    # delivered, none lost or taken twice where the open context moves.
    '^external interrupts: claimed by hart \[\d+(, \d+){3}\] \(\d+ in all\), found nothing by hart \[\d(, \d){3}\], taken by hart \[\d+(, \d+){3}\]$',
    # A checked build's count: idle and lock-wait halts that found the interrupt they wait for
    # pending ran no `wfi` (kernel/scheduling.md, R78).
    '^halts: [1-9]\d* skipped, an awaited interrupt pending$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['\[lock-contention\] FAIL']
poweroff = true
