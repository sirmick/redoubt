description = "Fair kernel entry under contention (R78, kernel/scheduling.md), at four harts: three budgets refused a `map_anon` after a search of the whole area in a loop, one on every hart but one, beside the latency workload's driver stand-in; every wait for the kernel lock takes it in ticket order (`lock-trace`; each section's length and cause beside, `hold-trace`), and the driver wake's p50 and p99 are recorded, not gated (QEMU's turns, kernel/scheduling.md, \"Residual risks\") (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-lock-contention-4"]
# A hammer on every hart but one; two harts are `sched-lock-contention`'s.
smp = [4]
keep_smp = true
# Test builds only: the trace ring with each lock wait's ticket (never in a default kernel).
kernel_features = ["hold-trace"]
# The oracle checks the waits' ticket order. The driver wake's p50 and p99 are printed beside their
# targets and recorded, not gated (`gate_harts=2`): under `-icount` a hart woken while another is
# in a search runs only when that hart's QEMU turn ends, and then draws its ticket behind up to
# three searches (kernel/scheduling.md, "Residual risks"), so which turn it lands behind follows
# the kernel's timing, not its fairness. A slice's end made cheaper moved it: rv32's p50 read
# 22.3 ms in four runs and 5.1 and 5.3 ms in two, where the kernel before read a steady 7.3 ms in
# six; the p99 stayed 41 ms against 43 to 52. `sched-lock-contention-4-mttcg` judges both where
# the harts run at once (rv32's p50 2,951 µs, 2.2 searches, in the same change's run).
post_check = "sched_oracle driver_wake_p50_us=15000 gate_harts=2"
timeout_secs = 1200
expect = [
    '^\[lock-contention\] 3 hammers. searches refused: \d+$',
    '^\[lock-contention\] driver wake: .*: gross, audits included; net in the post-check',
    '^LATENCY-SAMPLE contention driver_wake \d+ \d+$',
    '^SCHED-LOCK-CONTENTION TEST PASSED$',
    # The kernel's count at power-off, each hart's: its claims, its claims that found nothing (its
    # context trapped for an alarm another hart claimed first), and their sum, the alarms its
    # context took. A hart other than the boot hart took ten or more: its context is enabled (R78),
    # which `irq-boot-hart-only`, the boot hart's context alone, shows as exactly 0. Which hart wins
    # a claim is the idle one's, and which hart idles follows the boot's timing (claimed by hart
    # [29, 4, 168, 0] and [196, 1, 2, 2] in two runs), so it is not what this checks. Nor that every
    # hart takes each alarm: under icount a hammer in the kernel at every rise returns to a source
    # already claimed and masked, and traps for none (taken by hart [197, 167, 0, 168] in one rv32
    # run); `sched-lock-contention-4-mttcg`, where the harts run at once, proves that.
    '^external interrupts: claimed by hart \[\d+(, \d+){3}\], found nothing by hart \[\d+(, \d+){3}\], taken by hart \[\d+(, \d+)*, [1-9]\d+(, \d+)*\]$',
    # A checked build's count: idle and lock-wait halts that found the interrupt they wait for
    # pending ran no `wfi` (kernel/scheduling.md, R78).
    '^halts: [1-9]\d* skipped, an awaited interrupt pending$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['\[lock-contention\] FAIL']
poweroff = true
