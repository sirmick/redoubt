description = "The console's hold against its holder (kernel/devices.md, \"The console's one writer\"), an attack at 2 harts: a child that takes the hold and is killed in the middle of its line has that line ended by the kernel, then the kernel's line that waited for it and its own, each whole; a child that takes the hold and never gives it back holds up no kill and loses no kernel line: 120 children are killed, more than the 4 KiB of lines the kernel keeps waiting, and every kill's line comes out, then system_reset's. The verdict is the kernel's own lines"
arch = ["rv64", "rv32"]
kind = "boot"
icount = "shift=3,sleep=off"
programs = ["console-hold-stuck"]
smp = [2]
timeout_secs = 300
# H's line, ended by the kernel when H dies; the child killed while H held the console; H itself.
# Then S holds the console for good: the 120 kills' lines, and `system_reset`'s, which the program
# asks for only once every kill went through. All but H's line are the kernel's own.
expect = [
    '^\[holder\] cut off$',
    '^\[!\] Terminating process with PID \d+$',
    '^\[!\] Terminating process with PID \d+$',
    '^\[console-stuck\] ok: H held the console, a child and then H were killed$',
