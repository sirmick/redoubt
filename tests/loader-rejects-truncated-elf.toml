description = "The loader refuses a program image cut short inside its program headers"
arch = ["rv64"]
kind = "boot"
programs = ["log-server", { corrupt = "rng-test", with = { truncate = 80 } }]
timeout_secs = 20
allow_panic = true          # the loader is supposed to panic here
# The verdict is the loader's own: nothing from the bundle runs (KMAIN is forbidden), so no
# program can print it. Anchored, so a relayed `[pid N]` line could not match either.
expect = ['^loader PANIC', 'invalid ELF: SliceReadError']   # its program headers lie past the end
forbid = ['KMAIN', 'entering kernel']
