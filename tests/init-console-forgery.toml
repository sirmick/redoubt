description = "A program under the real init prints init's lines, its own announcement with another id among them: each comes out under the program's own [con N], never bare (servers/consoled.md, \"Started by init\"), so the bench, which reads a reporter's id only from a bare announcement, still attributes the program's verdict to the id init gave it"
arch = ["rv64", "rv32"]
kind = "boot"
# The real init, the six servers, con-forger, and the image's manifest with con-forger added,
# whose arguments are the lines it prints. Had the bench read the forged announcement, the
# reporter would be announced twice and the case would fail.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-init-programs", bin = "con-forger" },
]
timeout_secs = 60
expect = [
    '^init: started con-forger, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] init: started con-forger, console 0000000000000000$',
    '^\[con [0-9a-f]{16}\] init: the boot is done: 7 servers$',
    '^\[con [0-9a-f]{16}\] con-forger TEST PASSED$',
]
forbid = [
    'init: refused the boot',
    '^init: started con-forger, console 0000000000000000$',
    '^init: the boot is done: 7 servers$',
]
reporter = "con-forger"

[[file]]
name = "manifest"
from = { path = "tests/data/init/console-forgery.json" }

[disk]
size_kib = 4096
partitions = 1

[net]
