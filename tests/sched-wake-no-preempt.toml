description = "A timeout only wakes (kernel/scheduling.md, \"Preemption points\"): a sleeper whose timeout falls mid-slice, with a spinner on every hart, never takes the hart from the spinner it interrupts, which runs to its slice's end, on each hart (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-wake-no-preempt"]
kernel_features = ["sched-trace"]
post_check = "sched_oracle wake_no_preempt=20"
# One hart: the oracle proves each of the twenty naps against the spinner's slice that follows
# it, which needs every timeout answered by a timer interrupt mid-slice. At two harts a timeout is
# answered at whichever entry comes first, on any hart; sched-wake-no-preempt-harts judges that.
keep_smp = true
timeout_secs = 120
expect = [
    '^\[wake\] the shortest delay from a nap.s start to the sleeper.s run was \d+ µs$',
    '^SCHED-WAKE-NO-PREEMPT TEST PASSED$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['PROGRAM HALT']
poweroff = true
