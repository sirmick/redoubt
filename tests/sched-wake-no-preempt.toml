description = "A timeout only wakes (WP-K5, OWNER DECISION 2): a sleeper whose timeout falls mid-slice runs at the running spinner's slice end, never at once (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-wake-no-preempt"]
timeout_secs = 120
expect = [
    '^\[wake\] ok: a timeout mid-slice waited for the slice.s end',
    '^SCHED-WAKE-NO-PREEMPT TEST PASSED$',
]
forbid = ['\[wake\] FAIL', 'PROGRAM HALT']
poweroff = true
