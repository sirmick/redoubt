description = "init refuses a manifest with a second keyd entry, carrying the development signing seed beside the keyd init asks about (R35): one line saying where and why, then a power-off reporting a system failure (system_reset kind 3, status 255), before any server runs"
arch = ["rv64", "rv32"]
kind = "boot"
# The real init, the images its manifest names, and the manifest: image/manifest.json with a second
# keyd entry, keyd2, whose ssh_host seed is the development signing seed, whose public half the
# loader verifies the bundle with. init asks one keyd about the keys the box is authenticated by,
# so a second would hold that key unasked. The verdict is init's line and the firmware's status,
# which only system_reset kind 3 gives.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
]
timeout_secs = 30
expect = ['^init: refused the boot: servers\[1\]\.program: a second keyd, and init calls only one$']
forbid = ['^init: started']
poweroff = true
poweroff_status = 255

[[file]]
name = "manifest"
from = { path = "tests/data/init/second-keyd.json" }
