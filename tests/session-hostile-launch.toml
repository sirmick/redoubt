description = "A hostile image or startup block from a user's session hurts only the child (docs/servers/init.md, R32 and R31; docs/userland/native.md, \"Launching from a session\"): alice's SSH session makes four images in her home from /boot/beamlet-hello and launches each through the launch native in a budget carved from her own: the first 40 bytes (program headers cut short), the first half (a segment reaching past the image), the image's length of zeros (no ELF), and an empty file; then the whole image with a handle named outside the rule. The stub, as the child, refuses the three malformed images before it maps anything and the child exits 111 with its budget holding nothing; the client refuses the empty image and the bad name before any kernel call (bad_name, the native's name for a client refusal); her session's processes in use are the same after, and a well-formed exec of the same program runs. The verdicts are the launch's answers and the usage as her session, the victim, prints them (rule F); stub-launch is the kernel's and the stub's half from a native parent, process-attack the kernel's for startup records"
arch = ["rv64", "rv32"]
kind = "boot"
# The image's bundle with beamlet-hello public in /boot (steward-vault-launch's).
recipe = "tests/data/steward/vault-launch.boot.toml"
# One principal's budget holding a shell VM's session needs 1 GiB, as steward-vault-session.
memory_mib = 1024
# One login, a shell VM, four launches: twice steward-vault-launch's bound.
timeout_secs = 300
expect = [
    '^init: started sshd, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] sshd: listening on port 22$',
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
]
forbid = [
    'init: refused the boot',
    'init: rebooting',
    '^init: .* (exited|faulted|was killed)',
    'init: restarted',
    'EXCEPTION',
    'steward: the core exited',
    'steward: a step failed',
    'sshd: login .*: refused',
]

# Each answer is tagged, so a pattern matches what the shell printed and never the echo.
[[session]]
user = "alice"
steps = [
    { expect = '\([0-9]+\)> ' },
    { send = "img = File.read!(\"/boot/beamlet-hello\"); {:staged, File.write(\"/home/alice/cut\", binary_part(img, 0, 40)), File.write(\"/home/alice/half\", binary_part(img, 0, div(byte_size(img), 2))), File.write(\"/home/alice/zeros\", :binary.copy(<<0>>, byte_size(img))), File.write(\"/home/alice/empty\", \"\")}\n" },
    { expect = '\{:staged, :ok, :ok, :ok, :ok\}' },
    { send = "l = fn path -> {:ok, b} = Redoubt.Budget.carve(pages: 256, processes: 1, weight: 1); r = case :redoubt.launch(%{image: File.read!(path), budget: b, namespace: [], args: []}) do {:ok, j} -> Redoubt.Process.await(j, 30_000); e -> e end; u = Redoubt.Budget.usage(b); Redoubt.Budget.destroy(b); {r, u} end\n" },
    { expect = '#Function<' },
    { send = "{:ok, own} = Redoubt.Budget.own(); {:ok, %{processes: procs}} = Redoubt.Budget.usage(own); {:before, procs}\n" },
    { expect = '\{:before, \{[0-9]+, 2\}\}' },
    # The stub, running as the child, refuses each image before it maps anything: the child exits
    # 111 and its budget, read as it ended, holds nothing.
    { send = "{:cut, l.(\"/home/alice/cut\")}\n" },
    { expect = '\{:cut,\s*\{\{:exited, 111\}, \{:ok, %\{pages: \{256, 0\}, processes: \{1, 0\}' },
    { send = "{:half, l.(\"/home/alice/half\")}\n" },
    { expect = '\{:half,\s*\{\{:exited, 111\}, \{:ok, %\{pages: \{256, 0\}, processes: \{1, 0\}' },
    { send = "{:zeros, l.(\"/home/alice/zeros\")}\n" },
    { expect = '\{:zeros,\s*\{\{:exited, 111\}, \{:ok, %\{pages: \{256, 0\}, processes: \{1, 0\}' },
    # The client refuses an empty image, and a startup block with a handle name no rule allows,
    # before any kernel call: the native names every client refusal bad_name.
    { send = "{:empty, l.(\"/home/alice/empty\")}\n" },
    { expect = '\{:empty,\s*\{\{:error, :bad_name\},\s*\{:ok, %\{pages: \{256, 0\}, processes: \{1, 0\}' },
    { send = "{:ok, bad} = Redoubt.Budget.carve(pages: 256, processes: 1, weight: 1); r = :redoubt.launch(%{image: img, budget: bad, namespace: [], handles: [{\"Not A Name\", own}], args: []}); {:ok, %{pages: bp, processes: bq}} = Redoubt.Budget.usage(bad); {:bad_handle, r, bp, bq, Redoubt.Budget.destroy(bad)}\n" },
    { expect = '\{:bad_handle, \{:error, :bad_name\}, \{256, 0\}, \{1, 0\}, :ok\}' },
    { send = "{:after, Redoubt.Budget.usage(own) |> elem(1) |> Map.fetch!(:processes) == procs}\n" },
    { expect = '\{:after, true\}' },
    # Her session answers on: its own evaluation's elapsed ms, under 1 s, twice the worst measured
    # once per width (0 ms on rv64, 6 ms on rv32, beside other work) rounded up to a second;
    # `within` is the bench's margin for the line to arrive over ssh on a loaded host, no part of
    # the claim.
    { send = "{us, 55} = :timer.tc(fn -> Enum.sum(1..10) end); {:alive, div(us, 1000)}\n" },
    { within = 20 },
    { expect = '\{:alive, [0-9]{1,3}\}' },
    { send = "exec(\"beamlet-hello\", [\"after\", \"the\", \"attacks\"])\n" },
    { expect = 'beamlet-hello: after the attacks' },
    { expect = '\{:exited, 3\}' },
    { expect = '\([0-9]+\)> ' },
    { exit = 0 },
]

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
forward = [22]
