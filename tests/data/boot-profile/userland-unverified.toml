# The userland disk of image/userland.toml, unverified, for boot-profile-unverified only: the same
# objects in an EROFS volume, with no hash tree after it, so an erofsd attached to the range
# directly reads it (tests/boot-profile-unverified.toml).
# Everything below this header is image/userland.toml's, but `verity`.

# Whole disk, in KiB (a whole number of 512-byte sectors).
size_kib = 16384

[objects]
# Each application the shell's idle prompt loads a module of or starts, whole: the shell's own,
# Elixir's and the OTP applications they name, with Elixir's logger, and erts, whose `prim_file`
# the file server calls for the prompt's working directory.
applications = ["erts", "kernel", "stdlib", "compiler", "crypto", "elixir", "logger", "redoubt_shell"]
# Built here, with MIX_ENV=prod, apart from the development build `./shell` runs.
mix = ["userland/shell"]
# The modules beamlet embeds in place of kernel's own (userland/otp/vm/src/vm.rs, EMBEDDED): it
# loads them before it can read this disk.
exclude = ["application.beam", "gen_tcp.beam", "ram_file.beam"]
# The `Docs` chunk goes with the rest, so `h/1` says no documentation is available.
docs = false
# The boot pack's entries: what the shell loads to its prompt, every module and resource it looks
# up, measured by logging the platform's lookups to the prompt and confirmed by listing the
# entries still untaken when the first prompt is drawn: none. The shell's commands are not among
# them: each is loaded when first called. A name the prompt loads and this list lacks still
# loads, from its own file, at a lookup's cost; one it lists and the prompt does not load keeps
# the pack held, at most the pack's size, through the first command.
pack = [
    "Elixir.Access.beam", "Elixir.Application.beam", "Elixir.Code.beam", "Elixir.Enum.beam",
    "Elixir.File.beam", "Elixir.IO.beam", "Elixir.Kernel.beam", "Elixir.Keyword.beam",
    "Elixir.List.beam", "Elixir.Macro.Env.beam", "Elixir.Module.ParallelChecker.beam",
    "Elixir.Redoubt.Commandlet.Index.beam", "Elixir.Redoubt.Commandlet.Registry.beam",
    "Elixir.Redoubt.Shell.Printer.beam", "Elixir.Redoubt.Shell.beam",
    "Elixir.Redoubt.Term.Text.beam", "Elixir.Redoubt.Term.Width.beam",
    "Elixir.String.Chars.Integer.beam", "Elixir.String.Chars.beam", "Elixir.String.Tokenizer.beam",
    "Elixir.String.beam", "Elixir.System.beam", "compiler.app", "crypto.app", "elixir.app",
    "elixir.beam", "elixir_aliases.beam", "elixir_code_server.beam", "elixir_config.beam",
    "elixir_dispatch.beam", "elixir_env.beam", "elixir_erl.beam", "elixir_erl_pass.beam",
    "elixir_erl_var.beam", "elixir_expand.beam", "elixir_import.beam", "elixir_quote.beam",
    "elixir_sup.beam", "elixir_utils.beam", "erl_anno.beam", "erl_features.beam", "erl_parse.beam",
    "erl_scan.beam", "file.beam", "file_server.beam", "gen.beam", "gen_event.beam",
    "gen_server.beam", "global.beam", "io.beam", "io_lib.beam", "io_lib_format.beam", "kernel.app",
    "lists.beam", "logger.beam", "logger_config.beam", "logger_formatter.beam",
    "logger_h_common.beam", "logger_handler_watcher.beam", "logger_olp.beam", "logger_proxy.beam",
    "logger_server.beam", "logger_simple_h.beam", "logger_std_h.beam", "logger_sup.beam",
    "maps.beam", "ordsets.beam", "prim_file.beam", "proc_lib.beam", "proplists.beam", "queue.beam",
    "rand.beam", "re.beam", "redoubt_shell.app", "string.beam", "supervisor.beam", "unicode.beam",
    "unicode_util.beam",
]

[[partition]]
name = "system"
fs = "erofs"
# Emptied and filled with the objects before every pack.
stage = "target/image/userland"
