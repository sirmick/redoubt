# pack-bad-wrong-length's userland disk (tests/pack-bad-wrong-length.toml): beamlet-boot's,
# with a boot pack whose first entry's length is one more than its bytes, packed unverified so
# the pack reaches beamlet as written.
size_kib = 2048

[objects]
modules = ["io", "lists"]
erlang = ["userland/otp/redoubt/tests/erlang/beamlet_boot.erl"]
pack = ["beamlet_boot.beam", "io.beam", "lists.beam"]
pack_fault = "wrong-length"

[[partition]]
name = "system"
fs = "erofs"
