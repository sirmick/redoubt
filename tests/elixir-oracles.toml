description = "the Elixir oracles on beamlet, under the pinned OTP and Elixir: the steward core's reference over every trace, hand-written and recorded from the model, equal to the Rust core's output byte for byte with every table row taken, and the wire codec's vectors"
kind = "elixir"
otp = "28.5.0.6"
elixir = "1.20.4"
# The build (a cold beamlet and the model's trace writer: 29 s alone on four cores, more beside
# the rest of a bench) runs before the deadline starts. The scripts alone, built: 2.5 s; beside
# two prebuilds: 3.2 s. The deadline is 10 s, four times the alone time; the self-check
# (bench-elixir-oracles-broken-guard) shares this build and this deadline.
build = ["userland/otp/tools/build-oracles"]
timeout_secs = 10
scripts = ["libs/steward/elixir/run-traces", "libs/wire/elixir/run-vectors"]
