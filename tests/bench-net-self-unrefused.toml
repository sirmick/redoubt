description = "Self-check of net-attacks (must fail): the same boot with ipd not told that 10.0.9.102 is the box's own (no self=10.0.9.102/32), so the attack on it connects, and the bench's capture catches the SYN to a self_forbidden address. Proves the case would catch a missing self check. The original: attacks on the real netd and ipd, each from its own account with its positive control in the same boot (under the real init, each attacker a servers entry of the case's manifest with a badge of its own at ipd). Outside its prefix: scoped to 10.0.9.110/32 port 7, a client's connect to 10.0.9.101:7 reaches nothing (the peer counts 0), its control to 10.0.9.110:7 does (1). The box's own addresses, from a scope allowing everything: a forwarded self address (10.0.9.102, the peer counts 0), ipd's own address, loopback and the gateway are refused before any SYN (the capture), the victim listening on 8000 accepts only the bench's dial, and the unlabelled twin reaches its own peer (1). A labelled caller with a wide scope: its connect reaches nothing (its peer counts 0)"
arch = ["rv64", "rv32"]
kind = "boot"
# The real init, the servers, the judge and the clients (tests/data/net/unrefused.json).
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-net-tests", bin = "net-judge" },
    { package = "redoubt-net-client", bin = "net-client" },
]
timeout_secs = 180
expect = [
    '^init: the manifest is checked: 9 servers, bound \d+ pages$',
    '^init: started judge, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] judge ipd has a link ',
    '^\[con [0-9a-f]{16}\] judge victim listening on 8000$',
    '^\[con [0-9a-f]{16}\] judge attack outside the prefix to 10\.0\.9\.101:7: ',
    '^\[con [0-9a-f]{16}\] judge its control to 10\.0\.9\.110:7: ',
    '^\[con [0-9a-f]{16}\] judge attack on the box.s own 10\.0\.9\.102:7: ',
    '^\[con [0-9a-f]{16}\] judge attack on the box.s own 10\.0\.2\.15:8000: ',
    '^\[con [0-9a-f]{16}\] judge attack on the box.s own 127\.0\.0\.1:8000: ',
    '^\[con [0-9a-f]{16}\] judge attack on the box.s own 127\.1\.2\.3:8000: ',
    '^\[con [0-9a-f]{16}\] judge attack on the box.s own 10\.0\.2\.2:8000: ',
    '^\[con [0-9a-f]{16}\] judge attack on the box.s own 10\.0\.2\.2:22: ',
    '^\[con [0-9a-f]{16}\] judge the twin to 10\.0\.9\.111:7: ',
    '^\[con [0-9a-f]{16}\] judge the labelled caller reports \(information only\): ',
    '^\[con [0-9a-f]{16}\] judge ok: the victim accepted the bench.s dial \(1\)$',
    '^\[con [0-9a-f]{16}\] judge ok: the victim accepted nothing more and still runs$',
    '^\[con [0-9a-f]{16}\] judge TEST PASSED$',
]
# A server or client that ends is restarted by init, and says so: none may.
forbid = ['init: refused the boot', '^init: \S+ .*(exited|faulted|was killed)', '^init: restarted ', 'judge FAIL']
reporter = "judge"
must_fail = '^captured frame [0-9]+: the guest sent a SYN to 10\.0\.9\.102:7, one of the box.s own addresses$'

[[file]]
name = "manifest"
from = { path = "tests/data/net/unrefused.json" }

[net]
forward = [8000]
# net-attacks' list: one more than this manifest's ipd refuses, which the capture must catch.
self_forbidden = ["10.0.2.0/24", "10.0.9.102/32", "0.0.0.0/8", "127.0.0.0/8", "224.0.0.0/4", "240.0.0.0/4", "255.255.255.255/32"]

# The attack outside its prefix, and its control.
[[net.peer]]
addr = "10.0.9.101:7"
connections = 0
[[net.peer]]
addr = "10.0.9.110:7"
connections = 1
# A forwarded address of the box's own, and the unlabelled twin's peer.
[[net.peer]]
addr = "10.0.9.102:7"
connections = 0
[[net.peer]]
addr = "10.0.9.111:7"
connections = 1
# The labelled caller's.
[[net.peer]]
addr = "10.0.9.112:7"
connections = 0

# The victim's one legitimate connection.
[[net.dial]]
port = 8000
send = "d3 dial to the victim\n"
expect = "d3 dial to the victim\n"
