description = "Destroying a budget while handles to it and its descendants are held closes every one of them: each stale index is BadHandle, before and after frames and indices are reused (R10, I1, I2)"
arch = ["rv64", "rv32"]
kind = "boot"
# PID 2 log-server; PID 3 budget-victim, second, in system beside the attacker and holding the
# boot endpoint's receive right; PID 4 the attacker, whose first act is to take root, system
# and users from log-server (TAKE_GIFTS; never a device).
programs = ["log-server", "budget-victim", "budget-destroy-attack"]
timeout_secs = 30
# A handle that outlived its budget would reach a freed frame, and the kernel stops on that
# (I1): a PANIC, always forbidden. The verdict is the kernel surviving, the victim's pages and
# its DONE and the power-off. The attacker's lines pin that each stale index was refused and the
# carve returned, as progress.
expect = [
    '^\[server\] gifts given to pid 4$',
    '^\[pid 4\] \[destroy\] held b=\d+ c=\d+ d=\d+ scope=\d+ e=\d+; destroy b -> Ok\(\(\)\)$',
    '^\[pid 4\] \[destroy\] stale index checks refused: 8 of 8$',
    '^\[pid 4\] \[destroy\] system carve returned: true$',
    '^\[pid 4\] \[destroy\] e untouched: Ok\(10\)$',
    '^\[pid 4\] \[destroy\] destroy users -> Ok\(\(\)\), then Err\(BadHandle\)$',
    '^\[pid 4\] \[destroy\] attempts done$',
    '^\[pid 3\] \[victim\] mapped and touched 64 pages in system after the attack$',
    '^\[server\] done: reported by pid 3; still serving$',
]
forbid = ['BREACH']
poweroff = true
reporter = "budget-victim"
