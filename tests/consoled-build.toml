# startup and init to supply the UART and interrupt handles in the startup block.
# `servers/consoled/tests/` covers the threads, fake ns16550 and parked read resumed by an
# interrupt, including 9P conformance vectors; this case checks compilation only.
package = "redoubt-consoled"
