description = "A dead steward's restart is a logout, not a reboot, and leaves the shared servers as it found them (docs/servers/init.md, \"Restarts and reboots\"; docs/servers/steward.md, \"Failure and restart\"): the steward's test-only restart-probe ends every instance 14 s after it starts the console principal's session, so it dies thirteen times with that session and its connections live, slowly enough to stay under the reboot rule. Each time init disconnects the fresh connections it made for the steward at its servers, which frees every connection the steward minted under them for its sessions, empties users one principal's subtree at a time (budget_reap) and restarts the steward, which finds users at 0, carves afresh and starts the console session again. After the thirteenth restart the console session still starts: had the dead stewards' connections been kept, its connections would have met the cap of 8 at bootfsd and erofsd:system by the ninth, at walfsd:data by the fifth (alice's home carve and her session's connection minted through it, two an instance), and ipd's cap of 12 by the thirteenth. walfsd:alice-secrets is released by the same code but holds no connection here, since the case opens no vault session. The verdicts are the kernel's usage through the steward's lines, init's lines and the console's banner (rule F)"
arch = ["rv64", "rv32"]
kind = "boot"
# The image's programs, the steward built with its test-only restart-probe (servers/steward,
# src/bin/steward.rs, PROBE_EXIT): every instance exits 14 s after its console session starts.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-verityd", bin = "verityd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-walfsd", bin = "walfsd" },
    { package = "redoubt-erofsd", bin = "erofsd" },
    { package = "beamlet-redoubt", bin = "beamlet", workspace = "userland/otp" },
    { package = "redoubt-piped", bin = "piped" },
    { package = "redoubt-steward-server", bin = "steward", features = ["restart-probe"] },
    { package = "redoubt-sshd", bin = "sshd" },
    { package = "redoubt-consrelay", bin = "consrelay" },
]
# The principals' budgets, each holding a shell VM's session, need 1 GiB (steward-session-ends).
memory_mib = 1024
# The console session's VM fourteen times, 14 s apart.
timeout_secs = 1500
expect = [
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] steward: users holds 0 pages, 0 processes$',
    '^\[con [0-9a-f]{16}\] steward: carved users/alice account 1001: ',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
    # 9: PROBE_EXIT (servers/steward/src/bin/steward.rs), thirteen times; each restarted instance
    # starts the console session again, the thirteenth's being the verdict.
    '^init: steward \(PID [0-9]+\) exited, code 9$',
    '^init: emptied users: [0-9]+ budgets reaped$',
    '^init: restarted steward, console [0-9a-f]{16}$',
