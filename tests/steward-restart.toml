description = "A dead steward's restart is a logout, not a reboot (docs/servers/init.md, \"Restarts and reboots\"; docs/servers/steward.md, \"Failure and restart\"): with the console principal's session up, a login as the steward's test-only probe ends the steward while it holds sshd's call; init empties users one principal's subtree at a time (budget_reap) and restarts the steward, which finds users at 0, carves afresh and starts the console session again: its shell is back on the console, and nothing reboots. An sshd channel outlives its reaped session (steward.md, Residual risks), so no SSH session is open across the restart. The verdicts are the kernel's usage through the steward's lines, init's lines and the console's banner (rule F)"
arch = ["rv64", "rv32"]
kind = "boot"
# The image's programs, the steward built with its test-only restart-probe (servers/steward,
# src/protocol.rs, PROBE): a login for that one name ends it.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-verityd", bin = "verityd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-littlefsd", bin = "littlefsd" },
    { package = "redoubt-walfsd", bin = "walfsd" },
    { package = "redoubt-erofsd", bin = "erofsd" },
    { package = "beamlet-redoubt", bin = "beamlet", workspace = "userland/otp" },
    { package = "redoubt-steward-server", bin = "steward", features = ["restart-probe"] },
    { package = "redoubt-sshd", bin = "sshd" },
]
# The principals' budgets, each holding a shell VM's session, need 1 GiB (steward-session-ends).
memory_mib = 1024
# The console session's VM, twice.
timeout_secs = 1500
expect = [
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] steward: users holds 0 pages, 0 processes$',
    '^\[con [0-9a-f]{16}\] steward: carved users/alice account 1001: ',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
]
# The sessions run once the lines above are in; what they cause follows, in order.
expect_after = [
    # 9: PROBE_EXIT (servers/steward/src/protocol.rs). An exit holding sshd's call is faulted,
    # as littlefsd-restart's is.
    '^init: steward \(PID [0-9]+\) faulted, code 9, serving nobody, labels none; blamed on nobody: no steward$',
    '^init: emptied users: [0-9]+ budgets reaped$',
    '^init: restarted steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] steward: users holds 0 pages, 0 processes$',
    '^\[con [0-9a-f]{16}\] steward: carved users/alice account 1001: ',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
]
forbid = [
    'init: refused the boot',
    'init: rebooting',
    'steward: users not empty',
    '^init: steward \(PID [0-9]+\) exited, code 3$',
]

[[file]]
name = "manifest"
from = { path = "image/manifest.json" }
verity = "image/userland.toml"

# The probe: alice's key, the probe's name. The steward dies holding the login, so it is refused.
[[session]]
user = "steward-restart-probe"
key = "alice"
steps = [{ expect = 'Permission denied \(publickey\)' }, { exit = 255 }]

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
forward = [22]
