description = "The loader refuses a /chosen/rng-seed under 16 bytes (R17): 8 bytes of the real one, and the boot stops before the kernel"
arch = ["rv64", "rv32"]
kind = "boot"
icount = "shift=3,sleep=off"
programs = ["log-server"]
timeout_secs = 10
# QEMU's own tree for this line, with the seed cut to its first 8 bytes (docs/testbench.md,
# "Hostile inputs"); every real QEMU boot supplies 32, which is why no boot attacked this before.
device_tree = [{ shrink = "/chosen/rng-seed", to = 8 }]
allow_panic = true          # the loader is supposed to panic here
# The verdict is the loader's own: nothing from the bundle runs (KMAIN is forbidden), so no
# program can print it. Anchored, so a relayed `[pid N]` line could not match either.
expect = ['^loader PANIC', 'the device tree has no usable /chosen/rng-seed']
forbid = ['KMAIN', 'rng-seed: \d+ bytes', 'Kernel RNG seeded']
poweroff = true             # and the refusal stops the machine, rather than limping on
poweroff_status = 255       # RustSBI preserves the loader's SBI SystemFailure reason
