description = "A budget's deadline destroys it (R10): the running spinner inside it is killed at the deadline, killed notices blame nobody and arrive on time, a call its server took is abandoned once and the reply discarded, a send queued through a handle stamped with it fails Dead, every handle to it is revoked, system's usage is restored (I10); a past deadline destroys at once, FOREVER never, and a destroyed child's later deadline never fires (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["budget-deadline"]
timeout_secs = 120
expect = [
    '^\[deadline\] ok: the running spinner.s budget was destroyed at its deadline, killed notices blaming nobody$',
    '^\[deadline\] lateness ok \(',
    '^\[deadline\] ok: the server took the lease.s call$',
    '^\[deadline\] ok: 2 killed notices, blaming nobody$',
    '^\[deadline\] ok: the taken call was abandoned: one notice, reply discarded$',
    '^\[deadline\] ok: a send queued through a handle stamped with the lease failed Dead, the handle revoked$',
    '^\[deadline\] ok: handles to the lease, its child and stamped with it revoked',
    '^\[deadline\] ok: system.s usage restored',
    '^\[deadline\] ok: a past deadline destroys at once',
    '^\[deadline\] ok: the destroyed child.s later deadline did not fire$',
    '^BUDGET-DEADLINE TEST PASSED$',
]
forbid = ['\[deadline\] FAIL', '\[deadline\] lateness LATE']
poweroff = true
