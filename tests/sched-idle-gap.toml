description = "A sleeper cannot bank credit across an idle gap (the floor): B keeps half after A wakes into an empty queue; a budget created in the gap enters at the floor (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-idle-gap"]
timeout_secs = 600
expect = [
    '^\[idle-gap\] ok: B after the gap got',
    '^\[idle-gap\] ok: a budget created in the gap got',
    '^SCHED-IDLE-GAP TEST PASSED$',
]
forbid = ['\[idle-gap\] FAIL']
poweroff = true
