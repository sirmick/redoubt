description = "sched-lock-contention-4 where the harts run at once (multi-threaded TCG, no icount): three budgets refused a `map_anon` after a search of the whole area in a loop beside the driver stand-in; every wait for the kernel lock takes it in ticket order, and the driver wake's p50 and p99 are at most three and eight searches of the same run alone, since host time moves both, with the 15 and 50 ms targets recorded beside them, not judged, under the range cap (kernel/scheduling.md, R78) (host time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
programs = ["sched-lock-contention-4"]
smp = [4]
keep_smp = true
# Test builds only: the trace ring with each lock wait's ticket (never in a default kernel).
kernel_features = ["lock-trace"]
# The oracle checks the waits' ticket order and judges the driver wake's net p50 and p99 in
# searches of this run, alone (`one search alone`): host time moves both. A wake waits behind at
# most three searches and the one in progress (R78). On q's quiet cores twenty runs read a p50 of
# 1.6 to 1.9 searches and a p99 of 2.0 to 3.0, one run a width at 6.1 and 5.1: so 3 and 8. The p99
# bound cannot see a wake a search or two longer; the p50 bound does (the irq-boot-hart-only kernel
# reads 3.7 to 4.9 there). The absolute targets, 15 and 50 ms, are printed beside them and
# recorded, not judged, as `sched-lock-contention`'s are: under the range cap a wake waits a whole
# search, longer than the p50 target, until the search is bounded (kernel/scheduling.md, R78).
# Host time: a verdict only alone, on q's quiet cores
# (scripts/jobs.mk; docs/testbench.md, "On a shared host"). That set is four cores for four vCPU
# threads and QEMU's main thread: if the case flakes, look there first.
post_check = "sched_oracle driver_wake_p50_us=15000 driver_wake_p99_us=50000 driver_wake_p50_searches=3 driver_wake_p99_searches=8 record=rv64:4:contention:driver_wake:p50 record=rv64:4:contention:driver_wake:p99 record=rv32:4:contention:driver_wake:p50 record=rv32:4:contention:driver_wake:p99"
timeout_secs = 600
expect = [
    '^\[lock-contention\] one search alone: p50 \d+ µs, max \d+ µs \(21 searches\)$',
    '^\[lock-contention\] ok: every hammer pinned its area before the window opened$',
    '^\[lock-contention\] 3 hammers. searches refused: \d+$',
    '^\[lock-contention\] driver wake: .*: gross, audits included; net in the post-check',
    '^LATENCY-SAMPLE contention driver_wake \d+ \d+$',
    '^\[lock-contention\] ok: every driver wake fell inside the hammers. window: the last at \d+ µs, the window.s end \d+$',
    '^SCHED-LOCK-CONTENTION TEST PASSED$',
    # The kernel's count at power-off: every hart's context took ten or more of the 200 alarms
    # (claims and claims that found nothing). Where the harts run at once each one in user mode or
    # idle when an alarm rises traps for it (kernel/scheduling.md, "Every hart pays for each device
    # interrupt"): taken by hart [195, 201, 196, 197] (rv64) and [177, 176, 179, 198] (rv32).
    # Under icount, `sched-lock-contention-4`, a hammer can be in the kernel at every rise. The same
    # program on the `irq-boot-hart-only` kernel here fails it: claimed by hart [202, 0, 0, 0],
    # found nothing by hart [0, 0, 0, 0], taken by hart [202, 0, 0, 0] (a recorded run, both
    # widths).
    '^external interrupts: claimed by hart \[\d+(, \d+){3}\], found nothing by hart \[\d+(, \d+){3}\], taken by hart \[[1-9]\d+(, [1-9]\d+){3}\]$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['\[lock-contention\] FAIL']
poweroff = true
