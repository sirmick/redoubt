description = "The round at N = 4 of the responsiveness targets measured with the real steward, a companion of `steward-latency` (N = 1, 2 and 3) and `steward-latency-n16` (N = 16, rv64 only): the kernel's trace ring is per boot, so the five rounds split across three boots to each fit their own ring, and this boot carries N = 4 alone, the heaviest low-N round, about 3.1M of the ring's 8,388,608 records (per-round records ~1M / 2.2M / 2.4M / 3.1M / 1.5M at N = 1 / 2 / 3 / 4 / 16: a boot of all five overran the ring at two harts, a boot of N = 1 to 4 too, and on rv32 N = 1 to 3 alone fill 6.0M of it at two harts, so N = 4 fits beside neither). alice's session holds four live leases: three spinning agents (Redoubt.Agents.Echo `spin`, each a beamlet VM on a lease) beside the one measured lease (a probe lease the steward ends by its own decision, or a deadline lease the kernel takes), on the same manifest and recipes as the companions. D = 16 probe and 16 deadline leases, run one at a time beside the spinners (the deadline lease 14 s, twice the round's worst launch over both widths, so its deadline falls on a running VM, and the next lease is requested only after the previous is gone). The deadline notice is the exit notice's arrival less the deadline, one sample per lease grouped at N; p99 at D samples is the maximum, the pinned seed's sweep behind it. The case owns its round count: it writes the done marker after its round, on which the probe marks the window's end; the six marker-file exits reap every lease and trip init's reboot, whose reset dumps the kernel's trace the oracle reads. Targets unchanged from the stand-in's and the companions': decision wake p50 <= 25 ms and p99 <= 95 ms, timer wake p50 <= 15 ms and p99 <= 50 ms, deadline notice p99 <= 40 ms, R10 kernel time p99 <= 30 ms, a lease's end <= 125 ms; judged by the post-check net of audits, every pick checked by the rank oracle. A miss is a finding, not a tuning"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
# The guest seed the gate runs, sched-latency's; the sweep is recorded in the package's report.
qemu_seed = 3
# Out of the whole run until its rows pass on both widths. This boot runs the round at N = 4
# alone; steward-latency runs N = 1, 2 and 3 and steward-latency-n16 the round at N = 16. The
# ring is per boot: one boot of all five rounds overran its 8,388,608 records at two harts, one
# of N = 1 to 4 too, and N = 1 to 3 alone fill 6.0M of it on rv32 at two harts, so this round,
# about 3.1M records, has a boot of its own. The deadline lease is 14 s, twice the round's worst
# launch (2 x 6.62 s, rv32 at two harts beside three spinners, rounded up to a second), so its
# deadline falls on a running VM and never inside the launch (kernel/scheduling.md, "With the
# real steward"); the measured leases run one at a time, for a clean per-notice sample (the
# derivation and the per-notice rationale are in steward-latency.toml's comments).
whole_run = false
# The image's programs, the steward built with its test-only latency-probe (servers/steward,
# src/bin/steward.rs, Probe), and the crossing program the image publishes. The latency manifest
# gives the steward the stand-in's weight, 1000 under `system`, the image's own: the
# workload the page's targets were set at.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-verityd", bin = "verityd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-walfsd", bin = "walfsd" },
    { package = "redoubt-erofsd", bin = "erofsd" },
    { package = "beamlet-redoubt", bin = "beamlet", workspace = "userland/otp" },
    { package = "redoubt-piped", bin = "piped" },
    { package = "redoubt-crossing", bin = "crossing" },
    { package = "redoubt-steward-server", bin = "steward", features = ["latency-probe"] },
    { package = "redoubt-sshd", bin = "sshd" },
    { package = "redoubt-consrelay", bin = "consrelay" },
]
# The same latency manifest as steward-latency: alice sized for sixteen lease VMs of 5,248 pages
# beside her two sessions of 11,392 (a share of 106,770 = 2 x 11,393 + 16 x 5,249), bob's 16,384
# under `users`, and the trace ring's large form (256 MiB). 1536 MiB, not 2048: RAM starts at
# 0x8000_0000 and two GiB wrap the 32-bit address space, so rv32 booted to nothing.
memory_mib = 1536
# Test builds only: the trace ring, its large form, and its dump at the reset.
kernel_features = ["sched-trace-large"]
# The targets are gated at one hart and at two on rv64 and at one hart on rv32
# (kernel/scheduling.md, "Responsiveness"): the rv32 two-hart boots are recorded on that page
# (`--smp 2`; this round meets every target there), not gated, while the N = 2 round's timer wake
# there (steward-latency) is a finding of its own.
smp = { rv64 = [1, 2], rv32 = [1] }
# Four beamlet VMs live at once under icount, and the reboot rule needs six exits within 60 s.
# One round here; on rv32 under icount its counts come after a long run.
timeout_secs = 10800
# One cell is recorded, not judged, its target unmoved: the deadline notice's p99 at two harts
# on rv64. Under icount the harts take turns on one host thread and both harts' instructions
# advance one clock, so the other hart's work is counted inside the steward's send (p99 27.2 ms
# there, 33.5 in a later run); the cell is judged where the harts run at once, in
# steward-latency-n4-mttcg (kernel/scheduling.md, "With the real steward" and "A hart waits
# for QEMU's turns").
post_check = "sched_oracle gate_harts=2 r10_p99_us=30000 lease_end_p99_us=125000 timer_wake_p50_us=15000 timer_wake_p99_us=50000 decision_wake_p50_us=25000 decision_wake_p99_us=95000 deadline_notice_p99_us=40000 record=rv64:2:N=4:deadline_notice:p99"
expect = [
    '^init: started sshd, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] sshd: listening on port 22$',
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
]
forbid = [
    'init: refused the boot',
    'EXCEPTION',
    'steward: a step failed',
    'steward: the core exited',
    'sshd: login .*: refused',
    'target missed',
]
# The round's counts (deadline_notice and decision_wake at N = 4, D = 16), then the window's end
# on the done marker; the marker ends six instances within the minute and init reboots, the reset
# dumping the kernel's trace the post-check reads (these follow the session, not in `expect`).
expect_after = [
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=4 deadline_notice 16$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-COUNT N=4 decision_wake 16$',
    '^\[con [0-9a-f]{16}\] steward: LATENCY-END [0-9]+$',
    '^\[con [0-9a-f]{16}\] steward: latency-probe: the case is done, exiting for the reboot$',
    '^init: steward \(PID [0-9]+\) exited, code 9$',
    '^init: rebooting: steward was restarted 5 times within 60 seconds$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]

# Alice's session drives N = 4 (three spinners, D = 16) with steward-latency's round function:
# D probe leases (9 s, ended by the steward within a tenth of a second) and D deadline leases the
# kernel takes, run one at a time beside the spinners (the lease 14 s, twice the round's worst
# launch; the derivation and the per-notice rationale are in steward-latency.toml's session
# comment). The round's marker file is written, on which the probe counts it out; then the done
# marker, on which the probe prints the window's end and exits for the reboot.
[[session]]
user = "alice"
pty = true
steps = [
    { expect = '/home/alice \([0-9]+\)> ' },
    { send = "{:ok, c} = Redoubt.Contexts.connection(); {:stage, File.mkdir_p(\"/home/alice/project/out\"), File.write(\"/home/alice/project/in\", \"spin\")}\n" },
    { expect = '\{:stage, :ok, :ok\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "start = fn us -> {:ok, %{lease: l}} = Redoubt.Wire.Client.Steward.start_agent(c, us, Redoubt.Wire.Client.launch_timeout()); l end; round = fn n, d, r -> spinners = for _ <- 1..n//1, do: start.(600_000_000); Process.sleep(5000); for _ <- 1..d, do: (start.(9_000_000); Process.sleep(1500)); ls = case n do 0 -> 8; 1 -> 10; 2 -> 11; 3 -> 14; _ -> 14 end; for _ <- 1..d, do: (start.(ls * 1_000_000); Process.sleep((ls + 1) * 1000)); Enum.each(spinners, &Redoubt.Wire.Client.Steward.end_lease(c, &1)); File.write(\"/home/alice/latency-round-#{r}\", \"round over\"); Process.sleep(3000); {:round, r, :done} end; round.(3, 16, 1)\n" },
    { expect = '\{:round, 1, :done\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "{:marker, File.write(\"/home/alice/latency-done\", \"the case is done\")}\n" },
    { expect = '\{:marker, :ok\}' },
    { expect = '\([0-9]+\)> ' },
    { exit = 0 },
]

[[file]]
name = "manifest"
from = { path = "tests/data/steward/latency.manifest.json" }
verity = "image/userland.toml"

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
forward = [22]
