description = "Every kind of message across address spaces: a call with words, a lend, a writable lend, a send with a transfer (checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
# Built with the checks on (docs/testbench.md, "Checked builds").
debug_assertions = true
programs = ["log-server", "ipc-client"]
smp = [1, 4]
expect = [
    'KMAIN \(clean boot\)',
    '\[server\] PID 2 listening',
    'ok: call sum',
    'ok: writable lend returned Ok\("LENT MUTABLY ACROSS ADDRESS SPACES"\)',
    'ok: 1000 writable lend round trips',
    '\[server\] moved page at',
    "ok: transferred page's address is free again",
    'IPC TEST PASSED',
]
