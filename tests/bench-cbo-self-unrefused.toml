description = "Self-check of cbo-user-fault (must fail): the same boot with the kernel built plant-senvcfg, which writes senvcfg permissive after the boot's check, standing in for a hart whose reset value is not 0. Each child's operation then runs, cbo.inval, cbo.clean, cbo.flush and cbo.zero alike, and the child exits 0, so the case's closing verdict line never comes. Proves the case would catch a hart left permissive, and that QEMU runs all four operations when they are allowed, so the case does not pass vacuously"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
kernel_features = ["plant-senvcfg"]
programs = ["cbo-user-fault"]
timeout_secs = 30
# Each line is the kernel's exit notice for one child, read by the sole first program: `exited`
# with code 0 means the operation ran unrefused. All four must be seen before the run fails on the
# missing verdict line.
expect = [
    '^\[cbo-user-fault\] FAIL: cbo\.inval by a child ended Exited with code 0$',
    '^\[cbo-user-fault\] FAIL: cbo\.clean by a child ended Exited with code 0$',
    '^\[cbo-user-fault\] FAIL: cbo\.flush by a child ended Exited with code 0$',
    '^\[cbo-user-fault\] FAIL: cbo\.zero by a child ended Exited with code 0$',
    '^\[cbo-user-fault\] CBO USER FAULT$',
]
poweroff = true
must_fail = '^the guest reported a failure \(\[cbo-user-fault\] FAIL: cbo\.inval by a child ended Exited with code 0\); then guest exited while waiting for /\^\\\[cbo-user-fault\\\] CBO USER FAULT\$/: QEMU exited with exit status: 0$'
