description = "The checked build's chain audit catches a missing chain entry (kernel/budgets.md, \"Residual risks\", item 3; I2): a test build installs every handle without its stamp entry (handle-chain-fault), and after the attack case destroys its top budget the audit stops the kernel on the first handle held outside its stamp's subtree that its stamp's chain does not hold (handle-chain-fault, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
icount = "shift=3,sleep=off"
debug_assertions = true
kernel_features = ["handle-chain-fault"]
programs = ["handle-chain-attack"]
timeout_secs = 10
allow_panic = true          # the kernel is supposed to panic here
poweroff = true
poweroff_status = 255
# The verdict is the kernel's own audit: the destruction itself returns, and the audit after
# its walk finds the handle the planted fault left out of its stamp's chain.
expect = [
    '^\[chain-attack\] ok: holder 1 in beside holds C.s endpoint and the process object$',
    '^PANIC in PID \d+: panicked at kernel/src/handle.rs:[0-9]+:[0-9]+:$',
    '^I2: handle \d+ of PID \d+ is not in the chains its holder.s place calls for$',
]
