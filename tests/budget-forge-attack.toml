description = "Forged handle indices (unused slots, pages the table does not have, past the table, 0, wider than 32 bits) are BadHandle for every call; none reaches a budget the attacker holds (I1)"
arch = ["rv64", "rv32"]
kind = "boot"
# PID 2 log-server; PID 3 budget-victim, the first program started, holding the boot endpoint's
# receive right and `system`; PID 4 the attacker, holding `system` (slot 4), never a device.
# Each runs in a budget of its own under `system`.
programs = [
    "log-server",
    { bin = "budget-victim", budgets = ["system"] },
    { bin = "budget-forge-attack", budgets = ["system"] },
]
timeout_secs = 30
# Indices 129..=133 and 257..=261 name slots 1-5 of pages the attacker's table does not have, and
# 2^32 + 4 has system's index in its low half: a kernel that dropped the page, or truncated,
# would destroy system, and the victim, whose budget is under it, would never report. The verdict is
# the victim's pages and its DONE and the power-off; the attacker's counts are progress.
expect = [
    '^\[server\] started budget-forge-attack as pid 4$',
    '^\[pid 4\] \[forge\] \d+ of \d+ calls on forged indices got BadHandle \(all\)$',
    '^\[pid 4\] \[forge\] raw index 0, all ones, 2\^32 \+ 4 -> \[Some\(BadHandle\), Some\(BadHandle\), Some\(BadHandle\)\]$',
    '^\[pid 4\] \[forge\] attempts done$',
    '^\[pid 3\] \[victim\] mapped and touched 64 pages after the attack; every budget it holds within its limits: true$',
    '^\[server\] done: reported by pid 3; still serving$',
]
forbid = ['BREACH']
poweroff = true
reporter = "budget-victim"
