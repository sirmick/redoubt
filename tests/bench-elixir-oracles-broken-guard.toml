description = "self-check: with the steward reference's not_locked guard held always, its output leaves the Rust core's where a locked-out domain's grant must fail to start, and the case fails there"
kind = "elixir"
otp = "28.5.0.6"
elixir = "1.20.4"
# The build (a cold beamlet and the model's trace writer: 29 s alone on four cores, more beside
# the rest of a bench) runs before the deadline starts. The scripts alone, built: 1.3 s; beside
# two prebuilds: 1.7 s. The deadline is elixir-oracles' 10 s, four times its 2.5 s alone.
build = ["userland/otp/tools/build-oracles"]
timeout_secs = 10
scripts = ["libs/steward/elixir/run-traces --break not_locked"]
must_fail = '(?m)^ +DIVERGES blame\.trace: event 11: .*\n +rust: +audit 1/7 at=13 StartFailed lease=601\n +elixir: +audit 1/7 at=13 AgentStarted lease=601 '
