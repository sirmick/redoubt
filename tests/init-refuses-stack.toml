description = "init refuses an empty declared server stack before any server runs, then powers off with a system failure"
arch = ["rv64", "rv32"]
kind = "boot"
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-fsd", bin = "fsd" },
]
timeout_secs = 30
expect = ['^init: refused the boot: servers\[0\]\.stack_pages: a stack is 1 to 128 pages and smaller than its budget$']
forbid = ['^init: started']
poweroff = true
poweroff_status = 255

[[file]]
name = "manifest"
from = { path = "tests/data/init/system-fit.json" }
servers = [{ name = "keyd", stack_pages = "0" }]
