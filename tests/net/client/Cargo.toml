[package]
name = "redoubt-net-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The net cases' clients, a victim and attackers among them, started by init (tests/net)"

# One program, its role chosen by argument (src/lib.rs); each is a servers entry of its case's
# manifest.
[[bin]]
name = "net-client"
path = "src/main.rs"

[dependencies]
redoubt-rt = { path = "../../../libs/rt" }
redoubt-ipd = { path = "../../../servers/ipd" }
