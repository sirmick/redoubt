[package]
name = "redoubt-net-tests"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The net cases' judge, and the host test that checks each net case's manifest against its case file (docs/testbench.md)"

# The reporter of the net cases under init: a servers entry the clients report to.
[[bin]]
name = "net-judge"
path = "src/bin/net-judge.rs"
test = false

[dependencies]
redoubt-init-programs = { path = "../init-programs" }
redoubt-rt = { path = "../../libs/rt" }
# The restart probe's constants, shared with netd's test-only feature (net-judge, tests/cases.rs).
redoubt-netd = { path = "../../servers/netd" }
redoubt-net-client = { path = "client" }

[dev-dependencies]
# Each case's manifest, read with init's own decoder, and ipd's arguments with its own parser
# (tests/cases.rs).
redoubt-init = { path = "../../servers/init" }
redoubt-ipd = { path = "../../servers/ipd" }
toml = "0.8"
