description = "The image's disk serves its staged files (image/README.md): the disk is packed from image/disk.toml as ./mkimage packs it, its data partition a littlefs volume written through littlefsd's own code, here holding the littlefsd cases' stage; init boots the image's manifest, whose littlefsd:data mounts that volume without formatting it, and a client handed a root badge at littlefsd:data reads each staged file back"
arch = ["rv64", "rv32"]
kind = "boot"
# The real init, the image's servers and beamlet, and littlefsd-client; the manifest is the image's
# with the client added.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-verityd", bin = "verityd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-littlefsd", bin = "littlefsd" },
    { package = "beamlet-redoubt", bin = "beamlet", workspace = "userland/otp" },
    { package = "redoubt-littlefsd-programs", bin = "littlefsd-client" },
]
# The image needs 512 MiB: beamlet's budget, twice the shell VM's largest peak, does not fit the
# system budget a quarter of 256 MiB gives (docs/kernel/budgets.md).
memory_mib = 512
timeout_secs = 60
expect = [
    '^init: the manifest is checked: 12 servers, bound \d+ pages$',
    '^init: started littlefsd:data, console [0-9a-f]{16}$',
    '^init: started client, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] littlefsd-client read 2 files$',
    '^\[con [0-9a-f]{16}\] littlefsd-client TEST PASSED$',
]
forbid = ['init: refused the boot', '^init: .* (exited|faulted|was killed)', 'init: restarted', 'littlefsd-client TEST FAILED']
reporter = "client"

[[file]]
name = "manifest"
from = { path = "image/manifest.json" }
verity = "image/userland.toml"

[[file.servers]]
name = "client"
program = "littlefsd-client"
budget = { pages = "256", processes = 1, weight = 100 }
handed = [{ endpoint = "littlefsd:data", badge = "7" }]
args = ["read", "littlefsd:data", "/motd", "Redoubt, from the image disk\n", "/etc/notes", "staged under etc\n"]

[disk]
recipe = "image/disk.toml"
stage = "tests/data/littlefsd/stage"

[userland]
recipe = "image/userland.toml"

[net]
