description = "The image's disk serves its staged files (image/README.md): the disk is packed from image/disk.toml as ./mkimage packs it, its data partition a walfs volume written by libs/walfs, here holding the steward cases' stage (the littlefsd cases' files and the principals' homes, which the console session's home needs); init boots the image's manifest, whose walfsd:data mounts that volume without formatting it, and a client handed a root badge at walfsd:data (littlefsd-client, a client of either writable server) reads each staged file back"
arch = ["rv64", "rv32"]
kind = "boot"
# The real init, the image's servers, the steward, sshd, beamlet and piped, and littlefsd-client;
# the manifest is the image's with the client added.
programs = [
    { package = "redoubt-init", bin = "init" },
    { package = "redoubt-keyd", bin = "keyd" },
    { package = "redoubt-consoled", bin = "consoled" },
    { package = "redoubt-bootfsd", bin = "bootfsd" },
    { package = "redoubt-blkd", bin = "blkd" },
    { package = "redoubt-verityd", bin = "verityd" },
    { package = "redoubt-netd", bin = "netd" },
    { package = "redoubt-ipd", bin = "ipd" },
    { package = "redoubt-walfsd", bin = "walfsd" },
    { package = "redoubt-erofsd", bin = "erofsd" },
    { package = "beamlet-redoubt", bin = "beamlet", workspace = "userland/otp" },
    { package = "redoubt-piped", bin = "piped" },
    { package = "redoubt-steward-server", bin = "steward" },
    { package = "redoubt-sshd", bin = "sshd" },
    { package = "redoubt-consrelay", bin = "consrelay" },
    { package = "redoubt-littlefsd-programs", bin = "littlefsd-client" },
]
# The image needs 1 GiB: the principals' budgets, each holding the shell VM's session, do not fit
# the users budget 256 MiB leaves (docs/kernel/budgets.md).
memory_mib = 1024
timeout_secs = 60
expect = [
    '^init: the manifest is checked: 14 servers, bound \d+ pages$',
    '^init: started walfsd:data, console [0-9a-f]{16}$',
    '^init: started client, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] littlefsd-client read 2 files$',
    '^\[con [0-9a-f]{16}\] littlefsd-client TEST PASSED$',
]
forbid = ['init: refused the boot', '^init: .* (exited|faulted|was killed)', 'init: restarted', 'littlefsd-client TEST FAILED']
reporter = "client"

[[file]]
name = "manifest"
from = { path = "image/manifest.json" }
verity = "image/userland.toml"

[[file.servers]]
name = "client"
program = "littlefsd-client"
budget = { pages = "256", processes = 1, weight = 100 }
handed = [{ endpoint = "walfsd:data", badge = "8" }]
args = ["read", "walfsd:data", "/motd", "Redoubt, from the image disk\n", "/etc/notes", "staged under etc\n"]

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[userland]
recipe = "image/userland.toml"

[net]
