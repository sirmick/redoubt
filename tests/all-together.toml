description = "IPC tests sharing one log server with the kernel's timer running, to catch interference between processes (checked build)"
arch = ["rv64"]
kind = "boot"
# Built with the checks on (docs/testbench.md, "Debug assertions").
debug_assertions = true
programs = ["log-server", "ipc-client"]
smp = [1, 2]
expect = ["IPC TEST PASSED"]

[[grant]]
program = "log-server"
mmio = ["0x10000000:0x1000"]
