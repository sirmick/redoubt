description = "A call's kernel time does not grow with what other budgets hold (R12): process_create with its exit notice, an interrupt, a one-page map_anon, budget_create and a rolled-back process_create stay within twice their empty-system time and the wake target after one budget fills its page limit with endpoints (virtual time, release build)"
arch = ["rv64", "rv32"]
kind = "boot"
# A release build: a checked build re-scans every object frame to prove the indexes, which is
# what would be measured.
icount = "shift=3,sleep=off"
programs = ["scan-bounds"]
timeout_secs = 600
expect = [
    '^\[scan-bounds\] ok: the filler filled its budget with endpoints',
    '^\[scan-bounds\] ok: a rolled-back process_create is refused and costs nothing',
    '^\[scan-bounds\] ok: process_create to notice stays bounded',
    '^\[scan-bounds\] ok: interrupt stays bounded',
    '^\[scan-bounds\] ok: map_anon of a page stays bounded',
    '^\[scan-bounds\] ok: budget_create stays bounded',
    '^\[scan-bounds\] ok: rolled-back process_create stays bounded',
    '^SCAN-BOUNDS TEST PASSED$',
]
forbid = ['\[scan-bounds\] FAIL', 'PANIC']
poweroff = true
