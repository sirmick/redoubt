description = "Bench self-check: concurrent scripted SSH sessions, ordered by marks, exit statuses checked, against Redoubt's sshd on its host platform"
kind = "ssh-loopback"
timeout_secs = 20
# ssh runs redoubt-sshd-host itself, one process per session, which logs in each of these test
# keys as the principal of its name and runs a scripted console, not a shell.
authorized = ["alice", "bob"]

[[session]]
user = "alice"
steps = [
    { send = "echo alice-42\n" },
    { expect = '^alice-42$' },
    { mark = "alice-in" },
    { wait = "bob-done" },
    { send = "exit 3\n" },
    { exit = 3 },
]

# Ends the default way: input closed, and ssh must exit with status 0.
[[session]]
user = "bob"
steps = [
    { wait = "alice-in" },
    { send = "echo bob-was-here\n" },
    { expect = '^bob-was-here$' },
    { mark = "bob-done" },
]

# A terminal session: the login name's `+label` is not part of the key's name.
[[session]]
user = "alice+tty"
pty = true
steps = [
    { send = "tty; exit\n" },
    { expect = '^pty$' },
]

# A key the server does not accept: ssh's refusal is output, and its status is checked.
[[session]]
user = "mallory"
steps = [
    { expect = 'Permission denied \(publickey\)' },
    { exit = 255 },
]
