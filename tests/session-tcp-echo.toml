description = "gen_tcp over /net from a session's VM (docs/userland/beamlet.md, \"beamlet on Redoubt\"; docs/servers/ipd.md, \"The /net tree\"): the image boots with sshd on port 22 and alice logs in over SSH; her shell's :gen_tcp.connect to the bench's peer at 10.0.9.100:80 goes through the session's /net at ipd, and on that one connection each packet mode round-trips an echo: raw, line, a 2-byte length header, and active mode with a 4-byte header after the line's process takes the socket over, the mode changed by setopts between, then the socket is closed. The verdict is the peer's: it counts exactly 1 connection and the capture shows 1 SYN to it and none to the box's own addresses (rule F); the values the shell prints are tagged so a pattern matches the printed value and never the echo of the line typed"
arch = ["rv64", "rv32"]
kind = "boot"
recipe = "image/boot.toml"
# The image needs 1 GiB: the principals' budgets, each holding a shell VM's session, do not fit
# the users budget 256 MiB leaves (docs/kernel/budgets.md).
memory_mib = 1024
# One login, booting a shell VM, and one connection through the peer.
timeout_secs = 1500
expect = [
    '^init: started sshd, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] sshd: listening on port 22$',
    '^init: started steward, console [0-9a-f]{16}$',
    '^\[con [0-9a-f]{16}\] steward: audit 1001/\{\} at [0-9]+: Login ',
    '^\[con [0-9a-f]{16}\] Redoubt shell, on Elixir ',
]
forbid = [
    'init: refused the boot',
    'init: rebooting',
    '^init: .* (exited|faulted|was killed)',
    'init: restarted',
    'EXCEPTION',
    'steward: a step failed',
    'sshd: login .*: refused',
]
expect_after = [
    '^\[con [0-9a-f]{16}\] sshd: login alice: session [0-9a-f]{16}, labels \[\]$',
]

[[session]]
user = "alice"
forbid = ['\*\* \(']
# One connection: a session's sockets are its share of ipd's admission, and a closed one keeps
# its unit through TCP's TIME-WAIT (docs/servers/ipd.md, "Sizing"); the modes change by setopts.
steps = [
    { expect = '/home/alice \([0-9]+\)> ' },
    { send = "{:ok, s} = :gen_tcp.connect({10, 0, 9, 100}, 80, [:binary, active: false], 20000); {:connected, :ok}\n" },
    { expect = '\{:connected, :ok\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "{:raw, (fn -> :ok = :gen_tcp.send(s, \"raw echo\"); :gen_tcp.recv(s, 8, 20000) end).()}\n" },
    { expect = '\{:raw, \{:ok, "raw echo"\}\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "{:line, (fn -> :ok = :inet.setopts(s, packet: :line); :ok = :gen_tcp.send(s, \"a line\\n\"); :gen_tcp.recv(s, 0, 20000) end).()}\n" },
    { expect = '\{:line, \{:ok, "a line\\n"\}\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "{:two, (fn -> :ok = :inet.setopts(s, packet: 2); :ok = :gen_tcp.send(s, \"two bytes of header\"); :gen_tcp.recv(s, 0, 20000) end).()}\n" },
    { expect = '\{:two, \{:ok, "two bytes of header"\}\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "{:four, (fn -> :ok = :gen_tcp.controlling_process(s, self()); :ok = :inet.setopts(s, packet: 4, active: true); :ok = :gen_tcp.send(s, \"four bytes of header\"); receive do {:tcp, ^s, d} -> d after 20000 -> :none end end).()}\n" },
    { expect = '\{:four, "four bytes of header"\}' },
    { expect = '\([0-9]+\)> ' },
    { send = "{:closed, :gen_tcp.close(s)}\n" },
    { expect = '\{:closed, :ok\}' },
    { expect = '\([0-9]+\)> ' },
    { exit = 0 },
]

[userland]
recipe = "image/userland.toml"

[disk]
recipe = "image/disk.toml"
stage = "tests/data/steward/stage"

[net]
forward = [22]
# ipd refuses the box's own addresses whatever the scope (docs/servers/ipd.md, R59).
self_forbidden = ["127.0.0.0/8", "10.0.2.15/32"]

[[net.peer]]
addr = "10.0.9.100:80"
connections = 1
