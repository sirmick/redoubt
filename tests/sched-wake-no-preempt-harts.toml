description = "A timeout only wakes, on several harts (kernel/scheduling.md, \"Preemption points\"): a sleeper's hundred and twenty timeouts, answered at whichever kernel entry comes first on two harts (a timer interrupt, or a spinner's call), take no hart from the thread whose entry answered them; at least twenty could have, mid-slice or at a call (virtual time, checked build)"
arch = ["rv64", "rv32"]
kind = "boot"
debug_assertions = true
icount = "shift=3,sleep=off"
programs = ["sched-wake-no-preempt-harts"]
kernel_features = ["sched-trace"]
post_check = "sched_oracle wake_no_preempt=120 wake_witnesses=20"
smp = [2]
# The oracle judges each wake at the entry that answered it and needs at least twenty that could have
# preempted: answered mid-slice or at another budget's call (kernel/scheduling.md, "Preemption
# points"). Two harts: at one, sched-wake-no-preempt proves each nap against a slice. The naps step
# through 130 + (17k mod 1000) µs, so their ends move through the slices' phases, and each
# spinner calls every 37 µs. Five runs a width alone read 26 to 30 mid-slice and 67 to 81 at a
# call on rv64, and 0 to 4 mid-slice and 65 to 68 at a call on rv32; the floor, 20, is under a
# third of the least (before the slice's end switched where it is, rv32 read 40 to 43 at a call,
# and 17 while it picked there but switched through kmain). Mid-slice is recorded here, not
# judged: under icount the hart armed for the timeout takes its interrupt only at its next turn,
# after the other hart's call has answered it, so on rv32 such an interrupt finds nothing due.
# sched-wake-no-preempt-harts-mttcg, where the harts run at once, judges it. A kernel built with
# `wake-preempts` fails this case on rv32 (a wake took hart 0 from budget 37), a recorded run.
keep_smp = true
timeout_secs = 120
expect = [
    '^\[wake\] the shortest delay from a nap.s start to the sleeper.s run was \d+ µs$',
    '^SCHED-WAKE-NO-PREEMPT TEST PASSED$',
    '^SCHED-TRACE-END \d+ dropped 0$',
]
forbid = ['PROGRAM HALT']
poweroff = true
