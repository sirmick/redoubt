[package]
authors = ["Sean Cross <sean@xobs.io>"]
description = "Redoubt microkernel: task switching, memory management, capability IPC"
license = "MIT OR Apache-2.0"
edition = "2018"
name = "redoubt-kernel"
version = "0.9.38"
resolver = "2"

# Dependency versions enforced by Cargo.lock.
[dependencies]
stats_alloc = { version = "0.1.8", optional = true }
redoubt-abi = { path = "../libs/abi", features = [
    "forget-memory-messages",
] }
rand_chacha = { version = "0.3.1", optional = true, default-features = false }
sbi-rt = { version = "0.0.3", optional = true }
plic = { version = "0.0.3", optional = true, features = ["primitive-id"] }
riscv = "0.16"
paging = { path = "../libs/paging" }
redoubt-stride = { path = "../libs/stride" }
redoubt-sys = { path = "../libs/sys" }

[features]
smp = [] # multi-hart: KernelCell becomes a spinlock (the big kernel lock)
# Test builds only (WP-K5): record the stride queue's raw events in a bounded ring and print it at
# `system_reset`, for the bench's independent rank oracle (tools/testbench, sched_oracle).
sched-trace = []
# Debug only, never in a bench build but one recorded negative run: rank wakers behind queued
# budgets of equal pass (the model's R12TieQueuedFirst), to show the oracle catches it.
sched-inject-tie-fault = ["sched-trace"]
# Test builds only (WP-K5b, OD7): each DMA device's first reset reports "not confirmed" after the
# real write, so the quarantine path runs. It only ever adds quarantine.
dma-reset-deaf = []

# Capabilities. Boards select these; code keys on them rather than on the CPU's XLEN.
# See "Hardware abstraction" in planning/redoubt/PLAN.md.
sbi = ["dep:sbi-rt", "rand_chacha"] # runs in S-mode under the vendored RustSBI firmware
plic = ["dep:plic"]                 # standard RISC-V PLIC interrupt controller

# Boards. Everything else about these machines comes from the device tree at boot.
qemu-virt = ["sbi", "plic"]


debug-print = []
print-panics = []
dump-kernel-pages = []                              # include kernel pages in panic dumps
report-memory = ["stats_alloc"]
wrap-print = []
big-heap = []                                       # Cause heaps to start at 12 MM instead of 512 kB
# this is somewhat unsafe because it introduces more attack surface for the kernel by allowing the
# userspace to hand it a random page from the caller's virtual memory space, and populate it with debug information
debug-proc = []

# patches for simulation targets ONLY. Applying these flags will result in totally broken security.
hwsim = []

# default = ["print-panics", "debug-print", "wrap-print"]
default = ["print-panics"]
