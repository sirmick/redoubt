[package]
authors = ["Sean Cross <sean@xobs.io>"]
description = "Redoubt microkernel: task switching, memory management, capability IPC"
license = "MIT OR Apache-2.0"
edition = "2018"
name = "redoubt-kernel"
version = "0.9.38"
resolver = "2"

# The kernel is a `no_std` binary for the machine only, and has no host tests: its rules are
# tested on the target by the bench, and its pure parts through `redoubt-stride` and the model
# (docs/kernel/model.md). So `cargo test` over the workspace builds nothing here.
[[bin]]
name = "redoubt-kernel"
path = "src/main.rs"
test = false
bench = false

# Dependency versions enforced by Cargo.lock.
[dependencies]
rand_chacha = { version = "0.3.1", optional = true, default-features = false }
sbi-rt = { version = "0.0.3", optional = true }
plic = { version = "0.0.3", optional = true, features = ["primitive-id"] }
riscv = "0.16"
paging = { path = "../libs/paging" }
redoubt-ipclist = { path = "../libs/ipclist" }
redoubt-layout = { path = "../libs/layout" }
redoubt-stride = { path = "../libs/stride" }
redoubt-sys = { path = "../libs/sys" }

[features]
# Implied by every test-only feature below; the kernel refuses to compile it without debug
# assertions (main.rs), so a release kernel carries none of them (R23).
test-only = []
# Test builds only: record the stride queue's raw events in a bounded ring and print it at
# `system_reset`, for the bench's independent rank oracle (tools/testbench, sched_oracle).
sched-trace = ["test-only"]
# Test builds only: the same ring at 192 MiB rather than 64, for a run too long for it (the
# containment gate, at 512 MiB of RAM).
sched-trace-large = ["sched-trace"]
# Test builds only: also bracket each receive's pump, timer expiry and reconcile in the trace, for
# the worst-walk case's numbers (kernel/ipc.md, kernel/timer.md, "Residual risks"). Not in the
# gate: a record pair at every kernel entry would fill its ring.
walk-trace = ["sched-trace"]
# Debug only, never in a bench build but one recorded negative run: rank wakers behind queued
# budgets of equal pass (the model's R12TieQueuedFirst), to show the oracle catches it.
sched-inject-tie-fault = ["sched-trace"]
# Debug only, never in a bench build but one recorded negative run: the kernel lock is
# test-and-set instead of a ticket lock (cell.rs), so `smp-boot`'s FIFO check must fail (R78).
sched-test-and-set-entry = ["test-only"]
# Debug only, never in a bench build but one recorded negative run each: a destruction does not
# shoot its process down on another hart running it (`smp-no-evict`), or a hart installs a process
# it owes an ASID flush without making it (`smp-no-stale-mask`), so `smp-evict` must fail.
smp-no-evict = ["test-only"]
smp-no-stale-mask = ["test-only"]
# Debug only, never in a bench build but one recorded negative run: the audit after a destruction
# runs unstamped, so the oracle cannot subtract it and the deadline notice must miss.
audit-unstamped = ["sched-trace"]
# Debug only, never in a bench build but one recorded negative run: an audit's time stays billed
# to the budget that ran it and counts against its slice, so the deadline notice must miss.
audit-billed = ["test-only"]
# Debug only, never in a bench build but one recorded negative run: the rest of a timer interrupt
# after its expiry, and the return's own walk, are billed as before the fix to the budget it
# interrupted, so the oracle's timer-entry check must fail.
timer-tail-billed = ["sched-trace"]
# Debug only, never in a bench build but one recorded negative run: a frame is taken by the
# first-fit scan of the ownership table the bitmap replaced, so `scan-bounds` must fail.
alloc-first-fit = ["test-only"]
# Debug only, never in a bench build but one recorded negative run each: a PID given out keeps its
# last holder's ASID unflushed (`MemoryMapping::allocate`), or an unmap skips its flush, so the
# checked build's flush audit must stop `asid-reuse-stale`.
asid-no-reuse-flush = ["test-only"]
asid-no-leaf-flush = ["test-only"]
# Test builds only: each DMA device's first reset reports "not confirmed" after the
# real write, so the quarantine path runs. It only ever adds quarantine.
dma-reset-deaf = ["test-only"]
# Test builds only: a handle held outside its stamp's subtree is installed without its stamp
# chain entry, for the checked build's chain audit to catch (kernel/budgets.md, "Residual risks").
handle-chain-fault = ["test-only"]
# Test builds only: a handle to a process object is installed without its entry in the object's
# chain, for the same audit to catch.
process-chain-fault = ["test-only"]
# Test builds only: at the first system call the kernel loads the caller's `ecall` straight
# through the user mapping, which must fault (R24).
sum-probe = ["test-only"]
# Test builds only: after the boot has checked senvcfg is 0, `_start` writes it permissive (user
# cache-block operations run), standing in for a hart that kept a nonzero reset value; the
# self-check bench-cbo-self-unrefused must then fail (R11).
plant-senvcfg = ["test-only"]
# Test builds only: print a value whose `Display` prints and then panics, at boot, so both strike
# inside `print!` (debug/console.rs).
panic-in-print = ["test-only"]
# Test builds only: the old 10 ms slice, for the cluster's known-bad control (TENETS 6), which must
# miss the latency targets the 1 ms slice meets (kernel/scheduling.md, "Responsiveness").
slice-10ms = ["test-only"]

# Capabilities. Boards select these; code keys on them rather than on the CPU's XLEN.
# See "Hardware abstraction" in docs/kernel/boot.md.
sbi = ["dep:sbi-rt", "rand_chacha"] # runs in S-mode under the vendored RustSBI firmware
plic = ["dep:plic"]                 # standard RISC-V PLIC interrupt controller

# Boards. Everything else about these machines comes from the device tree at boot.
qemu-virt = ["sbi", "plic"]

# Console output.
debug-print = []
print-panics = []
wrap-print = []
default = ["print-panics"]
