[package]
name = "testbench"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Boots Redoubt under QEMU with injected programs and asserts on its console output"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"                                                         # cargo's report of the binaries it built (build.rs)
tar = { version = "0.4", default-features = false }
toml = "0.8"
ed25519-compact = { version = "2", default-features = false }
libc = "0.2"                                                             # openpty for a session's terminal (pty.rs)
redoubt-signing = { path = "../../libs/signing" }                        # the bundle signature's preimage
redoubt-blkd = { path = "../../servers/blkd" }                           # a case disk's GPT, written by blkd's own builder
redoubt-littlefsd = { path = "../../servers/littlefsd" }                 # a disk recipe's volumes, packed by littlefsd's own code
redoubt-verity = { path = "../../libs/verity" }                          # a verified volume's tree, as verityd checks it (disk.rs)
sha2 = { version = "0.11", default-features = false }                    # a run directory's and a guest file's names

stub = { path = "../../stub" } # the largest launched stack
redoubt-client = { path = "../../libs/client" } # the launcher's default stack size and paint format
redoubt-sys = { path = "../../libs/sys" } # the shared page size
redoubt-rt = { path = "../../libs/rt" } # the heap record's format

[dev-dependencies]
# The oracle's own evidence (sched_oracle.rs): traces from the executable model, with its tie
# rules broken on purpose, must be rejected.
redoubt-model = { path = "../../model" }
