[package]
name = "redoubt-vendor-check"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Host-only checks that the vendored crates are the published ones and the ones that build"
publish = false

# The same smoltcp, with exactly ipd's features, the same ed25519-compact as the loader and
# keyd, and the same sunset as sshd, so the lockfile resolves the vendored crates here too and
# `tests/vendored.rs` can prove the path copies are used.
[dependencies]
smoltcp = { version = "=0.14.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp"] }
ed25519-compact = { version = "=2.4.2", default-features = false }
sunset = { version = "=0.6.0", default-features = false }

[dev-dependencies]
# sunset's `Pty` names its terminal in a heapless string.
heapless = { version = "=0.9.3", default-features = false }
# SHA-256, already in the tree and tested against its vectors (keyd).
redoubt-keyd = { path = "../../servers/keyd" }
